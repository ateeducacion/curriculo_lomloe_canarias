cambios:
- nodo: bc:PLCL01BC2
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue constatar que el alumnado adquiere las destrezas necesarias para
    obtener, seleccionar y relacionar informaciones procedentes tanto del propio contexto escolar como de los medios de comunicación,
    en el marco del progreso de su vida académica y de su ciudadanía. Para ello, se comprobará que comprende de manera individual
    y cooperativa el sentido de textos orales y multimodales del ámbito personal, social y educativo en contextos informales
    y de diferentes tipologías, aplicando de manera acompañada estrategias de escucha activa, identificando las ideas más
    relevantes y opinando de forma razonada sobre el contenido, para construir conocimiento y responder a diferentes necesidades
    comunicativas. Se valorará asimismo que para alcanzar estos aprendizajes, el alumnado sea capaz de reconocer y respetar
    las emociones y experiencias de los demás, participando en actividades o proyectos escolares que aborden temas de relevancia
    ecosocial y cultural, mediante el uso, de manera guiada, de herramientas o plataformas virtuales, en entornos digitales
    restringidos y supervisados de forma segura, que le permitan ampliar su repertorio lingüístico individual, asumiendo algunas
    responsabilidades individuales y empleando estrategias cooperativas sencillas, dirigidas a la comprensión de los mensajes
    orales.
- nodo: bc:PLCL01BC3
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de producir textos orales de manera
    autónoma, iniciándose, como hablante funcional, en el uso de la palabra como herramienta de construcción del pensamiento;
    siendo capaz de cubrir necesidades comunicativas; desenvolviéndose en diferentes contextos de discurso oral adecuados
    a su nivel madurativo, tanto espontáneos (planteamiento de preguntas, expresión de emociones u opiniones, aclaración de
    dudas…) como planificados (entrevistas, exposiciones individuales y grupales, narraciones, noticias…); y teniendo en cuenta
    las características del español de Canarias. Para ello, se valorará si el alumno o la alumna planifica y organiza el discurso
    de manera acompañada, utilizando herramientas digitales como apoyo visual o guión, controlando el tiempo y empleando el
    vocabulario adecuado a la situación comunicativa. Asimismo, se verificará que utiliza estrategias de interpretación durante
    las interacciones, superando el sentido literal y haciendo uso de elementos de la comunicación no verbal. Se pretende
    constatar que el alumnado aplica estrategias para hablar en público (dicción, entonación, volumen, pausas, vista al público,
    ritmo, turno de palabra…), validando los rasgos del español de Canarias como modalidad lingüística propia del entorno.
    Finalmente, atendiendo a la diversidad de perfiles lingüísticos, el alumnado debe tener en cuenta el contexto que lo rodea
    y adecuarse a la persona interlocutora, así como el mensaje y su finalidad, utilizando un lenguaje respetuoso, que fomente
    la asertividad y la cohesión social, y que permita la resolución de conflictos de manera dialogada.
- nodo: bc:PLCL01BC4
  campo: scopeNote
  valor: A través de este bloque competencial, se valorará que el alumnado sea capaz de interpretar diferentes textos escritos
    y multimodales del ámbito personal, social o escolar con diferente tipología, diversidad de géneros discursivos y en diferentes
    formatos (hipertextos, gráficos, tablas estadísticas, mapas conceptuales…), analizando y valorando, de manera acompañada,
    su contenido y sus características. Asimismo, se comprobará que responde a distintas estrategias antes de la lectura (activación
    de conocimientos previos, inferencias a partir del título, realización de hipótesis, análisis de ilustraciones…), durante
    la lectura (leer en voz alta, releer, identificar palabras confusas, palabras clave o de otras lenguas, uso del diccionario…)
    y después de ella (localización y obtención de información explícita, integración de la información a sus conocimientos
    para transformarla en aprendizaje, comprensión de significados de manera global o particular, interpretación de elementos
    del lenguaje verbal y no verbal, evaluación del contenido, del lenguaje y de los elementos textuales…). De este modo,
    se verificará que la interpretación de los textos favorece el acceso al conocimiento del mundo y a la adquisición de nuevos
    aprendizajes, a través de la ampliación de su vocabulario y la fijación de la ortografía, siendo un incentivo motivacional
    que fomenta el placer por la lectura.
- nodo: bc:PLCL01BC7
  campo: scopeNote
  valor: A través de este bloque competencial, se constatará que el alumnado lee obras de manera acompañada y comparte las
    experiencias de lectura. Para ello, se comprobará que se inicia en el uso de estrategias para seleccionar textos ajustados
    a sus gustos e intereses, partiendo de sus experiencias emocionales y realizando indagaciones que le ayuden a leer con
    progresiva autonomía, obras o fragmentos variados y equilibrados, adecuados a su nivel madurativo y organizados en itinerarios
    lectores temáticos, de género o de cualquier otra naturaleza. Asimismo, se valorará que es capaz de compartir su experiencia
    y sus preferencias en comunidades lectoras, a través de la expresión acompañada de hechos y el intercambio de conceptos,
    pensamientos, opiniones y sentimientos de forma oral escrita, artística o multimodal, con actitud cooperativa y respetuosa,
    estableciendo vínculos emocionales y valiéndose de la biblioteca y del contexto social, cultural y familiar, así como
    de herramientas o plataformas virtuales. También se comprobará que el alumnado es capaz de identificar elementos del patrimonio
    literario, construyendo y compartiendo su interpretación de las obras, así como reflexionar de manera acompañada sobre
    valores como la cultura de paz, el desarrollo sostenible, los derechos de la infancia, la igualdad de género y el respeto
    hacia la diversidad familiar, funcional y étnico-cultural, entre otros, a través del reflejo que estos tienen en la literatura.
    Todo ello con la finalidad última de disfrutar, tanto del acto de leer como del intercambio cultural de experiencias en
    torno a la lectura, en un proceso de creación progresivo de su hábito lector para construir de manera positiva su identidad
    lectora.
- nodo: bc:PLCL01BC9
  campo: scopeNote
  valor: A través de este bloque competencial, se favorecerá la reflexión continuada en torno a la lengua y sus condiciones
    de uso, de manera ajustada a las posibilidades de abstracción de estas edades, para lo que se comprobará que el alumnado
    es capaz de obtener conclusiones, utilizando métodos inductivos sobre aspectos lingüísticos elementales (formulando generalizaciones,
    observando, comparando, estableciendo contrastes, creando y transformando palabras, enunciados o textos, formulando hipótesis,
    buscando ejemplos y contraejemplos…) y haciendo especial hincapié en el español hablado en Canarias, siempre en procesos
    de producción y comprensión de diferentes tipos de textos y géneros discursivos, mediante la búsqueda de diferencias entre
    la lengua oral y escrita, y la observación de relaciones de forma, función y significado entre palabras o grupos de palabras,
    y la iniciación en la reflexión interlingüística, realizando transferencias sencillas entre distintas lenguas; todo ello
    para contribuir a ampliar su repertorio lingüístico. Por último, se verificará que el alumnado participa en procesos de
    auto y coevaluación, a través de interacciones comunicativas, con actitud cooperativa y respetuosa, donde, de manera acompañada,
    revisa y mejora los textos propios y ajenos iniciándose en la reflexión metalingüística con la finalidad de subsanar algunos
    problemas de comprensión y expresión oral y escrita, atendiendo a mecanismos básicos de coherencia y cohesión y normas
    ortográficas naturales.
- nodo: bc:PLCL01BC10
  campo: scopeNote
  valor: A través de este bloque competencial se pretende formar personas capaces de comunicarse desde la empatía y el respeto,
    y para ello se comprobará que el alumnado es capaz de planificar y utilizar estrategias de manera acompañada, para para
    iniciarse en la resolución de conflictos a través del consenso y el uso del lenguaje, teniendo en cuenta aspectos verbales
    y no verbales, y favoreciendo la utilización, no solo eficaz, sino también ética de los diferentes sistemas de comunicación
    (verbal, no verbal, signado…). Asimismo, se constatará que el alumnado es capaz de escuchar activamente, identificando
    tanto sus propias emociones, ideas y comportamientos como las de las demás personas, reflejando lo que el otro dice, parafraseando,
    aclarando, sintetizando, preguntando o reformulando; de comunicarse de forma asertiva expresando hechos, conceptos, pensamientos,
    opiniones o sentimientos; y de participar tanto en interacciones comunicativas en las que muestra una actitud abierta
    y respetuosa, rechazando prejuicios y estereotipos lingüísticos, y reconociendo el valor del diálogo para mejorar la convivencia,
    como en actividades cooperativas en las que emplea un lenguaje no discriminatorio y respetuoso con las diferencias, y
    en las que comprende el valor de respetar las diferentes culturas y creencias, y dialoga sobre problemas éticos, sociales
    y ecológicos próximos a su realidad, defendiendo los principios y valores que rigen los derechos humanos, con el fin último
    de formar personas preparadas para la gestión dialogada de los conflictos y para construir una sociedad respetuosa e inclusiva.
