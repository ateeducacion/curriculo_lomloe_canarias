    en contextos formales e informales y de diferentes tipologías, aplicando estrategias de escucha activa, identificando
    las ideas más relevantes y realizando las inferencias y deducciones necesarias (especialmente en relación con informaciones
    de tipo espacial, temporal y de secuencia lógica) realizando una valoración crítica sobre el contenido e identificando
    elementos no verbales y formales para construir conocimiento y responder a diferentes necesidades comunicativas. Se valorará
    asimismo que para alcanzar estos aprendizajes, el alumnado sea capaz de reconocer y respetar las emociones y experiencias
    de las demás personas, participando en actividades o proyectos escolares que aborden temas de relevancia ecosocial y cultural,
    mediante el uso de herramientas o plataformas virtuales en entornos digitales restringidos y supervisados de manera segura,
    que le permitan ampliar su repertorio lingüístico personal, asumiendo las responsabilidades individuales asignadas y empleando
    estrategias cooperativas sencillas, dirigidas a la comprensión de los mensajes orales.
- nodo: bc:PLCL06BC3
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de producir textos orales de manera
    autónoma, utilizando la palabra como herramienta de construcción del pensamiento, profundizando como hablante funcional
    y siendo capaz de cubrir necesidades comunicativas desenvolviéndose en diversos contextos de discurso oral, tanto espontáneo
    (planteamiento de preguntas, expresión de emociones u opiniones, aclaración de dudas…) como planificado (entrevistas,
    exposiciones individuales y grupales, narraciones, noticias…) teniendo en cuenta las características del español de Canarias.
    Para ello se valorará si el alumno o la alumna planifica y organiza el discurso, utilizando herramientas digitales como
    apoyo visual o guión, controlando el tiempo y empleando el vocabulario adecuado a la situación comunicativa. Asimismo,
    se verificará que utiliza estrategias de interpretación durante las interacciones, superando el sentido literal y haciendo
    uso de elementos de la comunicación no verbal. Se pretende constatar que el alumnado aplica estrategias para hablar en
    público (dicción, entonación, volumen, pausas, vista al público, ritmo, turno de palabra…), validando las características
    del español de Canarias como modalidad lingüística propia del entorno. Finalmente, atendiendo a la diversidad de perfiles
    lingüísticos, el alumnado debe tener en cuenta el contexto que lo rodea y adecuarse al interlocutor, el mensaje y su finalidad,
    utilizando un lenguaje respetuoso, que fomente la asertividad y la cohesión social, y que permita la resolución de conflictos
    de manera dialogada.
- nodo: bc:PLCL06BC4
  campo: scopeNote
  valor: A través de este bloque competencial, se valorará que el alumnado sea capaz de interpretar diferentes textos escritos
    y multimodales del ámbito personal, social o escolar con diferente tipología, diversidad de géneros discursivos y en diferentes
    formatos (hipertextos, gráficos, tablas estadísticas, mapas conceptuales…), analizando y valorando su contenido y sus
    características. Asimismo, se comprobará que responde a distintas estrategias antes de la lectura (activación de conocimientos
    previos, inferencias a partir del título, realización de hipótesis, análisis de ilustraciones…), durante la lectura (leer
    en voz alta, releer, identificar palabras confusas, palabras clave o de otras lenguas, uso del diccionario…) y después
    de ella (localización y obtención de información explícita, integración de la información a sus conocimientos para transformarla
    en aprendizaje, realización de inferencias directas e indirectas para ir más allá de la interpretación literal, comprensión
    de significados de manera global o particular, interpretación de elementos del lenguaje verbal y no verbal, evaluación
    del contenido, del lenguaje y de los elementos textuales…). De este modo se verificará que la interpretación de los textos
    favorece el acceso al conocimiento del mundo y la adquisición de nuevos aprendizajes, a través de la ampliación de su
    vocabulario y la fijación de la ortografía, todo ello como incentivo motivacional que fomenta el placer por la lectura.
- nodo: bc:PLCL06BC7
  campo: scopeNote
  valor: A través de este bloque competencial, se constatará que el alumnado lee obras de manera autónoma y comparte las experiencias
    de lectura. Para ello se comprobará que puede usar estrategias para seleccionar, con criterio propio, textos ajustados
    a sus gustos e intereses, partiendo de sus experiencias emocionales y realizando indagaciones que le ayuden a leer con
    autonomía creciente, obras o fragmentos variados y equilibrados, adecuados a su nivel madurativo y organizados en itinerarios
    lectores temáticos, de género o de cualquier otra naturaleza. Asimismo, se valorará que es capaz de compartir su experiencia
    y sus preferencias en comunidades lectoras, a través de la expresión de hechos y el intercambio de conceptos, pensamientos,
    opiniones, sentimientos de forma oral escrita, artística o multimodal, con actitud cooperativa y respetuosa, estableciendo
    vínculos emocionales y valiéndose de la biblioteca y del contexto social, cultural y familiar, así como de herramientas
    o plataformas virtuales. También se comprobará que el alumnado es capaz de identificar elementos del patrimonio literario,
    con la debida atención a muestras de textos canarios, construyendo y compartiendo su interpretación de las obras, así
    como reflexionar sobre valores como la cultura de paz, el desarrollo sostenible, los derechos de la infancia, la igualdad
    de género y el respeto hacia la diversidad familiar, funcional y étnico-cultural, entre otros, a través del reflejo que
    estos tienen en la literatura.Todo ello con la finalidad última de disfrutar, tanto del acto de leer como del proceso
    de intercambio cultural de experiencias en torno a la lectura, en un proceso de creación progresivo de su hábito lector
    para construir de manera positiva su identidad lectora.
- nodo: bc:PLCL06BC9
  campo: scopeNote
  valor: A través de este bloque competencial, se favorecerá la reflexión continuada en torno a la lengua y sus condiciones
    de uso, de manera ajustada a las posibilidades de abstracción de estas edades, para lo que se comprobará que el alumnado
    es capaz de reflexionar, utilizando métodos tanto inductivos como deductivos, sobre aspectos lingüísticos elementales
    (formulando generalizaciones, observando, comparando, estableciendo contrastes, creando y transformando palabras, enunciados
    o textos, formulando hipótesis, buscando ejemplos y contraejemplos…) y haciendo especial hincapié en el español hablado
    en Canarias, siempre en procesos de producción y comprensión de diferentes tipos de textos y géneros discursivos, mediante
    la búsqueda de diferencias entre la lengua oral y escrita, la observación de relaciones de forma, función y significado
    entre palabras o grupos de palabras, y la iniciación en la reflexión interlingüística, realizando transferencias sencillas
    entre distintas lenguas; todo ello para contribuir a ampliar su repertorio lingüístico. Por último, se verificará que
    el alumnado participa en procesos de auto y coevaluación, a través de interacciones comunicativas, con actitud cooperativa
    y respetuosa, en los que revisa y mejora los textos propios y ajenos, profundizando en la reflexión metalingüística con
    la finalidad de subsanar algunos problemas de comprensión y expresión oral y escrita, atendiendo a mecanismos básicos
    de coherencia y cohesión, con especial atención a las sustituciones pronominales y a la correlación temporal establecida
    mediante los distintos tiempos verbales, a las normas de acentuación o a los signos de puntuación, y recurriendo cuando
    sea preciso a la consulta en diccionarios en diferentes formatos.
- nodo: bc:PLCL06BC10
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de planificar y utilizar estrategias,
    de manera autónoma, para la resolución de conflictos, a través de la deliberación argumentada y el uso del lenguaje, teniendo
    en cuenta aspectos verbales y no verbales, y favoreciendo la utilización no solo eficaz sino también ética de los diferentes
    sistemas de comunicación (verbal, no verbal, signado…). Asimismo, se constatará que el alumnado es capaz de escuchar activamente,
    identificando tanto sus propias emociones, ideas y comportamientos como las de las demás personas, reflejando lo que la
    otra persona dice, parafraseando, aclarando, sintetizando, preguntando o reformulando; de comunicarse de forma asertiva
    expresando hechos, conceptos, pensamientos, opiniones o sentimientos; y de participar tanto en interacciones comunicativas
    mostrando una actitud abierta y respetuosa, rechazando prejuicios y estereotipos lingüísticos, y reconociendo el valor
    del diálogo para mejorar la convivencia, como en actividades cooperativas en las que emplea un lenguaje no discriminatorio
    y respetuoso con las diferencias, hace uso de herramientas o plataformas virtuales de manera segura y responsable, comprende
    el valor de respetar las diferentes culturas y creencias, y dialoga sobre problemas éticos, sociales, económicos y ecológicos
    de la actualidad, defendiendo los principios y valores que rigen los derechos humanos, con el fin último de formar personas
    preparadas para la gestión dialogada de los conflictos y para construir una sociedad respetuosa e inclusiva.
