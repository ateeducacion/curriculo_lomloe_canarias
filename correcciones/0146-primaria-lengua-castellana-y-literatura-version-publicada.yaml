cambios:
- nodo: bc:PLCL01BC1
  campo: scopeNote
  valor: A través de este bloque competencial, se constatará que el alumnado reconoce la diversidad lingüística presente en
    su entorno más cercano y es capaz de valorar la realidad plurilingüe existente en el aula, incluyendo los distintos Sistemas
    Alternativos y Aumentativos de Comunicación (SAAC) y la lengua de signos. Para ello, se comprobará que puede realizar,
    de manera acompañada, una reflexión interlingüística para identificar las características propias del español de Canarias
    comparándolas con otras variantes de habla y otros dialectos, tanto peninsulares como de la América hispanohablante, efectuando
    transferencias sencillas entre ellos, construyendo su biografía lingüística personal, realizando una aproximación a la
    lengua de signos y a los SAAC, y apreciando la diversidad etnocultural y lingüística como riqueza y herramienta de reflexión.
    Asimismo, se comprobará que el alumnado desarrolla, en contextos cotidianos de comunicación, estrategias de identificación
    de prejuicios y estereotipos lingüísticos con actitud cooperativa, inclusiva y respetuosa, y detectando los abusos de
    poder a través de la palabra, lo que le permitirá resolver conflictos de manera dialogada y justa. Todo ello con la finalidad
    última de promover el ejercicio de una ciudadanía mundial sensibilizada, informada y comprometida con los derechos lingüísticos
    individuales y colectivos, en un marco de interculturalidad y respeto a los derechos humanos.
