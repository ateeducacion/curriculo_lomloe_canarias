  valor: A través de este bloque competencial, se constatará que el alumnado es capaz de poner su curiosidad al servicio del
    aprendizaje y emplear las destrezas propias del trabajo científico (la observación y el planteamiento de preguntas, la
    formulación de hipótesis justificadas y la aplicación de la experimentación, la indagación y la búsqueda de evidencias
    cualitativas y cuantitativas y el análisis de resultados y la deducción), para identificar y describir los fenómenos y
    procesos biológicos, geológicos, físico-químicos, matemáticos y tecnológicos que ocurren en situaciones conocidas y diferenciarlos
    de los fenómenos pseudocientíficos que no admiten comprobación experimental. Para ello, se valorará si es capaz de desarrollar
    proyectos de investigación relacionados con los diferentes bloques de saberes básicos del ámbito, de manera individual
    o colaborativa, que supongan la búsqueda, obtención y organización de la información de carácter científico, a partir
    de la utilización de fuentes variadas (observación, artículos científicos, páginas web, revistas, periódicos…), atendiendo
    a criterios de validez, calidad, actualidad y fiabilidad; o de diseñar y realizar procedimientos experimentales, validar
    hipótesis y analizar los resultados, empleando el razonamiento lógico-matemático para obtener conclusiones fundamentadas
    y comunicarlas, adoptando un punto de vista personal, mediante exposiciones orales, escritas o visuales en diversos soportes
    (presentaciones, informes, gráficos, diagramas, fórmulas…), apoyándose en las tecnologías digitales y utilizando el vocabulario
    científico adecuado, y presentar soluciones que creen valor en el ámbito personal, social, cultural y económico, considerando
    la experiencia como una oportunidad para aprender y mejorar sus destrezas al interpretar los fenómenos científico-tecnológicos.
    También se evaluará si aplica las normas de uso de los espacios específicos de la ciencia (instalaciones de museos, universidades,
    centros sanitarios, centros de investigación…), especialmente, los laboratorios del centro, y utiliza los materiales,
    las sustancias y las herramientas que en ellos se encuentren de forma segura, para preservar la salud propia y colectiva,
    la conservación sostenible del medioambiente y el respeto por las instalaciones. Finalmente, se comprobará si el alumnado
    es capaz de trabajar en equipo, como requiere en la actualidad la labor científica, desarrollando actividades de cooperación,
    propiciando la participación de todo el grupo, aceptando y cumpliendo las tareas y responsabilidades asignadas, analizando
    críticamente las aportaciones del equipo, incorporándolas a su aprendizaje con actitud dialogante y respetuosa, y optimizando
    los recursos para llevar a término el proceso. Además, se evaluará si en el contexto del trabajo en equipo, colabora e
    interactúa mediante herramientas o plataformas virtuales, compartiendo contenidos, datos e información, y gestiona responsable
    y éticamente sus acciones, poniendo sus prácticas comunicativas al servicio de la convivencia democrática, la resolución
    dialogada de los conflictos y el respeto a la diversidad en todas sus formas, y evitando todo tipo de discriminación o
    violencia para unir puntos de vista diferentes en los procesos de investigación que contribuyan al progreso de la ciencia.
    Todo ello con la finalidad de ofrecer al alumnado la oportunidad creativa y de crecimiento que aporta el trabajo científico,
    impulsando la igualdad de oportunidades entre los alumnos y las alumnas, y fomentando las vocaciones científicas y tecnológicas
    desde una perspectiva de género.
