- nodo: bc:BFUE02BC3
  campo: scopeNote
  valor: 'Este bloque competencial presenta una visión general de la gestión estratégica de las distintas áreas funcionales
    de una empresa y, a través de ella, se pretende constatar la capacidad del alumnado para contribuir a la consecución de
    objetivos compartidos, detectando inconvenientes y replanteando decisiones sobre el proyecto empresarial. Para ello, es
    necesario que pueda reconocer la estructura de la organización interna de una empresa, estableciendo gráficamente, a través
    de organigramas, la jerarquía, los flujos y las relaciones que se erigen entre departamentos, y haciendo uso de herramientas
    digitales para generar los organigramas a partir de mapas mentales que haya construido a mano. Se constatará, además,
    el desarrollo de habilidades para tomar decisiones grupales en diferentes áreas, utilizando diferentes herramientas para
    llevar a cabo las principales funciones empresariales. Respecto al área de aprovisionamiento, se comprobará que establece
    las necesidades de aprovisionamiento de recursos, cuando aplique técnicas de selección de proveedores y ordene cronológicamente
    las fases a seguir para ejecutar un plan de compras y control de stocks identificando la documentación mercantil generada
    en las operaciones comerciales, así como las diferencias en cuanto a uso, validez contable y fiscal tanto del albarán
    como de la factura. En cuanto al área de producción o servicio, se constatará la capacidad para explicar el proceso productivo
    de la idea de negocio de manera coherente, con sus implicaciones técnicas y medioambientales mediante el diseño, de manera
    grupal y con técnicas de prototipado (lego serious play, origami, impresión 3D, aplicaciones web, storyboards…), del prototipo
    del producto o del manual de procedimiento de prestación del servicio que aporte soluciones a los problemas reales. En
    lo que al área comercial y de marketing se refiere, se constatará, en primer lugar, la capacidad del alumnado para aplicar
    las técnicas de investigación de mercados útiles para valorar las necesidades y preferencias de los clientes potenciales
    respecto al producto, al precio, a la distribución y la comunicación, utilizando para ello, de forma correcta, ética y
    segura, herramientas de comunicación comercial y atención al cliente, análisis digitales, tecnologías digitales de comunicación,
    encuestas y hojas de cálculo. En segundo lugar, se valorará la capacidad para reflexionar sobre la responsabilidad en
    las acciones publicitarias mediante el análisis de anuncios publicitarios (plan de medios, publicidad en internet y tecnologías
    de comunicación digitales) y se constatará que toma decisiones comerciales y de marketing con enfoque inclusivo, cuando
    desarrolle una imagen de empresa que comprenda el nombre o marca comercial, logotipo y eslogan publicitario, respetando
    en todo momento el uso correcto de la propiedad privada de imágenes y nombres comerciales y respetando también el objetivo
    ético, responsable e inclusivo de la publicidad, rechazando todo tipo de discriminación y violencia, y promoviendo la
    igualdad y corresponsabilidad entre mujeres y hombres. En lo que concierne al área de recursos humanos, se constatará
    que puede plantear las decisiones de gestión del personal del proyecto empresarial, cuando describa los puestos de trabajo
    de la empresa, identifique las formas de búsqueda y selección del personal de la empresa incluido el videocurrículum y
    las nuevas habilidades demandadas por las empresas, diferencie las formas de contratación laboral de acuerdo a la normativa
    laboral, distinga los conceptos de documentos de retribución del personal, reconozca las obligaciones de la empresa ante
    la seguridad social, analice los derechos y deberes laborales básicos de las personas trabajadoras y empresarias, y tome
    conciencia de los riesgos que para la seguridad y salud de las personas trabajadoras pudiera ocasionar la actividad laboral
    de la empresa. Finalmente, atendiendo al área de financiación, se comprobará la capacidad para tomar decisiones financieras,
    cuando en el proyecto empresarial atienda a dos demandas: la primera de ellas, la gestión de cobros y pagos mediante la
    elaboración de un sencillo plan de tesorería basado en previsiones y planteamiento de hipótesis; y la segunda, la selección
    de las fuentes de financiación más apropiadas, considerando variables como el plazo de devolución, la titularidad y el
    origen de los fondos. Además, el avance en el cumplimiento de los Objetivos de Desarrollo Sostenible 2030 requiere de
    la introducción de elementos ambientales, sociales y de gobernanza en la toma de decisiones de inversión empresarial y
    de decisiones financieras sostenibles, por lo que se constatará que el alumnado tiene en cuenta la incorporación de los
    bonos verdes, los microcréditos o el crowdfunding en su modelo empresarial, valorando la contribución de la ciencia económica
    en el cambio de las condiciones de vida y adquiriendo compromisos como ciudadano en el ámbito local y global.'
