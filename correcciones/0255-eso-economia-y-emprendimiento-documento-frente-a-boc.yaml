  valor: El desarrollo de este bloque competencial permitirá constatar si el alumnado es capaz de determinar la admisibilidad
    de las ideas o soluciones emprendedoras dentro de su entorno económico, contrastando la satisfacción de las necesidades
    detectadas y guiando la toma de decisiones con el empleo de conocimientos económicos y financieros que le permitan reunir
    y optimizar los recursos necesarios para poner en marcha el proyecto emprendedor. Para la consecución de estos aprendizajes
    se requiere tener en cuenta, en primer lugar, el problema económico básico que obliga a las personas a tomar decisiones,
    para lo que se verificará su capacidad para realizar elecciones bajo el prisma de los principios económicos de los costes,
    el análisis marginal y los incentivos, en función del grado de escasez percibido para cubrir las necesidades y que reflexiona
    sobre cómo esta toma de decisiones de las personas usuarias, como destinatarias finales del prototipo, afecta a su vez
    a las empresas. Además, para optimizar la toma de decisiones en los mercados, el alumnado podría también hacer uso de
    herramientas de estudio del sector y de investigación de las necesidades de los clientes (configuración de motores de
    búsqueda en internet y redes, mapa de la empatía, entrevistas con clientes, etc.) para descubrir oportunidades y necesidades
    no cubiertas. En segundo lugar, a través de este bloque competencial se validará la capacidad el alumnado para analizar
    el funcionamiento económico y financiero de los mercados, con la finalidad de que los conocimientos adquiridos le guíen
    en la toma de decisiones financieras personales de forma responsable y en la búsqueda y planificación de los recursos
    necesarios para el desarrollo de las ideas o soluciones emprendedoras, como pudieran ser el funcionamiento del sistema
    financiero en nuestra sociedad, la descripción del papel de los intermediarios financieros como canalizadores del ahorro
    hacia las necesidades de inversión de consumidores y de empresas, el papel del dinero en la economía, la determinación
    del tipo de interés, la reflexión sobre activos digitales como las criptomonedas, etc. Además, se comprobará que valora
    los principios de interacción social desde un punto de vista macroeconómico y microeconómico, indagando en el papel que
    desempeñan los agentes económicos dentro de la modelización del flujo circular de la renta y analizando los flujos reales
    y monetarios que surgen de las relaciones que emanan del funcionamiento de los mercados de bienes y servicios y de factores
    productivos. En tercer lugar, se verificará que el alumnado esté en disposición de aplicar de forma práctica conocimientos
    económicos a actividades y situaciones concretas, empleando el pensamiento científico, mediante la interpretación de indicadores,
    tanto del entorno general o macroeconómico (análisis PESTEL, por ejemplo) como el específico o microeconómico (como el
    análisis de las estrategias competitivas de Porter), que afectan al proyecto emprendedor propuesto, a partir de otros
    modelos reales o simulados de referencia, analizando tendencias y oportunidades de negocios en los mercados y en la sociedad,
    para así ir perfeccionando la solución a los retos actuales de manera eficiente, equitativa y sostenible. Por último,
    en cuanto a la comprensión de ideas relativas a la dimensión social y ciudadana, la adquisición de los saberes relacionados
    con la economía colaborativa, la huella ecológica, la economía circular y el bienestar y las desigualdades que genera
    el comercio conferirán en el alumnado un punto de vista más extenso sobre las relaciones sistémicas de interdependencia,
    ecodependencia e interconexión entre actuaciones locales y globales, permitiendo constatar que el alumnado es capaz de
    considerar estos entornos de mayor cooperación global como fuente de búsqueda de nuevas oportunidades dirigidas a tomar
    decisiones que aporten valor y que favorezcan mejoras en la calidad de vida, mostrando respeto por las normas y el cumplimiento
    de los derechos y obligaciones de las personas usuarias como consumidoras, los cuales difieren entre países, fruto de
    las afecciones dispares de las decisiones económicas públicas y privadas.
