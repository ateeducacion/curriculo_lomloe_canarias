- nodo: bc:BBIE02BC1
  campo: scopeNote
  valor: A través de este bloque competencial se persigue que el alumnado sea capaz de modelizar y resolver, de forma autónoma,
    problemas relacionados con las ciencias de la vida,la salud, y medioambientales especialmente contextualizados en la Comunidad
    Autónoma de Canarias, como aplicación práctica de la estadística y la probabilidad a situaciones reales de las ciencias
    que nos ocupan. Todo ello haciendo uso de diferentes tecnologías digitales, como calculadoras, hojas de cálculo o programas
    de representación gráfica, entre otras; seleccionando y configurando las más adecuadas en función de la tarea; y describiendo
    de forma oral, escrita o gráfica, el proceso realizado. Para ello, se comprobará que el alumnado selecciona los datos
    u objetos relevantes de un problema, identifica sus relaciones y los codifica al lenguaje matemático o a un lenguaje fácil
    de interpretar por un sistema informático. Además, se evaluará que emplea diferentes estrategias para su resolución, como
    la analogía con otros problemas, la estimación, el ensayo y el error, la descomposición en problemas más sencillos, entre
    otras, seleccionando la más adecuada según su eficiencia. También, se persigue que el alumnado sea capaz de obtener todas
    las soluciones posibles de un problema, de demostrar la validez matemática de dichas soluciones, así como de seleccionar
    de entre ellas las más adecuadas en función del contexto, usando diferentes modos de comprobación de soluciones o de estrategias
    para validarlas, y evaluar su alcance.
