id: '0212'
titulo: 'Ámbito Lingüístico y Social (Educación Secundaria Obligatoria): 19 diferencias corregidas con el documento oficial'
motivo: 'Diferencias que el contraste no explicaba con el BOC. Criterio aprobado: el ODT oficial de la web de currículos es
  la referencia y el corpus debe reflejarlo. Se rehacen con los saberes y la numeración del documento los bloques SMBS03SBI,
  SMBS03SBII, SMBS03SBV, SMBS03SBVII, SMBS04SBII, SMBS04SBVI, SMBS04SBVII, en los que faltaban o sobraban saberes. Tipos:
  explicación de bloque distinto; nodo del corpus que no está en el documento.'
fuente:
  documento: eso-ambito-linguistico-y-social
  fichero: fuentes/documentos/eso/anexo_1_curriculos_pdc_eso_LS.odt
  sha256: 81b1c093d073bb40f625301a50832d4c4a68d6fdb6953728644a01360c8e1dac
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: bc:SMBS04BC1
  campo: scopeNote
  valor: 'A través de este bloque competencial se comprobará que el alumnado es capaz de comprender e interpretar, individualmente
    o en grupo, textos escritos, orales o multimodales de los ámbitos personal (conversaciones, anuncios, cartas, mensajería
    electrónica, canciones...), social (noticias, artículos de opinión o entrevistas, en formato periodístico o radiofónicos,
    textos y cuñas publicitarias, tutoriales, debates…) y educativo (manuales escolares, mapas conceptuales, informes, presentaciones,
    charlas TED, coloquios…) e incluso signados (expresiones y vocabulario de uso cotidiano en lengua de signos y alfabeto
    dactilológico). Se constatará que hace uso de estrategias y técnicas de comprensión y descodificación, que distingue la
    información de la opinión o la persuasión, y que es capaz de valorar la forma y el contenido, atendiendo al sentido global,
    a la relación entre sus partes y a la información más relevante, haciendo conexiones entre el texto y su contexto, y diferenciando
    el lenguaje verbal del no verbal. Se verificará, además, si el alumnado es capaz de producir textos escritos y multimodales
    con coherencia, cohesión, fluidez y adecuación, desarrollando procesos metacognitivos: la planificación, la textualización,
    la revisión y la edición del texto final mediante herramientas o plataformas virtuales, de manera respetuosa con la propiedad
    intelectual y con actitud crítica. Asimismo, se confirmará si es capaz de conversar en diálogos pedagógicamente orientados,
    estructurar el discurso y adecuar el registro y el comportamiento no verbal en producciones orales y multimodales, monologadas
    o dialogadas, respetando las características de la variedad dialectal del hablante, sobre temas de interés personal (la
    conversación, la discrepancia o la orden), social (reseñas radiofónicas, entrevistas, pódcast, noticias, debates, tertulias,
    cuñas publicitarias…) y educativo (la exposición oral y el debate) y laboral (curriculum vitae, carta de motivación y
    entrevista de trabajo). Se valorará si es capaz de adecuarse al grado de formalidad y a la audiencia, a los propósitos
    comunicativos, si dedica atención a los aspectos prosódicos (entonación, pausas, tono, timbre, volumen...) y si se ajusta
    al tiempo de exposición, evitando un uso discriminatorio del lenguaje y aplicando la cooperación conversacional, la cortesía
    lingüística (turno de palabra, escucha activa, uso de fórmulas de saludo y despedida…) y la asertividad para intercambiar
    opiniones. Por último, se perseguirá que el alumnado sea capaz de reflexionar sobre la estructura de la lengua y sus usos,
    de modo que en sus producciones orales y escritas preste atención a la corrección lingüística, incorpore un léxico adecuado
    y revise ortográfica y gramaticalmente sus creaciones (mediante diccionarios, manuales de consulta y correctores ortográficos),
    empleando mecanismos de cohesión, conectores textuales y usando adecuadamente las formas verbales. El objetivo último
    es que el alumnado entienda la lengua como una herramienta fundamental para su desarrollo integral y comprenda que su
    mejora contribuirá a facilitar el aprendizaje del resto de materias y saberes.'
