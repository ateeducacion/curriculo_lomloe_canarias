id: 0268
titulo: 'Antropología y Sociología (Bachillerato): enunciado de competencia del documento oficial'
motivo: El documento oficial dice «interés por la propia cultura y sociedad»; el corpus omitía «y sociedad». Lo ocultaba la
  explicación automática «limitación del modelo», retirada al guardar los enunciados por curso.
fuente:
  documento: bachillerato-antropologia-y-sociologia
  fichero: fuentes/documentos/bachillerato/Antropologia_y_Sociologia_BACH.odt
  sha256: 0e74853af05905a1e053010552dc02dd9e2df6ae4ef250fefb5c308531ed1afb
  ubicacion: Tablas de bloques competenciales
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: ce:BATRC3
  campo: definition
  valor: Reconocer el valor de las aportaciones de la antropología y la sociología para desarrollar el interés por la propia
    cultura y sociedad, promoviendo una perspectiva más amplia y respetuosa sobre las otras culturas mediante la realización
    de productos en los que se destaque el trabajo colaborativo y el ejercicio crítico sobre el fenómeno de la globalización.
