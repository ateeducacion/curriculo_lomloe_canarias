  valor: El pensamiento filosófico se ofrece aquí como una herramienta para pensar el presente que transforma las ideas de
    lo que somos, que despierta en el alumnado el asombro y la duda para impulsar la reflexión desde perspectivas diferentes.
    A través de este bloque competencial se persigue constatar que el alumnado reconoce los principales interrogantes filosóficos
    y construye un adecuado concepto de la filosofía y de su dimensión crítica, reconociendo las diversas reflexiones y soluciones
    dadas. Para ello, se comprobará que el alumnado es capaz de investigar y seleccionar información significativa que sirva
    al desarrollo de una actitud indagadora y crítica en el planteamiento de los problemas de la vida y la realidad. De este
    modo contribuiremos a la comprensión de textos acerca de la realidad, la ciencia, el ser humano y la sociedad, a la contrastación
    de la información de forma crítica y la comunicación de los conocimientos adoptando un punto de vista creativo, crítico
    y personal.
