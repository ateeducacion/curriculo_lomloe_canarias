- nodo: crit:PLNT01CE4.1
  campo: definition
  valor: Interpretar y explicar, de forma guiada, información básica de conceptos, textos breves y sencillos o emociones,
    atendiendo a la diversidad y apoyándose en recursos y soportes analógicos y digitales, con el fin de resolver problemas
    de su entorno inmediato en situaciones comunicativas sencillas para la mejora de la convivencia y el fomento de la igualdad
    de oportunidades, mostrando respeto y empatía hacia las diferencias culturales.
