  valor: A través de este bloque competencial se persigue constatar el grado de participación del alumnado en el desarrollo
    y ejecución de propuestas artístico-musicales breves y sencillas, entendiéndolas como medio para transmitir ideas, emociones
    y sentimientos. El nivel de implicación en las diversas tareas de forma colaborativa facilitará la valoración de la participación
    en el trabajo en grupo, aceptando tareas y responsabilidades de manera cooperativa y mostrando respeto y empatía con las
    ideas, las emociones y los sentimientos de los compañeros y las compañeras. Igualmente se evaluará el respeto de las normas
    básicas para la práctica musical en grupo. De la misma manera se constatará si el alumnado es capaz de utilizar elementos
    y recursos básicos para la creación de productos musicales, lo que implica la iniciación en el empleo de herramientas
    de grabación y reproducción de sonido. Asimismo se evaluará si son capaces de iniciarse en el empleo de las técnicas elementales
    necesarias para la interpretación vocal, instrumental y corporal de sus propias producciones. Además de la observación
    del proceso, también se tendrá en cuenta la búsqueda de calidad artística en la elaboración de productos y que sean considerados
    como un medio para transmitir valores democráticos, respeto por la diversidad, compromiso con la igualdad de género, la
    cohesión social y el desarrollo sostenible. La integración de diversos lenguajes en la creación de productos artísticos
    multidisciplinares invita, de manera inequívoca, a diseñar propuestas conjuntas entre las materias del ámbito artístico,
    potenciando la creatividad y la formación holística e inclusiva del alumnado.
