cambios:
- nodo: bc:BPSI02BC1
  campo: scopeNote
  valor: Se comprobará que el alumnado reconoce e identifica los elementos característicos del método científico, que comprende
    la relevancia del papel de la Psicología como disciplina científica y que reconoce su valor a la hora de promover la salud
    y mejorar la calidad de vida de las personas. Se verificará que es capaz de discriminar el conocimiento científico del
    pseudocientífico para evitar los riesgos de la desinformación a través del análisis crítico de textos científicos y no
    científicos. Por medio de esta competencia se constatará que el alumnado interpreta y transmite en diferentes formatos
    las aportaciones de las distintas teorías psicológicas como el psicoanálisis, el conductismo, el estructuralismo, el funcionalismo,
    el humanismo, el cognitivismo, etc., enfrentándose a textos significativos y breves de autoras y autores relevantes y
    que establece relaciones de forma argumentada entre el conocimiento aportado por la Psicología y el proveniente de otras
    disciplinas científicas, comprendiendo así los procesos de construcción del conocimiento. El alumnado será capaz de establecer
    relaciones entre el conocimiento aportado por la Psicología y el bienestar físico y mental de las personas participando
    de forma activa e informada en diferentes contextos, localizando, seleccionado, contrastando y transmitiendo información
    con autonomía y actitud crítica consolidando así su madurez personal y social y desarrollando una conciencia ciudadana
    responsable.
- nodo: crit:BPSI02CE2.1
  campo: definition
  valor: Identificar y comprender y explicar las características de la Psicología básica, sus objetivos, y principales técnicas
    de investigación, analizando el alcance y las limitaciones de los métodos empleados y estableciendo relaciones, e integrando
    la información procedente de otros campos del conocimiento para comprender los procesos de construcción del mismo.
