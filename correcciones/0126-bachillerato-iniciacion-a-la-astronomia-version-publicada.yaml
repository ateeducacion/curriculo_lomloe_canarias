cambios:
- nodo: ce:BIASC1
  campo: definition
  valor: Analizar la contribución de las distintas civilizaciones a la historia de la Astronomía, identificando y valorando
    las distintas aportaciones con una visión crítica y acorde al momento histórico en el que se producen, con la finalidad
    de comprender la evolución de las teorías que rigen el origen y el desarrollo del universo, y de reconocer las principales
    constelaciones, asociándolas a sus mitos históricos.
- nodo: sb:BIAS01SBI.8
  campo: definition
  valor: Descripción de la composición y organización del Universo (planetas, satélites, estrellas, galaxias, agujeros negros...),
    reconociendo la hipótesis de la existencia de la energía y materia oscura como elemento constituyente.
- nodo: sb:BIAS01SBV.4
  campo: definition
  valor: Análisis de la composición del Universo, reconociendo la hipótesis de la existencia de la energía y materia oscura.
- nodo: sb:BIAS01SBVI.8
  campo: definition
  valor: Conocimiento de los observatorios modernos y de los grandes telescopios, destacando la importancia de los centros
    de investigación (IAC) y de los observatorios de Canarias.
