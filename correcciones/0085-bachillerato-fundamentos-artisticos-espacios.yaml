- nodo: bc:BFU102BC2
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de valorar el patrimonio cultural y
    artístico, con especial atención al patrimonio canario, atendiendo a los condicionamientos ambientales y contextuales
    de las producciones de distintos periodos, consultando fuentes analógicas o digitales, y analizar su evolución a partir
    del estudio de diversas producciones de distintos estilos y épocas y relacionarlas con su función de forma abierta y respetuosa.
    Se verificará que es capaz de reconocer la diversidad de usos y funciones que se ha otorgado a las producciones artísticas
    a lo largo del tiempo, y entender cómo se les han atribuido nuevas funciones que distan del uso para el que fueron creados.
    Todo ello con la finalidad de ahondar en el significado del arte y de los objetos artísticos, además conocer las diversas
    atribuciones de las diferentes funcionalidades que se han dado a productos artísticos a lo largo de la historia propiciando
    una mirada desprejuiciada y explicar las singularidades de diversas manifestaciones culturales y artísticas.
- nodo: bc:BFU102BC3
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de analizar las manifestaciones artísticas
    desde su estudio formal, funcional y semántico, reconociendo las claves de sus lenguajes, valorando la riqueza expresiva
    del arte y de los lenguajes utilizados, además haciendo uso de la terminología específica para analizar una obra de arte
    con un lenguaje preciso, adecuado y coherente. Igualmente se verificará que es capaz de describir la multiplicidad de
    matices, variables y sutilezas que admite el análisis de una obra de arte, así como analizar la información obtenida explicando
    tanto las particularidades, como las semejanzas o diferencias de diversas producciones artísticas. Todo ello, con la finalidad
    de identificar los elementos constituyentes de manifestaciones artísticas de diversos periodos y estilos, haciendo uso
    de medios analógicos o digitales, justificando su relación con la época, artista o movimiento correspondiente y a su vez
    desarrollar el criterio y el deleite estético en la recepción de cualquier manifestación artística.
- nodo: sb:BFU102SBV.3
  campo: definition
  valor: Identificación y valoración de la arquitectura del vidrio y del hierro del s. XIX para establecer su impacto en la
    arquitectura posterior, especialmente en el movimiento moderno.
