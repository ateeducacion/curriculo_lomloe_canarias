cambios:
- nodo: bc:PLCL01BC8
  campo: scopeNote
  valor: Con este bloque competencial se comprobará que el alumnado, a través de su participación en itinerarios lectores,
    es capaz de escuchar textos literarios y realizar lecturas guiadas, acompañadas y autónomas, con especial atención a la
    literatura canaria, de manera silenciosa o en voz alta, empleando la entonación y el ritmo adecuados. Para ello, se constatará
    que establece relaciones elementales entre los diferentes textos literarios y otras manifestaciones culturales o artísticas.
    Asimismo, se verificará que comunica ideas, pensamientos, sentimientos y emociones empleando distintos lenguajes artísticos
    y culturales, integrando su propio cuerpo y que usa estrategias para la interpretación acompañada y compartida de las
    obras a través de conversaciones literarias. Por último, se verificará que produce, de manera acompañada, textos literarios,
    a partir de la observación de modelos dados, que incluyan otros lenguajes artísticos, experimentando, tanto en la creación
    como en la difusión, con diferentes medios y soportes, y con diversas técnicas plásticas, visuales, audiovisuales, sonoras
    o corporales, para percibir su sensibilidad estética, disfrutar de la experiencia y, en consecuencia, mejorar su expresión
    oral y escrita en la producción de diversos textos con intención lúdica, artística y creativa.
