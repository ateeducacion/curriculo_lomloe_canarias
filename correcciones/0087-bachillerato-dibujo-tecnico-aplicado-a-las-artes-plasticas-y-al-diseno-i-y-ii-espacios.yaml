cambios:
- nodo: bc:BDDB01BC3
  campo: scopeNote
  valor: A través de este bloque competencial se verificará si el alumnado diferencia las características de los distintos
    sistemas de representación, a través de la selección y aplicación, en cada caso, del procedimiento y sistema apropiado
    a la finalidad del proyecto artístico que se quiere plasmar; tiene en cuenta los tipos de proyección; y emplea conocimientos
    técnicos específicos de manera resolutiva y autónoma. Se observará también si representa, de forma eficaz, objetos sencillos
    mediante sus vistas diédricas (representación del sistema diédrico ortogonal en el primer diedro y las vistas en sistema
    europeo). Asimismo, se comprobará si diseña envases sencillos por medio de la representación en perspectiva isométrica
    o caballera; si en la iniciación al diseño de packaging reflexiona sobre el proceso realizado y el resultado obtenido,
    de manera creativa, innovadora e imaginativa; y si para todo ello desarrolla la visión espacial y la habilidad en la croquización
    y el dibujo a mano alzada. Por último, se verificará si dibuja ilustraciones o viñetas aplicando las técnicas de la perspectiva
    cónica (frontal y oblicua) en la representación de espacios, objetos o personas desde distintos puntos de vista, mejorando
    las destrezas gráficas; y si todo esto lo aplica al cómic, a la realización de ilustraciones y a proyectos de diseño de
    objetos y espacios, empleando soluciones innovadoras con una actitud colaborativa y creativa.
- nodo: bc:BDDB01BC5
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará si el alumnado adquiere destrezas en el manejo de herramientas
    y técnicas de dibujo vectorial en 2D; las aplica a la realización de proyectos de diseño, de forma individual o colectiva;
    y reflexiona sobre el resultado obtenido. Asimismo, se evaluará si se inicia en el modelado en 3D mediante el diseño de
    esculturas e instalaciones, proponiendo ideas creativas e innovadoras, además de prestar especial atención a artistas
    como Manuel Bethencourt, Juan Bordes o José Abad, entre otros, valorando su potencial como herramienta de aplicación en
    el proceso creativo; y lo aplica a proyectos artísticos de diseño gráfico, de objetos y de espacios mediante el uso de
    dispositivos digitales.
- nodo: bc:BDFB02BC2
  campo: scopeNote
  valor: A través de este bloque competencial se constatará si el alumnado diseña patrones, mosaicos, elementos decorativos
    y tipografías con precisión y exactitud, mediante la aplicación de transformaciones geométricas y trazados con y sin herramientas
    digitales, utilizando el pensamiento científico; y si con todo ello aborda proyectos creativos con eficacia, proporcionando
    recursos geométricos básicos para la concepción y diseño de los mismos, haciendo eficaz el aprendizaje. También se evaluará
    si diseña formas y construcciones geométricas mediante el empleo de tangencias, enlaces y curvas cónicas, con la intención
    de aplicarlas al diseño gráfico y el trazado manual y digital; y realiza, con rigor, diseños de proyectos artísticos y
    culturales sostenibles, que pueden estar asociados a la arquitectura de Canarias (Torre del Conde, Faro de la Entellada,
    Teatro Pérez Galdós, entre otros), con el uso diferentes herramientas y lenguajes artísticos. Por último, se constatará
    si estos recursos los incorpora tanto en la transmisión y desarrollo de ideas como en la expresión de sentimientos y emociones.
- nodo: bc:BDFB02BC4
  campo: scopeNote
  valor: A través de este bloque competencial se verificará si el alumnado es capaz de crear un diseño sencillo siguiendo
    las fases de un proyecto, partiendo del dibujo de bocetos o croquis al plano de taller para que se establezca un paso
    intermedio entre la idea y la ejecución material del diseño, de manera individual o en grupo, con el uso de diferentes
    herramientas digitales que les permita proponer ideas creativas y aplicar conocimientos técnicos. Asimismo, se comprobará
    si con este proyecto, y a través de códigos gráficos y normas generalizadas (UNE e ISO), comunica clara e inequívocamente
    su forma y dimensiones, por medio de la representación de objetos y sus vistas acotadas (cortes, secciones y roturas),
    a fin de interpretar y representar objetos y espacios, aplicando estrategias y destrezas que agilicen el trabajo colaborativo,
    para favorecer la utilización eficaz y ética de los diferentes criterios de comunicación. Todo esto, con las cualidades
    fundamentales de la funcionalidad, la operatividad y la universalidad, propias del dibujo normalizado.
