cambios:
- nodo: bc:IC4M01BC2
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de comprender los mensajes y las intenciones
    comunicativas de otras personas, así como de interpretar los estímulos del entorno, demostrando interés y curiosidad por
    la información que recibe, e iniciándose en la adquisición de diferentes estrategias que le permitan realizar anticipaciones,
    aproximaciones e inferencias. Se constatará que el alumnado es capaz de construir nuevos significados y aprendizajes,
    progresando, desde el acompañamiento y la mediación, hacia un determinado grado de autonomía y conocimiento del mundo.
    Se comprobará, de la misma manera, que el alumnado comprende palabras o capta el sentido global de mensajes sencillos
    en una primera lengua extranjera relacionados con rutinas propias del aula, con estados de ánimo, tiempo atmosférico,
    día de la semana…, y que relaciona palabras en dicha lengua con imágenes. Asimismo se verificará que los niños y las niñas
    son capaces de expresar sensaciones, sentimientos y emociones ante manifestaciones artísticas y culturales a través de
    la realización de observaciones y exploraciones de determinadas representaciones sociales, culturales y artísticas propias
    del patrimonio canario y de otras culturas presentes en su entorno más cercano, para comenzar a construir su propio conocimiento
    sobre los valores culturales más próximos. Todo ello con la finalidad de que el alumnado sea cada vez más autónomo en
    su uso del lenguaje oral en situaciones cotidianas, ampliando su repertorio lingüístico en situaciones comunicativas,
    iniciándose en el descubrimiento de la realidad lingüística del aula y de su entorno más cercano.
