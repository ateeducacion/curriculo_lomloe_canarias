cambios:
- nodo: bc:BHAR02BC2
  campo: scopeNote
  valor: A través de este bloque competencial se verificará que el alumnado es capaz de utilizar el arte como motivo de comunicación
    y de expresión de ideas, deseos y emociones. Esto se comprobará con el uso del vocabulario correcto para generar juicios
    propios que consigan fundamentar sentimientos y cimentar la empatía y el respeto por las expresiones ajenas, evitando
    actitudes discriminatorias. En el ámbito personal conlleva que el alumnado adquirirá la autonomía expresiva a la par que
    correcta, la autoafirmación personal y el respeto ante expresiones externas, que se conseguirán elaborando y expresando
    con coherencia y fluidez juicios y emociones propios acerca de las obras de arte y mostrando respeto y empatía por las
    opiniones, expresiones y emociones de los demás, así como utilizando la terminología y el vocabulario específico de la
    materia y demostrando un conocimiento básico de diversos lenguajes artísticos aprendidos. Los saberes que las alumnas
    y los alumnos adquirirán en este bloque versarán sobre el arte como forma de comunicación, la subjetividad, terminología
    y vocabulario artísticos específicos y herramientas de análisis de las obras de arte.
- nodo: bc:BHAR02BC3
  campo: scopeNote
  valor: A través de este bloque competencial se persigue que el alumnado pueda conocer las distintas funciones del arte.
    Por un lado, las relacionadas con el decurso de la historia y, por otro, su utilización religiosa, ideológica, política,
    social, económica, expresiva o propiamente estética, su producción y su percepción, lo que generará, por parte del alumnado,
    una comprensión global de las funciones del arte y fomentará su juicio crítico. Todo ello conllevará la necesidad de investigar,
    analizar, contrastar, opinar y expresar con corrección, tanto de forma individual como en trabajo colaborativo, con el
    fin de conseguir una imagen propia y colectiva integradora. Para ello se evaluará tanto la distinción, el análisis y la
    comprensión como la elaboración de un juicio crítico personal sobre las funciones del arte desde la prehistoria hasta
    la actualidad, que puede ser expresado mediante exposiciones audiovisuales, tablones, conferencias, debates, etc.
