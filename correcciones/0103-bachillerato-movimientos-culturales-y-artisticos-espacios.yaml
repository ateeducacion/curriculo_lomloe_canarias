- nodo: bc:BMFV02BC2
  campo: scopeNote
  valor: A través de este bloque competencial se verificará que el alumnado participa de forma activa en la conservación del
    patrimonio, argumentando por qué debe conservarse y comprendiendo el aporte de su conservación a la identidad individual
    y colectiva. Para ello el alumnado desarrollará proyectos de investigación individuales o colectivos, expresándose con
    corrección de forma oral, escrita, signada o multimodal, tras haberse documentado de manera rigurosa sobre los valores
    patrimoniales de las obras estudiadas. Los productos pueden ser paneles divulgativos, exposiciones o ferias, entre otras,
    usando los distintos espacios del centro educativo. Como resultado, el alumnado valorará de manera personal las creaciones
    relacionadas con los movimientos culturales y artísticos, especialmente los canarios, y las protagonizados por mujeres,
    para comprometerse con su conservación y con los ideales de libertad, creatividad y expresión que ayudan a configurar
    la identidad individual y colectiva. El objeto de estudio será la relación entre naturaleza, arte, cultura, arquitectura
    y urbanismo.
- nodo: sb:BMFV02SBV.3
  campo: definition
  valor: Aprendizaje y uso de los medios electrónicos, informáticos y digitales en el arte. Introducción al videoarte.
