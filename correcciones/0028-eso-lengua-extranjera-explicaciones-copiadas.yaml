id: 0028
titulo: 'Lengua Extranjera (Educación Secundaria Obligatoria): 18 explicaciones de bloque copiadas de otro curso'
motivo: La exportación repite en estos bloques competenciales la explicación de otro curso de la materia; el documento oficial
  trae una explicación propia para cada curso. Generada con `contrastar --proponer`.
fuente:
  documento: eso-lengua-extranjera
  fichero: fuentes/documentos/eso/Lengua_extranjera_ESO.odt
  sha256: 02f02285ec33ec8380caaf22b32eb86bfed12063865f50b3748f8a55dea2d159
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: bc:SLNT02BC1
  campo: scopeNote
  valor: Mediante este bloque competencial se confirmará que el alumnado es capaz de interpretar y analizar el sentido global
    y la información específica y explícita de textos orales, escritos y multimodales, breves y sencillos, utilizando recursos
    para el aprendizaje como diccionarios u otros recursos digitales. Además, también se pretende corroborar que el alumnado
    interpreta información de textos orales, escritos o multimodales, breves y sencillos, sobre temas cotidianos, poniendo
    en marcha un repertorio de estrategias básicas como hacer uso de sus conocimientos previos, apoyarse en pistas textuales
    para localizar información en un texto, asociar formatos a los diferentes tipos de textos o realizar de hipótesis y suposiciones
    para mejorar la comprensión. Asimismo, se trata de verificar que el alumnado aplica, con cierta autonomía, los conocimientos
    y las estrategias básicas de búsqueda y selección de información, para adquirir conocimiento y para ampliar su repertorio
    lingüístico individual con léxico de uso común y de interés para el alumnado. Además, se trata de corroborar que el alumnado
    reconoce modelos contextuales y géneros discursivos frecuentes en la comprensión de textos orales, escritos y multimodales,
    breves y sencillos, literarios y no literarios, relativos a la salud, la actividad física, el medioambiente, la comunicación
    y la tecnología, entre otros, que le ayuden a mejorar progresivamente el nivel de comprensión.
- nodo: bc:SLNT02BC2
  campo: scopeNote
  valor: Mediante este bloque competencial se comprobará que el alumnado es capaz de organizar y expresar con cierta autonomía
    textos orales y escritos escritos en diferentes soportes sobre temas cotidianos y frecuentes de relevancia para el alumnado
    en los ámbitos personal, público y educativo, que sean breves y sencillos y estén estructurados con claridad, empleando
    elementos lingüísticos de uso común que los doten de la apropiada cohesión y coherencia, produciéndolos con originalidad
    y adaptándolos a la intención comunicativa y a las convenciones sociolingüísticas, haciendo uso de su repertorio lingüístico
    para responder de esta manera a propósitos comunicativos concretos en los que se adopte un punto de vista reflexivo. Además,
    se buscará constatar que el alumnado selecciona, organiza y aplica con cierta autonomía estrategias básicas que impliquen
    la planificación, la coevaluación y la autoevaluación, la compensación, la comunicación no verbal o la autorreparación,
    tales como respetar los pasos de una tarea, emplear palabras clave o usar una lista de control para reajustar su trabajo.
    Por otro lado, se comprobará que se adopte una actitud adecuada, en la que se incluya el respeto por las producciones
    de los demás y la motivación, así como una aceptable gestión de las emociones y el aprecio y respeto por las normas.
- nodo: bc:SLNT02BC3
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado puede desenvolverse en situaciones interactivas,
    breves y sencillas, como conversaciones en las que se traslada información, en las que se solicita algo o en las que se
    produce intercambio de correspondencia personal,  ajustándose a la función comunicativa y usando convenciones y elementos
    lingüísticos de uso común o más habitual. Además, se buscará confirmar que planifica y participa en actividades grupales,
    tanto en el aula como fuera de ella, empleando herramientas o plataformas virtuales con suficiencia. También se tratará
    de verificar que muestra respeto y empatía por los interlocutores y las interlocutoras. Del mismo modo, se pretenderá
    verificar que este pone en marcha de forma guiada y en entornos próximos un repertorio de estrategias como el empleo de
    lenguaje prefabricado, modelos, ensayos previos, o la transferencia léxica o morfosintáctica, además de otros recursos,
    para así ajustarse a la tarea. Consecuentemente, durante su desarrollo deberá utilizar métodos que impliquen procesos
    de autoevaluación, coevaluación y autorreparación, siendo capaz de incorporar las experiencias de los demás en su aprendizaje.
    Finalmente, se buscará constatar que mantiene la motivación y el interés por llevar a cabo intercambios comunicativos
    en la lengua extranjera que le permitan ampliar su repertorio lingüístico.
- nodo: bc:SLNT02BC4
  campo: scopeNote
  valor: Mediante este bloque competencial se comprobará que el alumnado es capaz de mediar, oralmente o por escrito y de
    forma progresivamente autónoma, usando estrategias y conocimientos sencillos orientados a inferir y explicar conceptos,
    textos o comunicaciones de manera simple para transmitir información de forma activa mediante textos dotados de coherencia,
    cohesión y corrección en situaciones en las que se atiende a la diversidad. A su vez, se persigue constatar que el alumnado
    es capaz de mostrar respeto y empatía por las interlocutoras y los interlocutores y aprecio por las lenguas empleadas,
    al igual que hacer uso de la motivación y de una aceptable gestión emocional. Del mismo modo, se tratará de verificar
    que participa con interés en la solución de problemas de intercomprensión y de entendimiento en los que adoptará un punto
    de vista progresivamente crítico para así transmitir información de manera clara y responsable y con un repertorio lingüístico
    relativamente variado. También se verificará que el alumnado pueda aplicar estrategias básicas de forma progresivamente
    autónoma que ayuden a crear puentes y que faciliten la comunicación, como realizar transferencias léxicas o morfosintácticas,
    o razonar estratégicamente, adecuándose a las intenciones comunicativas, a las características contextuales y al tipo
    de texto en situaciones cotidianas y frecuentes próximas a la experiencia del alumnado, así como optimizando el uso de
    recursos y apoyos físicos o digitales en función de las necesidades de cada momento, con la finalidad de explicar y simplificar
    de manera activa e informada, textos, conceptos y mensajes.
- nodo: bc:SLNT02BC5
  campo: scopeNote
  valor: Por medio de este bloque competencial se verificará que el alumnado enriquece su repertorio lingüístico individual,
    estableciendo relaciones entre las distintas lenguas, a las que aplica métodos inductivos, deductivos o lógicos, para
    así extraer la información más relevante. Asimismo, se pretende comprobar que emplea herramientas y estrategias, de manera
    individual o en grupo, con cierta autonomía, como la producción y corrección de borradores, la toma de notas, la escucha
    activa, la realización de ensayos y la detección de errores comunes; u otras como el empleo de la perseverancia, la toma
    de decisiones o el uso de expresiones y léxico más habitual para intercambiar ideas sobre la propia comunicación y el
    aprendizaje (preguntar por el significado de una palabra o expresión, solicitar aclaraciones, manejar términos lingüísticos,
    etc.). A su vez, se persigue corroborar que plantea metas a corto y medio plazo respecto a las tareas y que documenta
    los procesos de planificación y evaluación de sus aprendizajes, tomando nota de las reflexiones y emociones derivadas
    e integrando las experiencias de aprendizaje de los demás. De la misma manera, se pretende evidenciar que se utilizan
    herramientas digitales y analógicas como lectores inmersivos, traductores digitales, diccionarios, webs, dosieres, porfolios…,
    las cuales integra en su entorno personal de aprendizaje, de modo que todo ello le permita tanto mantener la motivación
    como progresar, consolidar y avanzar en el aprendizaje de la lengua extranjera, transfiriendo conocimientos y estrategias
    a diferentes contextos sociales.
- nodo: bc:SLNT02BC6
  campo: scopeNote
  valor: Mediante este bloque competencial se confirmará que el alumnado es capaz de valorar la diversidad lingüística, cultural
    y artística y de mostrar respeto y aprecio por la cultura canaria y por otras, utilizando para ello la lengua extranjera
    en contextos cotidianos como medio de comunicación y de enriquecimiento personal. También se verificará que el alumnado
    identifica y comparte las semejanzas y diferencias entre lenguas y entre la cultura canaria y otras culturas, y que promueve
    aspectos esenciales del patrimonio cultural, natural y artístico canario, aplicando estrategias con cierta autonomía,
    con el fin de atender a valores ecosociales y democráticos que fomenten la sostenibilidad, la defensa de la libertad de
    expresión, la igualdad (con especial atención a la de género y a los derechos humanos) y el enriquecimiento inherente
    a la diversidad.
