  valor: Mediante este bloque competencial, se confirmará que el alumnado es capaz de valorar críticamente la diversidad lingüística,
    cultural y artística, y mostrar respeto y aprecio por la cultura canaria y por otras, utilizando para ello la lengua extranjera
    en contextos cotidianos como medio de comunicación y de enriquecimiento personal. También se verificará que el alumnado
    identifica y comparte las semejanzas y diferencias entre lenguas y entre la cultura canaria y otras culturas, y que promueve
    aspectos relevantes del patrimonio cultural, natural y artístico canario, aplicando estrategias de uso común, con el fin
    de atender a valores ecosociales y democráticos que fomenten la sostenibilidad, la defensa de la libertad de expresión,
    la igualdad, con especial atención a la de género y a los derechos humanos, y el enriquecimiento inherente a la diversidad.
