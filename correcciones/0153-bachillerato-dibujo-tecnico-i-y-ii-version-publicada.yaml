cambios:
- nodo: crit:BDBT01CE1.1
  campo: definition
  valor: Interpretar e identificar, a lo largo de la historia, la relación entre las matemáticas y el dibujo geométrico, valorando
    su importancia en diferentes campos como la arquitectura o la ingeniería, realizando búsquedas avanzadas en internet,
    así como evaluando y sintetizando la información, para analizar las estructuras geométricas y los elementos técnicos utilizados.
- nodo: crit:BDBT01CE2.1
  campo: definition
  valor: Resolver gráficamente cálculos matemáticos y transformaciones básicas, aplicando conceptos y propiedades de la geometría
    plana, utilizando herramientas e instrumentos adecuados y empleando destrezas que agilicen el trabajo colaborativo y en
    equipo, para resolver gráficamente operaciones matemáticas, relaciones, construcciones y transformaciones.
- nodo: crit:BDBT01CE2.2
  campo: definition
  valor: Trazar gráficamente construcciones poligonales, basándose en sus propiedades y mostrando interés por la precisión,
    claridad y limpieza, interpretando los elementos más relevantes de forma autónoma y aplicando destrezas que agilicen el
    trabajo colaborativo, para resolver gráficamente operaciones básicas de geometría plana.
- nodo: crit:BDBT01CE3.1
  campo: definition
  valor: Representar en sistema diédrico elementos básicos en el espacio, determinando su relación de pertenencia, posición
    y distancia, y utilizando el pensamiento científico a través objetivos que hagan eficaz el aprendizaje, para expresar
    y calcular soluciones a problemas geométricos sobre la superficie del plano.
- nodo: crit:BDBT01CE3.2
  campo: definition
  valor: Definir elementos y figuras planas en sistemas axonométricos, valorando su importancia como métodos de representación
    espacial, aprovechando la cultura digital, evaluando el proceso de la construcción del conocimiento y aplicando estrategias
    que agilicen el trabajo en equipo, para interpretar y recrear gráficamente la realidad tridimensional sobre la superficie
    del plano.
- nodo: crit:BDBT01CE3.3
  campo: definition
  valor: Representar elementos básicos en el sistema de planos acotados, haciendo uso de sus fundamentos, aplicando conocimientos
    técnicos específicos y buscando objetivos de forma autónoma, para resolver problemas e interpretar y recrear gráficamente
    la realidad tridimensional sobre la superficie del plano.
- nodo: crit:BDBT01CE3.5
  campo: definition
  valor: Valorar el rigor gráfico del proceso, la claridad, la precisión y el proceso de resolución y construcción gráfica,
    reflexionando sobre el resultado obtenido, a fin de fortalecer el optimismo y de aplicar estrategias y destrezas que agilicen
    el trabajo en equipo, para expresar y calcular las soluciones a problemas geométricos de representación espacial.
- nodo: crit:BDBT01CE4.2
  campo: definition
  valor: Utilizar el croquis y el boceto como elementos de reflexión en la aproximación e indagación de alternativas y soluciones
    a los procesos de trabajo, llevando a cabo una fase de creación de ideas, soluciones innovadoras y toma de decisiones,
    y buscando objetivos de forma autónoma, para hacer eficaz el aprendizaje, así como para iniciarse en la documentación
    gráfica de proyectos técnicos.
- nodo: crit:BDBT01CE5.1
  campo: definition
  valor: Crear figuras planas y tridimensionales mediante programas de dibujo vectorial, usando las herramientas que aportan
    y las técnicas asociadas, seleccionando dispositivos digitales, realizando búsquedas avanzadas en internet y diseñando
    prototipos o modelos, para virtualizar objetos y espacios en 2 y 3D.
