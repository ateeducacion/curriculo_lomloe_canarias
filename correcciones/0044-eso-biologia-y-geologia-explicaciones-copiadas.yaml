cambios:
- nodo: bc:SBIG03BC1
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de interpretar datos e información científica
    en diferentes formatos (gráficos, tablas, imágenes, símbolos, páginas web…) aplicando estrategias de tratamiento de la
    información para analizar y explicar, haciendo uso de la terminología adecuada, conceptos y procesos biológicos y geológicos
    concretos relacionados con los distintos bloques de saberes básicos de la materia, como la estructura de la geosfera y
    su dinámica interna, las interacciones entre la atmósfera, la hidrosfera, la geosfera y la biosfera, la situación medioambiental
    actual de Canarias, la relación entre los principales sistemas y aparatos del organismo, la relevancia de las vacunas
    o los mecanismos de defensa del organismo frente a patógenos, entre otros, apoyándose en el uso de esquemas, vídeos, modelos,
    diagramas, presentaciones, etc., y utilizando, cuando sea necesario, los pasos del diseño de ingeniería (identificación
    del problema, exploración, diseño, creación, evaluación y mejora) y herramientas digitales. También se pretende constatar
    si es capaz, a partir de la información obtenida, de extraer sus propias conclusiones y de argumentarlas, evitando el
    uso discriminatorio del lenguaje, generando productos comunicativos (pódcasts, murales, carteles, presentaciones, exposiciones
    orales…) de forma colaborativa para compartir y transmitir la información mediante herramientas o plataformas virtuales,
    gestionando su presencia y visibilidad en la red y ejerciendo una ciudadanía digital activa, cívica y reflexiva. Todo
    ello con el fin de que el alumnado tome conciencia de la importancia que tiene la transmisión de conocimientos para el
    avance de la ciencia y para el progreso de una sociedad en la que deberá tener una participación activa.
- nodo: bc:SBIG03BC2
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de localizar, seleccionar, contrastar
    y organizar, de manera progresivamente autónoma, información de diferentes fuentes (libros, revistas, periódicos, páginas
    web, pódcast, vídeos, etc.), citándolas correctamente y respetando la propiedad intelectual, para resolver preguntas y
    profundizar en temas relacionados con los distintos bloques de saberes básicos de la materia (vulcanismo canario, tipos
    celulares, importancia del suelo en el mantenimiento de los ecosistemas, situación medioambiental actual de Canarias,
    el cuerpo humano, hábitos saludables, etc.), y compartir contenidos mediante herramientas y plataformas digitales. Asimismo,
    se pretende verificar si el alumnado realiza autoevaluaciones sobre su proceso de aprendizaje buscando fuentes fiables
    y aplicando criterios de validez, calidad, actualidad y fiabilidad para reconocer la información con base científica y
    evitar los riesgos de manipulación y desinformación, manteniendo una actitud escéptica hacia aquellas sin base científica
    como pseudociencias, creencias infundadas, bulos, etc., y tomando conciencia de la necesidad de hacer un uso crítico,
    legal, seguro, saludable y sostenible de las tecnologías. Finalmente, se quiere constatar que el alumnado valora la contribución
    de la ciencia a la sociedad y reconoce la labor de las personas dedicadas a ella, con independencia de su etnia, sexo
    o cultura, destacando a las mujeres científicas, a través de la indagación en fuentes diversas y posterior comunicación
    mediante una exposición sobre científicas canarias, y entendiendo la investigación como una labor colectiva e interdisciplinar
    en constante evolución. Todo ello con el fin de que el alumnado desarrolle el sentido crítico y las destrezas necesarias
    para evaluar, clasificar y reconocer cuándo una información es veraz, preparándose de esta forma para su autonomía personal
    y profesional futura y para contribuir de forma activa y positiva en la sociedad.
- nodo: bc:SBIG03BC3
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de diseñar y realizar proyectos de investigación
    siguiendo los pasos de las metodologías científicas, de manera individual o colaborativa, relacionados con la materia
    (medio natural, salud humana, hábitos saludables, etc.) que supongan la búsqueda, obtención y organización de la información
    de carácter científico a partir de la utilización de fuentes variadas (libros, revistas científicas, páginas web, prensa…),
    discriminando las más idóneas, o la realización autónoma de trabajo experimental de laboratorio o de campo que implique
    la toma de datos cuantitativos o cualitativos. Se pretende evaluar si el alumnado aplica las destrezas propias del trabajo
    científico cuando plantea preguntas e hipótesis justificadas y las contrasta, si utiliza los instrumentos, herramientas
    o técnicas adecuadas con precisión y corrección, si respeta las normas de uso y seguridad en el laboratorio, si argumenta
    el proceso seguido y si reformula el procedimiento si fuera preciso. Del mismo modo, se verificará que el alumnado es
    capaz de interpretar y analizar críticamente los resultados obtenidos utilizando, cuando sea necesario, herramientas matemáticas
    y tecnológicas para obtener conclusiones fundamentadas y comunicarlas, utilizando el vocabulario científico, mediante
    exposiciones orales, escritas o visuales en diversos soporte. Finalmente, se quiere comprobar si el alumnado es capaz
    de establecer colaboraciones en las distintas fases del proyecto científico, utilizando espacios virtuales cuando sea
    necesario, y emplear estrategias de trabajo cooperativo, distribuyendo tareas y responsabilidades de manera equitativa,
    mostrando respeto por las perspectivas y las experiencias de las demás personas para incorporarlas a su aprendizaje,
    favoreciendo la inclusión y el respeto a la diversidad y a la igualdad de género. Todo ello con el fin de que el alumnado
    profundice en el conocimiento y aplicación de las metodologías científicas a través del desarrollo de proyectos de investigación,
    trabajando destrezas que le serán de gran utilidad no solo dentro del ámbito científico, sino también en su desarrollo
    personal, profesional y en su participación social.
- nodo: bc:SBIG03BC4
  campo: scopeNote
  valor: 'A través de este bloque competencial se comprobará que el alumnado es capaz de resolver problemas o dar explicación
    a procesos biológicos o geológicos de la vida cotidiana relacionados con los saberes básicos de los distintos bloques
    de la materia: el medioambiente (el calentamiento global, el cambio climático o la erosión y contaminación del suelo),
    la eficacia de las vacunas en la prevención de enfermedades infecciosas, los efectos de las adicciones, con sustancia
    y sin sustancia, sobre la salud o las relaciones entre los distintos sistemas del cuerpo humano, entre otros, identificando
    las variables o aspectos relevantes en cada caso y planteando modelos simplificados, formulando preguntas y comprobando
    hipótesis y utilizando sus propios conocimientos, datos e información obtenida mediante la observación o la experimentación,
    el razonamiento lógico, el pensamiento computacional o recursos digitales (animaciones, simulaciones, laboratorios virtuales…).
    Se evaluará, asimismo, si es capaz de analizar críticamente la solución a un problema sobre fenómenos biológicos o geológicos
    de forma cooperativa, valorando el impacto que puedan suponer en el entorno, y si reflexiona sobre el proceso realizado,
    valorando su viabilidad para tomar decisiones de forma razonada, si no lo fuese, y presentar ideas y soluciones alternativas.
    Por último, se valorará si el alumnado muestra persistencia y confianza ante problemas difíciles de resolver y si es capaz
    de desarrollar procesos metacognitivos de retroalimentación para aprender de sus errores. Todo ello con el fin de que
    el alumnado sea capaz de responder en entornos cambiantes y gestionar situaciones complejas de la vida cotidiana con resiliencia
    y haciendo uso del pensamiento lógico-formal.'
- nodo: bc:SBIG03BC5
  campo: scopeNote
  valor: 'A través de este bloque competencial se comprobará que el alumnado es capaz de relacionar la preservación de la
    biodiversidad, especialmente la biodiversidad de las islas Canarias, y la conservación del medioambiente con el desarrollo
    sostenible y la calidad de vida, analizando los efectos de determinadas acciones sobre el medioambiente y la salud (destrucción
    de hábitats, erosión y contaminación del suelo, extinción directa de especies, sobreexplotación de recursos, acumulación
    de residuos, exposición a contaminantes y sustancias químicas presentes en la atmósfera, patologías de los aparatos implicados
    en la nutrición…) mediante la información recabada en salidas de campo y la contenida en fuentes y soportes variados (páginas
    web, fotografías, vídeos, artículos científicos, prensa, etc.). Asimismo, se pretende comprobar si el alumnado es capaz
    de analizar de forma crítica los estilos de vida y las acciones propias y ajenas, teniendo en cuenta fundamentos fisiológicos
    y la información disponible, para promover y adoptar hábitos de vida sostenibles y saludables que eviten o minimicen los
    impactos medioambientales negativos. Por último, se quiere constatar que el alumnado es capaz de afrontar retos con sentido
    crítico, optimismo y resiliencia, aplicando sus conocimientos para diseñar colaborativamente y emprender un plan de acción
    con medidas que contribuyan a la protección y mejora del entorno más próximo y del planeta según el concepto one health
    (una sola salud): de los seres humanos, de otros seres vivos y del entorno natural, defendiendo de forma argumentada y
    respetuosa su conveniencia y difundiéndolo mediante campañas, exposiciones, pódcasts, informes, artículos… Todo ello con
    la finalidad de que el alumnado conozca el funcionamiento de su cuerpo y comprenda que el desarrollo sostenible es un
    objetivo urgente y sinónimo de bienestar, salud y progreso económico.'
- nodo: bc:SBIG03BC6
  campo: scopeNote
  valor: A través de este bloque competencial se verificará que el alumnado es capaz de interpretar el paisaje analizando
    sus elementos mediante la observación del entorno próximo o la utilización de imágenes (mapas, dibujos, fotografías, vídeos,
    animaciones…), completada con información científica recogida de fuentes diversas. Asimismo, se pretende evaluar si asocia
    la actividad humana con la transformación de la superficie terrestre y reflexiona sobre el impacto ambiental y los riesgos
    naturales derivados de dichas acciones, valorando la necesidad de una correcta planificación del uso del territorio en
    casos determinados, como cauces de barrancos, bordes de acantilados y otros lugares que constituyen zonas potenciales
    de riesgo, elaborando proyectos de sensibilización a través de distintas producciones (informes, decálogos, carteles informativos,
    exposiciones orales…) en las que, de forma individual o en grupo, proponga medidas y acciones encaminadas a la prevención
    de posibles catástrofes derivadas de los riesgos naturales, así como para la protección y mejora del paisaje natural canario,
    reconociendo su valor como patrimonio natural y promoviendo en su entorno cercano actitudes respetuosas y comprometidas
    con la naturaleza acordes a los Objetivos de Desarrollo Sostenible (ODS) y la Agenda Canaria de Desarrollo Sostenible
    2030.
- nodo: bc:SBIG04BC1
  campo: scopeNote
  valor: A través de este bloque competencial se pretende comprobar que el alumnado es capaz de interpretar y analizar datos
    e información científica, utilizando estrategias de trabajo cooperativo, en diferentes formatos (textos, gráficos, tablas,
    diagramas, imágenes, páginas web…), manteniendo una actitud crítica para explicar, con rigor científico, conceptos y procesos
    biológicos y geológicos concretos relacionados con los distintos bloques de saberes básicos de la materia, representándolos
    mediante el diseño y la realización de modelos y diagramas y utilizando, cuando sea necesario, los pasos del diseño de
    ingeniería (identificación del problema, exploración, diseño, creación, evaluación y mejora) y las herramientas digitales
    con ética y responsabilidad. También se pretende constatar si el alumnado es capaz, a partir de la información obtenida,
    de elaborar sus propias conclusiones y argumentar de forma fundamentada sus opiniones, transmitiéndolas de forma clara,
    con actitud cooperativa y respetuosa y evitando los usos discriminatorios del lenguaje, mediante exposiciones orales,
    escritas o visuales en diversos soportes, apoyándose en el uso de las tecnologías. Todo ello con el fin de comprender
    la importancia que tiene el intercambio de información y la colaboración entre individuos, organizaciones e incluso países
    para el desarrollo científico.
- nodo: bc:SBIG04BC2
  campo: scopeNote
  valor: A través de este bloque competencial se persigue constatar que el alumnado es capaz de identificar, localizar, seleccionar,
    organizar y evaluar información de fuentes diversas (textos, prensa, páginas web, vídeos, etc.), atendiendo a criterios
    de validez, calidad y actualidad y respetando la propiedad intelectual, para poder resolver preguntas y profundizar en
    temas relacionados con cualquiera de los saberes básicos de la materia (papel de las grandes científicas y científicos
    en el desarrollo de las ciencias biológicas y geológicas, función biológica de los procesos de división celular, principales
    teorías evolutivas, relación entre las mutaciones genéticas y el cáncer, hipótesis sobre el origen de la vida en la Tierra,
    principales teorías sobre el origen y evolución de las islas Canarias, métodos de estudio del interior de la Tierra, etc.).
    Se trata de averiguar si el alumnado realiza autoevaluaciones sobre su proceso de aprendizaje buscando fuentes fiables
    para contrastar la veracidad de la información y si adopta una actitud crítica y escéptica hacia informaciones sin base
    científica, como pseudociencias, teorías conspiratorias, creencias infundadas, bulos, etc., elaborando sus propias conclusiones
    y comunicándolas mediante informes, exposiciones u otros medios. También se quiere comprobar si el alumnado hace un uso
    crítico, legal, seguro, saludable y sostenible de las tecnologías digitales durante el proceso de búsqueda de información
    y si gestiona de manera responsable su presencia y visibilidad en la red para ejercer una ciudadanía digital activa,
    cívica y reflexiva. Por último, se pretende verificar que el alumnado valora la contribución de la ciencia a la sociedad,
    mostrando una actitud crítica acerca de su alcance y limitaciones, y reconoce la labor de las personas dedicadas a ella,
    destacando y ejemplificando las aportaciones de las mujeres en las ciencias experimentales a lo largo de la historia.
    Todo ello con el fin de que el alumnado desarrolle el sentido crítico y las destrezas necesarias para evaluar y clasificar
    la información y distinguir las fuentes fidedignas de aquellas de dudosa fiabilidad, lo que le permitirá afrontar con
    rigor científico el bombardeo continuo de información que existe en la sociedad actual y que no siempre refleja la realidad.
- nodo: bc:SBIG04BC3
  campo: scopeNote
  valor: Este bloque competencial tiene el propósito de evaluar si el alumnado es capaz de planificar y desarrollar proyectos
    de investigación de forma individual o colaborativa relacionados con el medio natural canario, o con cualquier otro de
    los saberes básicos de la materia, que supongan la experimentación, la toma de datos cuantitativos o cualitativos y la
    búsqueda y tratamiento de información de carácter científico a partir de diferentes fuentes (observación, publicaciones
    científicas, libros, páginas web…), discriminando las más idóneas y utilizando los instrumentos, herramientas o técnicas
    adecuadas con corrección y precisión. Se verificará que aplica las destrezas propias del trabajo científico cuando se
    plantea preguntas e hipótesis que puedan ser respondidas o contrastadas, argumenta el proceso seguido, describe sus observaciones
    e interpreta los resultados analizando su coherencia y reformulando el procedimiento si fuera preciso, para comunicar,
    adoptando un punto de vista personal, las conclusiones de su investigación mediante exposiciones orales, escritas o visuales
    en diversos soportes, apoyándose en herramientas digitales y empleando con precisión el vocabulario científico. Finalmente,
    se quiere comprobar si el alumnado mantiene una actitud cooperativa y colaborativa durante las distintas fases de la investigación,
    comprende proactivamente las perspectivas de las demás personas y las incorpora a su aprendizaje, respetando la diversidad
    y la igualdad de género y favoreciendo la inclusión. Todo ello con el fin de ofrecer al alumnado la oportunidad creativa
    y de crecimiento que aporta el trabajo científico, impulsando la igualdad de oportunidades entre los alumnos y las alumnas
    y fomentando las vocaciones científicas desde una perspectiva de género.
- nodo: bc:SBIG04BC4
  campo: scopeNote
  valor: A través de este bloque competencial se quiere comprobar que el alumnado es capaz de aplicar estrategias de resolución
    de problemas, identificando las variables o aspectos relevantes en cada caso, para resolver cuestiones y problemas de
    genética, mendeliana y molecular, medioambiental…, o interpretar procesos relacionados con distintos saberes básicos de
    la materia (la relación entre las mutaciones y el cáncer, la evolución, la tectónica de placas, los riesgos naturales,
    el origen de las islas Canarias, la historia geológica de una zona, etc.) utilizando datos, información procedente de
    distintas fuentes, el razonamiento y el pensamiento computacional para establecer modelos. Se evaluará asimismo la capacidad
    del alumnado para analizar críticamente la solución a un problema y reformular los procedimientos y las conclusiones si
    fuera necesario, presentando de forma cooperativa y a través de diferentes producciones orales o escritas (informes, presentaciones,
    exposiciones…) propuestas innovadoras, éticas y sostenibles, apreciando el impacto que puedan suponer en el entorno.
    Por último, se valorará si el alumnado es capaz de desarrollar procesos metacognitivos de retroalimentación para aprender
    de sus errores durante todo el proceso. Todo ello con el fin de que el alumnado desarrolle destrezas y estrategias, aplicables
    a diferentes situaciones de la vida, para encontrar soluciones y dar explicación a los diversos problemas que se le planteen,
    mostrando confianza a la hora de manejar situaciones complicadas así como tolerancia a la incertidumbre.
- nodo: bc:SBIG04BC5
  campo: scopeNote
  valor: A través de este bloque competencial se evaluará si el alumnado, mediante la información y toma de datos recabada
    en salidas de campo y la contenida en fuentes y soportes variados (páginas web, fotografías, vídeos, artículos científicos,
    periódicos, etc.), es capaz de identificar y analizar basándose en evidencias científicas los posibles riesgos naturales
    que afectan al archipiélago canario potenciados por determinadas actuaciones humanas sobre el medioambiente (destrucción
    de hábitats, extinción directa de especies, pérdida del suelo, sobreexplotación de recursos, acumulación de residuos,
    contaminación atmosférica… ), valorando el impacto que puedan suponer en el entorno. Asimismo, se pretende comprobar que
    el alumnado propone medidas y presenta soluciones innovadoras, éticas y sostenibles a través de campañas, debates, exposiciones,
    etc., que promuevan la adopción consciente y motivada de hábitos que eviten o minimicen los impactos medioambientales
    negativos, así como un estilo de vida sostenible y ecosocialmente responsable. Finalmente, se quiere constatar si el alumnado
    comprende las relaciones de interdependencia entre los efectos de las acciones humanas sobre el medioambiente y los riesgos
    derivados para la salud (exposición a contaminantes y sustancias químicas presentes en la atmósfera, en el agua, en el
    suelo, el agotamiento del ozono, las consecuencias del cambio climático, etc.) y argumenta la necesidad de mantener hábitos
    de vida sostenibles y saludables, defendiendo a través de comunicaciones orales o escritas (pódcasts, informes, artículos…)
    posibles acciones que puedan emprender a nivel familiar y social para preservar la salud individual y colectiva. Todo
    ello con el fin de que el alumnado tome conciencia de que la salud y el desarrollo económico de la especie humana se sustentan
    en el uso racional de los recursos naturales y en el mantenimiento de la biodiversidad.
- nodo: bc:SBIG04BC6
  campo: scopeNote
  valor: A través de este bloque competencial se evaluará si el alumnado es capaz de explicar la historia geológica de un
    relieve de su entorno próximo y deducir que el relieve es el resultado de la interacción de los procesos geológicos internos
    y externos, y, en especial, el origen y la evolución de las islas Canarias, localizando e identificando sus elementos
    más relevantes a partir del análisis e interpretación de cortes geológicos, mapas topográficos u otros sistemas de información
    geológica. Asimismo, se verificará que aplica los principios geológicos básicos (horizontalidad, superposición, actualismo,
    etc.) y hace uso de otras fuentes de información, seleccionando los resultados de manera crítica y respetando la propiedad
    intelectual, para describir los hechos acontecidos y reconstruir algunos de los cambios que la Tierra ha sufrido desde
    su origen, transmitiendo los resultados de forma clara y precisa, en diferentes formatos. También se quiere comprobar
    que interpreta los elementos de un paisaje concreto mediante la observación directa del entorno, el uso de aplicaciones
    tecnológicas, fotografías, vídeos, etc., identificando y analizando los posibles riesgos naturales, así como los generados
    por las actividades humanas para ofrecer propuestas de actuación ante ellos, haciendo balance de su sostenibilidad. Por
    último, se quiere constatar si el alumnado reconoce el valor del patrimonio natural y la fragilidad del paisaje y adopta
    una actitud de rechazo ante las prácticas urbanísticas, forestales, industriales o de otro tipo que pongan en peligro
    vidas humanas, infraestructuras o espacios naturales, proponiendo medidas y emprendiendo acciones fundamentadas científicamente,
    a través de campañas, exposiciones, debates, mesas redondas…, en las que defiende con argumentos y expresa su posición
    personal, encaminadas a concienciar y sensibilizar a la comunidad educativa y a su entorno más cercano sobre la necesidad
    de proteger y conservar el medio natural canario.
