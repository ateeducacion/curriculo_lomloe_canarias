id: '0044'
titulo: 'Biología y Geología (Educación Secundaria Obligatoria): 12 explicaciones de bloque copiadas de otro curso'
motivo: La exportación repite en estos bloques competenciales la explicación de otro curso de la materia; el documento oficial
  trae una explicación propia para cada curso. Generada con `contrastar --proponer`.
fuente:
  documento: eso-biologia-y-geologia
  fichero: fuentes/documentos/eso/Biologia_geologia_ESO.odt
  sha256: c33804f4d036b158a54e5c094f7f79fe188ea0ffa66b3cc4201ea8bc921ff8c3
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: propuesta
