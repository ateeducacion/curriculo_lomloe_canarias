  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: bc:BFUE02BC2
  campo: scopeNote
  valor: Con esta competencia específica se podrá verificar la capacidad del alumnado para establecer y argumentar de forma
    grupal los objetivos sociales y empresariales, y los elementos intangibles de la cultura y la imagen corporativa del proyecto
    emprendedor, mediante el empleo de, por ejemplo, el lienzo misión-visión-valores, el análisis DAFO de la empresa o proyecto
    social y las matrices CAME, que permiten corregir, afrontar, mantener y explotar los factores positivos y negativos detectados.
    Asimismo, se comprobará que tiene en cuenta el impacto de su actividad en el entorno social, laboral y medioambiental,
    incorporando de forma grupal objetivos de responsabilidad social corporativa con los distintos grupos de interés o stakeholders
    de la empresa; además de la aplicación de estrategias de economía circular, en relación con los Objetivos de Desarrollo
    Sostenible y de la Agenda Canaria 2030. Para ello, puede apoyarse en el análisis básico de ejemplos de empresas y en balances
    de sostenibilidad o sociales elaborados en base a indicadores como puede ser el GRI (Global Reporting Initiative) o utilizando
    la metodología de los «5 porqués», que justifiquen la propuesta empresarial en el contexto local para crear valor en su
    entorno y fomentar el consumo responsable, la igualdad y la cohesión social. A continuación, se verificará que el alumnado
    adopta y argumenta las decisiones de constitución de una empresa, referidas a la forma jurídica en relación con las responsabilidades
    legales de las personas propietarias y gestoras, y las exigencias del capital requerido, diferenciando entre trabajo por
    cuenta propia y ajena, entre empresas de personas físicas y jurídicas y reconociendo las peculiaridades del régimen de
    cotización a la Seguridad Social de la persona trabajadora autónoma y las diferencias con las personas autónomas económicamente
    dependientes (TRADEs); que tiene en consideración los factores más relevantes para la toma de decisiones de localización
    y de dimensión; y que aplica las técnicas precisas para llevar a cabo el proceso de naming de la idea de negocio y las
    etapas del branding que permitan crear la identidad corporativa y el posicionamiento de la marca en el mercado. Seguidamente,
    se comprobará también su capacidad para comparar, analizar y sintetizar la información prescriptiva de documentación que
    se precisa, para realizar los trámites ante la Seguridad Social, la Agencia Tributaria, organismos laborales, ayuntamientos
    y el Registro Mercantil, mostrando autonomía en la búsqueda de información fiable y actualizada, en organismos de asesoramiento
    como los PAE (Puntos de Atención al Emprendedor) y sobre los instrumentos de calidad diferenciada, como denominaciones
    de origen local, que puedan brindarle ayuda y apoyo para realizar los trámites para la puesta en marcha del proyecto,
    aplicando protocolos de seguridad digital en los trámites digitales con la administración y valorando la importancia de
    la legalidad en la gestión para la convivencia en sociedad y la necesidad de cumplir los plazos legales.
- nodo: sb:BFUE02SBII.4
  campo: definition
  valor: 'Diferenciación entre el trabajo por cuenta propia y ajena: las cotizaciones y los derechos sociales en el Régimen
    Especial de los Trabajadores Autónomos (RETA).'
