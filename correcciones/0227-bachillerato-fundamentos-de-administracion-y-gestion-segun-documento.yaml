id: '0227'
titulo: 'Fundamentos de Administración y Gestión (Bachillerato): 2 diferencias corregidas con el documento oficial'
motivo: 'Diferencias que el contraste no explicaba con el BOC. Criterio aprobado: el ODT oficial de la web de currículos es
  la referencia y el corpus debe reflejarlo. Tipos: explicación de bloque distinto; texto de saber distinto.'
fuente:
  documento: bachillerato-fundamentos-de-administracion-y-gestion
  fichero: fuentes/documentos/bachillerato/Fundamentos_de_Administracion_y_Gestion_BACH.odt
