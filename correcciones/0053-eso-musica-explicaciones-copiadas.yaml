id: '0053'
titulo: 'Música (Educación Secundaria Obligatoria): 12 explicaciones de bloque copiadas de otro curso'
motivo: La exportación repite en estos bloques competenciales la explicación de otro curso de la materia; el documento oficial
  trae una explicación propia para cada curso. Generada con `contrastar --proponer`.
fuente:
  documento: eso-musica
  fichero: fuentes/documentos/eso/Musica_ESO.odt
  sha256: 2e8f42e00050f337d11331e013a581fedfbd36ed27aad1b0e28239e20653e2cc
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: bc:SMUS02BC1
  campo: scopeNote
  valor: A través del presente bloque competencial se persigue constatar si el alumnado es capaz de identificar y describir,
    de manera guiada, los elementos rítmicos, melódicos y formales, así como identificar y clasificar las voces e instrumentos
    de obras o fragmentos musicales de diversos géneros, culturas, épocas y estilos trabajados en el aula, poniendo especial
    atención a la producción realizada en Canarias y a las obras de mujeres artistas y compositoras. La incorporación de la
    perspectiva de género en el trabajo de aula permitirá comprobar si el alumnado reflexiona acerca de la imagen de la mujer
    en producciones actuales y su rol a lo largo de la historia, favoreciendo un acercamiento que ayude a identificar los
    mitos, los estereotipos y los roles de género transmitidos a través de la música y la danza. A su vez, se evaluará su
    capacidad para relacionar la música y la danza en el estudio de propuestas diversas, estableciendo las conexiones entre
    sus elementos. Igualmente se comprobará el desarrollo de actitudes como el respeto hacia la diversidad cultural y artística,
    la empatía y la necesidad de valorar y conservar el patrimonio artístico. El desarrollo de estas actividades con un modelo
    de aprendizaje cooperativo, además de garantizar la educación inclusiva y promotora de oportunidades para todo el alumnado,
    facilitará la evaluación del cumplimiento de las normas básicas de comportamiento en el desarrollo de actividades musicales
    y la participación en actividades grupales con una actitud abierta y respetuosa. Y finalmente se comprobará si todo esto
    contribuye al fomento de una actitud crítica y reflexiva sobre el patrimonio musical y dancístico, y potencia el gusto
    por estas artes y su percepción como fuente de disfrute y enriquecimiento personal. La comprensión del Arte como reflejo
    del pensamiento y la cultura de la sociedad en que es creado, permite establecer la relación entre las diferentes formas
    de expresión. Esta concepción favorece la interconexión entre las distintas materias del ámbito artístico, es por ello
    que la puesta en práctica de este bloque competencial favorece el trabajo interdisciplinar con la materia Educación Plástica,
    Visual y Audiovisual.
- nodo: bc:SMUS02BC2
  campo: scopeNote
  valor: 'A través de este bloque competencial se valorará la exploración por parte del alumnado de patrones rítmicos, recursos
    tímbricos tales como los planos sonoros corporales e instrumentales y esquemas formales entre otros, que constituyen las
    técnicas y recursos musicales y dancísticos elementales, cuya adquisición y aplicación serán evaluadas en el desarrollo
    de las improvisaciones llevadas a cabo en el aula, a través del empleo de la voz, el cuerpo y los instrumentos musicales.
    Por lo tanto, permitirá valorar que el alumnado sea capaz de explorar dichas técnicas y ponerlas en práctica, a propuesta
    de la docente o el docente, para expresar sus propias ideas, sentimientos y emociones. De igual forma se constatará la
    destreza en el manejo de herramientas tecnológicas como medio de expresión musical. Para ello, se desarrollarán actividades
    de improvisación rítmica guiadas, individuales o colectivas, donde se podrá evaluar la participación activa del alumnado
    con una actitud de colaboración y respeto hacia la diversidad de ideas en el grupo, así como el cumplimiento de las normas
    básicas para la práctica musical. Finalmente, se comprobará si vivir la música de manera cooperativa e integrar nuevas
    técnicas y recursos como forma de expresión logra favorecer el desarrollo del autoconocimiento, la autoestima y la motivación
    por el aprendizaje, y contribuye al enriquecimiento cultural entre iguales y a la superación de barreras y estereotipos
    sociales. Las distintas disciplinas artísticas cuentan con sus propios medios, técnicas y recursos, para la consecución
    de un fin común: la expresión de ideas, sentimientos y emociones. Además de compartir su potencial expresivo, los distintos
    lenguajes artísticos pueden servir de fuente de inspiración mutua, es por ello que el desarrollo de situaciones de aprendizaje
    interdisciplinares, entre las materias del ámbito artístico, potenciará la capacidad de expresión, autoconocimiento y
    autoestima del alumnado.'
- nodo: bc:SMUS02BC3
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de interpretar, con o sin apoyo de partituras,
    obras o fragmentos de repertorio vocal, instrumental, corporal o dancístico diverso, de complejidad rítmica y melódica
    acorde al nivel (obras a una o dos voces, con estructuras sencillas y donde el alumnado pueda experimentar distintos roles
    dentro del conjunto), aplicando de manera guiada las habilidades, estrategias y técnicas elementales necesarias, con una
    correcta ergonomía e higiene postural, en actuaciones musicales individuales o grupales, dentro o fuera del aula. Para
    ello se constatará que el alumnado es capaz de aplicar de manera guiada las estrategias elementales para gestionar adecuadamente
    sus emociones, cuidando la puesta en escena ante el público. La lectura y escritura guiada de partituras, con notación
    convencional y no convencional, su estudio y montaje, permitirá verificar la capacidad para identificar e interpretar,
    con ayuda del profesorado, los elementos del lenguaje musical (ritmo, melodía y formas musicales). Se valorará, por último,
    el necesario cumplimiento de las normas básicas para hacer música en grupo, la actitud del alumnado hacia el proceso de
    ensayo y la comprensión de su necesidad como parte del aprendizaje, interactuando de manera activa, cooperativa y respetuosa.
    La interpretación musical es una actividad propicia para generar productos artísticos en los que se combinen distintos
    lenguajes, por ello la puesta en práctica de este bloque competencial se estima propicia para participar en proyectos
    interdisciplinares con la materia de Educación Plástica, Visual y Audiovisual.
- nodo: bc:SMUS02BC4
  campo: scopeNote
  valor: A través de este bloque competencial se persigue constatar el grado de participación del alumnado en el desarrollo
    y ejecución de propuestas artístico-musicales sencillas, entendiéndolas como medio para transmitir ideas, emociones y
    sentimientos. El nivel de implicación en las diversas tareas, de forma colaborativa, facilitará la valoración de la participación
    en el trabajo en grupo, aceptando tareas y responsabilidades de manera cooperativa y mostrando respeto y empatía con las
    ideas, emociones y sentimientos de los compañeros y las compañeras. Igualmente se evaluará el respeto de las normas básicas
    para la práctica musical en grupo. De la misma manera se constatará si el alumnado es capaz de utilizar elementos y recursos
    para la creación de productos musicales y audiovisuales, lo que implica el conocimiento y la aplicación de herramientas
    de grabación y reproducción de sonido. Asimismo se evaluará si son capaces de aplicar de manera guiada las técnicas elementales
    necesarias para la interpretación vocal, instrumental y corporal de sus propias producciones. Además de la observación
    del proceso, también se tendrá en cuenta la búsqueda de calidad artística en la elaboración de productos y que sean considerados
    como un medio para transmitir valores democráticos, respeto por la diversidad, compromiso con la igualdad de género, la
    cohesión social y el desarrollo sostenible. La integración de diversos lenguajes en la creación de productos artísticos
    multidisciplinares invita, de manera inequívoca, a diseñar propuestas conjuntas entre las materias del ámbito artístico,
    potenciando la creatividad, la cohesión social y la formación holística e inclusiva del alumnado.
