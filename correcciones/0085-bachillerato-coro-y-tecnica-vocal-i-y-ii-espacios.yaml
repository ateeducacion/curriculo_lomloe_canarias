cambios:
- nodo: bc:BCBR01BC2
  campo: scopeNote
  valor: La activación de este bloque competencial permitirá comprobar si el alumnado es capaz de adquirir y aplicar técnicas
    vocales y corporales, y desarrollar las habilidades propias del canto, ampliando las posibilidades de la voz y el cuerpo
    como instrumentos de comunicación. A través de la realización de ejercicios, vocalizaciones e improvisaciones en grupo,
    se constatará en qué medida el alumnado es capaz de entonar intervalos melódicos y armónicos sencillos, desarrollando
    el oído armónico y la afinación, y poniendo en práctica los elementos de la producción vocal (respiración, emisión, articulación
    y resonancia). Estas actividades constituirán un medio para que el alumnado explore su propia voz y demuestre que es capaz
    de reconocer su propio sonido y el sonido de sus compañeras y compañeros del coro, reforzando el autoconocimiento, la
    autoestima y la autoconfianza. Se evaluará a su vez que el alumnado sea capaz de adaptar su voz a las necesidades del
    conjunto, mostrando una actitud democrática, respeto por la diversidad y sensibilidad hacia las emociones y experiencias
    de las demás personas del grupo. Asimismo, se pondrá especial atención al cuidado de la voz y la postura corporal, y se
    comprobará que el alumnado es capaz de adoptar y consolidar hábitos saludables a través del canto, contribuyendo a su
    bienestar físico y emocional y al del grupo.
- nodo: bc:BCBR01BC4
  campo: scopeNote
  valor: Este bloque competencial permitirá constatar en qué medida el alumnado es capaz de participar en proyectos escénicos
    colaborativos con la finalidad de favorecer su crecimiento artístico y personal. Se verificará el empleo responsable y
    la integración de herramientas digitales para la creación de productos musicales y audiovisuales en el desarrollo de proyectos,
    de forma que el alumnado sea capaz de incorporarlas a su entorno personal de aprendizaje y ejerza una ciudadanía digital
    activa, lo que implica el uso seguro, saludable, sostenible, crítico y responsable de las tecnologías digitales. Asimismo
    se evaluará la implicación, la participación y la cooperación, de manera que el alumnado demuestre conciencia de grupo,
    afrontando retos con sentido crítico y ético, y fortaleciendo el optimismo, la resiliencia y la búsqueda de objetivos
    de forma autónoma, para hacer eficaz su aprendizaje. A su vez, se comprobará que el alumnado es capaz de integrar el canto
    coral con otros lenguajes artísticos, utilizando estos proyectos como un vehículo para la difusión de valores como la
    participación solidaria en la mejora del entorno social, la búsqueda del desarrollo sostenible o la igualdad de derechos,
    entre otros. Por último, se valorará en qué medida el alumnado es capaz de mostrar una actitud escénica adecuada y respeto
    por el público, desarrollando actitudes y valores inherentes a la práctica de conjunto, lo que contribuye a enriquecer
    el entorno cultural e identificar oportunidades de desarrollo personal, social, académico o profesional.
- nodo: bc:BCHR02BC1
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará si el alumnado es capaz de analizar piezas vocales diversas y
    explicar sus cualidades estilísticas, así como las características de la interpretación y de la puesta en escena, demostrando
    fluidez, coherencia y corrección en su expresión oral y escrita. Para ello se seleccionará un repertorio variado de piezas
    vocales de dificultad adaptada al nivel, abarcando el patrimonio musical de Canarias, de otras culturas y de diferentes
    épocas y estilos del ámbito occidental. El repertorio seleccionado incluirá también la música popular, la música urbana
    y la contemporánea, prestando especial atención a las producciones de las compositoras, intérpretes femeninas y directoras
    de agrupaciones vocales. En estas audiciones el alumnado deberá demostrar una actitud de recepción activa, de manera que
    las escuchen o visionen, y sea capaz de comprender, interpretar y valorar críticamente la diversidad lingüística y cultural
    presente en la sociedad, y el patrimonio artístico de cualquier época. Asimismo, se constatará que el alumnado es capaz
    de analizar la relación del texto con la música, utilizando las partituras de las piezas vocales seleccionadas como recurso
    de apoyo y aplicando el análisis fonético del texto en el aprendizaje de obras vocales. Por último, se verificará en qué
    medida el alumnado es capaz de aplicar los recursos interpretativos y escénicos de las piezas analizadas a las propias
    producciones e interpretaciones, realizando con rigor sus prácticas artísticas y armonizando los aprendizajes con sus
    propios objetivos, lo que contribuye a desarrollar el criterio estético y ampliar las posibilidades de disfrute de la
    música.
- nodo: bc:BCHR02BC3
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará si el alumnado es capaz de interpretar piezas vocales de distintas
    épocas y culturas, adaptadas al nivel, demostrando precisión técnica y adecuación al conjunto y a las pautas de la dirección,
    con la finalidad de ampliar su capacidad expresiva. La participación en distintas formaciones vocales permitirá evaluar
    la capacidad del alumnado para contribuir a la búsqueda de sonido del conjunto en la práctica vocal, al equilibrio entre
    las voces y los planos sonoros, mostrando una actitud de escucha activa. De igual forma, se constatará la adquisición
    de actitudes y valores inherentes a la práctica coral (actitud escénica adecuada, respeto por el público y compromiso
    con los objetivos grupales), lo que favorecerá la socialización y la empatía con las demás personas, fortaleciendo el
    optimismo y la búsqueda de objetivos, y mostrando sensibilidad hacia las emociones y experiencias ajenas. Asimismo, se
    valorará la aplicación de la lectura de partituras, con notación convencional y no convencional, y la consolidación de
    estrategias de memorización en el aprendizaje e interpretación de piezas vocales, propiciando la autonomía para hacer
    eficaz su aprendizaje. Para ello se seleccionará un repertorio variado de piezas vocales de dificultad adaptada al nivel,
    abarcando el patrimonio musical de Canarias, de otras culturas y de diferentes épocas y estilos del ámbito occidental.
    El repertorio seleccionado incluirá también la música popular, la música urbana y la contemporánea, prestando especial
    atención a las producciones de las compositoras e intérpretes femeninas. Igualmente se comprobará que el alumnado es capaz
    de valorar críticamente la diversidad lingüística y cultural presente en la sociedad y el patrimonio artístico de cualquier
    época. Por último, se evaluará la habilidad para incorporar la percusión corporal y otros diseños coreográficos a las
    interpretaciones del conjunto, contribuyendo a la profundización en las posibilidades expresivas de la voz y el cuerpo,
    y consolidando los valores colectivos de la práctica coral.
- nodo: sb:BCHR02SBIII.4
  campo: definition
  valor: Aplicación de la lectura de partituras, con notación convencional y no convencional, en el aprendizaje e interpretación
    de piezas vocales.
