id: '0267'
titulo: 'Griego I y II (Bachillerato): enunciado de competencia del documento oficial'
motivo: El corpus traía «aportaciones del mundo clásico latino», copiado de Latín; el documento oficial dice «del mundo clásico».
  Lo ocultaba la explicación automática «limitación del modelo», retirada al guardar los enunciados por curso.
