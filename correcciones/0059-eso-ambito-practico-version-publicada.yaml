cambios:
- nodo: bc:SAM304BC5
  campo: scopeNote
  valor: Mediante este bloque competencial se persigue constatar que el alumnado es capaz de proteger los dispositivos digitales,
    sus datos personales, su propia salud y la huella digital generada en internet, aprendiendo de sus errores para desarrollar
    una adecuada ciudadanía digital. Con este fin, se comprobará que el alumnado dispone de las herramientas necesarias para
    proteger sus datos personales, al mismo tiempo que desarrolla hábitos y estrategias que contribuyan a la seguridad y a
    la salud en el uso crítico y responsable de las tecnologías digitales de la comunicación y colaboración mediante la configuración
    de sus condiciones de privacidad de forma periódica, aplicando principios de ética, respetando la propiedad intelectual,
    y asumiendo una participación comprometida, tolerante y de respeto por la diversidad en las redes sociales y espacios
    virtuales de trabajo. así como las estrategias que debe utilizar para actuar en consecuencia, localizando y contrastando
    los riesgos, y tomando conciencia de la importancia de las amenazas al bienestar personal.
- nodo: crit:SAM304CE1.2
  campo: definition
  valor: Seleccionar y aplicar de manera segura y responsable las herramientas de diseño asistido, y las técnicas de elaboración
    manual, mecánica o digital, empleando los materiales, operadores y recursos tecnológicos adecuados en los procesos de
    diseño y fabricación de productos tecnológicos para dar respuesta a las necesidades planteadas.
