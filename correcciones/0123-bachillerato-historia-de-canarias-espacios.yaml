cambios:
- nodo: crit:BHIC01CE1.3
  campo: definition
  valor: Investigar, argumentar y generar productos originales y creativos sobre el patrimonio arqueológico de Canarias, su
    composición y aportación al conocimiento de las distintas sociedades insulares, sus modos de vida y organización social,
    mediante procesos de investigación grupal que impliquen la búsqueda, evaluación y selección de la información en fuentes
    diversas, tanto arqueológicas como documentales, a través de productos que supongan la generación de contenidos propios
    y su publicación en espacios virtuales educativos, y la realización de intervenciones orales de distinta naturaleza, promoviendo
    la difusión de los valores patrimoniales de los enclaves arqueológicos.
- nodo: sb:BHIC01SBI.2.1
  campo: definition
  valor: Estudio de los desafíos pasados, actuales y futuros de la actual sociedad canaria. De la fragmentación insular al
    mundo globalizado.
