- nodo: bc:PEFI03BC1
  campo: scopeNote
  valor: A través de este bloque competencial el alumnado desarrollará un estilo de vida activo y saludable, integrando la
    actividad física y comportamientos que favorezcan la salud mental, física y social mediante experiencias motrices con
    responsabilidad individual y colectiva. Para ello, el alumnado debe demostrar que adquiere hábitos de educación postural,
    hidratación, relajación, respiración e higiene, utilizando la actividad física como alternativa en el tiempo libre. Se
    verificará que identifica las ventajas de consumir alimentos de origen natural frente a los procesados y ultraprocesados.
    Se constatará que aplica medidas de seguridad al inicio, en el desarrollo y la finalización de la práctica de la actividad
    física (activación adaptada a la actividad física, vuelta a la calma, vestimenta y calzado adecuado para la práctica deportiva),
    identificando situaciones peligrosas durante la actividad física y aplicando comportamientos saludables, de respeto a
    las diferencias individuales y que favorezcan la igualdad. Todo ello con la finalidad de que el alumnado muestre evidencias
    en relación a su participación en experiencias motrices que ayudan a preservar la salud y el medioambiente, reflexionando
    y explicando situaciones de juego, adoptando hábitos saludables para un bienestar físico y mental, con actitudes éticas
    y de seguridad, identificando y discriminando situaciones de riesgo en las experiencias motrices vivenciadas, iniciándose
    en el reconocimiento de posibilidades y limitaciones propias.
- nodo: bc:PEFI03BC3
  campo: scopeNote
  valor: A través de este bloque competencial se constatará que el alumnado es capaz de desarrollar procesos de autorregulación
    e interacción en el marco de la práctica motriz, incidiendo por tanto en los ámbitos personal y social. Para ello, el
    alumnado deberá demostrar habilidades sociales de acogida, inclusión, cooperación; actitudes de respeto hacia las normas
    y reglas; y actuar con deportividad y juego limpio en situaciones motrices lúdicas. Se constatará que controla la impulsividad
    y gestiona las emociones propias, los pensamientos y sentimientos a partir de experiencias motrices, empleando para ello
    estrategias sencillas. Se evaluará que pone sus prácticas comunicativas al servicio de la convivencia democrática, expresándose
    de manera clara y respetuosa para favorecer la resolución de los conflictos de forma dialógica y justa al participar en
    diferentes tipos de actividades comunitarias, siendo consciente y consecuente con los principios democráticos y valorando
    las aportaciones de compañeros y adversarios (coevaluación) demostrando una actitud empática e inclusiva. Todo ello con
    la finalidad de que el alumnado reflexione y dialogue sobre valores y problemas éticos de actualidad, mostrando un compromiso
    activo de cambio frente a los estereotipos, la discriminación, la violencia, el cuidado del entorno haciendo uso de conductas
    que favorezcan la convivencia en situaciones motrices y valorando su disposición positiva hacia el esfuerzo físico sabiendo
    reconocer sus propias limitaciones.
