cambios:
- nodo: bc:PEFI01BC1
  campo: scopeNote
  valor: A través de este bloque competencial el alumnado desarrollará un estilo de vida activo y saludable, integrando la
    actividad física y comportamientos que favorezcan la salud mental, física y social mediante experiencias motrices con
    responsabilidad individual y colectiva. Para ello, se comprobará que el alumnado adquiere conocimientos sobre la exploración
    de las posibilidades de la motricidad a partir de diferentes tipos de situaciones motrices lúdicas, como es el juego motor,
    incluyendo los alternativos y modificados, aportando hábitos de higiene corporal, hidratación, respiración, relajación
    y educación postural. Se constatará que el alumnado toma conciencia de diferentes medidas de seguridad aplicables al inicio,
    el desarrollo y la finalización de la práctica de la actividad física (activación, vuelta a la calma, vestimenta y calzado
    adecuado para la práctica deportiva, relajación, descansos e hidratación), tratando de reducir el riesgo de lesiones o
    accidentes, e implicando comportamientos que favorezcan la convivencia y la igualdad. Todo ello con la finalidad de participar
    en situaciones motrices lúdicas de forma segura, contribuyendo a preservar el medioambiente y la salud física y mental,
    iniciando el reconocimiento de las propias posibilidades y limitaciones, y reconociendo los riesgos para la salud, interiorizando
    hábitos saludables, éticos y medidas de seguridad.
- nodo: bc:PEFI01BC3
  campo: scopeNote
  valor: A través de este bloque competencial se constatará que el alumnado es capaz de desarrollar procesos de autorregulación
    e interacción en el marco de la práctica motriz, incidiendo por tanto en los ámbitos personal y social. Para ello, el
    alumnado deberá ser capaz de participar en situaciones motrices lúdicas respetando las normas y reglas del juego, actuando
    con deportividad y juego limpio, resolviendo los conflictos de forma dialógica, justa y respetuosa; con actitud cooperativa,
    favoreciendo el desarrollo de las habilidades sociales. Se constatará que identifica y gestiona las emociones derivadas
    de la interacción en contexto motrices con la ayuda del docente, mediante estrategias sencillas, y es capaz de verbalizarlas
    expresándose de manera clara y adecuada y sabiendo reconocer sus limitaciones para disfrutar de la actividad física. Todo
    ello con la finalidad de que el alumnado respete las experiencias y acepte las características y el nivel de las demás
    personas de forma empática e inclusiva, demostrando una actitud positiva frente a las actuaciones contrarias a la convivencia
    y haciendo uso de conductas que favorezcan la inclusión y la igualdad de género en situaciones motrices.
