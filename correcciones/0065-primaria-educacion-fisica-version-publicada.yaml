- nodo: bc:PEFI05BC1
  campo: scopeNote
  valor: A través de este bloque competencial el alumnado desarrollará un estilo de vida activo y saludable, integrando la
    actividad física y aquellos comportamientos que favorezcan la salud mental, física y social, mediante experiencias motrices,
    con responsabilidad individual y colectiva, aplicando las medidas de seguridad, para percibir y disfrutar de la práctica
    motriz como espacio para la interacción social. Para ello, el alumnado debe demostrar que adquiere conocimientos sobre
    los efectos beneficiosos del deporte y la actividad física, los procesos de activación corporal, como preparación para
    la práctica de forma general o específica, la autorregulación del esfuerzo ante diferentes situaciones motrices, así como
    la relajación y la higiene personal y postural, con el fin de generar una predisposición a transferir lo aprendido a la
    vida cotidiana. Se constatará que interioriza las medidas de seguridad en relación a la práctica de la actividad física,
    su vestimenta, los materiales utilizados, la activación y las acciones motrices ejecutadas, discriminando situaciones
    peligrosas, evitándolas a partir de la interiorización de conductas adecuadas para la salud y las relaciones sociales
    con el resto de participantes. Se verificará, asimismo, que integra las ventajas de consumir alimentos de origen natural
    frente a los procesados y ultraprocesados. Todo ello con la finalidad de que el alumnado muestre evidencias relacionadas
    con la aplicación de un estilo de vida saludable, que incorpore la reflexión, la experimentación y el sentido crítico
    de aspectos relacionados con la corporeidad y las situaciones de riesgo, actuando con ética, seguridad y responsabilidad
    ante las tareas planificadas. Se valorará asimismo la capacidad para reconocer las limitaciones propias y tratar de superarlas
    (autoevaluación), al igual que la colaboración en la mejora de sus iguales a través de la retroalimentación aplicada a
    las situaciones motrices (coevaluación).
- nodo: bc:PEFI05BC3
  campo: scopeNote
  valor: A través de este bloque competencial se constatará que el alumnado es capaz de desarrollar procesos de autorregulación
    e interacción en el marco de la práctica motriz, incidiendo por tanto en los ámbitos personal y social. Para ello, deberá
    intervenir en situaciones motrices lúdicas demostrando predisposición, esfuerzo, perseverancia, habilidades sociales y
    haciendo uso de estrategias de trabajo en equipo. Además, en la resolución constructiva de conflictos en situaciones motrices,
    aplicará el diálogo, expresándose de forma clara y con respeto hacia las demás personas. Se comprobará que identifica
    e implementa conductas positivas hacia la convivencia mostrando una actitud crítica y un compromiso activo de cambio frente
    a los estereotipos, la discriminación, la violencia y aceptando la diversidad de género, capacidades o competencia motriz.
    Se evaluará que interviene en las distintas prácticas motrices respetando las normas y reglas del juego, con deportividad
    (juego limpio), haciendo uso de actitudes cooperativas y expresándose con asertividad, reconociendo las actuaciones de
    personas compañeras y oponentes (coevaluación). Se constatará que gestiona sus emociones y la impulsividad, que reconoce
    y respeta las de los demás, con actitud empática e inclusiva, poniendo sus prácticas comunicativas al servicio de la convivencia
    democrática, la gestión dialógica y justa de los conflictos de forma consciente y respetuosa con los principios democráticos
    y la igualdad de derecho de todas las personas. Todo ello con la finalidad de que el alumnado reflexione y dialogue sobre
    valores y problemas éticos de actualidad, que entienda la necesidad de respetar diferentes culturas e ideologías y de
    cuidar el entorno.
