id: '0007'
titulo: 'Latín I y II (Bachillerato): 12 textos de saber ausentes en la exportación'
motivo: La exportación de ProIDEAC no trae estos textos. Se toman del documento oficial; generada con `contrastar --proponer`
  (los saberes se emparejan por contenido).
fuente:
  documento: bachillerato-latin-i-y-ii
  fichero: fuentes/documentos/bachillerato/Latin_I_y_II_BACH.odt
  sha256: 95331b0c8e940dda5d4d8bb6e961ec6fe741b0a0ec7a869967e53ec7c9d04b5f
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: sb:BLAI01SBI.1.5.1
  campo: definition
  valor: 'Establecimiento de relaciones básicas de concordancia: sustantivo + adjetivo y sustantivo/pronombre + verbo.'
- nodo: sb:BLAI01SBI.1.5.2
  campo: definition
  valor: Conocimiento de la disposición de las palabras latinas en una frase.
- nodo: sb:BLAI01SBI.2.2.1
  campo: definition
  valor: Formulación de expectativas a partir del entorno textual (título, obra…) y del propio texto (campos temáticos, familias
    de palabras…), así como a partir del contexto.
- nodo: sb:BLAI01SBI.2.2.2
  campo: definition
  valor: Identificación del tema y breve descripción de la estructura y género.
- nodo: sb:BLAI01SBI.2.2.3
  campo: definition
  valor: Acercamiento a las peculiaridades lingüísticas de los textos traducidos (discurso directo/indirecto, uso de tiempos
    verbales, géneros verbales, pregunta retórica…).
- nodo: sb:BLAI01SBI.2.2.4
  campo: definition
  valor: Identificación de errores frecuentes de traducción y técnicas para evitarlos (comprobación de si la traducción está
    completa, control de acuerdo a criterios dados, delimitación de construcciones sintácticas…).
