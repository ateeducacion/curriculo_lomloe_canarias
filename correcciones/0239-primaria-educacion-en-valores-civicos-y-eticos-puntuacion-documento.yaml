cambios:
- nodo: crit:PEDK05CE1.2
  campo: definition
  valor: Generar una posición moral autónoma a través de la reflexión, el uso de los conceptos éticos y el diálogo respetuoso
    con otras personas, en torno a distintos valores y modos de vida, así como problemas relacionados con las tecnologías,
    conociendo su evolución a lo largo de la historia, analizando sus ventajas e inconvenientes, reflexionando sobre cómo
    afectan al autoconcepto y las relaciones sociales, con la finalidad de generar y expresar una posición crítica ante el
    uso responsable y seguro de las redes y medios de comunicación, las conductas adictivas, la prevención del abuso y el
    acoso escolar, y el respeto de la intimidad personal aprendiendo a discernir entre información contrastada, veraz y bulos.
- nodo: crit:PEDK05CE2.4
  campo: definition
  valor: Comprender y valorar los principios de justicia, solidaridad, seguridad y paz, a la vez que el respeto a las libertades
    básicas, a partir del análisis y la ponderación de las políticas y acciones de ayuda y cooperación internacional, de defensa
    para la paz y de seguridad ciudadana, ejercidas por el Estado y sus instituciones, los organismos internacionales, las
    ONG y ONGD, y la propia ciudadanía.
