    en situaciones de comunicación sencillas y cotidianas, de relevancia personal y próximas a su entorno inmediato, con actitud
    cooperativa y respetuosa. En este sentido, se verificará que el alumnado es capaz de exponer presentaciones breves, realizar
    descripciones y narrar de forma accesible textos que expresan hechos, conceptos, pensamientos, opiniones y sentimientos.
    Para ello, el alumnado podrá hacer uso de diferentes soportes analógicos y digitales, realizando búsquedas guiadas y reconociendo
    la propiedad intelectual de las fuentes consultadas y contenidos utilizados. A su vez, se pretende que el alumnado desarrolle
    la empatía y tenga una visión más creativa y emocional del aprendizaje.
- nodo: bc:PSGN06BC3
  campo: scopeNote
  valor: 'Con este bloque competencial se comprobará que el alumnado es capaz de participar en interacciones, así como seleccionar
    y utilizar estrategias y métodos básicos que le permitan iniciar, mantener y concluir una conversación con progresiva
    autonomía. En este sentido, se valorará que el alumnado responda a propósitos comunicativos concretos, para los que se
    deben trabajar funciones comunicativas adecuadas al ámbito y al contexto: como saludar, despedirse, presentarse, formular
    y contestar preguntas, participar en diálogos, debates y asambleas, así como adquirir léxico básico y de interés. A su
    vez, se pretende averiguar si el alumnado es capaz de hacer uso de las normas y los principios que rigen la cortesía lingüística
    y la etiqueta digital, los elementos verbales y no verbales de la comunicación, tanto orales como escritos y multimodales,
    en contextos analógicos y digitales, restringidos y supervisados de manera segura, con una actitud abierta y responsable
    ante su uso. Los intercambios de información serán breves y sencillos sobre temas cotidianos, predecibles, de relevancia
    personal y funcional, que permitan el desarrollo de las funciones interpersonales y cooperativas como ceder y respetar
    el turno de palabra, pedir y dar aclaraciones y explicaciones, y colaborar. De esta manera, se prepara al alumnado para
    el ejercicio de una ciudadanía democrática, alejada de los estereotipos, y responsable y respetuosa hacia hablantes o
    estudiantes de la segunda lengua extranjera.'
- nodo: bc:PSGN06BC4
  campo: scopeNote
  valor: En este bloque competencial, se comprobará si el alumnado es capaz de justificar y explicar tanto textos orales,
    escritos, signados y multimodales, como conceptos o emociones, haciendo uso de conocimientos, destrezas y actitudes que
    promuevan iniciarse en actividades de mediación, entendiendo esta como una actividad del lenguaje que permita al alumnado
    explicar y facilitar la comprensión de mensajes o textos, en situaciones cotidianas próximas a su entorno, como explicar
    una infografía, dar indicaciones para orientarse en un mapa, o apoyar y facilitar la comprensión de textos breves. Además,
    se persigue constatar que el alumnado selecciona e implementa métodos y estrategias adecuadas que faciliten la comprensión,
    la producción, la interacción y la comunicación en situaciones colaborativas y cooperativas, con el fin de desarrollar
    el pensamiento estratégico y mejorar su repertorio lingüístico.
- nodo: bc:PSGN06BC5
  campo: scopeNote
  valor: 'Con este bloque competencial se persigue que el alumnado haga uso de su repertorio lingüístico individual y establezca
    relaciones entre las distintas lenguas. Se promoverá que el alumnado, experimente, diferencie y reflexione sobre aspectos
    básicos de la segunda lengua extranjera, su funcionamiento y funcionalidad, así como que adquiera y aplique estrategias
    y técnicas de compensación de las carencias comunicativas para comparar, contrastar, organizar y utilizar unidades lingüísticas:
    léxico, morfosintaxis o patrones sonoros. Asimismo, se trata de que el alumnado sea capaz de transferir los conocimientos,
    las destrezas y las estrategias adquiridas a otros contextos, desarrollando, así, el pensamiento divergente, reflexivo
    y más profundo del aprendizaje. Los distintos tipos de evaluación evidenciarán el progreso, la autonomía y autoestima
    del alumnado con la utilización de instrumentos como los derivados del PEL o los diarios de aprendizaje, ya sea en formato
    analógico o digital. Se destaca, de esta manera, la importancia de la toma de conciencia de los conocimientos y las estrategias
    de los que dispone, analizando las fortalezas y carencias propias en el terreno lingüístico y comunicativo.'
- nodo: bc:PSGN06BC6
  campo: scopeNote
  valor: Con este bloque competencial, se persigue promover que el alumnado sea capaz de apreciar y respetar la diversidad
    y el patrimonio lingüístico, cultural y artístico de personas y países donde se habla la segunda lengua extranjera y de
    las islas Canarias, mostrando respeto, cuidado y conservación del entorno. Asimismo, se pretende que el alumnado sea capaz
    de seleccionar y aplicar estrategias básicas y de detección de usos discriminatorios del lenguaje verbal y no verbal,
    para entender y apreciar los aspectos socioculturales y sociolingüísticos. A su vez, se fomentará que el alumnado muestre
    empatía y comprensión por las producciones ajenas, aceptando otros puntos de vista y manifestando conductas contrarias
    a la violencia, a los prejuicios de cualquier tipo y a los estereotipos sexistas. También se persigue que el alumnado
    desarrolle su autonomía y una visión creativa y emocional del aprendizaje. Se contribuye así a la adquisición de la competencia
    específica, ya que se comprobará si el alumnado establece vínculos entre las diferentes lenguas y culturas, y con la propia,
    en contextos comunicativos cotidianos y habituales.
