  valor: 'Con este bloque competencial se pretende constatar que el alumnado es capaz de inferir características, propiedades,
    patrones de semejanza o diferencia culturales, tanto de las masas como de colectivos concretos, aplicando los métodos
    y las técnicas de investigación de ambas disciplinas. Para ello, se propone que el alumnado trabaje en equipo y asuma
    roles propios de la investigación social; diseñe y emprenda proyectos de investigación sobre algún fenómeno cultural o
    sociológico (por ejemplo: el impacto de una moda o tendencia en determinados colectivos, el comportamiento de fans de
    personajes públicos o de los hinchas deportivos, estudios de población sobre el comercio electrónico, los videojuegos
    online, la preferencia e idolatría por un producto, la influencia de rituales o símbolos en la convivencia de comunidades,
    la organización familiar y productiva de determinadas etnias que habitan en Canarias…); aplique técnicas de recogida de
    datos (observación, participación, entrevistas, encuestas, categorización…); y se documente y contraste sus resultados
    con otras publicaciones, y los comunique, haciendo uso de las tecnologías digitales, mediante producciones como informes,
    presentaciones ante público, documentales…, en las que pueda apreciarse que comprende y aporta una visión crítica y respetuosa
    con las formas de vida estudiadas.'
