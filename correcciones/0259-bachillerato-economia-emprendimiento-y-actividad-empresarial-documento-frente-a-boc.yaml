  valor: Con la evaluación de este bloque competencial se comprobará la capacidad del alumnado para analizar de forma integral
    el problema de la escasez económica y sus implicaciones, estudiando la aparición del coste de oportunidad, aplicando los
    principios económicos en las elecciones entre bienes y servicios en diferentes simulaciones del ámbito personal, social
    y académico y explicando el valor de uso y de cambio de los bienes, a través de ejemplos como la paradoja del valor. Asimismo,
    se verificará que valora la relación existente entre escasez, eficiencia y equidad en nuestras sociedades, comparando
    de forma crítica las características, ventajas e inconvenientes de los distintos sistemas económicos y debatiendo de forma
    activa e informada sobre las realidades socioeconómicas de distintos países. Seguidamente se constatará que describe cómo
    los precios orientan las decisiones en el mercado a través de la teoría de la «mano invisible» y que distingue el papel
    de los agentes en la economía desde la perspectiva del análisis coste-beneficio, utilizando el modelo económico del flujo
    circular de la renta, para transferir sus conocimientos desde contextos microeconómicos a contextos macroeconómicos, y
    valorando las distintas implicaciones de los fallos del mercado mediante el estudio de casos prácticos de actualidad contextualizados
    especialmente en la realidad socioeconómica canaria. Además, se comprobará la capacidad del alumnado para analizar la
    oferta y la demanda, interpretando cómo y en qué medida las modificaciones en las variables que les afectan provocan cambios
    en el equilibrio del mercado, estudiando los movimientos y desplazamientos de sus curvas y la elasticidad precio de la
    demanda y mostrando una actitud crítica acerca del alcance y limitaciones de los métodos empleados. Del mismo modo, a
    través de la utilización del modelo de demanda agregada y oferta agregada se verificará su capacidad para analizar las
    situaciones de equilibrio y desequilibrios a corto plazo con relación al nivel general de precios, el pleno empleo de
    los recursos y el nivel de producción global, y comprendiendo las fluctuaciones de la actividad económica a través de
    la evolución y análisis estadístico de los principales agregados macroeconómicos, con especial atención a la economía
    canaria, que justifican la intervención del sector público mediante la aplicación de las políticas económicas para mejorar
    el empleo, controlar la inflación y lograr el desarrollo económico y el bienestar social. Adicionalmente, la consecución
    de los aprendizajes de este bloque competencial proporcionará al alumnado una educación financiera básica al facilitarle
    la información y las herramientas para la necesaria planificación y gestión de la inversión, el ahorro y el consumo. Para
    ello, se verificará, en primer lugar, que es capaz de explicar la tipología, las funciones y la fijación del precio del
    dinero en función del riesgo y el beneficio, así como los distintos medios de pago asociados a las transacciones y, en
    segundo lugar, que describe el entorno financiero, tradicional y de banca online mediante el análisis del papel de los
    bancos en la economía y la búsqueda de información comparativa en internet de las características y el funcionamiento
    de los productos financieros y los seguros, y valorando, mediante el estudio de casos prácticos, los beneficios y los
    factores personales para invertir, así como los riesgos del crédito y del endeudamiento, para contribuir así a la consolidación
    de su madurez personal y social. Por último, se persigue constatar si el alumnado es capaz, desde otras perspectivas,
    de valorar el comportamiento humano en el proceso de toma de decisiones económicas para lograr el bienestar, estudiando
    con actitud crítica textos escritos o multimodales que pongan de manifiesto la relación entre filosofía y economía, interpretando
    las conexiones entre felicidad, consumo y maximización del bienestar social a través de las teorías éticas del utilitarismo,
    como las de John Stuart Mill o la paradoja de Easterlin, así como la relación de la economía con la sociología, valorando
    las conexiones entre bienestar social y calidad de vida, y con la psicología, a través del reconocimiento que del bienestar
    hace la psicología positiva. Además, se valorará que reflexiona, para construir conocimiento, sobre los fallos de la racionalidad
    económica en la toma de decisiones de las personas (efectos relatividad, manada, dotación, etc.), sobre la economía del
    comportamiento, la psicología económica y la teoría de la decisión.
