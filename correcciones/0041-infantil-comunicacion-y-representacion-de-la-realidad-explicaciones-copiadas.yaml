id: '0041'
titulo: 'Comunicación y Representación de la Realidad (Educación Infantil): 30 explicaciones de bloque copiadas de otro curso'
motivo: La exportación repite en estos bloques competenciales la explicación de otro curso de la materia; el documento oficial
  trae una explicación propia para cada curso. Generada con `contrastar --proponer`.
fuente:
  documento: infantil-comunicacion-y-representacion-de-la-realidad
  fichero: fuentes/documentos/infantil/Area_3_Comunicacion_y_Representacion_de_la_Realidad.odt
  sha256: 767e4e7dd8a49b4250e275f573607ca1208d0669adcf9da59ea36f3fcb3f3b40
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: bc:IC4M04BC1
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado despliega, de manera progresiva, sus diferentes
    capacidades comunicativas, de manera que sea capaz de interpretar los mensajes de las demás personas y, a su vez, expresar
    sus propias necesidades, emociones, sentimientos o ideas, en un entorno de bienestar. De esta forma, se comprobará que
    el alumnado es capaz de participar en situaciones de comunicación significativas y funcionales, desde el respeto a las
    diferencias individuales y a la diversidad de lenguas presentes en el entorno próximo, así como a las particularidades
    del español hablado en Canarias, lo que les permitirá conocer e integrar nuevas posibilidades, habilidades y estrategias
    comunicativas. Asimismo se verificará que niños y niñas son capaces de emplear la empatía y la asertividad en los intercambios
    comunicativos, ampliando, de forma progresiva, su repertorio personal; integrando los elementos propios de la comunicación
    no verbal; progresando en la adquisición y el uso de las convenciones sociales propias de los intercambios lingüísticos,
    desde la perspectiva de la igualdad y el respeto a las diferencias individuales; y acercándose, progresivamente, a los
    significados de distintos mensajes en contextos de comunicación conocidos. Se evaluará, asimismo, que demuestren interés
    hacia el aprendizaje una primera lengua extranjera, a través de su participación en actividades en las que identifiquen,
    señalen, nombren…, su realidad más cercana utilizando dicha lengua, utilizando además expresiones sencillas en la lengua
    extranjera. Además se valorará el avance en el conocimiento y la integración de elementos de diferentes lenguajes o códigos
    (verbal, no verbal, plástico, musical, digital…). Todo ello con la finalidad de que el alumnado experimente el placer
    de comunicarse mediante interacciones ligadas a la emoción, en situaciones, favorecedoras del aumento del vocabulario
    y de la integración de los significados de las palabras a los discursos, disfrutando de los intercambios comunicativos.
- nodo: bc:IC4M04BC2
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado se inicia en la adquisición de diferentes estrategias
    que le permitan realizar anticipaciones, aproximaciones e inferencias, con la finalidad de comprender los mensajes y las
    intenciones comunicativas de otras personas y construir nuevos significados y aprendizajes, progresando desde el acompañamiento
    y la mediación hacia un determinado grado de autonomía y conocimiento del mundo. Se comprobará que el alumnado es capaz
    de interpretar los mensajes y la información proveniente de su entorno, así como las intenciones comunicativas de las
    demás personas, lo que le permitirá ampliar su repertorio lingüístico e iniciarse en la comprensión de las intenciones
    comunicativas de otras personas. Asimismo se valorará que los niños y las niñas sean capaces de interpretar mensajes transmitidos
    a través de representaciones o manifestaciones sociales, culturales y artísticas de su entorno, también en formato digital,
    prestando especial atención al patrimonio canario, reconociendo la intencionalidad del emisor y mostrando una actitud
    curiosa y responsable. Se valorará, además, que comprenda palabras y mensajes sencillos en una primera lengua extranjera,
    en actividades relacionadas con las rutinas diarias y el contexto más cercano al alumnado, de manera que continúe con
    la aproximación a lenguas y culturas diferentes de la familiar, con la finalidad de enriquecer su repertorio lingüístico
    y avanzar, así, en el descubrimiento del mundo que le rodea y de sus valores culturales.
- nodo: bc:IC4M04BC3
  campo: scopeNote
  valor: A través de este bloque competencial se evaluará la capacidad del alumnado para producir mensajes verbales, no verbales,
    musicales, plásticos, digitales, gestuales y multimodales. De esa manera, se comprobará que el alumnado explora las posibilidades
    expresivas de los diferentes lenguajes y avanza en el conocimiento y la valoración de los distintos lenguajes expresivos,
    utilizándolos, con creatividad, para desenvolverse de manera más autónoma para representar aspectos de la realidad, vivida
    o imaginada. La elaboración de creaciones plásticas, explorando y utilizando diferentes materiales y técnicas, la interpretación
    de propuestas de expresión corporal y musical, y el descubrimiento de diversas herramientas y aplicaciones digitales,
    permitirán constatar la capacidad del alumnado para ampliar y enriquecer su repertorio comunicativo a través de diferentes
    lenguajes expresivos. Se comprobará, además, que niños y niñas son capaces de hacer un uso funcional del lenguaje oral
    como instrumento regulador de la acción en las interacciones con las demás personas, con seguridad y confianza, y para
    comunicar ideas, argumentar puntos de vista, plantear hipótesis y estructurar relatos propios, utilizando una entonación
    y vocalización adecuadas así como los aspectos no verbales de la oralidad; y que, progresivamente, van aumentando su repertorio
    lingüístico, construyendo un discurso cada vez más ajustado en contextos formales e informales. La escucha activa y la
    ampliación progresiva del vocabulario permitirá que el alumnado comprenda el mundo que le rodea y avance en sus interpretaciones
    y concepciones acerca de la realidad. Se comprobará, además, que el alumnado progresa en su utilización de palabras y
    estructuras breves y sencillas, en una primera lengua extranjera, significativas para el desarrollo de rutinas diarias,
    actividades, tareas y retos en el contexto del aula. Todo ello con la finalidad de que niños y niñas avancen en la estructuración
    del lenguaje oral, tanto en la lengua materna como en la lengua extranjera, así como en el conocimiento de las múltiples
    posibilidades comunicativas y expresivas.
- nodo: bc:IC4M04BC4
  campo: scopeNote
  valor: 'A través de este bloque competencial, niños y niñas avanzarán en el descubrimiento de las propiedades del sistema
    de escritura y de los usos funcionales de la escritura, como herramienta de representación del lenguaje oral y sus sonidos,
    avanzando en la comprensión de algunas de sus características y convenciones, y mostrando interés por descubrir, anticipar
    o inferir, la información que contienen los textos escritos y por producir mensajes, de manera espontánea, para comunicar
    sus propias emociones y experiencias. Se comprobará que participan, con curiosidad y disfrute, en las actividades de acercamiento
    a los usos sociales de la lectura y la escritura, en diversas situaciones comunicativas; participando, asimismo, en los
    momentos de cuento a través de la escucha activa, demostrando curiosidad por las historias que se les narran y disfrutando
    de la biblioteca de aula y de centro como espacios para el disfrute de los textos literarios, que despiertan la imaginación,
    la creatividad del alumnado. Se constatará que avanzan en el reconocimiento de otros códigos de representación gráfica:
    imágenes, símbolos, números…, de manera que puedan identificar algunas de las características textuales y paratextuales
    de los textos escritos. Se valorará que se inicien, de manera guiada, en el uso de sencillas estrategias de búsqueda de
    información, así como en la reelaboración de textos sencillos. Se verificará que se inician en el manejo de textos escritos
    presentes en el aula, en diferentes soportes, y en el interés por producir escrituras espontáneas, sencillas, desde las
    propias hipótesis, siempre desde un enfoque lúdico y desde el respeto a la evolución de los diferentes ritmos de desarrollo
    personal y del conocimiento del proceso a través del cual niños y niñas se apropian del sistema de escritura, ofreciendo
    posibilidades diversas para que cada niño y niña exprese, desde sus posibilidades y con escrituras espontáneas, aquello
    que quiera compartir.'
- nodo: bc:IC4M04BC5
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado avanza en la valoración de la diversidad plurilingüe
    y cultural del aula y de su entorno más próximo, así como en el reconocimiento y respeto por otras lenguas, etnias y culturas,
    y manifestaciones artísticas y culturales presentes en su entorno más cercano, prestando una especial atención al patrimonio
    social y cultural de Canarias. La presencia de lenguas diversas en el aula, así como el bagaje cultural que conllevan,
    invita a jugar con el código de la lengua propia y la de otras personas, comparando similitudes y diferencias en las maneras
    de nombrar la realidad, de pronunciar, de escribir… De esta forma se constatará el desarrollo del respeto a la lengua
    propia y a otras, así como a las expresiones de cada cultura, realizando una primer acercamiento a las particularidades
    del español hablado en Canarias, avanzando en el conocimiento y respeto de la pluralidad lingüística y cultural de su
    entorno. Se comprobará, asimismo, que el alumnado avanza en el aprendizaje de una primera lengua extranjera como instrumento
    para el acercamiento a otras culturas y sus costumbres. Se comprobará, de esta manera que el alumnado participa en interacciones
    comunicativas en la lengua extranjera en rutinas y situaciones cotidianas, y que es capaz de reproducir textos sencillos,
    variados y repetitivos con la adecuada expresividad, así como la destreza en la imitación de sonidos, ritmo y entonación
    (nursery rhymes, poems, songs...). Por otro lado, se comprobará que el alumnado disfruta de las primeras aproximaciones
    a obras musicales, audiovisuales, dramáticas o dancísticas, tanto de su entorno cultural más cercano como de otras culturas,
    iniciándose en el descubrimiento de sus estrategias comunicativas y de la diversidad cultural presente en su entorno.
    Asimismo se valorará que sean capaces de expresar emociones, ideas y pensamientos, a través de manifestaciones artísticas
    propias así como de explorar las posibilidades expresivas de manifestaciones culturales diversas, con especial atención
    a las del patrimonio canario y de disfrutar del proceso creativo. Para ello, se verificará que el alumnado se inicia en
    la indagación de las posibilidades sonoras, expresivas y creativas de la voz, el cuerpo, los objetos cotidianos de su
    entorno y los instrumentos y que participa en propuestas musicales y en actividades individuales y grupales de expresión
    corporal, con la finalidad de disfrutar de las posibilidades expresivas de su cuerpo y de avanzar en su acercamiento a
    la expresión musical. Asimismo se valorará la capacidad de los niños y niñas de disfrutar con la escucha de diversas producciones
    musicales, destacando las propias del patrimonio canario, contribuyendo así al aumento de su bagaje cultural y musical.
    La exploración de las herramientas digitales presentes en el aula y en otros contextos educativos permitirá avanzar en
    el uso responsable de las mismas y en las posibilidades que les ofrece la tecnología para la creación, comunicación, aprendizaje
    y disfrute. Todo ello con la finalidad de enriquecer el bagaje cultural y desarrollar la sensibilidad y la creatividad,
    lo que permitirá el desarrollo de valores que permitan al alumnado ejercer una ciudadanía crítica, solidaria, igualitaria
    y comprometida con la sociedad.
