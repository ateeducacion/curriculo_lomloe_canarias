id: '0062'
titulo: 'Educación Artística (Educación Primaria): 66 textos de la versión publicada en el BOC'
motivo: El texto de la exportación no coincide con el publicado en el BOC y el del documento oficial sí (comprobado contra
  fuentes/boletines). Se toma el del documento. Generada con `contrastar --proponer`.
fuente:
  documento: primaria-educacion-artistica
  fichero: fuentes/documentos/primaria/anexo_2_curriculo-educacion_artistica.odt
  sha256: 3f4f37e848a598d5ae0fd0c89c44d39003073af771f4e6630814f2bcd1e590bf
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: propuesta
aprobada_por: null
cambios:
- nodo: bc:PEAR01BC1
  campo: scopeNote
  valor: A través de este bloque competencial, se constatará que el alumnado es capaz de descubrir y describir manifestaciones
    artísticas del patrimonio cultural y artístico de Canarias y de otras culturas, de diferentes géneros, corrientes estéticas,
    estilos y épocas, producidas por creadoras y creadores locales, regionales, nacionales e internacionales, con especial
    atención a las obras de mujeres y a la perspectiva de género. Para ello, el alumnado deberá demostrar una recepción activa
    de las mismas, mediante experiencias sensoriales, de manera que escuchen, observen, toquen, sientan o visionen y exploren
    sus características con actitud abierta e interés, estableciendo relaciones entre ellas y con su contexto histórico y
    social, y demostrando que aprecian las diferencias; además de con curiosidad, sensibilidad, respeto y valoración hacia
    la diversidad de las mismas. Se comprobará que el alumnado es capaz de realizar búsquedas guiadas en internet, con el
    debido acompañamiento, relacionadas con estas manifestaciones artísticas, aplicando estrategias básicas de análisis. Todo
    ello con la finalidad de que el alumnado descubra, reconozca y aprecie las especificidades en intencionalidades de las
    diversas manifestaciones culturales y artísticas del entorno próximo, comprendiendo la necesidad de respetarlas y conservarlas.
    Asimismo, esta competencia implica reconocer y apreciar las especificidades e intencionalidades de las manifestaciones
    del patrimonio cultural y artístico de las islas y de diferentes corrientes estilísticas de su entorno próximo, valorando
    sus diferencias y la necesidad de respetarlas, teniendo en cuenta la perspectiva de género.
- nodo: bc:PEAR01BC2
  campo: scopeNote
  valor: A través de este bloque competencial, se constatará que el alumnado es capaz de seleccionar y aplicar estrategias
    elementales de tratamiento de la información (localizar, seleccionar, contrastar…) para la búsqueda guiada de información
    de fuentes diversas, incluyendo las digitales, sobre distintas manifestaciones que forman parte del patrimonio cultural
    y artístico de Canarias, y de diferentes corrientes estéticas, procedencias y épocas, producidas por creadoras y creadores
    locales, regionales, nacionales e internacionales, de las artes plásticas y visuales, las artes audiovisuales, la música
    y las artes escénicas y performativas, a través de distintos canales y medios de acceso sencillos, reconociendo sus lenguajes
    y elementos técnicos característicos (vocabulario específico, técnicas, materiales, medios, soportes y profesiones vinculadas).
    Así mismo, se verificará que el alumnado comprende sus diferencias y similitudes, y valora la diversidad como factor de
    diálogo y elemento para la mejora de la convivencia. Se comprobará que el alumnado reconoce las sensaciones y emociones
    básicas producidas por diferentes manifestaciones culturales y artísticas, a partir de su análisis y comprensión, de manera
    que pueda alcanzar y afianzar un sentido progresivo de pertenencia e identidad, siendo capaz de cooperar con sus iguales,
    con una actitud abierta, dialogante, respetuosa e inclusiva, y teniendo en cuenta la perspectiva de género. Todo ello
    con la finalidad de disfrutar de las mismas, entender su valor, respetar su autoría y empezar a desarrollar una sensibilidad
    artística propia.
- nodo: bc:PEAR01BC3
  campo: scopeNote
  valor: A través de este bloque competencial, se constatará que el alumnado es capaz de expresar y comunicar, de manera creativa,
    ideas, sentimientos y emociones mediante la experimentación guiada con elementos de los lenguajes artísticos y la utilización
    de algunas herramientas (instrumentos artísticos y herramientas digitales), integrando su propio cuerpo, interactuando
    con el entorno y desarrollando sus capacidades afectivas. Para ello, se comprobará que el alumnado tiene la capacidad
    de explorar, conocer, descubrir y manejar diferentes códigos, técnicas, materiales, instrumentos, medios y soportes, con
    actitud abierta e inclusiva. En este sentido, el alumnado deberá demostrar que utiliza, de manera creativa, elementos
    configurativos básicos de los lenguajes visual, audiovisual, musical y dramático, en diferentes contextos comunicativos,
    por medio de la práctica instrumental, vocal y corporal, de manifestaciones propias del patrimonio cultural y artístico
    de Canarias y de diferentes estilos, épocas y culturas. Del mismo modo, se verificará que el alumnado elabora propuestas
    artísticas sencillas, de manera guiada, atendiendo a las fases del proceso creativo, utilizando algunas de las posibilidades
    expresivas del cuerpo, el sonido, la imagen, herramientas analógicas y tecnologías digitales básicas, mostrando confianza
    en las propias capacidades, aplicando estrategias de aprendizaje autorregulado y denotando aprecio por las aportaciones
    de otras personas del grupo. Todo ello con la finalidad de que el alumnado muestre interés tanto por el proceso como por
    el producto final en producciones plásticas, visuales, audiovisuales, musicales, escénicas y performativas; disfrute del
    arte; comprenda sus posibilidades comunicativas y expresivas; se inicie en la percepción de la intencionalidad en las
    manifestaciones culturales; y llegue a producir obras propias como medio para canalizar sus ideas, sentimientos y emociones.
- nodo: bc:PEAR01BC4
  campo: scopeNote
  valor: A través de este bloque competencial, se constatará que el alumnado es capaz de participar, diseñar y compartir activamente
    y de manera guiada, mediante un proceso cooperativo, en producciones culturales y artísticas creativas. Se comprobará
    que puede planificar propuestas para lograr un objetivo final y comunicar la experiencia creativa en espacios y canales
    sencillos con el fin de desarrollar la creatividad, la noción de autoría y el sentido de pertenencia. De esta manera,
    se verificará que el alumnado puede realizar, de forma guiada, proyectos sencillos diseñando, fabricando y evaluando diferentes
    prototipos o modelos, y atendiendo tanto a las fases del proceso creativo como a la evaluación, al interés y a la valoración
    del proceso y el producto final. Asimismo, se comprobará que el alumnado expresa, de manera elemental, hechos, conceptos,
    pensamientos, opiniones o sentimientos de forma creativa y democrática, utilizando elementos, técnicas, materiales y herramientas
    elementales propios de la expresión plástica, visual, musical, dramática, dancística, audiovisual y performativa. Finalmente,
    se constará que el alumnado conoce y respeta la diversidad lingüística y cultural presente en las islas y en otros lugares
    y culturas. De la misma manera, se verificará que es capaz de reconocer necesidades y retos que afrontar, elaborar ideas
    originales, planificar tareas y cooperar en equipo, haciendo un uso responsable de los recursos y entendiendo las características
    y funciones de las diferentes profesiones vinculadas con las artes.
