    opiniones o sentimientos de forma creativa y democrática, utilizando elementos, técnicas, materiales y herramientas sencillas
    propios de la expresión plástica, visual, musical, dramática, dancística, audiovisual y performativa; y de conocer y respetar
    la diversidad lingüística y cultural presente en las islas y en otros lugares y culturas. De la misma manera, se verificará
    que es capaz de reconocer necesidades y retos que afrontar y elaborar ideas originales, planificar tareas y cooperar con
    otros y otras en equipo, haciendo un uso responsable de los recursos y entendiendo las características y funciones de
    las diferentes profesiones vinculadas con las artes.
- nodo: bc:PEAR05BC1
  campo: scopeNote
  valor: A través de este bloque competencial, se constatará que el alumnado es capaz de distinguir y describir manifestaciones
