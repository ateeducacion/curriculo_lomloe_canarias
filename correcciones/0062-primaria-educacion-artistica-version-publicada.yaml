    además de con curiosidad, sensibilidad, respeto y valoración hacia la diversidad de las mismas. Se comprobará que el alumnado
    es capaz de realizar búsquedas guiadas en internet, con el debido acompañamiento, relacionadas con estas manifestaciones
    artísticas, aplicando estrategias básicas de análisis. Todo ello con la finalidad de que el alumnado descubra, reconozca
    y aprecie las especificidades en intencionalidades de las diversas manifestaciones culturales y artísticas, comprendiendo
    la necesidad de respetarlas y conservarlas.
