  valor: Con este bloque competencial se trata de verificar que el alumnado es capaz de analizar los acontecimientos más importantes
    de la historia de la Astronomía y su influencia en el desarrollo del conocimiento y de la sociedad, en un clima de respeto
    y comprensión hacia otras creencias, ideologías, visiones del mundo… Para ello, se constatará que es capaz de planificar
    y elaborar trabajos de investigación individuales o grupales relacionados con el estudio de estos acontecimientos y con
    la relación existente entre las constelaciones y su mitología, a partir del análisis y de la información previamente seleccionada
    de diferentes fuentes, contrastando algunas de las concepciones que se han tenido sobre el Universo a lo largo de la historia
    y utilizando los recursos que le ofrecen las tecnologías digitales para todo ello. Se comprobará también que es capaz
    de manejar los conceptos de ascensión recta (AR) y declinación (DEC), como medio para localizar de forma rápida cualquier
    objeto estelar una vez conocidas sus coordenadas, y de reconocer las principales constelaciones, así como algunos de los
    objetos estelares que se pueden localizar en ellas, de manera que sea capaz de orientarse en una noche estrellada. Se
    evaluará asimismo que el alumnado sea capaz de argumentar la relevancia de la contribución de Canarias en relación con
    el conocimiento del Universo. Finalmente, se valorará su capacidad para comunicar las conclusiones de su investigación
    mediante exposiciones orales, haciendo uso de soportes digitales. Todo ello con la finalidad de reconocer la importancia
    de los estudios astronómicos para el conocimiento del Universo y de tomar conciencia de la inmensidad del Cosmos.
