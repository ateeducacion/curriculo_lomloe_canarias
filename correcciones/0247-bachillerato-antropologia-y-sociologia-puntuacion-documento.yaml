- nodo: bc:BATR02BC2
  campo: scopeNote
  valor: Con este bloque competencial se pretende constatar que el alumnado adquiere una base teórica y conceptual básica
    de ambas disciplinas y que es capaz de aplicarla en el diseño de diferentes producciones (exposiciones con murales, informes,
    conferencias, monográficos, artículos de divulgación, documentales…). Se pretende verificar que pone sus prácticas comunicativas
    al servicio de la convivencia democrática, que comunica sus ideas haciendo uso de la terminología adecuada, que propone
    ejemplos explicativos conectados con los problemas o fenómenos sobre los que investiga, demostrando que ha comprendido
    estos aspectos teóricos y que es capaz de hacer transferencias para analizar y establecer comparaciones entre distintos
    objetos de investigación, o bien para apoyar sus argumentos teóricos y planteamientos prácticos.
