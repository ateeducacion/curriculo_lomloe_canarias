id: '0216'
titulo: 'Educación en Valores Cívicos y Éticos (Educación Primaria): 18 diferencias corregidas con el documento oficial'
motivo: 'Diferencias que el contraste no explicaba con el BOC. Criterio aprobado: el ODT oficial de la web de currículos es
  la referencia y el corpus debe reflejarlo. Se rehacen con los saberes y la numeración del documento los bloques PEDK05SBII,
  PEDK06SBII, en los que faltaban o sobraban saberes. Tipos: descriptores de bloque distinto; descriptores de criterio distinto;
  falta en el corpus: texto de saber; nodo del corpus que no está en el documento; texto de saber distinto.'
