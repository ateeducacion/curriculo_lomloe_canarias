cambios:
- nodo: bc:SAMB03BC1
  campo: scopeNote
  valor: A través de este bloque competencial se pretende comprobar si el alumnado es capaz de emplear, de manera progresivamente
    autónoma, las fuentes y las herramientas tradicionales y digitales apropiadas, para la consulta, el archivado y el intercambio
    de información, que mejor se adapten a sus necesidades, comprobando que cumplen los criterios de fiabilidad y validez.
    Además, se verificará si examina, ubica y coteja datos e información de carácter científico para resolver preguntas y
    problemas o para profundizar en temas relacionados con cualquiera de los saberes básicos de las materias del ámbito, comprobando
    su autenticidad en función del objetivo de búsqueda para evitar los riesgos de manipulación y desinformación, manteniendo
    una actitud escéptica hacia informaciones sin base científica, citando las fuentes, respetando la propiedad intelectual
    y realizando autoevaluaciones sobre su proceso de aprendizaje. Asimismo, se valorará si adquiere, ordena y cataloga sus
    recursos en un entorno personal de aprendizaje y lo organiza y emplea eficazmente para almacenar, recuperar, reutilizar
    y compartir información, reconociendo los problemas y los riesgos que entraña el uso de las tecnologías digitales a través
    de procesos de metacognición que le permitan reflexionar y aprender de sus errores, estableciendo medidas preventivas
    para la protección de los dispositivos, los datos y la salud, propia y de las demás personas, y tomando conciencia de
    la necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible de las tecnologías. Todo ello con la finalidad
    de que el alumnado se familiarice con los flujos de información multidireccional característicos de las disciplinas científico-tecnológicas,
    refuerce las destrezas necesarias para construir conocimiento y fomente su curiosidad por la ciencia y la tecnología,
    a la vez que se prepara para ejercer su autonomía personal.
- nodo: bc:SAMB04BC1
  campo: scopeNote
  valor: A través de este bloque competencial se pretende comprobar si el alumnado es capaz de seleccionar y emplear las fuentes
    y las herramientas tradicionales y digitales apropiadas, para la consulta, el archivado y el intercambio de información,
    que mejor se adapten a sus necesidades, desechando las menos adecuadas tras comprobar que cumplen los criterios de fiabilidad,
    calidad, actualidad y validez. Además se verificará si examina, ubica y coteja datos e información de carácter científico-tecnológico
    para resolver preguntas y problemas o para profundizar en temas relacionados con cualquiera de los saberes básicos de
    las materias del ámbito, comprobando su autenticidad, adecuación y conveniencia en función de su objetivo de búsqueda
    para evitar los riesgos de manipulación y desinformación, manteniendo una actitud crítica y escéptica hacia informaciones
    sin base científica, citando las fuentes, respetando la propiedad intelectual y realizando autoevaluaciones sobre su proceso
    de aprendizaje. Asimismo, se valorará si adquiere, ordena y cataloga sus recursos en un entorno personal de aprendizaje
    y lo gestiona eficazmente para almacenar, recuperar, reutilizar y compartir información, prestando especial atención a
    los riesgos que entraña el uso de las tecnologías digitales a través de procesos de metacognición que le permitan aprender
    de sus errores, adoptando medidas preventivas para la protección de los dispositivos, los datos y la salud, propia y de
    las demás personas, y tomando conciencia de la necesidad de hacer un uso crítico, legal, seguro, saludable y sostenible
    de las tecnologías. Todo ello con la finalidad de que el alumnado se familiarice con los flujos de información multidireccional
    característicos de las disciplinas científico-tecnológicas, refuerce las destrezas necesarias para construir conocimiento
    y fomente su curiosidad por la ciencia y la tecnología, a la vez que se prepara para ejercer su autonomía personal.
- nodo: bc:SAMB04BC3
  campo: scopeNote
  valor: Este bloque competencial tiene el propósito de evaluar si el alumnado es capaz de identificar, comprender y gestionar
    sus emociones en cualquier situación cotidiana, mediante el empleo de distintas técnicas (razonamiento lógico, asertividad,
    diario emocional, etc.), y de mostrar resiliencia frente a situaciones adversas o al enfrentarse a diferentes retos académicos
    (elaboración de un plan de vida saludable, la valoración crítica de la tecnología al logro de los Objetivos de Desarrollo
    Sostenible (ODS), utilización de modelos para la comprensión de procesos científico–técnicos, realización de operaciones
    con números en contextos cotidianos, resolución de problemas sobre energía, movilidad…), poniendo en práctica estrategias
    para la aceptación del error y afrontando situaciones de incertidumbre, proponiendo alternativas en el caso de no obtener
    los resultados esperados, aprendiendo de las equivocaciones propias y de las de las demás personas, y realizando un seguimiento
    de su proceso de aprendizaje a través de diversas herramientas (diario de aprendizaje, planes de acción, agenda escolar,
    portafolio…). Además, se verificará que el alumnado es capaz, a través de procesos de autoevaluación individual y colectiva,
    y mediante la revisión de borradores y de los feedback correspondientes, de reflexionar, corregir o mejorar aquellos aspectos
    que lo requieran, utilizando la retroalimentación constructiva y la evaluación formativa, con el fin de mejorar su capacidad
    de perseverancia en la consecución de los objetivos y el disfrute durante el proceso de aprendizaje. Por otro lado, se
    pretende comprobar si el alumnado es capaz de colaborar y asumir las responsabilidades del trabajo en equipo, participando
    de forma activa y desarrollando las destrezas personales y sociales que se ponen en acción a través de la realización
    de proyectos de investigación, debates en equipo, juegos de rol, resolución de problemas o retos, pequeñas experiencias
    de laboratorio…, relacionados con cualquiera de los bloques de saberes básicos del ámbito; utilizando dinámicas de trabajo
    cooperativo; elaborando productos que dependan de las aportaciones de cada una de las personas que conforman el grupo
    y de sufuncionamiento ; fomentando la comunicación y la colaboración entre el alumnado; promoviendo la empatía y respetando
    las emociones al comprender proactivamente las experiencias y los puntos de vista de las demás personas, a la vez que
    aprende a resolver los conflictos inherentes al trabajo en equipo; considerando los sentimientos y las perspectivas del
    resto; y buscando soluciones justas y mutuamente beneficiosas. Todo ello, con el fin de que el alumnado desarrolle las
    habilidades que le permitan seguir aprendiendo a lo largo de la vida, desde la confianza en el conocimiento como motor
    del desarrollo, construyendo una identidad positiva y fomentando una actitud dialogante y asertiva que repercuta en el
    bienestar personal y grupal y genere relaciones saludables.
- nodo: bc:SAMB04BC4
  campo: scopeNote
  valor: A través de este bloque competencial se persigue constatar que el alumnado es capaz de resolver problemas reales,
    relacionados con cualquiera de los bloques de saberes básicos del ámbito, haciendo uso de diferentes herramientas manuales
    o digitales (regletas, fichas, dados, calculadoras, hojas de cálculo, programas de representación gráfica o geometría
    dinámica, laboratorios virtuales, simulaciones...), seleccionando y configurando las más adecuadas en función de la tarea,
    aplicando los pasos del trabajo científico y utilizando de forma eficaz el pensamiento computacional para descomponer
    un problema en partes más simples y para codificarlo en un lenguaje apropiado y fácil de ejecutar por un sistema informático,
    y describiendo de forma oral, escrita o gráfica el proceso realizado. Asimismo, se comprobará que interpreta y modeliza
    problemas de la vida cotidiana, identificando los datos y el objetivo, definiendo la relación que existe entre ellos y
    representando la información mediante herramientas de modelización como diagramas, expresiones simbólicas, gráficas...
    Además, se verificará que el alumnado selecciona y aplica estrategias apropiadas (analogía con otros problemas, estimación,
    ensayo y error, resolución de manera inversa, búsqueda de patrones...), reflexionando sobre el proceso realizado, superando
    bloqueos e inseguridades, buscando un cambio de estrategia cuando sea necesario y transformando el error en oportunidad
    de aprendizaje. También se pretende evaluar si es capaz de obtener todas las soluciones posibles de un problema, así como
    seleccionar de entre ellas las óptimas, reformulando los procedimientos y las conclusiones, si fuera necesario, y valorando
    tanto la corrección matemática como sus implicaciones desde diferentes perspectivas (de género, de sostenibilidad, de
    consumo responsable...). Finalmente, se comprobará que el alumnado es capaz de interpretar y explicar, utilizando el pensamiento
    científico y el razonamiento matemático, fenómenos de índole científico-técnicos; analizando con actitud crítica datos
    e información científica de diferentes fuentes de información (libros, revistas, periódicos, páginas web, pódcast, vídeos...)
    y en diversos formatos (gráficos, tablas, imágenes, símbolos…); haciendo uso de la terminología adecuada y de los principios,
    las teorías y las leyes científicas que se engloban en los diferentes bloques de saberes básicos; estableciendo, aplicando
    y analizando las conexiones existentes entre el mundo real, las matemáticas, la tecnología y las ciencias; y usando los
    procesos inherentes a la investigación científica y matemática. Todo ello con el fin de comprender y mejorar lo que ocurre
    a su alrededor a través de la ciencia y la tecnología.
- nodo: crit:SAMB03CE4.4
  campo: definition
  valor: Reconocer fenómenos de índole científico-tecnológicos y describirlos en términos de los principios, las teorías y
    las leyes científicas, entendiendo y aplicando las conexiones existentes entre el mundo real, las matemáticas, las ciencias
    y la tecnología para comprender lo que ocurre a su alrededor.
- nodo: crit:SAMB03CE4.5
  campo: definition
  valor: Analizar el funcionamiento de los dispositivos digitales y resolver problemas técnicos sencillos, identificando sus
    componentes, evaluando sus funciones y aplicando criterios de reutilización de materiales y ahorro energético, con el
    fin de hacer un uso seguro y eficiente de estos.
- nodo: crit:SAMB03CE6.3
  campo: definition
  valor: Explicar, a partir de la búsqueda en diferentes fuentes, la contribución de la ciencia y la tecnología a la sociedad
    y la labor de las personas dedicadas a ella, visibilizando a las mujeres científicas, ingenieras y técnicas, con el fin
    de entender que la investigación es una labor colectiva e interdisciplinar que genera avances y que se encuentra en constante
    evolución.
- nodo: crit:SAMB04CE4.4
  campo: definition
  valor: Interpretar fenómenos de índole científico-tecnológico y explicarlos en términos de los principios, las teorías y
    las leyes científicas, estableciendo, aplicando y analizando las conexiones existentes entre el mundo real, las matemáticas
    y las ciencias y la tecnología para comprender lo que ocurre a su alrededor.
- nodo: crit:SAMB04CE6.3
  campo: definition
  valor: Valorar, a partir de la búsqueda en diferentes fuentes, la contribución de la ciencia y la tecnológía a la sociedad
    y la labor de las personas dedicadas a ella, visibilizando a las mujeres científicas, ingenieras y técnicas, con el fin
    de fomentar las vocaciones STEAM y percibir la investigación como una labor colectiva e interdisciplinar que genera avances
    y que se encuentra en constante evolución, influida por el contexto político y los recursos económicos.
- nodo: sb:SAMB03SBI.4.4
  campo: definition
  valor: Realización de montajes físicos o simulados de circuitos eléctricos y electrónicos y operadores mecánicos para la
    búsqueda de solución de problemas en contextos reales.
- nodo: sb:SAMB03SBII.9
  campo: definition
  valor: Estudio de las formas de energía que se emplean en Canarias a partir de datos e información recabados de fuentes
    diversas (web de la consejería o ministerio competente en materia de energía, web del Instituto Tecnológico de Canarias,
    artículos periodísticos, revistas especializadas…).
- nodo: sb:SAMB03SBV.1
  campo: definition
  valor: Formulación de conjeturas sobre medidas de objetos del entorno o relaciones entre estas basadas en estimaciones.
