id: '0051'
titulo: 'Lengua Castellana y Literatura (Educación Secundaria Obligatoria): 4 textos que solo difieren en espacios'
motivo: El texto de la exportación solo difiere del documento oficial en espacios (dobles, de no separación o al principio
  o final). Se toma el del documento. Generada con `contrastar --proponer`.
