id: '0031'
titulo: 'Tecnología y Digitalización (Educación Secundaria Obligatoria): 14 explicaciones de bloque copiadas de otro curso'
motivo: La exportación repite en estos bloques competenciales la explicación de otro curso de la materia; el documento oficial
  trae una explicación propia para cada curso. Generada con `contrastar --proponer`.
fuente:
  documento: eso-tecnologia-y-digitalizacion
  fichero: fuentes/documentos/eso/Tecnologia_digitalizacion_ESO.odt
  sha256: 559fd65318942cd638ef2e1196b1ceeaca0c91fe429cccca292d8e2940c0be24
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: bc:SUEC02BC1
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz, aplicando técnicas de trabajo individual
    y colaborativo y evitando sesgos de género, de definir problemas planteados e iniciar la búsqueda de soluciones, a partir
    de la información obtenida desde una perspectiva interdisciplinar, utilizando el pensamiento científico y estrategias
    variadas de investigación en las que se tenga en cuenta la fiabilidad de las fuentes, su veracidad y su relevancia. Además,
    hará uso de herramientas de simulación que le permitan analizar, comprender y examinar productos y sistemas tecnológicos
    conforme a las diferentes fases del método de proyectos, prestando especial atención a los riesgos que entraña el uso
    de las tecnologías digitales y adoptando medidas preventivas para la protección de los dispositivos, los datos y la salud
    personal.
- nodo: bc:SUEC02BC2
  campo: scopeNote
  valor: Con este bloque competencial se comprobará que el alumnado es capaz de planificar, seleccionar y organizar los materiales
    y herramientas necesarios para construir las soluciones previamente ideadas y diseñadas conforme a las técnicas de representación
    gráfica dadas, utilizando aplicaciones CAD en dos y tres dimensiones para la representación de esquemas, circuitos, planos
    y objetos necesarios, con un enfoque de aprendizaje-servicio como metodología para aprender y aplicar lo aprendido en
    un entorno cercano. Asimismo, se verificará que desarrolla sus habilidades blandas a través del trabajo cooperativo y
    colaborativo desde una perspectiva interdisciplinar y evitando situaciones que supongan cualquier tipo de discriminación.
    También se valorará si es capaz de comunicar, con coherencia, corrección y siguiendo unas pautas establecidas, la información
    relativa a los procesos desarrollados para intercambiar información y crear conocimiento.
- nodo: bc:SUEC02BC3
  campo: scopeNote
  valor: En este bloque competencial se comprobará que el alumnado conoce las propiedades principales de los materiales empleados
    y es capaz de aplicar conocimientos relativos a conformación de materiales, estructuras, operadores mecánicos y eléctricos
    para construir colaborativamente, evitando sesgos de género, soluciones tecnológicas creativas, sostenibles y eficaces
    que den respuesta a las necesidades planteadas, empleando técnicas de fabricación apropiadas, siguiendo las normas de
    seguridad e higiene en el trabajo que correspondan en cada momento. Asimismo, se valorará su capacidad para evaluar el
    proceso seguido y redefinirlo en caso necesario.
- nodo: bc:SUEC02BC4
  campo: scopeNote
  valor: Este bloque competencial tiene el propósito de evaluar la capacidad del alumnado para emplear las herramientas digitales
    necesarias para diseñar, editar y crear contenido, haciendo uso, además, del vocabulario técnico apropiado para transmitir
    la información relativa a todo el proceso, desde la fase de ideación hasta la obtención de la solución, de manera eficaz.
    Asimismo, se valorará la capacidad para seguir tanto los protocolos establecidos en el trabajo cooperativo y colaborativo
    como las pautas propias de la participación en los entornos virtuales, es decir, la etiqueta digital.
- nodo: bc:SUEC02BC5
  campo: scopeNote
  valor: Este bloque competencial tiene como propósito valorar la capacidad del alumnado para comprender el funcionamiento
    de los distintos dispositivos digitales que conforman el entorno, con la consiguiente transferencia de estrategias a otros
    contextos, así como de aplicar los principios del pensamiento computacional, que contribuye a la adquisición de estrategias
    sistemáticas para abordar y resolver problemas de diversa índole, para desarrollar algoritmos y aplicaciones informáticas
    que den respuesta a problemas concretos y que permitan la automatización de procesos, y su aplicación en sistemas de control
    y robótica. También se valorará su capacidad para describir, interpretar y analizar crítica y eficazmente las soluciones
    y sus implicaciones sociales, reformulando el procedimiento si fuera necesario.
- nodo: bc:SUEC02BC6
  campo: scopeNote
  valor: A través de este bloque competencial se verificará que el alumnado es capaz de identificar los elementos del hardware
    y del software presentes en los dispositivos de su entorno digital de aprendizaje para utilizarlos de manera eficiente
    y segura, adoptando las medidas preventivas necesarias, con el fin de identificar y abordar la resolución de problemas
    técnicos sencillos. Además, debe ser capaz de utilizar herramientas de búsqueda de información, edición y creación de
    contenidos y de difundirlos en plataformas adecuadas, aplicando estrategias de organización de la información y adoptando
    las medidas pertinentes de protección de datos y de información para garantizar el derecho a la propiedad intelectual
    y el bienestar emocional y digital.
- nodo: bc:SUEC02BC7
  campo: scopeNote
  valor: Con este bloque competencial se comprobará que el alumnado comprende el funcionamiento de los principales sistemas
    de producción de electricidad y que es capaz de aplicar el pensamiento crítico para analizar y valorar las repercusiones
    de la actividad tecnológica en general y de las tecnologías emergentes en particular en la sociedad y en el entorno, teniendo
    en cuenta la particularidad de Canarias como zona ultraperiférica y haciendo referencia, entre otros aspectos, a la igualdad
    e inclusión social, a la accesibilidad, la obsolescencia y el impacto ambiental. Asimismo, deberá ser capaz de promover
    un uso responsable y ético de la misma conforme a la consecución de los Objetivos de Desarrollo Sostenible y a las metas
    canarias que responden a los retos de la Agenda Canaria de Desarrollo Sostenible 2030.
- nodo: bc:SUEC03BC1
  campo: scopeNote
  valor: A través de este bloque competencial se valorará que el alumnado sea capaz, aplicando técnicas de trabajo individual
    y colaborativo y evitando sesgos de género, de identificar los elementos relevantes de un problema e iniciar la búsqueda
    de soluciones, a partir de la información obtenida en múltiples fuentes, en las que se tenga en cuenta su fiabilidad,
    veracidad y relevancia, desde una perspectiva interdisciplinar y utilizando el pensamiento científico. Asimismo, debe
    ser capaz de emplear estrategias variadas de investigación y herramientas de simulación que le permitan analizar, comprender
    y examinar productos y sistemas tecnológicos conforme a las diferentes fases del método de proyectos, prestando especial
    atención a los riesgos que entraña el uso de las tecnologías digitales y adoptando medidas preventivas para la protección
    de los dispositivos, datos y la salud personal.
- nodo: bc:SUEC03BC2
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará la adquisición por parte del alumnado de estrategias que le permitan
    aplicar la creatividad y ser eficientes en la organización y planificación de tareas que requieran el empleo de materiales
    y herramientas en la investigación, en el diseño y en la ideación de soluciones de manera eficaz y desde una perspectiva
    interdisciplinar. Para ello se comprobará que el alumnado es capaz de trabajar de manera cooperativa y colaborativa, evitando
    situaciones que supongan cualquier tipo de discriminación, para construir las soluciones previamente ideadas y diseñadas
    conforme a las técnicas de representación gráfica dadas, utilizando aplicaciones CAD en dos y tres dimensiones para la
    representación de esquemas, circuitos, planos y objetos necesarios, con un enfoque de aprendizaje servicio como metodología
    para aprender y aplicar lo aprendido en un entorno cercano. También se valorará si es capaz de comunicar, con coherencia,
    corrección y siguiendo unas pautas establecidas, la información relativa a los procesos desarrollados para intercambiar
    información y crear conocimiento.
- nodo: bc:SUEC03BC3
  campo: scopeNote
  valor: En este bloque competencial se verificará que el alumnado es capaz de justificar el uso de los materiales en las
    soluciones propuestas basándose en sus propiedades, y de aplicar conocimientos relativos a conformación de materiales,
    estructuras, operadores mecánicos, eléctricos y electrónicos para encontrar soluciones a problemas concretos y, de manera
    colaborativa y evitando sesgos de género, emplear las técnicas de fabricación adecuadas y sus correspondientes normas
    de seguridad e higiene, para materializar dichas propuestas, construyendo soluciones tecnológicas creativas, sostenibles
    y eficaces. Asimismo, se valorará su capacidad para evaluar el proceso seguido y redefinirlo en caso necesario.
- nodo: bc:SUEC03BC4
  campo: scopeNote
  valor: A través de este bloque competencial se debe verificar que el alumnado es capaz de hacer uso de los medios digitales
    para elaborar información que permita definir ideas y soluciones, intercambiarla de manera eficaz para facilitar los aprendizajes
    y difundirla, todo ello haciendo uso de los formatos y el vocabulario técnico pertinente. Además, debe ser capaz de, en
    estos procesos de interacción que involucran trabajo colaborativo y cooperativo, respetar los códigos de comunicación
    y de comportamiento específicos del ámbito digital, en clara referencia a las reglas de la netiqueta.
- nodo: bc:SUEC03BC5
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de aplicar los principios del pensamiento
    computacional para comprender el funcionamiento de los distintos dispositivos digitales que conforman el entorno y desarrollar
    algoritmos y aplicaciones informáticas que den respuesta a problemas concretos y que permitan la automatización de procesos,
    así como su aplicación en sistemas de control y robótica de diferente nivel de complejidad. También se valorará su capacidad
    para describir, interpretar y analizar crítica y eficazmente las soluciones y sus implicaciones sociales, reformulando
    el procedimiento si fuera necesario.
- nodo: bc:SUEC03BC6
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de identificar los elementos del hardware
    y del software presentes en los dispositivos de su entorno digital de aprendizaje para utilizarlos de manera eficiente
    y segura, adoptando las medidas preventivas necesarias, con el fin de identificar y abordar la resolución de problemas
    técnicos sencillos. Además, debe ser capaz de utilizar herramientas variadas de búsqueda de información, edición y creación
    de contenidos y de difundirlos en distintas plataformas, aplicando estrategias adecuadas de organización de la información
    y adoptando las medidas pertinentes de protección de datos y de información adecuadas para garantizar el derecho a la
    propiedad intelectual y el bienestar emocional y digital.
- nodo: bc:SUEC03BC7
  campo: scopeNote
  valor: Con este bloque competencial se comprobará que el alumnado identifica y describe los sistemas de producción energética
    y aplica el pensamiento crítico para analizar y valorar las repercusiones que la actividad tecnológica en general y las
    tecnologías emergentes en particular, tienen en el bienestar emocional de las personas directamente o a través de las
    consecuencias de estas en el entorno, teniendo en cuenta la particularidad de Canarias como zona ultraperiférica, en una
    clara referencia, entre otros aspectos, a la igualdad e inclusión social, a la accesibilidad, a la obsolescencia y al
    impacto ambiental, para promover de esta manera una mejora de las soluciones conforme a la consecución de los Objetivos
    de Desarrollo Sostenible y a las metas canarias que responden a los retos identificados en la Agenda Canaria de Desarrollo
    Sostenible 2030.
