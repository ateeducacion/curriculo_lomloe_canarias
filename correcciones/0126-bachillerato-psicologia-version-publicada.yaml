cambios:
- nodo: bc:BPSI02BC3
  campo: scopeNote
  valor: Mediante la adquisición de esta competencia específica el alumnado debe ser capaz de construir conocimiento. Para
    ello se constatará que comprende las principales teorías de la personalidad y su evolución a lo largo de la historia interpretando
    y transmitiendo con precisión las aportaciones de autores como Freud, Jung, Roggers, Kelly, Cattell, Eysenck, Costa y
    McCrae, Cloninger, etc. Así mismo, se constatará que identifica los factores genéticos, medioambientales y culturales
    que influyen en la conformación de la personalidad integrando esta información para plantear acciones promotoras de la
    salud física y mental. Se verificará que describe la evolución del cerebro humano y conoce la estructura del sistema nervioso
    central, fundamentalmente del encéfalo, distinguiendo áreas y funciones que determinan la conducta de las personas e identificando
    las principales consecuencias del daño cerebral. Se verificará que identifica las diferentes técnicas de investigación
    cerebral y su impacto en el avance científico. Se constatará que comprende y reconoce algunas de las bases genéticas que
    determinan la conducta humana destacando el origen de algunas enfermedades producidas por alteraciones genéticas y transmitiendo
    elementos más relevantes de investigaciones actuales. Se verificará que el alumnado describe el concepto de salud mental
    reflexionando con actitud empática sobre los conceptos de trastorno y enfermedad mental, rechazando cualquier tipo de
    discriminación hacia las personas que lo padecen e identificando factores sociales de protección.
- nodo: crit:BPSI02CE5.3
  campo: definition
  valor: Conocer y analizar formas actuales de interacción social con especial énfasis en entornos virtuales concienciando
    sobre los riesgos de fenómenos como el sexting, el grooming y la sextorsión, y sus consecuencias, y redes sociales, detectando
    fortalezas y debilidades, localizando indicadores de desinformación y manipulación, identificando factores de protección
    de la salud física y mental y afectivo-sexualy desarrollando hábitos de comportamiento favorecedores del bienestar individual
    y colectivo para ejercer una ciudadanía digital activa, cívica y reflexiva.
- nodo: sb:BPSI02SBI.1
  campo: definition
  valor: La Psicología como la ciencia que estudia los procesos mentales.
- nodo: sb:BPSI02SBI.2
  campo: definition
  valor: Aportaciones más relevantes de las corrientes contemporáneas de la Psicología.
- nodo: sb:BPSI02SBI.2.3
  campo: definition
  valor: Descripción, análisis y valoración del psicoanálisis, el conductismo, el estructuralismo, el funcionalismo, la psicología
    humanista, el cognitivismo y el constructivismo.
- nodo: sb:BPSI02SBII.1
  campo: definition
  valor: El sistema nervioso central.
- nodo: sb:BPSI02SBII.1.4
  campo: definition
  valor: Descripción de la anatomía del sistema nervioso central, localización de las principales áreas y descripción de sus
    funciones (corteza cerebral, sistema límbico…).
- nodo: sb:BPSI02SBII.2
  campo: definition
  valor: El sistema endocrino.
- nodo: sb:BPSI02SBIII.1
  campo: definition
  valor: Percepción.
- nodo: sb:BPSI02SBIII.2
  campo: definition
  valor: Atención y memoria.
- nodo: sb:BPSI02SBIV.2
  campo: definition
  valor: Inteligencia.
- nodo: sb:BPSI02SBIV.3
  campo: definition
  valor: Pensamiento.
- nodo: sb:BPSI02SBV.7
  campo: definition
  valor: Reconocimiento de las implicaciones del desarrollo tecnológico en las nuevas formas de interacción social concienciando
    sobre los riesgos de fenómenos como el sexting, el grooming y la sextorsión, y sus consecuencias. Debate sobre sus ventajas
    e inconvenientes y sus implicaciones en el bienestar físico y mental y afectivo de las personas.
- nodo: sb:BPSI02SBV.8
  campo: definition
  valor: Identificación y aplicación de estrategias y medidas para el uso seguro de internet, incluyendo la prevención de
    prácticas sexuales virtuales de riesgo. Comprensión de conceptos como huella digital, identidad digital, netiqueta, etc.
- nodo: sb:BPSI02SBVI.4
  campo: definition
  valor: Identificación de diferentes estilos de liderazgo y debate sobre su repercusión en el rendimiento y bienestar laboral
    de las personas.
