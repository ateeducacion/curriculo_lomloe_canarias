id: '0016'
titulo: 'Bioestadística (Bachillerato): saber III.3.2 exportado con el código III.1.2'
motivo: 'La exportación codifica los dos saberes del apartado III.3 «Inclusión, respeto y diversidad» como III.1.1 y III.1.2.
  El importador reconstruye el primero como III.3.1 porque su código choca con el III.1.1 real; el segundo no choca con nada
  y queda colgado de III.1. El documento oficial lo numera 3.2: se crea III.3.2 y se retira III.1.2.'
