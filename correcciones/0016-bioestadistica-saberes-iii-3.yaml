id: '0016'
titulo: 'Bioestadística (Bachillerato): saberes de «Inclusión, respeto y diversidad» con código de otro apartado'
motivo: La exportación codifica los dos saberes del apartado III.3 «Inclusión, respeto y diversidad» como III.1.1 y III.1.2.
  El primero choca con el III.1.1 real (error codigo_duplicado y se pierde) y el segundo queda colgado de III.1. El documento
  oficial los numera 3.1 y 3.2. Se crean III.3, III.3.1 y III.3.2 y se retira III.1.2. El error codigo_duplicado lo sigue
  produciendo el importador hasta que la exportación corrija el código.
