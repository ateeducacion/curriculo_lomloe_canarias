  valor: A través de este bloque competencial se pretende constatar que el alumnado reconoce el alfabeto griego y sus características
    fonéticas, gráficas y prosódicas, leyendo textos griegos de manera progresiva y correcta. Deberá ser capaz, además, de
    analizar morfológica y sintácticamente textos sencillos y aplicar estrategias y herramientas para la traducción de textos
    griegos y para la resolución de problemas, que contrastará para reformular las hipótesis, al mismo tiempo que lleva a
    cabo ejercicios muy elementales de retroversión, puesto que la traducción de textos constituye el núcleo del proceso de
    aprendizaje de las lenguas clásicas. Esto hará que el alumnado sea capaz no solo de expresarse de forma oral y escrita,
    creando conocimiento e intercambiándolo, sino también de comprender, interpretar y valorar diferentes textos orales, escritos
    o multimodales, localizando, seleccionando y contrastando información de diferentes fuentes. Con todo, y a través de actividades
    de autorreparación, autoevaluación y coevaluación, podrá analizar y valorar, de manera crítica, la diversidad lingüística
    y cultural, y lograr el desarrollo personal y social.
