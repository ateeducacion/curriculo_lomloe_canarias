id: 0019
titulo: 'Educación Física (Educación Secundaria Obligatoria): 15 explicaciones de bloque copiadas de otro curso'
motivo: La exportación repite en estos bloques competenciales la explicación de otro curso de la materia; el documento oficial
  trae una explicación propia para cada curso. Generada con `contrastar --proponer`.
fuente:
  documento: eso-educacion-fisica
  fichero: fuentes/documentos/eso/Educacion_Fisica_ESO.odt
  sha256: e275ea4326004bdb4de2adf25ca208f42e3bcde467b1b448732f412dcf16234e
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: propuesta
aprobada_por: null
cambios:
- nodo: bc:SEFI02BC1
  campo: scopeNote
  valor: A través de este bloque competencial se busca comprobar que el alumnado desarrolla acciones relacionadas con la salud
    y la seguridad en la práctica motriz desde la conciencia de su realidad individual, sus necesidades y sus expectativas,
    comenzando a gestionar, planificar y autorregular dicha práctica, así como otros elementos que condicionan la salud. Se
    comprobará que es capaz de emprender acciones en relación con el desarrollo y la mejora de la condición física, la salud
    y la seguridad en la práctica motriz, utilizando el método científico en el análisis y la valoración de las distintas
    prácticas motrices y su efecto sobre los niveles de salud física, mental y social. Se propondrá llevar a cabo la planificación
    personal de la práctica motriz en las rutinas diarias utilizando la activación y vuelta a la calma, duración, la intensidad
    y la continuidad, entre otros aspectos, para mejorar sus niveles de condición motriz. Contará con la posibilidad de explorar
    herramientas digitales asociadas a la gestión de la actividad física, de forma creativa, crítica y personal, a la par
    que respetuosa con la propiedad intelectual, para hacer un uso legal y seguro de las tecnologías digitales, además de
    saludable y sostenible. Se constatará que es capaz de analizar diferentes aspectos que caracterizan un estilo de vida
    saludable como la alimentación, los hábitos de higiene, el horario de sueño, la educación postural, los primeros auxilios
    o la prevención de lesiones, entre otros, conociendo los riesgos para la salud previo análisis crítico de los estereotipos
    corporales, de género y de competencia motriz para preservar la salud física, mental y social, así como realizando autoevaluaciones
    sobre su proceso de aprendizaje que parten de su realidad individual, sus necesidades y sus expectativas, para hacer un
    uso saludable de su tiempo libre y así mejorar su calidad de vida. Este bloque competencial contribuye a la formación
    integral a través de la dinamización de prácticas introyectivas y prácticas motrices de acondicionamiento físico saludable;
    prevención, cuidado y pautas de actuación seguras en prácticas motrices asociadas a prácticas introyectivas, la alimentación,
    la educación postural, los primeros auxilios o la prevención de lesiones entre otros; gestión de la actividad física con
    opción de empleo de herramientas digitales que enriquezcan su práctica.
- nodo: bc:SEFI02BC2
  campo: scopeNote
  valor: 'A través de este bloque competencial se comprobará que el alumnado explora y toma decisiones analizando lo que ocurre
    durante el proceso, cambiando de estrategia, si es preciso, y valorando finalmente el resultado en el seno de diferentes
    experiencias motrices. Se comprobará que es capaz de practicar retos con distintos grados de interacción, participación
    e incertidumbre en el entorno y en contextos diversos de práctica motriz,  que conlleven la planificación, gestión y reflexión
    sobre el proceso realizado y el resultado obtenido, teniendo en cuenta los mecanismos de percepción, decisión y ejecución
    adecuados a la lógica interna. Asimismo, se valorarán las capacidades físicas y coordinativas condicionantes de la práctica,
    realizando autoevaluación de su desempeño y evaluando el de sus iguales. Será éste el medio para aprender de los errores
    o reafirmar fortalezas mediante el uso de estrategias de autoconocimiento y autoeficacia, que consoliden actitudes de
    superación, crecimiento y resiliencia en situaciones de carácter motor y la transferencia a otros contextos. Este bloque
    competencial contribuye a la formación integral a través del planteamiento de retos motores para la mejora de las capacidades
    condicionales: capacidades físicas y capacidades coordinativas, desafíos individuales, desafíos cooperativos, desafíos
    de oposición y desafíos de cooperación-oposición.'
- nodo: bc:SEFI02BC3
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado vivencia numerosas situaciones motrices con distintos
    grados y tipos de interacción mostrando una actitud positiva, crítica y respetuosa en las relaciones interpersonales,
    para que aprenda a gestionar sus emociones y sus habilidades sociales en contextos variados de práctica motriz. Se comprobará
    que es capaz de compartir espacios de práctica físico-deportiva con una perspectiva inclusiva, comprendiendo y analizando
    las diferencias culturales, sociales, de género y de habilidad, priorizando el respeto y las reglas sobre los resultados,
    mostrando tolerancia, resolviendo de forma dialogada los conflictos, fomentando el juego limpio, la cooperación y la resiliencia
    para aprender a gestionar emociones y habilidades sociales en un proceso continuo de retroalimentación, contribuyendo
    al entendimiento social, al compromiso ético y al fomento de las relaciones constructivas en contextos variados de práctica
    motriz. Este bloque competencial contribuye a la formación integral a través de la dinamización de prácticas motrices
    inclusivas y prácticas para el autoconocimiento, la gestión de las emociones y las habilidades sociales en la actividad
    física.
- nodo: bc:SEFI02BC4
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado practica y experimenta tanto los recursos expresivos
    del cuerpo y el movimiento como las manifestaciones culturales motrices a través del juego y el deporte. Se comprobará
    que el alumnado es capaz de poner en práctica manifestaciones motrices de Canarias y de otras culturas, comprendiendo
    las relaciones entre ellas y su papel en el patrimonio de la cultura motriz. Se verificará que es capaz de participar
    en manifestaciones artístico-expresivas de manera creativa y abierta para crear productos individuales o colectivos, además
    de ser capaz de reconocer y valorar con espíritu crítico el juego y el deporte como fenómenos sociales. Este bloque competencial
    contribuye a la formación integral a través de la dinamización de prácticas motrices de la cultura canaria y de otras
    culturas, así como al desarrollo de prácticas con finalidad artístico-expresiva y rítmico-expresiva.
- nodo: bc:SEFI02BC5
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado practica y valora las actividades físico-deportivas
    adaptándose a contextos variados de práctica motriz, organizando y evaluando las mismas, combinando procesos de aprendizaje
    y de servicio a la comunidad. Se llevarán a cabo de forma segura y desde planteamientos basados en la conservación y el
    desarrollo sostenible. Se verificará que es capaz de adoptar un estilo de vida sostenible y ecosocialmente responsable
    teniendo la posibilidad de emprender y desarrollar colaborativa y cooperativamente acciones de servicio a la comunidad
    vinculadas a la actividad física y al deporte, aportando ideas y acciones en beneficio de la sociedad, reflexionando y
    desarrollando sus propios juicios para contribuir de forma consciente y activa, valorando el impacto y la sostenibilidad
    de la práctica de actividades físico-deportivas en diferentes entornos, aplicando medidas de seguridad, para preservar
    la salud y el medioambiente. Este bloque competencial contribuye a la formación integral a través de la dinamización de
    prácticas motrices sostenibles en entornos urbanos y naturales terrestres, así como en acuáticos si fuera posible. Además,
    se promoverá la movilidad sostenible y segura en desplazamientos a pie o sobre ruedas y prácticas motrices vinculadas
    al tiempo libre, a una ciudadanía activa y al compromiso cívico.
