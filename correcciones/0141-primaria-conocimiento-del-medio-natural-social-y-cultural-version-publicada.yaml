    conciencia emocional (percepción, reconocimiento y comprensión emocional de alegría, tristeza, miedo, enfado, asco y sorpresa),
    la regulación emocional (autocontrol impulsivo y ajuste afectivo) y la vinculación emocional (empatía). Sensibilidad y
    aceptación de la diversidad presente en el aula y en la sociedad desde un modelo inclusivo, que incluya la educación afectivo-sexual,
    adaptada al nivel madurativo del alumnado.'
