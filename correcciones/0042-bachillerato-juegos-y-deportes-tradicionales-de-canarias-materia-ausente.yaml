  accion: crear
  datos:
    tipo: CompetenciaEspecifica
    notation: BJUIC2
    definition: Conocer, practicar y valorar las actividades ludomotrices y deportivas de carácter tradicional de Canarias,
      así como el proceso de deportivización que han desplegado algunas de ellas dentro del marco etnomotriz, para conocer
      y experimentar de manera práctica el patrimonio de juegos y deportes de Canarias de adultos favoreciendo su transmisión
      y conservación.
