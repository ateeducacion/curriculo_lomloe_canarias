- nodo: ce:BJUIC1
  accion: crear
  datos:
    tipo: CompetenciaEspecifica
    notation: BJUIC1
    definition: Conocer, practicar y difundir los juegos motores tradicionales infantiles y de adolescentes en Canarias, visibilizando
      los estereotipos sexistas y las desigualdades de género en el marco de su contexto histórico para favorecer la inclusión,
      el desarrollo emocional del alumnado y las vías de transmisión intergeneracional a partir de la experiencia motriz.
    broader: materia:BJUI
    materia: materia:BJUI
    etapa: etapa:BAC
