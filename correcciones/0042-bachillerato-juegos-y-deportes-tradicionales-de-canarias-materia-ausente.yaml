    scopeNote: A través de este bloque competencial, se promoverá que el alumnado conozca, practique y difunda la diversidad
      de juegos motores tradicionales dirigidos a la infancia y la adolescencia en Canarias. Se busca identificar los estereotipos
      sexistas y las desigualdades de género, fomentando la inclusión y el desarrollo emocional que favorece su práctica,
      así como difundir su conexión con el entorno y la transmisión intergeneracional.
