- nodo: bc:BJUI01BC2
  accion: crear
  datos:
    tipo: BloqueCompetencial
    notation: BJUI01BC2
    prefLabel: Juegos y Deportes Tradicionales de Canarias · 1º Bachillerato · bloque competencial C2
    scopeNote: A través de este bloque competencial se propiciará que el alumnado desarrolle la capacidad de identificar,
      valorar y poner en práctica actividades ludomotrices y deportivas tradicionales canarias, reconociendo, caracterizando
      y valorando el contexto sociocultural canario, diferenciando las que tienen un origen anterior a la conquista y colonización
      europea y las que se incorporaron con el posterior aporte humano y cultural, y reconociendo el proceso de deportivización
      adquirido por algunas de ellas. A través de este bloque competencial se propiciará que el alumnado conozca, ponga en
      práctica y difunda la variedad de juegos motores y deportes tradicionales de Canarias, potenciando la inclusión y el
      desarrollo emocional que favorece su práctica y difundiendo su vinculación con el entorno y la transmisión intergeneracional.
    broader: materia:BJUI
    agrupa:
