cambios:
- nodo: bc:SLCL02BC1
  campo: scopeNote
  valor: Este bloque competencial nos va a permitir constatar que el alumnado, a partir del acercamiento a la realidad sociolingüística,
    es capaz de aprovechar esta diversidad en el aula y su propia biografía lingüística como elemento de aproximación a la
    reflexión, estudiando el origen y distribución geográfica, identificando y aplicando nociones básicas de las diferentes
    lenguas, incluido el lenguaje idiomático del silbo gomero. Para ello se partirá de la consideración del español como lengua
    universal y policéntrica, en la que ninguna variedad geográfica ha de considerarse más correcta que otra. Asimismo, se
    valorará que entiende la amplitud de la diversidad de la lengua en uso, señalando las diferencias entre plurilingüismo
    y diversidad dialectal. En este sentido, se estudiará la variedad dialectal canaria, en sus rasgos fónicos, gramaticales
    y léxicos, comparándola con las características propias de otros dialectos del español, con el objetivo de fomentar que
    el alumnado se sienta legitimado lingüística y culturalmente. La diversidad lingüística, dialectal y cultural presente
    en la sociedad española, así como en la europea y en el mundo hispanohablante formará parte del desarrollo personal del
    alumnado, como herramienta imprescindible para el diálogo y la cohesión social, lo que le permitirá identificar y rechazar
    prejuicios y estereotipos, así como afianzar una actitud de respeto y de sensibilidad hacia el patrimonio cultural, y
    hacia el uso personal de la variedad propia, con un efecto directo en su seguridad en la comunicación.
- nodo: bc:SLCL02BC2
  campo: scopeNote
  valor: A través de este bloque competencial se persigue constatar que el alumnado, individualmente o en grupo, comprende
    e interpreta textos orales, signados (a través del reconocimiento guiado de expresiones y vocabulario de uso cotidiano
    en alfabeto dactilológico) o multimodales sencillos de los ámbitos personal (conversaciones, avisos, videoconferencias,
    anuncios, canciones…), social (reseñas radiofónicas, entrevistas, noticias, tutoriales, debates, tertulias, cuñas publicitarias…)
    y educativo (presentaciones, charlas TED, coloquios, debates…), aplicando estrategias que le permitan identificar los
    componentes del hecho comunicativo (grado de formalidad de la situación y carácter público o privado; distancia social
    entre los interlocutores; propósitos comunicativos e interpretación pautada de intenciones). Se verificará asimismo que
    distingue la información de la opinión, los procedimientos retóricos, los elementos no verbales de la comunicación (gestos,
    postura, proxemia y vocalización) e interpreta el significado de la imagen y elementos paratextuales de los textos icónico-verbales
    y multimodales, ensanchando las posibilidades de la comunicación asíncrona, buscando y seleccionando la información de
    manera pautada con criterios de fiabilidad y pertinencia, requiriendo del alumnado una correcta alfabetización informacional
    y mediática para hacer frente a los riesgos de desinformación y manipulación; reorganizándola y sintétizándola en oraciones
    que se relacionen lógica y semánticamente. También se comprobará que es capaz de interpretar el sentido global y la relación
    entre sus partes y seleccionar, retener y analizar la información más relevante, estableciendo las conexiones entre el
    texto y su contexto que permitan conferirle su sentido, analizando de manera progresivamente autónoma fuentes de procedencia
    verbal y no verbal (entornos virtuales de aprendizaje, bibliotecas escolares y públicas como espacios creativos de aprendizaje…);
    y aplicando métodos inductivos, deductivos y metalingüísticos guiados (establecimiento de generalizaciones, comparación
    con otras lenguas o redacción de conclusiones propias) con el propósito de participar en diferentes contextos de manera
    activa e informada y construir conocimiento.
- nodo: bc:SLCL02BC3
  campo: scopeNote
  valor: A través de este bloque competencial comprobaremos que el alumnado, de manera individual o en grupo, es capaz de
    conversar en diálogos pedagógicamente orientados, estructurar el discurso y adecuar el registro y el comportamiento no
    verbal en producciones orales y multimodales sencillas de carácter informal, monologadas o dialogadas con coherencia,
    cohesión y adecuación a los diferentes contextos sociales, respetando las características de la variedad dialectal del
    hablante, sobre temas de interés personal (la conversación), social (reseñas radiofónicos, entrevistas, pódcast, noticias,
    debates, tertulias…) y educativo (la exposición oral), atendiendo al grado de formalidad de la situación y al carácter
    público o privado; a la distancia social entre los interlocutores; a los propósitos comunicativos y a la interpretación
    pautada de intenciones; al canal y a los elementos no verbales de la comunicación (postura corporal, gesticulación…);
    a los aspectos prosódicos (entonación, pausas, tono, timbre, volumen..); a la adecuación a la audiencia, al tiempo de
    exposición y a los rasgos discursivos y lingüísticos de la oralidad formal. De igual forma se verificará que incorpora
    de manera progresivamente autónoma palabras propias del registro formal de la lengua y también que desarrolla la gestión
    de la información, analizando necesidades y oportunidades. Asimismo, participa de manera gradualmente activa e informada
    en interacciones comunicativas orales informales (incluyendo las que se producen en entornos virtuales de aprendizaje),
    evitando un uso discriminatorio del lenguaje e incorporando aspectos como la cooperación conversacional y la cortesía
    lingüística (turno de palabra, respeto al espacio, gesticulación adecuada, escucha activa, uso de fórmulas de saludo y
    despedida…) y la asertividad y la resolución dialogada de los conflictos para intercambiar información, regular la conducta
    y establecer vínculos personales.
- nodo: bc:SLCL02BC4
  campo: scopeNote
  valor: A través de este bloque competencial se persigue constatar que el alumnado comprende, interpreta y valora, de manera
    individual o colectiva, textos escritos y multimodales sencillos de los ámbitos personal (mensajería electrónica, notas,
    diario…), social (noticias, textos publicitarios…) y educativo (manuales escolares, mapas conceptuales, informes, apuntes…),
    atendiendo a la gradación y la complejidad de los textos (extensión, estructura, lenguaje, tema…) y a diferentes géneros
    textuales. Se comprobará que hace uso de estrategias y técnicas de lectura comprensiva, que van más allá de la decodificación
    del texto, aplicando métodos inductivos y deductivos (búsqueda de contraejemplos o establecimiento de generalizaciones),
    que deben desplegarse antes, durante y después del acto lector para permitirle reconocer y explicar el sentido global
    del texto, la estructura, la intención del emisor y la relación entre sus partes. Se verificará asimismo que distingue
    la información de la opinión e interpreta el significado de la imagen y elementos paratextuales de los textos icónico-verbales
    y multimodales, en consonancia con la sociedad de la información y del conocimiento del siglo XXI, buscando y seleccionando
    de manera pautada la información procedente de diferentes fuentes con criterios de fiabilidad y pertinencia, reconociendo
    los riesgos de desinformación y manipulación, y reorganizándola y sintetizándola en oraciones que se relacionen lógica
    y semánticamente. Igualmente, se comprobará que es capaz de reconocer y explicar la forma y el contenido, atendiendo al
    sentido global, la relación entre sus partes y la información más relevante, los mecanismos de referencia interna (conectores
    y mecanismos gramaticales como las sustituciones pronominales y adverbiales), analizando fuentes de procedencia verbal
    y no verbal con el propósito de participar en diferentes situaciones comunicativas de manera activa para favorecer su
    desarrollo personal y su participación en la sociedad.
- nodo: bc:SLCL02BC5
  campo: scopeNote
  valor: 'A través de este bloque competencial se persigue constatar que el alumnado, de manera individual o en grupo, es
    capaz de producir textos escritos (con especial atención a los textos narrativos, descriptivos, dialogados y expositivos)
    y multimodales con coherencia, cohesión y adecuación y con distintas intenciones comunicativas, desarrollando procesos
    metacognitivos de retroalimentación: la planificación –determinación del propósito comunicativo y el destinatario, análisis
    de la situación comunicativa, lectura y análisis de modelos y redacción de borradores de escritura–, la textualización,
    la revisión progresivamente autónoma y la edición guiada del texto final mediante herramientas o plataformas virtuales,
    de manera respetuosa con la propiedad intelectual. Asimismo, se comprobará que aplica gradualmente procedimientos lingüísticos
    y de estilo, y que atiende a las convenciones propias del ámbito discursivo personal (mensajería electrónica, notas, diario…),
    social (redes sociales, y medios de comunicación, textos publicitarios…) y educativo (toma de apuntes, manuales escolares,
    esquemas, resúmenes…), prestando especial atención a la corrección lingüística, la incorporación gradual de un léxico
    adecuado, la revisión ortográfica y gramatical (uso de diccionarios, manuales de consulta y de correctores ortográficos
    en soporte analógico o digital), así como la identificación y aplicación de los recursos lingüísticos para adecuar el
    registro a la situación comunicativa. Igualmente, se constatará que usa mecanismos de cohesión, conectores textuales y
    mecanismos de referencia interna gramaticales y léxicos; reconocimiento y estudio del uso coherente de las formas verbales,
    y valoración de la correlación temporal en el discurso relatado. Todo ello identificando y aplicando los aprendizajes
    adquiridos para reconocer la comunicación escrita como un medio para favorecer, a través del lenguaje, una convivencia
    positiva que respete la diversidad, el compromiso con la igualdad de género, la cohesión social, el desarrollo sostenible
    y el logro de una ciudadanía mundial en sociedades cambiantes y diversas, así como para dar respuesta a demandas comunicativas
    concretas.'
- nodo: bc:SLCL02BC6
  campo: scopeNote
  valor: Con este bloque competencial se comprobará si el alumnado es capaz de elaborar trabajos o proyectos de investigación
    sencillos en diferentes soportes, individualmente o de forma cooperativa sobre temas del currículo o de interés personal
    y social e incorporar de manera progresivamente autónoma a su entorno personal dispositivos y plataformas digitales, herramientas,
    aplicaciones y servicios en línea. Se verificará que es capaz de aplicar gradualmente estrategias de planificación y de
    respeto por las convenciones establecidas en la presentación de sus producciones, con las que divulga de forma pautada
    el conocimiento adquirido (organización en epígrafes, procedimientos de cita, notas, bibliografía y webgrafía…) definiendo
    sus propios objetivos, localizando, seleccionando y contrastando la información procedente de diferentes fuentes incluyendo
    criterios de fiabilidad y pertinencia en función de los objetivos de lectura, siendo la biblioteca escolar el entorno
    ideal para la adquisición de estas habilidades, entendida como espacio creativo de aprendizaje y como centro de recursos,
    formación y coordinación. Se constatará también que integra y reelabora la información como nuevo conocimiento, respetando
    los derechos de autoría digital, adoptando un punto de vista creativo y adecuado al contexto de difusión, incorporando
    hábitos de uso de las tecnologías digitales críticos, seguros, sostenibles y saludables, mostrando interés por la gestión
    de los procesos de búsqueda, la claridad y la coherencia en la expresión, y aplicando autoevaluaciones sobre su propio
    proceso de aprendizaje, de manera que preste especial cuidado por la gestión responsable de su identidad digital. Asimismo,
    en sus producciones orales y escritas se valorará que es capaz de sintetizar la información procedente de fuentes diversas
    en esquemas propios, de manera respetuosa con la propiedad intelectual y utilizando la cultura digital para evitar los
    riesgos de desinformación y manipulación.
- nodo: bc:SLCL02BC7
  campo: scopeNote
  valor: A través de esta competencia se constatará que el alumnado es capaz de elegir a partir de preselecciones y leer de
    manera progresivamente autónoma obras variadas, propias de la literatura juvenil contemporánea, así como a la literatura
    española y universal, con la debida atención a la literatura canaria, de acuerdo a sus gustos, intereses y necesidades,
    a partir de la exploración guiada de bibliotecas escolares y públicas y configurando gradualmente su propio itinerario
    lector. Asimismo, se verificará que participa progresivamente y de manera activa en situaciones comunicativas vinculadas
    con el circuito literario y lector del ámbito personal y educativo (debates, clubes de lectura, libro fórum, chats, blogs…)
    que favorezcan, a través de modelos, el intercambio abierto de la experiencia lectora y de las diferentes formas de apropiación
    y recreación de los textos leídos, haciendo un uso progresivamente autónomo de soportes, herramientas o plataformas virtuales
    diversas (videorreseñas, reseñas en revistas o radios escolares, jornadas de oralidad…) que incluyan el contacto con formas
    literarias actuales impresas y digitales (videopoemas, audiolibros, plataformas de lectura y para escritura social, murales
    en forma de poesía…), asumiendo que “leer con otras personas” también es hablar sobre lo que se lee y compartir lo que
    se escribe. Para ello, se establecerán estrategias que permitan al alumnado explicitar a partir de guías los criterios
    de selección de las lecturas, utilizando progresivamente un metalenguaje específico, las formas de acceso a la cultura
    literaria y la propia experiencia bibliográfica, estableciendo vínculos de manera pautada entre las obras leídas y la
    actualidad, así como con otros textos y manifestaciones artísticas y culturales próximas a sus intereses, reconociendo
    los lenguajes y elementos técnicos básicos que las caracterizan en los que se valorará el respeto por las opiniones y
    experiencias ajenas.
- nodo: bc:SLCL02BC8
  campo: scopeNote
  valor: Se verificará que el alumnado es capaz de explicar y argumentar, utilizando progresivamente el metalenguaje específico,
    con ayuda de pautas y modelos, la interpretación de obras o fragmentos representativos de la literatura española y universal
    de cualquier época, con la adecuada atención a la literatura canaria, a partir de lectura guiada y compartida en el aula
    de textos inscritos en itinerarios temáticos o de género planificados, que incluyan la presencia de escritoras y escritores
    previamente seleccionados, identificando de manera progresivamente autónoma, la intención del autor o autora, la recurrencia
    de temas y los rasgos más significativos del género, así como detectando la pervivencia de universales temáticos y formales
    en la literatura, a fin de crear un mapa cultural y desarrollar su conciencia literaria. Asimismo, se comprobará que el
    alumnado compara la conexión existente entre unos textos literarios con otros, ya sean orales, escritos o multimodales,
    y con otras manifestaciones artísticas próximos a sus intereses (música, cine, cómic, novela gráfica…), además de con
    las nuevas formas de ficción, estableciendo vínculos de manera pautada en función de temas, tópicos, estructuras, lenguaje
    y manifestando a lo largo del proceso juicios razonados en los que se valorará el respeto por las opiniones y experiencias
    ajenas. Para ello, el alumnado participará en situaciones comunicativas de manera progresivamente activa y adecuada (discusiones
    o conversaciones literarias) propias del ámbito personal y académico que propiciarán la construcción compartida de la
    interpretación de las obras y la realización de trabajos sencillos, individuales o cooperativos, de identificación y crítica
    literaria presentados en diversos formatos y soportes, propiciando una relación afectiva con las obras literarias y priorizando
    el despertar de una sensibilidad estética que acreciente en el alumnado las posibilidades de disfrute ante la lectura
    y la escritura creativa. Además, desarrollará progresivamente estrategias que favorezcan las lecturas expresivas, dramatizaciones
    y recitaciones de textos (videopoemas, guiones, improvisaciones, representaciones…) atendiendo a los procesos de comprensión
    y oralización implicados. Por último, se pretende verificar que el alumnado es capaz de crear textos personales o colectivos
    de géneros diversos con propósito literario y artístico y sentido estético, en referencia a modelos dados, en los que
    aplica de manera progresiva las convenciones de los diversos géneros y los aspectos formales (poemas, caligramas, relatos
    cortos, diarios digitales, biografías, monólogos humorísticos, novelas gráficas, piezas teatrales…) presentados en formato
    papel o digital, y con distintos lenguajes artísticos y audiovisuales, (cómics, vídeos, biopic, animación, interpretación
    teatral, blogs…) en los que se aplican los conocimientos literarios adquiridos y la experiencia lectora, aplicando autoevaluaciones
    y coevaluaciones sobre su propio proceso de aprendizaje, con el propósito de que la escritura creativa sea entendida como
    una forma de comunicación que permita afianzar el gusto por la lectura y la creación literaria.
- nodo: bc:SLCL02BC9
  campo: scopeNote
  valor: 'A través de este bloque competencial se persigue constatar que el alumnado es capaz, promoviendo su capacidad de
    observación y razonamiento, de analizar la estructura de la lengua y sus usos, y las elecciones lingüísticas y discursivas
    del emisor y sus efectos en el receptor. Se debe llegar a la generalización y a la sistematización con distintos niveles
    de profundización, a través del apoyo del docente o del aprendizaje entre iguales, a partir de la manipulación de estructuras,
    comparación, observación y transformación de enunciados, generalizaciones y contraste entre las distintas variedades del
    español y las lenguas del entorno del aula, prestando especial atención a las particularidades del español de Canarias.
    Se verificará que para ello el alumnado utiliza el metalenguaje específico básico y hace uso de diccionarios y otras fuentes
    de consulta en distintos formatos, con el fin de obtener información gramatical básica y resolver dudas sobre el uso correcto
    de la lengua oral y escrita en sus aspectos sintácticos, léxicos y pragmáticos. Por un lado, se comprobará que el alumnado
    reconoce las unidades básicas de la lengua, teniendo en cuenta los diferentes niveles: el sonido y sistema de escritura,
    la palabra (forma y significado), su organización en el discurso (orden de las palabras, componentes de las oraciones
    o conexión entre los significados). Por otro, el alumnado abordará la distinción entre la forma (categoría gramatical),
    la función de las palabras y el reconocimiento de los procedimientos léxicos (afijos) y sintácticos para el cambio de
    categoría, explicación y uso de los procedimientos de adquisición y formación de palabras, la reflexión sobre los cambios
    en su significado, las relaciones semánticas entre palabras y sus valores denotativos y connotativos en función del contexto
    y el propósito comunicativo, para aproximarse finalmente a la identificación de la relación entre los esquemas semántico
    y sintáctico, a partir de la observación y transformación de enunciados de cierta complejidad de acuerdo con estos esquemas.
    Finalmente, se comprobará que es capaz de aplicar estos conocimientos en un proceso de auto y coevaluación para hacer
    propuestas de mejora sobre sus propios textos con la finalidad de generar en el alumnado la reflexión, en un sentido funcional,
    sobre los mecanismos lingüísticos que regulan la comunicación.'
- nodo: bc:SLCL02BC10
  campo: scopeNote
  valor: Con este bloque competencial se comprobará que el alumnado es capaz de utilizar de forma progresivamente autónoma
    y en diferentes contextos, incluidos los virtuales, un lenguaje respetuoso y libre de usos discriminatorios, analizando
    los elementos lingüísticos y extralingüísticos que lo constituyen, favoreciendo de esta manera la comunicación positiva
    y constructiva en sus relaciones interpersonales. Para ello, se comprobará que comprende y respeta los puntos de vista
    de las demás personas en los intercambios comunicativos presentes en el ámbito educativo, por ejemplo en los trabajos
    grupales en los que el alumnado participa. Por último, el alumnado podrá demostrar en estas interacciones comunicativas
    que aplica de forma progresivamente autónoma estrategias comunicativas como la escucha activa, la comunicación asertiva,
    la cooperación conversacional, la cortesía lingüística y el valor del diálogo para la construcción de una convivencia
    positiva, la resolución pacífica de los conflictos, la búsqueda de consensos y el desarrollo de relaciones interpersonales
    basadas en la empatía y el respeto.
