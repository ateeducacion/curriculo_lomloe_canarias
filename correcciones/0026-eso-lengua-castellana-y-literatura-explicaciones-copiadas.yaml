    los derechos lingüísticos y su expresión en leyes y declaraciones institucionales, con atención a la Constitución Española
    y al Estatuto de Autonomía de Canarias, y que el conocimiento alcanzado evidencia respeto y sensibilidad hacia el patrimonio
    cultural y hacia la riqueza que implica la diversidad lingüística en la construcción de su identidad.
