    prestando especial atención a las particularidades del español de Canarias. Se verificará que para ello el alumnado utiliza
    el metalenguaje específico y hace uso de diccionarios y otras fuentes de consulta en distintos formatos, con el fin de
    obtener información gramatical y resolver dudas sobre el uso correcto de la lengua oral y escrita en sus aspectos sintácticos,
    léxicos y pragmáticos. Por un lado, se comprobará que el alumnado analiza las unidades básicas de la lengua, teniendo
    en cuenta los diferentes niveles: el sonido y sistema de escritura, la palabra (forma y significado), su organización
    en el discurso (orden de las palabras, componentes de las oraciones o conexión entre los significados). Por otro, el alumnado
    abordará el análisis en uso de la distinción entre la forma (categoría gramatical), la función de las palabras y la aplicación
