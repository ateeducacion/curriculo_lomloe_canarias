- nodo: bc:SLCL04BC9
  campo: scopeNote
  valor: 'A través de este bloque competencial se persigue constatar que el alumnado es capaz de reflexionar con actitud crítica
    sobre la estructura de la lengua y sus usos y sobre las elecciones lingüísticas y discursivas del emisor así como sus
    efectos en el receptor. Se debe llegar a la generalización y a la sistematización con distintos niveles de profundización,
    a través del apoyo del docente o del aprendizaje entre iguales, a partir de la formulación de hipótesis, manipulación
    de estructuras, comparación y transformación de enunciados, contraejemplos, generalizaciones y contraste entre las distintas
    variedades del español y otras lenguas, prestando especial atención a las particularidades del español de Canarias. Se
    verificará que para ello el alumnado utiliza el metalenguaje específico y hace un uso eficaz de diccionarios y otras fuentes
    de consulta en distintos formatos, con el fin de obtener información gramatical y resolver dudas sobre el uso correcto
    de la lengua oral y escrita en sus aspectos sintácticos, léxicos y pragmáticos. Por un lado, se comprobará que el alumnado
    analiza y explica las unidades básicas de la lengua, teniendo en cuenta los diferentes niveles: el sonido y sistema de
    escritura, la palabra (forma y significado), su organización en el discurso (orden de las palabras, componentes de las
    oraciones o conexión entre los significados). Por otro, el alumnado abordará la distinción entre la forma (categoría gramatical),
    la función de las palabras y la consolidación de los procedimientos léxicos (afijos) y sintácticos para el cambio de categoría,
    los procedimientos de adquisición y formación de palabras, la valoración sobre los cambios en su significado, las relaciones
    semánticas entre palabras y sus valores denotativos y connotativos en función del contexto y el propósito comunicativo,
    para reflexionar sobre la relación entre los esquemas semántico y sintáctico, a partir de la observación y transformación
    de enunciados de acuerdo con estos esquemas. Finalmente, se comprobará que es capaz de aplicar estos conocimientos en
    un proceso de auto y coevaluación para hacer propuestas de mejora sobre sus propios textos, basándose en la reflexión
    metalingüística en torno al proceso de aprendizaje con la finalidad de generar en el alumnado la reflexión, en un sentido
    funcional, sobre los mecanismos lingüísticos que regulan la comunicación.'
