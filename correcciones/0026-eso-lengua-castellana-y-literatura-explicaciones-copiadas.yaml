    evolución de las diferentes lenguas, así como los hechos culturales, históricos y normativos que han configurado la diversidad
    lingüística, dialectal y cultural, presente en la sociedad española, europea y del mundo hispanohablante, integrándola
    en su desarrollo personal como factor de diálogo y cohesión social. Para ello se partirá de la consideración del español
    como lengua universal y policéntrica, en la que ninguna variedad geográfica ha de considerarse más correcta que otra.
    En este sentido, se estudiará la variedad dialectal canaria, en sus rasgos fónicos, gramaticales y léxicos, comparándola
    de manera razonada con las características propias de otros dialectos del español, con el objetivo de fomentar que el
    alumnado se sienta legitimado lingüística y culturalmente al utilizar con seguridad su variedad dialectal en los diferentes
    actos de comunicación. Se valorará asimismo que entiende la amplitud de la diversidad de la lengua en uso, explicando
    y valorando los rasgos dialectales de aquellos que responden a variedades sociolectales o a registros lingüísticos, y
    explorando y cuestionando de manera argumentada prejuicios y estereotipos a partir del estudio y reflexión de los fenómenos
    del contacto entre lenguas (bilingüismo, préstamos, interferencias, diglosia lingüística y dialectal), particularmente
    la diglosia dialectal que afecta a los y las hablantes de las Islas. Por último, se verificará que alcanza y expresa conclusiones
    pertinentes y razonadas en la indagación en torno a los derechos lingüísticos y su expresión en leyes y declaraciones
    institucionales, con atención a la Constitución Española de 1978 y el Estatuto de Autonomía de Canarias, y que el conocimiento
    alcanzado evidencia el respeto y la sensibilidad hacia el patrimonio cultural y hacia la riqueza que implica la diversidad
    lingüística en la construcción de su identidad.
