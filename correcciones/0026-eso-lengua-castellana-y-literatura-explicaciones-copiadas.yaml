    fijando sus propios objetivos, localizando, seleccionando y contrastando la información procedente de diferentes fuentes
    con criterios de fiabilidad, calidad, validez, actualidad y pertinencia en función de los objetivos de lectura, siendo
    la biblioteca escolar el entorno ideal para la adquisición de estas habilidades, entendida como espacio creativo de aprendizaje
    y como centro de recursos, formación y coordinación. Se constatará también que integra y reelabora la información, respetando
    los derechos de autoría digital, adoptando un punto de vista creativo, crítico y adecuado al contexto de difusión, asumiendo
    de manera eficaz hábitos de uso de las tecnologías digitales críticos, seguros, sostenibles y saludables, valorando la
    gestión de los procesos de búsqueda, el rigor, la claridad y la coherencia en la expresión, y aplicando autoevaluaciones
    y técnicas metacognitivas de retroalimentación sobre su propio proceso de aprendizaje, de manera que garantice la gestión
    responsable de su identidad digital. Asimismo, en sus producciones orales y escritas se valorará que es capaz de reorganizar
    y sintetizar la información procedente de fuentes diversas en esquemas propios, de manera respetuosa con la propiedad
