    de acceso a la cultura literaria y la propia experiencia bibliográfica, estableciendo vínculos entre las obras leídas
    y la actualidad, así como con otros textos y manifestaciones artísticas y culturales, distinguiendo los lenguajes y elementos
    técnicos que las caracterizan y expresando con seguridad a lo largo del proceso juicios críticos en los que se valorará
    el respeto por las opiniones y experiencias ajenas.
