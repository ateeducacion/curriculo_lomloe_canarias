    valores denotativos y connotativos en función del contexto y el propósito comunicativo, para analizar la relación entre
    los esquemas semántico y sintáctico, a partir de la observación y transformación de enunciados de acuerdo con estos esquemas.
    Finalmente, se comprobará que es capaz de aplicar estos conocimientos en un proceso de auto y coevaluación para hacer
    propuestas de mejora sobre sus propios textos, basándose en la reflexión metalingüística en torno al proceso de aprendizaje
    con la finalidad de generar en el alumnado la reflexión, en un sentido funcional, sobre los mecanismos lingüísticos que
    regulan la comunicación.'
