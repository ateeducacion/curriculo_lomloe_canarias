    de retroalimentación: la planificación –determinación del propósito comunicativo y la persona destinataria, análisis de
    la situación comunicativa, lectura y análisis de modelos y redacción de borradores de escritura–, la textualización, la
    revisión y la edición del texto final mediante herramientas o plataformas virtuales, de manera respetuosa con la propiedad
    intelectual y con actitud crítica y creativa. Asimismo, se comprobará que aplica de manera pertinente procedimientos lingüísticos
    y de estilo, y que atiende a las convenciones propias del ámbito discursivo personal (mensajería electrónica, notas, diario…),
    social (redes sociales y medios de comunicación, textos publicitarios…), educativo (toma de apuntes, manuales escolares,
    esquemas, resúmenes…) y profesional (carta de motivación, currículum vitae), prestando especial atención a la corrección
    lingüística, la incorporación de un léxico adecuado, la revisión ortográfica y gramatical (uso de diccionarios, manuales
    de consulta y de correctores ortográficos en soporte analógico o digital), así como la valoración y aplicación eficaz
    de los recursos lingüísticos para adecuar el registro a la situación comunicativa. Igualmente se constatará que usa mecanismos
    de cohesión, conectores textuales y mecanismos de referencia interna gramaticales y léxicos; conocimiento, explicación
    y uso coherente de las formas verbales y reconocimiento y apropiación de la correlación temporal en la coordinación y
    subordinación de oraciones y en el discurso relatado. Todo ello movilizando y aplicando los aprendizajes adquiridos para
    interiorizar la comunicación escrita como un medio para favorecer, de manera reflexiva y eficaz, a través del lenguaje,
    una convivencia positiva que respete la diversidad, el compromiso con la igualdad de género, la cohesión social, el desarrollo
    sostenible y el logro de una ciudadanía mundial en sociedades cambiantes y diversas, así como para dar respuesta pertinente
    y creativa a demandas comunicativas concretas y favorecer un uso ético del lenguaje.'
