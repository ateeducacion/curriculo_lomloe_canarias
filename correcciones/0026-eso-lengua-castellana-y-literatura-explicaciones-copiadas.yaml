    gesticulación…); a los aspectos prosódicos (entonación, pausas, tono, timbre, volumen..); a la adecuación a la audiencia,
    al tiempo de exposición y a los rasgos discursivos y lingüísticos de la oralidad formal. De igual forma se verificará
    que incorpora de manera pertinente palabras propias del registro formal de la lengua y también que desarrolla procesos
    metacognitivos de retroalimentación y de gestión de la información, analizando necesidades y oportunidades y afrontando
    retos con sentido crítico. Asimismo, participa de manera activa e informada en interacciones comunicativas orales formales
    e informales (incluyendo las que se producen en entornos virtuales de aprendizaje), evitando un uso discriminatorio del
    lenguaje y garantizando aspectos como la cooperación conversacional y la cortesía lingüística (turno de palabra, respeto
    al espacio, gesticulación adecuada, escucha activa, uso de fórmulas de saludo y despedida…), la asertividad y la resolución
    dialogada de los conflictos para intercambiar información, regular la conducta y establecer vínculos personales.
- nodo: bc:SLCL04BC4
  campo: scopeNote
  valor: A través de este bloque competencial se persigue constatar que el alumnado comprende, interpreta y valora, de manera
    individual o colectiva, con actitud crítica y reflexiva, textos escritos y multimodales de los ámbitos personal (mensajería
    electrónica, notas, diario, carta…), social (artículos de opinión, noticias, textos publicitarios, redes sociales…), educativo
    (manuales escolares, mapas conceptuales, informes…) y profesional (currículum vitae y carta de motivación), atendiendo
    a la gradación y la complejidad de los textos (extensión, estructura, lenguaje, tema…) y a diferentes géneros textuales.
    Se comprobará que hace uso de estrategias y técnicas de lectura comprensiva, que van más allá de la decodificación del
    texto, aplicando métodos inductivos, deductivos y metacognitivos (formulación de hipótesis, búsqueda de contraejemplos,
    establecimiento de generalizaciones, o redacción de conclusiones propias), que deben desplegarse antes, durante y después
    del acto lector para permitirle analizar y reflexionar de manera razonada sobre el sentido global del texto, la estructura,
    la intención del emisor y la relación entre sus partes. Se verificará asimismo que distingue la información de la opinión
    o la persuasión y analiza de manera argumentada el significado de la imagen y elementos paratextuales de los textos icónico-verbales
    y multimodales, en consonancia con la sociedad de la información y del conocimiento del siglo XXI, buscando y seleccionando
    la información procedente de diferentes fuentes con criterios de validez, calidad, actualidad, fiabilidad y pertinencia,
    mostrando especial cuidado con los riesgos de desinformación y manipulación, analizándola, valorándola, reorganizándola
    y sintetizándola en oraciones que se relacionen lógica y semánticamente. Igualmente se comprobará que es capaz de interpretar
    y valorar de manera crítica la forma y el contenido, atendiendo al sentido global, a la relación entre sus partes y a
    la información más relevante, a los mecanismos de referencia interna (conectores y mecanismos gramaticales como las sustituciones
    pronominales y léxicas de referencia interna) y a los procedimientos lingüísticos para la expresión de la subjetividad;
    así como haciendo conexiones entre el texto y su contexto, analizando fuentes de procedencia verbal y no verbal, con el
    propósito de participar en diferentes situaciones comunicativas de manera activa e informada, como personas lectoras competentes,
    poniendo sus prácticas discursivas al servicio de la convivencia democrática y para construir conocimiento.
