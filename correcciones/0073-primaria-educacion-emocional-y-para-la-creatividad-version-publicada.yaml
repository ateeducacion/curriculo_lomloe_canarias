cambios:
- nodo: bc:PEUM01BC1
  campo: scopeNote
  valor: Por medio de este bloque competencial, se comprobará que el alumnado puede percibir y comprender sus propias emociones,
    para poder ajustarlas a diferentes contextos y situaciones cotidianas. En este sentido, se constatará que el alumnado
    es capaz de percibir las respuestas corporales a estas emociones y de asociarlas a sus propias experiencias emocionales.
    Se verificará, asimismo, que es capaz de expresar sensaciones, mediante el uso de lenguajes multimodales, y de adquirir
    vocabulario emocional, favoreciendo una comunicación al servicio de la convivencia positiva, a través del uso eficaz y
    ético del lenguaje. Se verificará, además, que se inicia en la utilización recursos para identificar los desencadenantes
    de determinadas emociones y anticipar las consecuencias, poniendo en práctica, como hábitos saludables para su bienestar
    físico y mental, la utilización de estrategias de autoconciencia emocional (respiración, relajación, conexión con el aquí
    y el ahora…), a través de experiencias vivenciadas en el aula, de actividades guiadas de autodescubrimiento, de la aplicación
    de herramientas y tecnologías asistenciales, de la práctica de juegos de movimiento y de percepción sensorial, desarrollando
    así sus capacidades afectivas con actitud abierta e inclusiva, como forma de alcanzar su bienestar emocional y propiciar
    el autoconocimiento personal.
- nodo: bc:PEUM01BC2
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de actuar con responsabilidad e iniciarse
    en la regulación de las propias emociones, en particular, de aquellas que se manifiesten de forma desajustada y que provoquen
    malestar, adecuando su intensidad y duración, a través de la puesta en práctica de diferentes recursos tales como técnicas
    de respiración y relajación, estrategias corporales (movimiento, biodanza…), atención plena, técnicas artístico-expresivas
    (dramatizaciones, expresión corporal, canto...), en contextos escolares. Además, se constatará si el alumnado actúa con
    responsabilidad emocional, ofreciendo disculpas y llevando a cabo rectificaciones en beneficio de las personas afectadas.
    Todo ello con la finalidad de crear una identidad afectiva satisfactoria y contribuir a la mejora de las relaciones interpersonales,
    asumiendo la responsabilidad en lo que se refiere a la gestión de las propias emociones y favoreciendo una convivencia
    democrática positiva con el resto de personas de su entorno próximo.
- nodo: bc:PEUM01BC3
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue constatar que el alumnado es capaz de vincularse emocionalmente
    con las demás personas, expresando lo que siente de manera clara y adecuada. Se comprobará que el alumnado puede identificar
    y comprender las señales corporales y emocionales en las otras personas, escuchando de manera afectiva (sin interrumpir,
    mirando a los ojos, utilizando algunas expresiones que ayuden a seguir la conversación…), para desarrollar una relación
    interpersonal que favorezca el respeto a la convivencia y los comportamientos solidarios. Para ello, se valorará si el
    alumnado es capaz de identificar y expresar las propias emociones, necesidades y vivencias a las demás personas, tanto
    de forma verbal como a través de otros lenguajes expresivos (dibujos, gestos, movimientos, música…) y favoreciendo la
    comunicación digital. Se pretende comprobar que participa en interacciones comunicativas con actitud respetuosa, tanto
    para intercambiar información como para construir vínculos personales. Para ello, se propiciarán ambientes, actividades,
    dinámicas… que permitan que el alumnado pueda comunicarse, de manera afectiva, sobre las normas de convivencia, la resolución
    dialogada y justa de los conflictos…; todo ello de forma consciente, respetuosa, constructiva, dialogante e inclusiva
    para propiciar el vínculo emocional y el desarrollo de unas relaciones interpersonales auténticas.
- nodo: bc:PEUM01BC4
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue constatar que el alumnado se inicia en la apertura y sensibilidad
    al mundo que lo rodea, así como en el compromiso emocional con las personas y la sociedad, aceptando y asumiendo compromisos
    afectivos con las demás personas y con la sociedad. Para ello, se comprobará que puede identificar y experimentar, de
    manera guiada, proyectos emprendedores, novedosos, genuinos y éticos, en el centro educativo y en otros contextos; y si
    participa en iniciativas sociales, altruistas y sostenibles, o en acciones fundamentadas científicamente, que beneficien
    a toda la comunidad o que repercutan positivamente en el bienestar personal y social desde las diferentes vertientes de
    la emprendeduría (profesional, científica, social, artística, emocional y vital), para preservar la salud, el medioambiente…,
    aplicando sostenibilidad. Se verificará que se inicia en el conocimiento de procesos de pensamiento generadores de propuestas
    originales y alternativas, así como de técnicas y destrezas creativas (lluvia de ideas, analogías, ideart, rutinas y destrezas
    de pensamientos…) y recursos de múltiples lenguajes (audio, vídeo, impresión, digital, tecnología, o herramientas asistenciales…)
    para trazar y llevar a término dichos proyectos e iniciativas, de manera que exprese su creatividad en todas sus dimensiones
    y actitudes innovadoras, iniciándose con ello en la autoconfianza en las propias capacidades creativas. Se valorará que
    muestran interés por las experiencias e ideas comunes y receptividad frente a lo diferente, lo nuevo o lo alternativo,
    para generar y comunicar historias, darle nuevo uso a objetos, realizar composiciones plásticas, danzas, proyectos innovadores
    u otras formas de representación y expresión… que sirvan para romper estereotipos.También se comprobará si el alumnado
    es capaz de colaborar en favor de otras personas para alcanzar un objetivo común; o de vincularse emocionalmente manifestando
    actitudes abiertas e innovadoras. Todo ello con la finalidad de promover la autoafirmación y autoconfianza creativa en
    las propias capacidades, comprometiéndose emocionalmente con otras personas y la sociedad a través de la puesta en marcha
    de proyectos emprendedores e innovadores que aporten beneficios para la comunidad.
