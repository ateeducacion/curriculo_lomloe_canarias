- nodo: bc:PEUM03BC1
  campo: scopeNote
  valor: Por medio de este bloque competencial, se comprobará que el alumnado puede identificar, comprender y analizar sus
    propias emociones, para poder ajustarlas a diferentes contextos y situaciones cotidianas, identificando sus fortalezas
    y debilidades. En este sentido, se constatará que el alumnado es capaz de percibir y reconocer las respuestas corporales
    a estas emociones y de asociarlas a sus propias experiencias emocionales. Se verificará, asimismo, que es capaz de expresar
    sensaciones y emociones, mediante el uso de lenguajes multimodales, y de adquirir vocabulario emocional, utilizando fuentes
    diversas para ampliar su propios conocimientos sobre las emociones y favoreciendo una comunicación al servicio de la convivencia
    positiva, a través del uso eficaz y ético del lenguaje. Se verificará, asimismo, que experimenta con recursos para identificar
    los desencadenantes de determinadas emociones y anticipar las consecuencias, poniendo en práctica, como hábitos saludables
    para su bienestar físico y mental, la utilización de estrategias de autoconciencia emocional (respiración, relajación,
    conexión con el aquí y el ahora…), a través de experiencias vivenciadas en el aula, de actividades guiadas de autodescubrimiento,
    de la aplicación de herramientas y tecnologías asistenciales, y de la práctica de juegos de movimiento y de percepción
    sensorial, desarrollando así sus capacidades afectivas con actitud abierta e inclusiva, como forma de alcanzar su bienestar
    emocional y propiciar el autoconocimiento personal.
- nodo: bc:PEUM03BC2
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de asumir la responsabilidad de aprender
    a regular las propias emociones, en particular aquellas que se manifiesten de forma desajustada y que provoquen malestar,
    adecuando su intensidad y duración, a través de la puesta en práctica de diferentes recursos tales como técnicas de respiración
    y relajación, estrategias corporales (movimiento, biodanza…), atención plena, técnicas artístico-expresivas (dramatizaciones,
    expresión corporal, canto...), en contextos tanto escolares como de la vida cotidiana, cuando se presentan situaciones
    de tensión o conflicto. Además, se constatará si el alumnado asume su responsabilidad emocional ante las demandas de compensación
    o satisfacción de perjuicios a otras personas por conductas emocionales inadecuadas, mostrando asertividad, ofreciendo
    disculpas y llevando a cabo rectificaciones en beneficio de las personas afectadas, y evitando la humillación, la valoración
    negativa y el castigo a sí mismo o a sí misma. Todo ello con la finalidad de crear una identidad afectiva satisfactoria
    y contribuir a la mejora de las relaciones interpersonales, asumiendo la responsabilidad en lo que se refiere a la gestión
    de las propias emociones y favoreciendo una convivencia democrática positiva con el resto de personas de su entorno próximo.
- nodo: bc:PEUM03BC3
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue constatar que el alumnado es capaz de vincularse emocionalmente
    con las demás personas, expresando lo que siente de manera clara, adecuada y asertiva. Se comprobará que el alumnado puede,
    además de identificar, comprender, interpretar, de manera empática, las señales corporales y emocionales en las otras
    personas, para desarrollar una relación interpersonal que favorezca el respeto a la convivencia, escuchando de manera
    activa (sin interrumpir, mirando a los ojos, utilizando algunas expresiones que ayuden a seguir la conversación…) y conectando
    con los sentimientos de las demás personas. Del mismo modo, se busca verificar si observa y valora sus emociones y las
    de las otras personas, escuchándolas y conectando con sus sentimientos, con el fin de promover comportamientos solidarios
    y altruistas. Para ello, se valorará si el alumnado es capaz de identificar y expresar las propias emociones, necesidades
    y vivencias a las demás personas, tanto de forma verbal como a través de otros lenguajes expresivos (dibujos, gestos,
    movimientos, música…). Además, se pretende comprobar que participa en interacciones comunicativas con actitud cooperativa
    y respetuosa, tanto para intercambiar información como para construir vínculos personales. Asimismo, se iniciará en el
    desarrollo del pensamiento en perspectiva y la comprensión de las emociones que experimentan otras personas, manifestando
    una tendencia a apreciar y conmoverse ante dichos estados emocionales agradables y desagradables, sin que lleve consigo
    sufrimiento personal (estrés empático). Para ello, se propiciarán ambientes, actividades, dinámicas…, que permitan que
    el alumnado pueda comunicarse de manera afectiva, reflexionar sobre las normas de convivencia, la resolución dialogada
    y justa de los conflictos, los valores y problemas éticos de actualidad…; todo ello, de forma consciente, respetuosa,
    constructiva, dialogante e inclusiva para propiciar el vínculo emocional y el desarrollo de unas relaciones interpersonales
    auténticas.
- nodo: bc:PEUM03BC4
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue constatar que el alumnado muestra apertura y sensibilidad al mundo
    que lo rodea, así como en el compromiso emocional con las personas y la sociedad, aceptando la incertidumbre y lo nuevo
    como una oportunidad de mejora a nivel personal y comunitario, y asumiendo compromisos afectivos con las demás personas
    y con la sociedad. Para ello, se comprobará que puede experimentar y desarrollar, de manera guiada, proyectos emprendedores,
    novedosos, genuinos y éticos, en el centro educativo y en otros contextos; y sí participa en iniciativas sociales, altruistas
    y sostenibles, o en acciones fundamentadas científicamente, que beneficien a toda la comunidad o que repercutan positivamente
    en el bienestar personal y social desde las diferentes vertientes de la emprendeduría (profesional, científica, social,
    artística, emocional y vital), para preservar la salud, el medioambiente, la sostenibilidad y la seguridad. Se comprobará
    que conoce y ejecuta procesos de pensamiento generadores de propuestas originales y alternativas, así como técnicas y
    destrezas creativas (lluvia de ideas, analogías, ideart, rutinas y destrezas de pensamientos…) y recursos de múltiples
    lenguajes (audio, vídeo, impresión, digital, tecnología, o herramientas asistenciales…), para trazar y llevar a término
    dichos proyectos e iniciativas, de manera que exprese y desarrolle su creatividad en todas sus dimensiones y sus actitudes
    innovadoras, adquiriendo con ello la autoconfianza en las propias capacidades creativas. Se valorará que muestran interés
    por las experiencias e ideas comunes, y la receptividad frente a lo diferente, lo nuevo o lo alternativo, para generar
    y comunicar historias, dar un nuevo uso a los objetos, realizar composiciones plásticas, danzas, proyectos innovadores
    u otras formas de representación y expresión…, que rompan estereotipos y se inicien en la actitud crítica. También se
    comprobará si el alumnado es capaz de movilizarse en favor de otras personas para alcanzar un objetivo común, o de vincularse
    emocionalmente manifestando actitudes abiertas e innovadoras. Todo ello con la finalidad de promover la autoafirmación
    y autoconfianza creativa en las propias capacidades, comprometiéndose emocionalmente con otras personas y la sociedad,
    a través de la puesta en marcha de proyectos emprendedores e innovadores que aporten beneficios para la comunidad.
