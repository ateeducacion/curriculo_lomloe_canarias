cambios:
- nodo: ce:BEFIC3
  campo: definition
  valor: Difundir y promover nuevas prácticas motrices, compartiendo espacios de actividad físico-deportiva con independencia
    de las diferencias culturales, sociales, de género y de habilidad, priorizando el respeto hacia los participantes y a
    las reglas sobre los resultados, adoptando una actitud crítica y proactiva ante comportamientos antideportivos o contrarios
    a la convivencia y desarrollando procesos de autorregulación emocional que canalicen el fracaso y el éxito en estas situaciones,
    para contribuir autónomamente al entendimiento social y al compromiso ético en los diferentes espacios en los que se participa,
    fomentando la detección precoz y el conocimiento de las estrategias para abordar cualquier forma de discriminación o violencia.
