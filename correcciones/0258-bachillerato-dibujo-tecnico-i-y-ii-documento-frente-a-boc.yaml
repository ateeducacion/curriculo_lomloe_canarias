    resolver gráficamente operaciones matemáticas y construcciones básicas de geometría plana.
- nodo: crit:BDBT01CE4.1
  campo: definition
  valor: Documentar gráficamente objetos sencillos mediante sus vistas acotadas, aplicando la normativa UNE e ISO en la utilización
    de sintaxis, escalas y formatos, valorando la importancia de usar un lenguaje técnico común, con la ayuda de formatos
    digitales, distribuyendo en grupo las tareas y fortaleciendo el optimismo, a fin de reflexionar sobre el proceso realizado
    para documentar gráficamente proyectos arquitectónicos e ingenieriles.
