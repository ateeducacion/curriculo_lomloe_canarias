  valor: Utilizar razonamientos inductivos, deductivos y lógicos en problemas de índole gráfico-matemáticos, aplicando fundamentos
    de la geometría plana para resolver gráficamente operaciones matemáticas, relaciones, construcciones y transformaciones.
- nodo: crit:BDBT01CE2.3
  campo: definition
  valor: Trazar gráficamente tangencias y curvas, aplicando sus propiedades con rigor en su ejecución, utilizando métodos
