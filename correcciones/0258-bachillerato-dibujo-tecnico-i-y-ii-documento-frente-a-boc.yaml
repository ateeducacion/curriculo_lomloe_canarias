id: 0258
titulo: 'Dibujo Técnico I y II (Bachillerato): 4 diferencias con el BOC resueltas con el documento oficial'
motivo: 'El corpus tenía el texto publicado en el BOC y el ODT oficial dice otra cosa (texto, puntuación, lista de descriptores
  o saber omitido). Validado el 05-11-2026 en la página de validación BOC/ODT: prevalece el ODT, de acuerdo con el criterio
  de que el corpus refleja el documento oficial. Ver docs/pendientes.md, «Diferencias con el BOC».'
