id: '0244'
titulo: 'Segunda Lengua Extranjera (Educación Primaria): 20 textos con la puntuación del documento oficial'
motivo: 'Textos que solo difieren en la puntuación y que el BOC no permite decidir (el texto extraído del PDF no conserva
  la puntuación de forma fiable). Criterio aprobado: el ODT oficial es la referencia y el corpus debe reflejarlo.'
fuente:
  documento: primaria-segunda-lengua-extranjera
  fichero: fuentes/documentos/primaria/anexo_2_curriculo_segunda_lengua_extranjera.odt
  sha256: 1d8e735a9b084ddd8a8baa522a2a53d7049bd400056b26bcbc1383700c91d875
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: crit:PSGA05CE1.1
  campo: definition
  valor: Reconocer y analizar el sentido global, así como palabras y frases breves y sencillas, de textos orales, escritos
    y multimodales, sobre temas frecuentes y cotidianos de relevancia personal y ámbitos próximos a su experiencia, expresados
    de forma comprensible y clara, a través de distintos soportes, para contribuir al repertorio lingüístico individual y
    responder a propósitos de comunicación cotidianas.
- nodo: crit:PSGA05CE2.2
  campo: definition
  valor: Seleccionar, planificar y aplicar, de forma progresivamente autónoma, conocimientos y estrategias adecuadas con ayuda
    de recursos analógicos y digitales, para preparar y producir textos creativos adecuados a las intenciones comunicativas
    cotidianas que contribuyan al pleno desarrollo personal, creativo y emocional.
- nodo: crit:PSGA05CE4.2
  campo: definition
  valor: Seleccionar e implementar, de forma progresivamente autónoma, estrategias básicas en situaciones colaborativas y
    cooperativas, apoyándose en el lenguaje no verbal, herramientas digitales y plataformas virtuales con el fin de ayudar
    a las demás personas y facilitar la comprensión, la producción de información y la comunicación.
- nodo: sb:PSGA05SBIII.4
  campo: definition
  valor: Identificación de aspectos socioculturales y sociolingüísticos básicos, relativos a las costumbres, la vida cotidiana
    y las relaciones interpersonales, las convenciones sociales básicas de uso común, el lenguaje no verbal, la cortesía lingüística
    y la etiqueta digital propias de países donde se habla la segunda lengua extranjera.
- nodo: sb:PSGA05SBIV
  campo: definition
  valor: Dimensiones interpersonal e intrapersonal
