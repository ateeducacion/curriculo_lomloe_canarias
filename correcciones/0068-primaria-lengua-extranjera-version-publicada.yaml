cambios:
- nodo: bc:PLNT01BC1
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de identificar e interpretar palabras
    y expresiones, así como de seleccionar y aplicar estrategias y métodos, de forma guiada, que le permitan entender el sentido
    general y la información específica expresada de manera directa y clara en textos breves y muy sencillos en formato oral,
    escrito y multimodal sobre temas cotidianos que respondan a necesidades comunicativas relacionadas con su entorno más
    cercano, y participando en procesos de auto y coevaluación. Asimismo, se constatará que el alumnado hace uso de diferentes
    recursos y apoyos tanto en soportes digitales como analógicos, como la interpretación de formas de representación elementales
    (escritura, imagen), el uso del lenguaje verbal y no verbal, la repetición, la búsqueda de información guiada y la información
    contextual (elementos extralingüísticos) y cotextual (elementos lingüísticos), que faciliten la recepción de la información,
    haciendo uso de métodos inductivos y deductivos cuando sea necesario, y contribuyendo, de esta manera, a la detección
    de las carencias comunicativas y al enriquecimiento de sus conocimientos, destrezas y actitudes. Los procesos de comprensión
    requieren contextos dialógicos que favorezcan la construcción de un saber conjunto, y que contribuyan a un aprendizaje
    autónomo y a tener una visión más creativa y emocional del aprendizaje.
- nodo: bc:PLNT01BC2
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz, por un lado, de producir, de forma
    guiada, palabras y frases breves, tanto orales, escritas y multimodales en todas sus dimensiones y formas; y por otro
    lado, de seleccionar y aplicar estrategias elementales que le permitan producir mensajes sencillos y creativos, con actitud
    cooperativa y respetuosa. En este sentido, se verificará que está en disposición de producir mensajes y descripciones
    breves y accesibles. Para ello, el alumnado podrá hacer uso de diferentes soportes analógicos y digitales, realizando
    búsquedas muy guiadas. A su vez, se pretende que desarrolle la empatía y tenga una visión más creativa y emocional del
    aprendizaje.
- nodo: bc:PLNT01BC3
  campo: scopeNote
  valor: 'Con este bloque competencial se comprobará que el alumnado es capaz de participar en interacciones muy breves y
    sencillas, así como de seleccionar y utilizar, de forma guiada, estrategias elementales que le permitan participar en
    una conversación. En este sentido, se valorará que el alumnado responda a propósitos comunicativos concretos, para los
    que se deben trabajar funciones comunicativas adecuadas al ámbito y al contexto personal como: saludar, despedirse, presentarse,
    formular y contestar preguntas, participar en pequeños diálogos y asambleas, o adquirir léxico básico y de interés. A
    su vez, se pretende averiguar si es capaz también de hacer uso de los elementos verbales y no verbales de la comunicación,
    tanto orales como escritos y multimodales, en contextos analógicos y digitales, restringidos y supervisados de manera
    segura, con una actitud abierta y responsable ante su uso. Los intercambios de información serán muy breves y sencillos,
    predecibles, de relevancia personal y funcional, que permitan el desarrollo de las funciones interpersonales y cooperativas
    como ceder y respetar el turno de palabra, y colaborar. De esta manera, se prepara al alumnado para el ejercicio de una
    ciudadanía responsable y respetuosa hacia hablantes o estudiantes de la lengua extranjera.'
- nodo: bc:PLNT01BC4
  campo: scopeNote
  valor: Con este bloque competencial se comprobará si el alumnado es capaz de interpretar y explicar textos breves y sencillos,
    orales, escritos y multimodales, conceptos o emociones, haciendo uso de conocimientos, destrezas y actitudes elementales
    que permitan introducirse en actividades de mediación, y entendiendo esta como una actividad del lenguaje que permita
    al alumnado explicar y facilitar la comprensión de mensajes o textos, en situaciones concretas de su entorno inmediato
    como explicar una imagen para apoyar la comprensión de frases y palabras. Además, se persigue constatar que el alumnado
    selecciona y aplica métodos y estrategias elementales, que faciliten la comprensión, la producción, la interacción y la
    comunicación, en situaciones colaborativas y cooperativas, con el fin de desarrollar el pensamiento estratégico y mejorar
    su repertorio lingüístico.
- nodo: bc:PLNT01BC5
  campo: scopeNote
  valor: Con este bloque competencial se persigue que el alumnado haga uso de su repertorio lingüístico individual y establezca
    relaciones entre las distintas lenguas. Además, se promoverá que identifique, compare y utilice aspectos elementales de
    la lengua extranjera, su funcionamiento y funcionalidad, y que adquiera y utilice estrategias elementales para detectar
    y utilizar unidades lingüísticas; léxico, morfosintaxis o patrones sonoros. Asimismo, se trata de que sea capaz de transferir
    los conocimientos, las destrezas y las estrategias adquiridas en su realidad más cercana, desarrollando así el pensamiento
    divergente, reflexivo y más profundo del aprendizaje. Los distintos tipos de evaluación evidenciarán el progreso, y la
    autonomía y autoestima del alumnado, junto con la iniciación de instrumentos como los derivados del PEL o los diarios
    de aprendizaje, ya sea en formato analógico o digital. Se destaca, de esta manera, la importancia de la toma de conciencia
    de los conocimientos y las estrategias elementales que está adquiriendo, analizando las fortalezas y carencias propias
    en el terreno lingüístico y comunicativo.
- nodo: bc:PLNT01BC6
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue promover que el alumnado sea capaz de mostrar interés por la diversidad
    y el patrimonio lingüístico, cultural y artístico de personas y países donde se habla la lengua extranjera y de las islas
    Canarias, mostrando respeto y cuidado por conservación del entorno. Así mismo, se pretende que sea capaz de seleccionar
    y aplicar estrategias elementales y de iniciación de usos discriminatorios del lenguaje verbal y no verbal, para comprender
    y respetar los aspectos socioculturales y sociolingüísticos. A su vez, se fomentará que sea capaz de mostrar empatía y
    comprensión por las producciones de las demás personas, diferenciando y reconociendo las intervenciones y manifestando
    conductas contrarias a la violencia, los prejuicios de cualquier tipo y los estereotipos sexistas. También se persigue
    que el alumnado desarrolle la autonomía y la visión creativa y emocional del aprendizaje. Se contribuye así a la adquisición
    de la competencia específica, ya que se comprobará si el alumnado establece vínculos entre la propia lengua y otras lenguas
    y culturas, en contextos comunicativos cotidianos y habituales.
