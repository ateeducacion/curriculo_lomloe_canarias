    autónoma, que le permitan entender el sentido general y la información específica y predecible de textos orales, escritos
    y multimodales sobre temas cotidianos que respondan a necesidades comunicativas relacionadas con su entorno más cercano,
    participando en procesos de auto y coevaluación. Asimismo, se constatará que el alumnado hace uso de diferentes recursos
    y apoyos tanto en soportes digitales como analógicos, como la interpretación de formas de representación (escritura, imagen,
    gráficos), el uso del lenguaje verbal y no verbal, la repetición y relectura, la búsqueda de información y la información
    contextual (elementos extralingüísticos) y cotextual (elementos lingüísticos), que faciliten la recepción, el proceso
    y la reflexión de la información, haciendo uso de métodos inductivos y deductivos cuando sea necesario, de forma que se
    contribuya a la compensación de las carencias comunicativas y al enriquecimiento de sus conocimientos, destrezas y actitudes.
    Los procesos de comprensión requieren contextos dialógicos, que favorezcan la construcción de un saber conjunto que contribuyan
    a un aprendizaje autónomo y a tener una visión más creativa y emocional del aprendizaje.
