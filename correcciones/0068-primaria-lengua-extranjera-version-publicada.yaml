- nodo: crit:PLNT01CE1.1
  campo: definition
  valor: Identificar e interpretar palabras y expresiones habituales en textos orales, escritos y multimodales breves y muy
    sencillos, sobre temas frecuentes y cotidianos de relevancia personal y ámbitos próximos a su experiencia, y en textos
    literarios adaptados al nivel de desarrollo del alumnado, expresados de forma directa, comprensible y clara, a través
    de distintos soportes, para contribuir al repertorio lingüístico individual y responder a propósitos de comunicación cotidianas.
- nodo: crit:PLNT01CE1.2
  campo: definition
  valor: Seleccionar y aplicar, de forma guiada, estrategias elementales en situaciones comunicativas cotidianas y de relevancia
    para el alumnado, para captar el sentido global e identificar información explícita en textos diversos, tanto analógicos
    como digitales.
- nodo: crit:PLNT01CE2.1
  campo: definition
  valor: Producir, de forma guiada, palabras y frases breves y sencillas en textos orales, escritos y multimodales, partiendo
    de modelos y usando soportes analógicos y digitales, para realizar intervenciones sencillas en situaciones de comunicación
    de relevancia personal y próximas a la experiencia del alumnado.
- nodo: crit:PLNT01CE2.2
  campo: definition
  valor: Seleccionar y aplicar, de forma guiada, conocimientos y estrategias elementales con ayuda de apoyos y recursos analógicos
    y digitales, para producir mensajes breves, sencillos y creativos adecuados a las intenciones comunicativas en contextos
    cotidianos que contribuyan al pleno desarrollo personal, creativo y emocional.
- nodo: crit:PLNT01CE3.2
