    analógicos y digitales, restringidos y supervisados de manera segura, con una actitud abierta y responsable ante su uso.
    Los intercambios de información serán breves y sencillos de temas cotidianos, predecibles, de relevancia personal y funcional,
    que permitan el desarrollo de las funciones interpersonales y cooperativas como ceder y respetar el turno de palabra,
    pedir y dar aclaraciones, y colaborar. De esta manera, se inicia al alumnado para el ejercicio de una ciudadanía democrática,
    responsable y respetuosa hacia hablantes o estudiantes de la lengua extranjera.'
- nodo: bc:PLNT04BC4
  campo: scopeNote
  valor: Con este bloque competencial se comprobará si el alumnado es capaz de facilitar y explicar textos breves, orales,
    escritos y multimodales, conceptos o emociones, haciendo uso de conocimientos, destrezas y actitudes básicas que permitan
    iniciarse en actividades de mediación, y entendiendo esta como una actividad del lenguaje que permita al alumnado explicar
    y facilitar la comprensión de mensajes o textos, en situaciones cotidianas próximas a su entorno, como explicar una infografía,
    dar indicaciones para orientarse en un mapa o para apoyar y facilitar la comprensión de textos breves. Además, se persigue
    constatar que el alumnado selecciona e implementa métodos y estrategias básicas, que faciliten la comprensión, la producción,
    la interacción y la comunicación, en situaciones colaborativas y cooperativas, con el fin de desarrollar el pensamiento
    estratégico y mejorar su repertorio lingüístico.
- nodo: bc:PLNT04BC5
  campo: scopeNote
  valor: Con este bloque competencial se persigue que el alumnado haga uso de su repertorio lingüístico individual y establezca
    relaciones entre las distintas lenguas. Se promoverá que experimente sobre aspectos básicos de la lengua extranjera, su
    funcionamiento y funcionalidad, y que adquiera y aplique estrategias básicas de compensación de las carencias comunicativas
    para responder a una necesidad concreta, usando unidades lingüísticas; léxico, morfosintaxis o patrones sonoros. Asimismo,
    se trata de que sea capaz de transferir los conocimientos, las destrezas y las estrategias adquiridas a su entorno más
    próximo, desarrollando así el pensamiento divergente, reflexivo y más profundo del aprendizaje. Los distintos tipos de
    evaluación evidenciarán el progreso, y la autonomía y autoestima del alumnado, junto con la introducción de instrumentos
    como los derivados del PEL o los diarios de aprendizaje, ya sea en formato analógico o digital. Se destaca, de esta manera,
    la importancia de la toma de conciencia de los conocimientos y las estrategias básicas de las que dispone, analizando
    las fortalezas y carencias propias en el terreno lingüístico y comunicativo.
- nodo: bc:PLNT04BC6
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue promover que el alumnado sea capaz de respetar la diversidad y
    el patrimonio lingüístico, cultural y artístico de personas y países donde se habla la lengua extranjera y de las islas
    Canarias, mostrando respeto y cuidado por la conservación del entorno. Así mismo, se pretende que sea capaz de seleccionar
    y aplicar estrategias básicas y adecuadas y de detección de uso común discriminatorio del lenguaje verbal y no verbal,
    para comprender y respetar los aspectos socioculturales y sociolingüísticos. A su vez, se fomentará que sea capaz de mostrar
    empatía y comprensión por las producciones de las demás personas, valorando las intervenciones y manifestando conductas
    contrarias a la violencia, los prejuicios de cualquier tipo y los estereotipos sexistas. También se persigue que el alumnado
    desarrolle la autonomía y una visión creativa y emocional del aprendizaje. Se contribuye así a la adquisición de la competencia
    específica, ya que se comprobará si el alumnado establece vínculos entre la propia lengua y otras lenguas y culturas,
    en situaciones comunicativas guiadas.
- nodo: bc:PLNT05BC1
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de reconocer, interpretar y analizar
