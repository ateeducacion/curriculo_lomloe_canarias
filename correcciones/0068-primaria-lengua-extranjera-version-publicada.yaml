id: 0068
titulo: 'Lengua Extranjera (Educación Primaria): 140 textos de la versión publicada en el BOC'
motivo: El texto de la exportación no coincide con el publicado en el BOC y el del documento oficial sí (comprobado contra
  fuentes/boletines). Se toma el del documento. Generada con `contrastar --proponer`.
