cambios:
- nodo: bc:SMBS03BC1
  campo: scopeNote
  valor: 'A través de este bloque competencial se comprobará que el alumnado es capaz de comprender e interpretar, individualmente
    o en grupo, textos escritos, orales o multimodales de los ámbitos personal (conversaciones, anuncios, cartas, mensajería
    electrónica, canciones…), social (noticias o entrevistas, en formato periodístico o radiofónicos, textos y cuñas publicitarias,
    tutoriales, debates…) y educativo (manuales escolares, mapas conceptuales, informes, presentaciones, charlas TED, coloquios…)
    e incluso signados (expresiones y vocabulario de uso cotidiano en lengua de signos y alfabeto dactilológico). Se constatará
    que hace uso de estrategias y técnicas de comprensión y descodificación, que distingue la información de la opinión o
    la persuasión, y que es capaz de valorar la forma y el contenido, atendiendo al sentido global, a la relación entre sus
    partes y a la información más relevante, haciendo conexiones entre el texto y su contexto, y diferenciando el lenguaje
    verbal del no verbal. Se verificará, además, si el alumnado es capaz de producir textos escritos y multimodales con coherencia,
    cohesión, fluidez y adecuación, desarrollando procesos metacognitivos: la planificación, la textualización, la revisión
    y la edición del texto final mediante herramientas o plataformas virtuales, de manera respetuosa con la propiedad intelectual
    y con actitud crítica. Asimismo, se confirmará si es capaz de conversar en diálogos pedagógicamente orientados, estructurar
    el discurso y adecuar el registro y el comportamiento no verbal en producciones orales y multimodales, monologadas o dialogadas,
    respetando las características de la variedad dialectal del hablante, sobre temas de interés personal (la conversación,
    la discrepancia o la orden), social (reseñas radiofónicas, entrevistas, pódcast, noticias, debates, tertulias, cuñas publicitarias…)
    y educativo (la exposición oral y el debate). Se valorará si es capaz de adecuarse al grado de formalidad y a la audiencia,
    a los propósitos comunicativos, si dedica atención a los aspectos prosódicos (entonación, pausas, tono, timbre, volumen..)
    y si se ajusta al tiempo de exposición, evitando un uso discriminatorio del lenguaje y aplicando la cooperación conversacional,
    la cortesía lingüística (turno de palabra, escucha activa, uso de fórmulas de saludo y despedida…) y la asertividad para
    intercambiar opiniones. Por último, se perseguirá que el alumnado sea capaz de reflexionar sobre los usos de la lengua,
    de modo que en sus producciones orales y escritas preste atención a la corrección lingüística, incorpore un léxico adecuado
    y revise ortográfica y gramaticalmente sus creaciones (mediante diccionarios, manuales de consulta y correctores ortográficos),
    empleando mecanismos de cohesión, conectores textuales y usando adecuadamente las formas verbales. El objetivo último
    es que el alumnado entienda la lengua como una herramienta fundamental para su desarrollo integral y comprenda que su
    mejora contribuirá a facilitar el aprendizaje del resto de materias y saberes.'
- nodo: bc:SMBS03BC6
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de analizar de forma crítica planteamientos
    geográficos que expliquen la construcción de los sistemas democráticos y los principios constitucionales que rigen la
    vida de la comunidad, y utiliza la lengua como herramienta para la comunicación positiva. Se constatará que valora la
    ley como contrato social para la resolución dialogada de los conflictos y la igualdad de derechos de todas las personas,
    utilizando un lenguaje no discriminatorio y desterrando los abusos de poder a través de la palabra. Se comprobará que
    reconoce la importancia de la Constitución española de 1978, reconoce los diferentes ordenamientos normativos así como
    el conocimiento del Estatuto de Autonomía de Canarias y la evolución de las instituciones de Canarias. Por último, se
    verificará que utiliza la lengua como herramienta para la comunicación positiva (mediante exposiciones, debates, lectura
    de conclusiones de trabajos colaborativos), asumiendo los derechos y deberes propios de nuestro marco de convivencia,
    para promover la participación ciudadana y la cohesión social.
- nodo: bc:SMBS04BC6
  campo: scopeNote
  valor: 'A través de este bloque competencial se comprobará que el alumnado es capaz de analizar de forma crítica planteamientos
    históricos que expliquen la construcción de los sistemas democráticos y los principios constitucionales que rigen la vida
    de la comunidad tales como: la transformación política de los seres humanos, revoluciones y resistencias. La conquista
    de los derechos individuales y colectivos en la época contemporánea, el origen, la evolución y la adaptación de los sistemas
    liberales en España y en el mundo, la construcción de la democracia y los orígenes del totalitarismo, la acción de los
    movimientos sociales en el mundo contemporáneo, la memoria democrática, la igualdad real entre mujeres y hombres y la
    reflexión crítica de la Declaración Universal de los Derechos Humanos. Se constatará que es capaz de valorar y ejercitar
    responsabilidades, derechos y deberes en pro de la resolución dialogada de los conflictos y la igualdad de derechos de
    todas las personas, utilizando un lenguaje no discriminatorio y desterrando los abusos de poder a través de la palabra.
    También se examinará que es capaz de poner en práctica actuaciones en favor de su desarrollo y afirmación a través del
    conocimiento de nuestro ordenamiento jurídico y constitucional y el conocimiento de la memoria democrática. Por último,
    se verificará que es capaz de reconocer movimientos y causas que generen una conciencia solidaria, y de analizar y reconocer
    los compromisos internacionales de nuestro país en favor de la paz, la seguridad, la cooperación, la sostenibilidad, los
    valores democráticos y los Objetivos de Desarrollo Sostenible, y su concreción en la Agenda Agenda Canaria de Desarrollo
    Sostenible (ACDS) 2030, para contribuir a la consecución de un mundo más seguro, justo, solidario y sostenible, teniendo
    en cuenta la singularidad de Canarias en el ámbito europeo.'
- nodo: ce:SMBSC4
  campo: definition
  valor: Seleccionar y leer de manera autónoma obras diversas como fuente de placer, y escribir textos con intención literaria,
    configurando un itinerario lector y creador que evolucione en cuanto a diversidad, complejidad y calidad de las obras;
    y compartir experiencias de lectura para construir la propia identidad lectora y disfrutar de la dimensión social de la
    lectura y de la escritura creativa.
- nodo: crit:SMBS03CE1.5
  campo: definition
  valor: Reconocer la interrelación entre el propósito comunicativo y las elecciones lingüísticas del emisor, así como los
    aspectos básicos del funcionamiento de la lengua, con especial atención al español de Canarias, aplicando conocimientos
    gramaticales, léxicos, ortográficos y discursivos para revisar sus propios textos, de forma progresivamente autónoma,
    y desarrollar la conciencia lingüística.
