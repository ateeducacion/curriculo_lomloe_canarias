    y respetuosos con la dignidad humana, así como de la reflexión ética ante los usos de la tecnología y la gestión del tiempo
    libre. Le será útil llevar a cabo trabajos preferentemente colaborativos, donde se presentará mediante recursos audiovisuales
    y la puesta en acción de debates, coloquios o entrevistas. La finalidad será transformar su entorno próximo de forma sostenible,
    inmerso en una sociedad de la información, donde se pretende constatar que asume que el aprendizaje es un proceso de adquisición
    de nuevos conocimientos, que se lleva a cabo a lo largo de toda la vida.
- nodo: bc:SGEH03BC9
