    proceso de integración europeo, conociendo sus instituciones y sus principales logros, la integración de Canarias como
    región ultraperiférica, además de los Objetivos de Desarrollo Sostenible. Por último, se valorará que participa en actividades
    comunitarias, incluyendo los programas educativos europeos, así como en la presentación de ideas y soluciones innovadoras,
    éticas y sostenibles, como pueden ser murales o paneles divulgativos, ferias, exposiciones o lapbook, entre otros.
- nodo: bc:SGEH04BC1
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de buscar, seleccionar, tratar y organizar
    información, elaborando contenidos propios en distintos formatos usando los datos en entornos digitales y evaluando la
    fiabilidad de las fuentes, teniendo en cuenta el problema de la desinformación. El objetivo será construir conocimiento
    partiendo de los métodos de investigación en el ámbito de la historia, con razonamientos y resultados científicos, matemáticos
    y tecnológicos (gráficas, tablas, diagramas, esquemas). También se verificará que analiza y comprende la dimensión social
    y ciudadana de su propia identidad, así como los hechos culturales, históricos y normativos que la determinan, a través
    de análisis crítico de todo tipo de textos, contrastando la interpretación de historiadores e historiadoras y la construcción
    y la interpretación de líneas del tiempo a través de la linealidad, cronología, simultaneidad y duración. Por último,
    se valorará que elabore síntesis y productos explicativos (informes, dramatizaciones, exposiciones, murales y paneles
    divulgativos, dosieres informativos, pódcast, etc.), comunicando la información, adoptando un punto de vista creativo,
    crítico y personal, participando, colaborando y compartiendo contenidos, datos y conocimiento desde la ética de los nuevos
    comportamientos en la sociedad de la información.
- nodo: bc:SGEH04BC2
  campo: scopeNote
  valor: Mediante este bloque competencial se verificará que el alumnado es capaz de indagar, argumentar y elaborar productos
    propios sobre problemas históricos y sociales tales como la desigualdad e injusticia en el contexto local y global (desde
    Canarias, España y el resto del mundo), con el uso crítico de textos y búsquedas en internet, seleccionando los resultados
    de manera crítica y construyendo conocimiento —siendo necesario potenciar una metodología de aprendizaje guiado, apoyada
    en el trabajo colaborativo entre el alumnado— creando contenidos digitales originales, como son los juicios propios y
    argumentados ante problemas de actualidad contextualizados históricamente y la defensa y exposición orales de los mismos
    a través, entre otros, de presentaciones, debates, exposiciones, dramatizaciones, entrevistas, infografías o paneles y
    murales divulgativos. Por último, se valorará asimismo la construcción de su propia personalidad, en su dimensión social
    y ciudadana y enriquecimiento del acervo común canario, entendiendo el patrimonio como bien y como recurso, a través de
    su puesta en valor, difusión y con propuestas de gestión de esa riqueza patrimonial con producciones y planteamientos
    éticos que incluyan el diálogo, la empatía y la actitud colaborativa e inclusiva.
- nodo: bc:SGEH04BC3
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de conocer los principales desafíos (mediante,
    entre otros, trabajos de síntesis, informes, ejes cronológicos, comentarios de texto, de imágenes, de datos o documentales)
    a los que se han enfrentado distintas sociedades a lo largo del tiempo, como pueden ser la emergencia climática, la sostenibilidad
    o los conflictos ideológicos, étnicos y culturales. Para ello se comprobará que analiza los cambios, las causas y consecuencias,
    y que comprende, interpreta y valora con actitud crítica los textos y las diversas fuentes con la finalidad de elaborar
    productos significativos (informes, dosieres, exposiciones, etc.). Por otro lado, se constatará que utiliza métodos y
    proyectos de investigación, preferentemente colaborativos, haciendo uso de mapas y otras representaciones gráficas, para
    realizar propuestas a los Objetivos de Desarrollo Sostenible, desde un enfoque ecosocial, problemas y desafíos pasados,
    actuales o futuros, tales como la diversidad social, étnico-cultural y de género, las migraciones, la multiculturalidad
    y el mestizaje en sociedades abiertas, con el objetivo de expresarlo a través de la elaboración de paneles divulgativos,
    murales digitales, conferencias, congresos, ferias escolares, etc. Finalmente, se valorará la responsabilidad ecosocial
    del alumnado, que ha de comprender y analizar problemas éticos fundamentales y de actualidad, y que es capaz de entender
    las relaciones sistémicas de interdependencia, ecodependencia e interconexión entre actuaciones locales y globales, teniendo
    como referencia la realidad de Canarias, además de desarrollar una ciudadanía ética digital, dentro de los nuevos comportamientos
    en la sociedad de la información con la producción de imágenes o decálogos interactivos, entre otros.
- nodo: bc:SGEH04BC5
  campo: scopeNote
  valor: Por medio de este bloque competencial se verificará que el alumnado es capaz de analizar, de forma crítica, planteamientos
    históricos y geográficos para explicar los sistemas democráticos y principios constitucionales, conociendo la transformación
    política (transiciones, revoluciones y resistencias, y cambios en la época contemporánea), la conquista de los derechos
    individuales y colectivos de este mismo periodo histórico y el origen, evolución y adaptación de los sistemas liberales
    en España y la implicación y repercusión en Canarias. Se verificará que conoce, valora y ejercita responsabilidades, derechos
    y deberes a través del estudio de la Transición y de la Constitución española de 1978 y de nuestro ordenamiento jurídico.
    Por otro lado, se podrá visualizar que analiza y asume fundamentalmente los principios y valores, como son la comprensión
    de la memoria democrática y la lucha por la libertad, la igualdad y los derechos humanos, y la acción de los movimientos
    sociales en el mundo contemporáneo, mediante la participación social, el trabajo en equipo, la mediación y la resolución
    pacífica de conflictos, así como debates, pódcast o entrevistas a representantes de la ciudadanía, etc.
- nodo: bc:SGEH04BC6
  campo: scopeNote
  valor: A través de este bloque competencial se podrá comprobar que el alumnado es capaz de conocer y comprender los procesos
    geográficos, históricos y culturales que han conformado la realidad multicultural, a través del análisis de los aspectos
    geográficos, históricos, ecosociales y culturales que han conformado la sociedad globalizada y la incidencia en España
    y en Canarias. Se podrá verificar que puede diferenciar las alianzas e instituciones internacionales, la mediación y misiones
    de paz, y que es capaz de asumir un compromiso cívico y participativo, a través del diseño, exposición y puesta en práctica
    de propuestas para la gestión pacífica de los conflictos y el apoyo a las víctimas en favor de la igualdad y la inclusión,
    donde el alumnado identifique prejuicios y estereotipos, teniendo como fin la prevención de toda discriminación. Como
    productos de difusión se podrán usar exposiciones, murales, paneles divulgativos, presentaciones, dramatizaciones o conferencias,
    entre otras. Se valorarán las actitudes de respeto por la diversidad, y el compromiso con la igualdad de género, la cohesión
    social y la libertad de expresión.
- nodo: bc:SGEH04BC7
  campo: scopeNote
  valor: Mediante este bloque competencial se comprobará que el alumnado es capaz de identificar los fundamentos que sostienen
    nuestras identidades colectivas y las de otros, reconociendo los rasgos que van conformando la identidad propia canaria
    y la de las demás personas. Se verificará que realiza búsquedas en internet con el fin de analizar las ideas relativas
    a la dimensión social y ciudadana de su propia identidad y la de hechos culturales e históricos, el compromiso con la
    igualdad de género, la cohesión social, el desarrollo sostenible y el logro de la ciudadanía mundial creando producciones
    para difundir las conclusiones. También se constatarán las estrategias para la identificación de los fundamentos del proceso
    de transformación de la España contemporánea en la formación de una identidad multicultural compatible, las formaciones
    identitarias, el nacimiento de las nuevas expresiones artísticas, el patrimonio como bien y como recurso, especialmente
    en Canarias; la perspectiva histórica del componente emocional plasmando las conclusiones en la elaboración de exposiciones,
    conferencias, debates, congresos, coloquios, catálogos artísticos, etc.
- nodo: bc:SGEH04BC9
  campo: scopeNote
  valor: Por medio de este bloque competencial se verificará que el alumnado es capaz de conocer y valorar la aportación de
    nuestro país a la cultura europea, mundial y la singularidad de Canarias en el contexto europeo, a través de la interpretación
    y explicación, de forma argumentada, de la conexión de España con los grandes procesos históricos de la época contemporánea.
    Se verificará el conocimiento del sistema capitalista, desde el colonialismo pasando por el imperialismo hasta las nuevas
    subordinaciones económicas y culturales, el estudio crítico y comparativo de la primera mitad del siglo XX, con especial
    atención al enfrentamiento entre los totalitarismos y los sistemas democráticos, y los fundamentos geoestratégicos desde
    la segunda mitad del siglo XX hasta la actualidad elaborando paneles divulgativos, pósteres en diferentes formatos, infografías
    interactivas, etc. Asimismo, se comprobará que el alumnado valora la contribución de nuestro país a la consecución de
    un mundo más seguro, justo, solidario y sostenible, a través del análisis de los conflictos actuales y los compromisos
    internacionales de España en su solución. También se evaluará la comprensión e interpretación de textos para participar
    en diferentes contextos, el análisis y la comprensión de ideas relativas a la dimensión social y ciudadana de su propia
    identidad. Se comprobará que el alumnado es capaz de analizar y valorar los principios y valores que emanan del proceso
    de integración europeo y los derechos humanos y de la infancia, especialmente el logro de los grandes compromisos contenidos
    en los Objetivos de Desarrollo Sostenible. Por último, se comprobará que participa en actividades comunitarias, así como
    en la generación de ideas y soluciones innovadoras, éticas y sostenibles, usando productos como son las presentaciones
    orales, audiovisuales, dramatizaciones o multimedia.
