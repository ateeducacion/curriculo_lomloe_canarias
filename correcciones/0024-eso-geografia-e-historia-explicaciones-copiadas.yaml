    acciones de cohesión y solidaridad territorial, donde se incluye el conocimiento de las instituciones más cercanas, los
    valores del europeísmo y de la Declaración Universal de los Derechos Humanos.
- nodo: bc:SGEH03BC8
  campo: scopeNote
  valor: Mediante este bloque competencial se comprobará que el alumnado es capaz de tomar conciencia del papel de los ciclos
