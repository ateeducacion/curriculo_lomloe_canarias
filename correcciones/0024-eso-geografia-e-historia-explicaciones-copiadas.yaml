    del diseño, exposición y puesta en práctica de iniciativas para la gestión pacífica de los conflictos —colaborando en
    el propio centro y en entorno más cercano— y el apoyo a las víctimas en favor de la igualdad y la inclusión, valorándose
    las actitudes de respeto por la diversidad, y el compromiso con la igualdad de género, la cohesión social y la libertad
    de expresión.
- nodo: bc:SGEH03BC7
  campo: scopeNote
  valor: Con este bloque competencial se comprobará que el alumnado es capaz de identificar los fundamentos que sostienen
    las diversas identidades propias y las ajenas, partiendo del conocimiento del patrimonio material e inmaterial común de
