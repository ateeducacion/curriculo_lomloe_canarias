cambios:
- nodo: bc:SGEH02BC1
  campo: scopeNote
  valor: A través de este bloque competencial se verificará que el alumnado es capaz de utilizar las herramientas adecuadas
    para una aproximación al conocimiento científico, buscando y seleccionando información sobre temas relevantes del presente
    y del pasado, para elaborar, expresar y presentar contenidos propios en forma de esquemas, tablas informativas y otros
    formatos usando los datos en entornos digitales y evaluando la fiabilidad de las fuentes, teniendo en cuenta el problema
    de la desinformación. Se pretende que el alumnado aprenda a construir conocimiento partiendo de los métodos de investigación
    en el ámbito de la geografía y la historia, con razonamientos y resultados científicos, matemáticos y tecnológicos (gráficas,
    tablas, diagramas, esquemas). También se constatará que analiza distintos tipos de textos sobre la Edad Media y Edad Moderna,
    contrastando la interpretación de historiadores y que construye e interpreta líneas del tiempo a través de la linealidad,
    cronología, simultaneidad y duración. Por último, se valorará que elabore esquemas y tablas comparativas (informes, estudios,
    dosieres informativos, paneles divulgativos, infografías), comunicando la información, participando, colaborando y compartiendo
    contenidos y datos desde la ética de los nuevos comportamientos en la sociedad de la información.
- nodo: bc:SGEH02BC2
  campo: scopeNote
  valor: Mediante este bloque competencial se comprobará que el alumnado es capaz de indagar y argumentar información sobre
    problemas geográficos, históricos y sociales que resulten relevantes en la actualidad, desde lo local a lo global, partiendo
    de la propia realidad canaria, de España y del resto del mundo, mediante un uso contrastado de la información haciendo
    una lectura crítica como base para la construcción del conocimiento histórico, que se consigue con el desarrollo de una
    serie de destrezas, habilidades y estrategias intelectuales como la comprensión lectora, la interpretación de fuentes
    diversas y el análisis crítico y objetivo de los problemas presentes y pasados de la humanidad. Se verificará que conoce
    incorpora y utiliza adecuadamente términos, conceptos y acontecimientos relacionados con la geografía, la historia y otras
    disciplinas de las ciencias sociales, mediante el trabajo colaborativo, en grupos base, con aprendizaje guiado, y que
    realiza intervenciones orales y presenta textos escritos y otros productos, mostrando planteamientos comparados y contrastados.
    El objetivo es que el alumnado elabore juicios argumentados, respetando las opiniones de los demás y enriqueciendo el
    acervo común en el contexto del mundo actual, sus retos y sus conflictos desde una perspectiva sistémica y global. Por
    último, se valorará la construcción de su propia personalidad, en su dimensión social y ciudadana y el enriquecimiento
    del acervo común, entendiendo el patrimonio —partiendo del canario y siguiendo con el resto de España— como bien y como
    recurso, a través de su puesta en valor, difusión y gestión de esa riqueza patrimonial, con producciones (presentaciones,
    paneles divulgativos, murales digitales, ferias…) y planteamiento éticos que incluyan la gestión de las emociones y su
    repercusión en comportamientos individuales y colectivos.
- nodo: bc:SGEH02BC3
  campo: scopeNote
  valor: Con este bloque competencial se comprobará que el alumnado es capaz de conocer los principales desafíos a los que
    se han enfrentado distintas sociedades a lo largo del tiempo, como pueden ser los desafíos demográficos en el mundo actual
    y la competencia y los conflictos por los recursos y el territorio. También que el alumno o la alumna comprende, interpreta
    y valora con objetividad los textos y las diversas fuentes para analizar las tensiones internacionales, choques y alianzas
    entre civilizaciones. Por otro lado, se constatará que utiliza tecnologías de la información, como pueden ser el manejo
    y utilización de dispositivos, aplicaciones informáticas y plataformas digitales para realizar propuestas a los Objetivos
    de Desarrollo Sostenible, desde un enfoque encaminado a la conciencia ambiental así como el respeto, protección y cuidado
    de los seres vivos y del planeta, donde se les plantearán proyectos, retos o problemas que facilitan al alumnado, tanto
    individual como grupal, poner en acción estrategias y habilidades diversas para analizar y comprender los fenómenos, situaciones
    o acontecimientos que tienen una especial relevancia o interés en el mundo en el que vive. Finalmente, se valorará la
    responsabilidad ecosocial del alumnado, que ha de comprender y analizar problemas éticos fundamentales y de actualidad,
    tales como la transformación humana del territorio y la distribución desigual de los recursos y del trabajo, y que es
    capaz de entender las grandes migraciones humanas teniendo como referencia la realidad de Canarias, en el contexto del
    proceso de conquista y colonización, además de desarrollar una ciudadanía ética digital, mediante el uso seguro de las
    redes de comunicación así como una lectura crítica de la información.
- nodo: bc:SGEH02BC4
  campo: scopeNote
  valor: A través de este bloque competencial se verificará que el alumnado es capaz de identificar y analizar los elementos
    del paisaje y su articulación en sistemas complejos rurales y urbanos, así como su evolución en el tiempo, mediante métodos
    básicos de investigación para la construcción del conocimiento de la Geografía (localización y distribución, comparación
    y generalización, conexión y evolución). El objetivo es alcanzar una interpretación del territorio y del paisaje mediante
    las Tecnologías de la Información Geográfica (TIG) para analizar el fenómeno de las aglomeraciones urbanas y la ruralidad,
    así como la despoblación y el sostenimiento del mundo rural. Por otro lado, se verificará que comprende el desarrollo
    urbano sostenible y que identifica la ciudad como un espacio de convivencia, respetando los diferentes modos y estilos
    de vida en el contexto de la globalización. Finalmente se constatará que el alumnado es capaz de valorar la riqueza y
    el patrimonio natural de Canarias, de España y del resto del mundo, mediante metodologías del pensamiento geográfico (localización
    y representación del espacio geográfico y obtención de información a partir de mapas, datos estadísticos y gráficos) para
    potenciar la protección del patrimonio natural, histórico, artístico y cultural.
- nodo: bc:SGEH02BC5
  campo: scopeNote
  valor: Con este bloque competencial se comprobará que el alumnado es capaz de analizar de forma crítica planteamientos históricos
    y geográficos explicando la construcción de los sistemas democráticos y los principios constitucionales que rigen la vida
    en comunidad, así como la contribución del Estado y sus instituciones a la paz, a la seguridad integral ciudadana y a
    la convivencia social, analizando desde la Edad Media hasta la Edad Moderna. El objetivo es comprobar que el alumnado
    conoce la incorporación e implicación de la sociedad civil en procesos democráticos y que participa en proyectos comunitarios.
    Se verificará que conoce, las formulaciones estatales en el mundo medieval y moderno, tales como las repúblicas, imperios
    y reinos. Por otro lado, se podrá visualizar que analiza y asume fundamentalmente los principios y valores de la dignidad
    humana y derechos universales, como puede ser la Convención sobre los Derechos del Niño y la acción de los movimientos
    sociales, mediante la participación, trabajo en equipo (con tareas informativas como dosieres, paneles divulgativos, murales,
    preparación, difusión de entrevistas u otro tipo de intervenciones), mediación y resolución pacífica de conflictos.
- nodo: bc:SGEH02BC6
  campo: scopeNote
  valor: 'A través de este bloque competencial se comprobará que el alumnado es capaz de comprender los procesos geográficos,
    históricos y culturales que han conformado la realidad multicultural en la que vivimos, a través del estudio del legado
    histórico y el acervo cultural desde la Edad Media hasta la Edad Moderna en la formación de las identidades colectivas
    de España y Canarias como pueden ser el papel de la religión en la organización social, la legitimización del poder y
    la formación de identidades. Se podrá verificar que puede identificar las situaciones discriminatorias de las personas
    invisibilizadas de la historia: mujeres, esclavos y extranjeros así como la marginación, segregación, control y sumisión
    en la historia de la humanidad de las niñas y de las mujeres en el mundo y los roles de género y su manifestación en todos
    los ámbitos de la sociedad y la cultura. El objetivo es alcanzar el respeto y aceptación del otro mediante comportamientos
    no discriminatorios y contrarios a cualquier actitud segregadora, valorándose las actitudes de respeto por la diversidad,
    y el compromiso con la igualdad de género y las manifestaciones y conductas no sexistas mediante la elaboración —de forma
    individual o en grupo— de paneles y murales divulgativos, exposiciones, pósteres, infografías o cualquier otro recurso.'
- nodo: bc:SGEH02BC7
  campo: scopeNote
  valor: Por medio de este bloque competencial se comprobará que el alumnado es capaz de identificar los fundamentos que sostienen
    las diversas identidades propias y las ajenas, reconociendo el significado y función de las expresiones artísticas y culturales
    a lo largo de la historia medieval y moderna, mostrando respeto por la conservación del patrimonio material e inmaterial.
    Se verificará que analiza las ideas relativas a la influencia de las civilizaciones judía e islámica en la cultura europea.
    También se constatarán las estrategias para identificar el significado y función de las expresiones artísticas y culturales
    en las distintas civilizaciones y el origen histórico de distintas identidades colectivas que se han desarrollado en España
    y Canarias. Se valorará que interpreta el uso que se ha hecho de esas expresiones mediante la elaboración de síntesis
    y productos explicativos (informes, estudios, dosieres informativos, murales, lapbook, presentaciones, paneles divulgativos),
    comunicando la información, empezando a adoptar un punto de vista creativo, crítico y personal, y mostrando una actitud
    de respeto hacia los diferentes sentidos de pertenencia, promoviendo la solidaridad y la cohesión social.
- nodo: bc:SGEH02BC8
  campo: scopeNote
  valor: Mediante este bloque competencial se comprobará que el alumnado es capaz de tomar conciencia del papel de los ciclos
    demográficos, el ciclo vital, las formas de vida y las relaciones intergeneracionales y de dependencia en la sociedad
    actual y su evolución a lo largo del tiempo, usando una perspectiva canaria. Se verificará que conoce los desafíos demográficos
    en el mundo actual y la transformación humana del territorio y la distribución desigual de los recursos y del trabajo
    y la evolución de los sistemas económicos, de los ciclos demográficos, de los modos de vida y de los modelos de organización
    social. También se evaluará el conocimiento de la riqueza y valor del patrimonio natural, la influencia humana en la alteración
    de los ecosistemas en el pasado, así como la lucha por la supervivencia y el estatus social en la Edad Media y en la Edad
    Moderna. Se comprobará que el alumnado es capaz de analizar los dilemas del mundo actual como punto de partida para el
    pensamiento crítico y el desarrollo de juicios propios, así como la presentación de ideas y soluciones innovadoras, éticas
    y sostenibles, con la elaboración, por ejemplo, de paneles divulgativos, murales digitales, conferencias, congresos o
    ferias escolares. Por último, se pretende seguir fomentando los estilos de vida y hábitos que se adquieren individual
    y colectivamente en el entorno cultural y familiar les hará visualizar cómo mejoran la esperanza y la calidad de vida.
- nodo: bc:SGEH02BC9
  campo: scopeNote
  valor: Con este bloque competencial se comprobará que el alumnado es capaz de conocer y valorar la importancia de la seguridad
    integral ciudadana en la cultura de convivencia nacional e internacional, a través de la interpretación de la conexión
    de España y Canarias con los grandes procesos históricos a largo de la historia medieval y moderna, en el escenario de
    los grandes flujos de difusión cultural y técnica, así como en el de la evolución del comercio internacional y en el contexto
    de sus relaciones políticas y diplomáticas, pretendiendo que se valore lo que han supuesto para la evolución de nuestro
    país y señalando las aportaciones de sus habitantes a lo largo de la historia, adentrándose en la contribución de Canarias
    en el proceso del descubrimiento de América. Por otro lado, se comprobará que el alumnado reconoce la contribución de
    nuestro país a la consecución de un mundo más seguro, justo, solidario y sostenible, a través del análisis de la concentración
    y distribución de la riqueza, las formas y modos de percibir y representar la desigualdad. También se evaluará la comprensión
    e interpretación de textos para participar en diferentes contextos, el análisis y la comprensión de ideas y actitudes
    en el proyecto de construcción de una identidad común y la seguridad y la cooperación internacional, incluidos los grandes
    compromisos contenidos en los Objetivos de Desarrollo Sostenible, así como la exposición de ideas y soluciones innovadoras,
    éticas y sostenibles mediante, entre otros recursos, de presentaciones, debates, conferencias o paneles y murales divulgativos.
- nodo: bc:SGEH03BC1
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de buscar, seleccionar, tratar y organizar
    información, elaborando contenidos propios en distintos formatos (murales, informes, tablas), usando los datos en entornos
    digitales y evaluando la fiabilidad de las fuentes, teniendo en cuenta el problema de la desinformación. El objetivo será
    construir conocimiento partiendo de los métodos de investigación en el ámbito de la Geografía y la historia, con razonamientos
    y resultados científicos, matemáticos y tecnológicos (gráficas, tablas, diagramas, esquemas), de gran importancia en la
    enseñanza de la Geografía. También se verificará que empieza a analizar y comprender la dimensión social y ciudadana de
    su propia identidad. Por último, se valorará que elaboren síntesis y productos explicativos (informes, estudios, murales,
    infografías, exposiciones, dosieres informativos), comunicando la información, empezando a adoptar un punto de vista creativo,
    crítico y personal, participando, colaborando y compartiendo contenidos y datos desde la ética de los nuevos comportamientos
    en la sociedad de la información.
- nodo: bc:SGEH03BC2
  campo: scopeNote
  valor: Mediante este bloque competencial se comprobará que el alumnado es capaz de indagar, argumentar y elaborar productos
    propios sobre problemas geográficos y sociales tales como la desigualdad e injusticia en el contexto local y global (desde
    Canarias, España y el resto del mundo), con el uso crítico de mapas, textos, gráficas, tablas, diagramas o cualquier otro
    documento de las ciencias sociales, además de búsquedas en internet. Tendrá que ir seleccionando los resultados de manera
    progresivamente crítica y construyendo conocimiento, creando contenidos digitales originales, como son los juicios propios
    y argumentados ante problemas de actualidad contextualizados de forma espacial y temporal. Para ello es necesario potenciar
    una metodología basada en el trabajo colaborativo, que fomente las experiencias de investigación mediante un aprendizaje
    guiado y de experimentación. Posteriormente, deberá defender de forma crítica de los mismos a través de presentaciones
    y debates. Por último, se valorará la construcción de su propia personalidad, en su dimensión social y ciudadana y enriquecimiento
    del acervo común, entendiendo el patrimonio como bien y como recurso, a través de la puesta en valor, difusión y gestión
    de esa riqueza patrimonial con producciones —como pueden ser la realización de pequeños cortos, exposiciones, coloquios,
    pódcast, murales o paneles divulgativos— y la puesta en común de planteamientos éticos que incluyan el diálogo, la empatía
    y la actitud colaborativa e inclusiva.
- nodo: bc:SGEH03BC3
  campo: scopeNote
  valor: Con este bloque competencial se comprobará que el alumnado es capaz de conocer los principales desafíos a los que
    se enfrentan las distintas sociedades en la actualidad y a lo largo del tiempo, como pueden ser la emergencia climática,
    la sostenibilidad o los conflictos ideológicos, étnicos y culturales. Para ello se comprobará que puede analizar los cambios,
    las causas y consecuencias y que comprende, interpreta y valora con actitud crítica los distintos documentos, especialmente
    los geográficos, y las diversas fuentes. Por otro lado, se constatará que utiliza métodos y proyectos de investigación,
    preferentemente colaborativos, haciendo uso de mapas y otras representaciones gráficas, para realizar propuestas a los
    Objetivos de Desarrollo Sostenible, a través de recursos audiovisuales tales como las presentaciones, paneles y murales
    divulgativos, ferias, congresos o debates. Se constatará que utilizan un enfoque ecosocial sobre los problemas y los desafíos
    pasados, actuales o futuros, tales como la diversidad social, étnico-cultural y de género, las migraciones, la multiculturalidad
    y el mestizaje en sociedades abiertas, teniendo como referencia la realidad de Canarias. Por último, se pretende que el
    alumnado desarrolle una ciudadanía ética digital, dentro de los nuevos comportamientos en la sociedad de la información.
- nodo: bc:SGEH03BC4
  campo: scopeNote
  valor: Con este bloque competencial se comprobará que el alumnado es capaz de identificar y analizar los elementos del paisaje
    y su articulación en sistemas complejos naturales, rurales y urbanos, así como su evolución en el tiempo, desde el éxodo
    rural hasta la concentración urbana, pasando por el problema de la despoblación rural en España, así como la ordenación
    del territorio y la transformación del espacio, especialmente en el caso de Canarias. Se llevará a la práctica por medio
    del análisis multicausal de sus relaciones naturales y humanas, presentes y pasadas. También se verificará que analiza
    e investiga la huella humana, en su proceso de transformación y degradación a lo largo del tiempo y la protección del
    medio natural, estudiando críticamente su grado de sostenibilidad y equilibrio, donde se valorará su implicación en la
    defensa y protección del medioambiente, a través del planteamiento y desarrollo de proyectos y otras acciones de colaboración
    dentro del centro, mediante proyectos o planes, o con otros organismos de la zona —ONG o entidades locales—, que contribuyan
    a la conservación y mejora del entorno natural cercano, rural y urbano, que favorecerán a un estilo de vida sostenible
    y ecosocialmente responsable.
- nodo: bc:SGEH03BC5
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de analizar de forma crítica los planteamientos
    históricos y geográficos de los actuales sistemas democráticos y sus principios constitucionales, conociendo los actuales
    derechos individuales y colectivos en España. Se verificará que conoce, valora y ejercita responsabilidades, derechos
    y deberes a través del estudio guiado de nuestro ordenamiento normativo autonómico canario, constitucional y supranacional.
    Por otro lado, se podrá visualizar que analiza y asume fundamentalmente los principios y valores, como son la lucha por
    la libertad, la igualdad y los derechos humanos, y la acción de los movimientos sociales en el mundo contemporáneo, mediante
    la participación, trabajo en equipo, mediación y resolución pacífica de conflictos, realizándose exposiciones, debates,
    entrevistas, mesas redondas o integrándose el alumnado en equipos de resolución de conflictos en su propio centro educativo.
- nodo: bc:SGEH03BC6
  campo: scopeNote
  valor: Por medio de este bloque competencial se comprobará que el alumnado es capaz de conocer y comprender los procesos
    geográficos, históricos y culturales que han conformado la sociedad contemporánea, a través del análisis de los aspectos
    geográficos, históricos, ecosociales y culturales, así como las transformaciones científicas y tecnológicas que han conformado
    la actual comunidad globalizada, prestando especial atención a su incidencia en España y Canarias. Se hará por medio de
    tareas de síntesis, realizándose exposiciones en clase o en el centro con proyecciones, paneles divulgativos, murales,
