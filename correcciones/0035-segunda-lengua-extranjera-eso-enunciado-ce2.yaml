id: '0035'
titulo: 'Segunda Lengua Extranjera (ESO): coma sobrante en el enunciado de la competencia 2'
motivo: El enunciado de la competencia específica 2 lleva en la exportación una coma entre «coherente» y «mensajes» que no
  está en el documento oficial. Afecta a los tres idiomas (alemán, italiano y francés).
