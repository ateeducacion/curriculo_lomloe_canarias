cambios:
- nodo: bc:PEDK05BC1
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de dirigir su conducta, reconocer y gestionar
    sus emociones, deseos, razones y voluntades, y constituirse como persona libre y responsable, mediante el desarrollo de
    la autoestima, el pensamiento crítico y ético, y el fomento de la autonomía y la responsabilidad. Para ello, el alumnado
    deberá demostrar que es capaz de decidir y reflexionar sobre problemas de carácter ético, prestando especial atención
    a la diferencia entre las personas, la identidad, la dignidad e igualdad, la relevancia de la diversidad de modos de vida
    y los valores en el entorno canario. Se constatará, además, que el alumnado puede identificar los valores, normas y sentimientos
    que guían sus acciones, respetando el valor de la diversidad y fomentando el comportamiento ético en la cohesión social,
    la toma de decisiones y la resolución de conflictos. Todo ello, a través de la búsqueda, análisis y organización de información,
    evaluando la influencia y uso crítico y responsable de los medios y redes de comunicación para prevenir conductas adictivas,
    abusos y ciberacosos, el respeto a la intimidad, los límites a la libertad de expresión y la oposición ante cualquier
    forma de discriminación o violencia, y reconociendo la eco-dependencia e interdependencia como valores esenciales. Teniendo
    como finalidad última, que el alumnado sea capaz de generar juicios morales y alcance los fines del propio proyecto personal
    y colectivo.
- nodo: bc:PEDK05BC2
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado reflexiona, desarrolla valores e infiere conductas
    cívicas y éticas, promoviendo una convivencia democrática, justa, respetuosa, pacífica y no sexista, basada en la toma
    de decisiones, la prevención y la gestión dialogada de conflictos, la promoción de la igualdad de derechos y el respeto
    hacia la diversidad social, de género, lingüística y étnico-cultural. Para ello, se constatará que el alumnado responde
    a los principios de justicia, solidaridad, seguridad y paz, a partir del análisis y las acciones de la ciudadanía, el
    Estado, sus instituciones, los organismos internacionales, las ONG y ONGD, especialmente aquellas que actúan en la Comunidad
    Autónoma de Canarias. Además, se contribuirá a la adquisición de la competencia específica ya que se comprobará que es
    capaz de interactuar de acuerdo a normas y valores cívicos y éticos, en contextos diversos, adoptando sus propios juicios,
    con autonomía y responsabilidad; analizando racionalmente conflictos cercanos en entornos presenciales y virtuales; promoviendo
    valores y principios constitucionales y democráticos que defiendan los derechos humanos y de la infancia, la igualdad,
    el respeto por las minorías, las identidades etnoculturales, la interculturalidad y las migraciones en la sociedad canaria;
    concienciando y sensibilizando así al alumnado sobre la importancia del enriquecimiento cultural y patrimonial a través
    de la sociedad, considerando la posición geoestratégica que tiene Canarias para la confluencia de las diferentes culturas.
    Por otro lado, esta competencia implica que el alumnado sea capaz de reconocer, gestionar y respetar las emociones, sentimientos
    y experiencias de los demás, a través de una educación inclusiva y sostenible, empoderando al alumnado para que pueda
    tomar decisiones conscientes y actuar responsablemente con respecto a la viabilidad socio-económica y la consecución de
    una sociedad justa para generaciones presentes y futuras, asumiendo responsabilidades individuales y colectivas. Todo
    ello, con la finalidad de promover un marco social de convivencia proactiva y democrática a través de la adopción de posturas
    críticas en procesos de reflexión guiados.
- nodo: bc:PEDK05BC3
  campo: scopeNote
  valor: A través de este bloque competencial se constarará que el alumnado se compromete activamente con valores y prácticas
    consecuentes con el respeto, cuidado y protección de los seres vivos y el planeta. De acuerdo con este objetivo, se comprobará
    que el alumnado sea capaz de evaluar alternativas con las que frenar el cambio climático e identificar causas y problemas
    ecosociales, participando en actividades que promuevan un desarrollo sostenible. Se contribuye así a la competencia específica,
    ya que se comprobará que el alumnado sea capaz de comprender las relaciones sistemáticas entre la persona, la sociedad
    y la naturaleza, teniendo en cuenta los conceptos de interdependencia, ecodependencia e interrelación, iniciándose en
    la adopción de estilos de vida sostenible para contribuir a la conservación de la biodiversidad de Canarias como parte
    fundamental de su patrimonio. Para ello, el alumnado deberá ser capaz de buscar y analizar información fiable para motivar
    la reflexión y el diálogo sobre los límites del planeta y el cambio climático, así como de evaluar críticamente la huella
    ecológica de las acciones humanas, para así reflexionar sobre el deber legal de cuidar el entorno y proponer soluciones
    valiosas que respondan especialmente a las necesidades detectadas en la Comunidad Autónoma de Canarias. Se comprobará,
    además, que el alumnado adquiere una perspectiva ética y biocéntrica de su relación con el entorno y que, a partir de
    esa convicción, genera prácticas y hábitos para el logro de los Objetivos de Desarrollo Sostenible que promueven la salud
    y la preservación del medioambiente y los seres vivos, relativos a conceptos como consumo responsable, uso sostenible
    del suelo, del aire, del agua, de la energía y residuos teniendo en cuenta el carácter insular del archipiélago canario.
- nodo: bc:PEDK05BC4
  campo: scopeNote
  valor: A través de este bloque competencial, se constatará que el alumnado sea capaz de mantener relaciones plenas, inclusivas
    y satisfactorias. De acuerdo con este objetivo, se comprobará que el alumnado es capaz de expresar y gestionar equilibradamente
    sus emociones y reconocer y valorar las emociones de otras personas fomentando un desarrollo integral sostenible. Se contribuye
    así a la competencia específica, ya que se comprobará que el alumnado sea capaz de desarrollar la autoestima y la empatía
    para identificar, gestionar y expresar emociones y sentimientos propios de forma oral, escrita, signada o multimodal,
    reconociendo y valorando las de las demás personas. Para ello, el alumnado deberá ser consciente de las propias emociones,
    ideas y comportamientos personales, que le ayudarán a emplear estrategias para gestionar los conflictos de manera dialogada
    y democrática, así como desarrollar la empatía con las demás personas, establecer relaciones sociales adecuadas, armoniosas
    y constructivas con perspectiva de género y rechazar prejuicios y estereotipos. De esta manera, se contribuirá a su propio
    proyecto personal en el que está implicado el medio natural canario, los afectos, la salud, la familia, la amistad y el
    amor.
