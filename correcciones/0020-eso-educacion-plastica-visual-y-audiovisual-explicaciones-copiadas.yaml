id: '0020'
titulo: 'Educación Plástica, Visual y Audiovisual (Educación Secundaria Obligatoria): 16 explicaciones de bloque copiadas
  de otro curso'
motivo: La exportación repite en estos bloques competenciales la explicación de otro curso de la materia; el documento oficial
  trae una explicación propia para cada curso. Generada con `contrastar --proponer`.
fuente:
  documento: eso-educacion-plastica-visual-y-audiovisual
  fichero: fuentes/documentos/eso/Educacion_Plastica_Visual_y_Audiovisual_ESO.odt
  sha256: 2725925a2b96dec2f2191c4e0527bb47139cc0a45c363157b7f4598a18670112
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: bc:SEUP02BC1
  campo: scopeNote
  valor: A través de este bloque competencial se constatará que el alumnado, mediante el análisis de los géneros artísticos,
    puede reconocer los factores históricos y sociales más relevantes que rodean a diferentes producciones plásticas, visuales
    y audiovisuales, así como su función y finalidad; y expresarlo de forma oral, escrita, signada o multimodal. Asimismo,
    con el análisis de obras de arte, tanto de forma guiada como sin ayuda, se verificará si es capaz de valorar la importancia
    de la conservación, protección y difusión del patrimonio cultural, desde el más cercano hasta alcanzar el conjunto de
    la humanidad, con interés, actitud cooperativa y perspectiva de género. Por último, se comprobará si ha llegado a entender
    cómo todo esto se convierte en el testimonio de los valores y convicciones del individuo y de la sociedad en su conjunto.
- nodo: bc:SEUP02BC2
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que alumnado es capaz de explicar razonadamente, de manera oral,
    escrita, signada o multimodal, la importancia del proceso que media entre la realidad, el imaginario y la producción,
    por medio del análisis de lenguaje visual como forma de comunicación; y expresar para ello hechos, conceptos, pensamientos,
    opiniones o sentimientos. También se valorará si supera estereotipos y muestra un comportamiento respetuoso con la diversidad
    cultural. Además, se constatará que analiza, de forma guiada, diversas producciones artísticas, incluidas las del patrimonio
    cultural y artístico de Canarias, participando activamente en el trabajo en grupo, valorando el intercambio, las experiencias
    compartidas y el diálogo intercultural. Todo esto con la finalidad de comprobar si supera prejuicios, especialmente comunes
    en lo relativo a la percepción de las producciones artísticas y culturales, amplía sus horizontes y establece un juicio
    crítico y autocrítico.
- nodo: bc:SEUP02BC3
  campo: scopeNote
  valor: A través de este bloque competencial se persigue constatar si el alumnado selecciona y describe propuestas plásticas,
    visuales y audiovisuales de diversos tipos y épocas, con especial atención a las de Canarias, mediante los elementos que
    intervienen en composiciones básicas y de las leyes compositivas, de manera individual, grupal o colaborativa, con el
    uso de diferentes herramientas digitales, en cualquier medio o soporte. Asimismo se comprobará si lo hace con curiosidad
    y desde una perspectiva de género, con énfasis en el estudio de producciones artísticas ejecutadas por mujeres; así como,
    si comparte con respeto impresiones y emociones, y expresa su opinión personal de forma abierta. Por último se comprobará
    si ha conseguido construir una cultura artística personal más amplia y alimentar el imaginario. Todo ello con la intención
    de fomentar la cimentación de una mirada empática y despojada de prejuicios, y que comprenda que todas estas producciones
    han marcado el camino para llegar hasta donde nos encontramos hoy.
- nodo: bc:SEUP02BC4
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará si el alumnado puede analizar de forma guiada las especificidades
    de los lenguajes de diferentes producciones culturales y artísticas, con el uso diferentes herramientas digitales; descubrir
    las diversas posibilidades que ofrecen como fuente generadora de ideas y respuestas; establecer conexiones entre ellas
    e incorporarlas creativamente en las producciones propias, de manera individual, grupal y colaborativa; así como, demostrar
    respeto por las normas, empatía, equidad y espíritu constructivo. Asimismo se pretende constatar si, mediante el estudio
    del proceso creativo y los mapas mentales, entre otras, es capaz de reconocer e interpretar los rasgos particulares de
    diversas técnicas y lenguajes artísticos, con el uso de textos orales, signados, escritos o multimodales; y mostrar interés
    por las manifestaciones artísticas y culturales, especialmente las de Canarias. Por último, se observará si consigue interiorizar
    las diversas posibilidades que ofrecen los diferentes lenguajes como fuente generadora de ideas y nuevas respuestas. Todo
    esto con la intención de que el alumnado se percate de la multiplicidad de las producciones, las técnicas y los lenguajes
    empleados como un valor generador de riqueza a todos los niveles, por lo que debe entender su naturaleza diversa desde
    el acercamiento, tanto a sus modos de producción y de diseño en el proceso de creación como a los de recepción.
- nodo: bc:SEUP02BC5
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará si el alumnado es capaz de expresar ideas, emociones y su visión
    del mundo en diferentes producciones plásticas, visuales y audiovisuales, con diversas herramientas, técnicas y soportes,
    seleccionados de manera crítica, y con una actitud cooperativa y respetuosa. Asimismo. Se verificará también si realiza
    diferentes tipos de producciones artísticas, individuales o colectivas, mediante la construcción de polígonos regulares
    (triángulos y cuadriláteros) e irregulares, en función de sus lados y sus ángulos, con la posibilidad de aplicarlos a
    la artesanía popular canaria; si justifica el proceso creativo con iniciativa y autoconfianza, así como con racionalidad,
    empatía y sensibilidad; y si selecciona las técnicas y los soportes adecuados. Por último, se observará si mejora su capacidad
    de comunicación y si desarrolla la reflexión crítica y la autoconfianza. Todo esto con la finalidad de que compruebe que
    para el desarrollo de su identidad personal es indispensable el conocimiento del contexto artístico y cultural de la sociedad
    en la que experimenta sus vivencias.
- nodo: bc:SEUP02BC6
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará si el alumnado es capaz de explicar su pertenencia a un contexto
    cultural concreto, especialmente el de Canarias, con la búsqueda, la selección y el tratamiento de la información, de
    manera guiada, en fuentes diversas. Para ello se constatara que utiliza creativamente referencias culturales y artísticas
    del entorno en la elaboración de producciones propias, con una actitud dialogante, argumentativa, respetuosa y opuesta
    a cualquier tipo de discriminación o violencia, por medio de las técnicas básicas de expresión gráfico-plástica en
    dos dimensiones y las técnicas secas, húmedas y mixtas, a través del estudio de artistas como César Manrique y Manolo
    Millares. Por último, se valorará si consigue enriquecer sus creaciones y desarrollar su propia identidad personal, cultural
    y social. Todo ello con el propósito de que se de cuenta de que llevar a buen término una producción artística es el resultado
    de un proceso complejo que implica el conocimiento de los materiales, herramientas y técnicas propios del medio de expresión
    artística escogido, así como sus posibilidades de empleo; y de experimentar con los diferentes resultados conseguidos
    y los efectos producidos en el público receptor de la obra.
- nodo: bc:SEUP02BC7
  campo: scopeNote
  valor: A través de este bloque competencial se persigue constatar que el alumnado puede realizar un proyecto artístico,
    con creatividad y de forma consciente, analizando el lenguaje y la comunicación visual (finalidad o función), así como
    los grados de iconicidad de las imágenes, de manera individual, grupal y colaborativa, y con el empleo de diferentes lenguajes,
    materiales, soportes y herramientas, teniendo en cuenta a artistas canarios como Óscar Domínguez y Felo Monzón. Por último,
    se comprobará que integra y enriquece el diseño con todos estos saberes en la realización de un proyecto artístico. Todo
    ello con la finalidad de que se dé cuenta de que por la multiplicidad de lenguajes artísticos, desde los más tradicionales
    hasta los más recientes, debe aprender a hacer un uso informado y progresivo de estos, sentando las bases para que más
    adelante pueda profundizar en sus potencialidades expresivas.
- nodo: bc:SEUP02BC8
  campo: scopeNote
  valor: A través de este bloque competencial se constatará que el alumnado reconoce diferentes usos y funciones de las producciones
    y manifestaciones artísticas; así como que es capaz de argumentar sus conclusiones acerca de las oportunidades personales,
    sociales y económicas que se pueden generar. También se comprobará que lo aplica, con una intención previa, para la creación
    de mensajes visuales y audiovisuales publicitarios (lectura y análisis), de forma individual o colectiva, organizando
    y desarrollando las diferentes etapas del proceso y aprendiendo de sus errores. Por último, se comprobará su capacidad
    para exponer las distintas fases de elaboración y el resultado final, mediante el uso de aplicaciones informáticas sencillas.
    Todo esto con la intención de que asimile que la obra artística alcanza todo su sentido y potencialidad cuando llega al
    público y produce un efecto sobre él.
