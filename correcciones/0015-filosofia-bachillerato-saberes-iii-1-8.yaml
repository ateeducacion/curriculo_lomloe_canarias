id: '0015'
titulo: 'Filosofía (Bachillerato): textos de los saberes III.1.8 y saber III.1.8.7 ausente'
motivo: 'La exportación trae seis saberes vacíos (III.1.8.1 a III.1.8.6). El documento oficial tiene siete: cuatro bajo III.1.8
  y, bajo el cuarto («Reflexión filosófica en torno a la democracia»), tres más. Se conservan los códigos planos de ProIDEAC:
  se rellenan los seis en el orden del documento y se crea III.1.8.7 para el séptimo. REVISAR: si se prefiere la jerarquía
  del documento, habría que crear III.1.8.4.1 a III.1.8.4.3 y retirar III.1.8.5 y III.1.8.6, lo que cambia identificadores.'
