  valor: A través de este bloque competencial se pretende que el alumnado, empleando métodos inductivos, deductivos y lógicos,
    propios del razonamiento matemático, sea capaz de formular, investigar y justificar conjeturas y problemas de forma autónoma
    y creativa, integrando el uso de herramientas tecnológicas digitales, seleccionando la más adecuada para la tarea a realizar
    y utilizando varias fuentes de información. También propiciará que se pueda verificar que el alumnado es capaz de plantear,
    contrastar o comprobar hipótesis, confirmando su validez mediante la observación, la experimentación y la indagación,
    buscando mejorar su destreza para interpretar, modelizar fenómenos y resolver problemas. Asimismo, se podrá comprobar,
    a través de esas situaciones problematizadas, que el alumnado sabe utilizar de forma eficaz el pensamiento computacional
    para descomponer un problema en partes más simples, que lo codifica en un lenguaje apropiado y fácil de interpretar por
    un sistema informático, y también que puede modificar, crear y generalizar algoritmos o patrones en situaciones sencillas,
    todo lo cual favorecerá el desarrollo de un pensamiento más diverso y flexible con el que podrá construir su propio conocimiento,
    potenciar su curiosidad, gusto e interés por esta disciplina y mejorar su capacidad de reflexión y de superación al afrontar
    con resiliencia y compromiso los posibles obstáculos y dificultades que surjan por el camino, asumiendo el éxito y el
    fracaso como una valiosa oportunidad para aprender.
