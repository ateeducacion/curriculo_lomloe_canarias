id: '0231'
titulo: 'Literatura Canaria (Bachillerato): 2 diferencias corregidas con el documento oficial'
motivo: 'Diferencias que el contraste no explicaba con el BOC. Criterio aprobado: el ODT oficial de la web de currículos es
  la referencia y el corpus debe reflejarlo. Se rehacen con los saberes y la numeración del documento los bloques BLCA02SBIV,
  en los que faltaban o sobraban saberes. Tipos: falta en el corpus: texto de saber; texto de saber distinto.'
