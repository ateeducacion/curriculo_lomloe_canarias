  valor: A través del presente bloque competencial, concretado en un único criterio de evaluación, se evaluará en qué medida
    el alumnado es capaz de interpretar o dramatizar obras de diferentes épocas y culturas. Se constatará la capacidad para
    aplicar estrategias y técnicas coreográficas, de dramatización e interpretación instrumental y vocal, asumiendo diversas
    funciones en dicha práctica y reflexionando sobre el proceso y el resultado obtenido como oportunidad para el aprendizaje.
    Se verificará que la participación en las actividades de interpretación grupal se realice con una actitud de respeto y
    responsabilidad, distribuyendo las tareas de manera ecuánime, mostrando sensibilidad hacia las emociones y experiencias
    de los demás, para consolidar una personalidad empática e independiente y una búsqueda de calidad artística en los objetivos
    propuestos. Finalmente, se evaluará la capacidad para comprender, interpretar y valorar críticamente partituras con notación
    convencional y no convencional, como apoyo a la práctica musical, participando en las dinámicas de grupo de manera activa
    e informada y respondiendo con creatividad y eficacia a los desempeños derivados de la expresión artística. Todo ello
    permitirá comprender el hecho artístico desde la propia experiencia, contribuyendo de esta manera a la finalidad de la
    competencia específica.
