cambios:
- nodo: bc:BHMC01BC3
  campo: scopeNote
  valor: A través de este bloque competencial se persigue constatar que el alumnado es capaz de identificar la desigualdad
    como uno de los principales problemas de las sociedades contemporáneas, reconociendo las experiencias históricas de determinados
    colectivos, y que localiza, selecciona y contrasta de manera autónoma información, procedente de diferentes fuentes, referente
    a los niveles, condiciones y modos de vida en las sociedades contemporáneas, a la evolución histórica de la clase trabajadora
    y de las organizaciones obreras, además de la evolución de la situación de la mujer en la sociedad contemporánea. También
    se podrá comprobar que el alumnado identifica que los regímenes liberales pusieron en el centro de la acción política
    y social el nuevo ideal de ciudadanía, basado en la igualdad, que ha tenido definiciones diferentes y contrapuestas. Se
    verificará que analiza el mundo del trabajo y las transformaciones que se han producido en el ámbito de la producción,
    adoptando un juicio propio y argumentado ante las desigualdades y la concentración del poder en determinados grupos sociales,
    así como las experiencias y conflictos en defensa de los derechos laborales y la mejora de las condiciones de vida. Finalmente,
    se comprobará que el alumnado rechaza todo tipo de discriminación y violencia, promoviendo el respeto, la defensa de los
    derechos de las minorías y la igualdad efectiva entre mujeres y hombres.
- nodo: sb:BHMC01SBII.1
  campo: definition
  valor: Comprensión del proceso de globalización en el mundo contemporáneo y sus implicaciones en la sociedad actual. Conocimiento
    de las aglomeraciones urbanas y las consecuencias y desafíos en el mundo rural.
