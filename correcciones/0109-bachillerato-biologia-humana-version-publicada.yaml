cambios:
- nodo: bc:BBIL02BC4
  campo: scopeNote
  valor: Mediante este bloque competencial se pretende evaluar si el alumnado es capaz de analizar la relación entre el correcto
    equilibrio del organismo y determinadas conductas de la vida cotidiana, trabajando de forma colaborativa en equipos diversos;
    aplicando habilidades de coordinación, comunicación, emprendimiento y reparto equilibrado de responsabilidades, para planear
    y emprender acciones fundamentadas científicamente que promuevan el bienestar físico y mental propio y de las demás personas;
    y buscando y ofreciendo apoyo a la sociedad para construir un mundo más saludable. Además, se evaluará si el alumnado
    identifica las conductas de riesgo (adicciones con y sin sustancia, relaciones sexuales sin protección, trastornos alimenticios,
    conductas antisociales…) y si es capaz de reconocer las medidas de prevención necesarias para incluir recomendaciones
    (necesidad de actividad física, vigilancia de las posturas inadecuadas, rechazo al uso de drogas y al consumo de suplementos
    alimenticios innecesarios, necesidad de revisiones médicas periódicas…), con el fin de defender, de manera argumentada
    y con juicio propio, la necesidad de diseñar e implementar un plan de vida saludable, y de emprender acciones, personales
    y colectivas, para, de esta manera, contribuir a la construcción de una sociedad más sana, justa y solidaria.
- nodo: bc:BBIL02BC5
  campo: scopeNote
  valor: El valor de esta competencia específica radica en la necesidad urgente de que la sociedad adopte un modelo de desarrollo
    sostenible, afrontando uno de los mayores y más importantes retos a los que se enfrenta la humanidad actualmente. Para
    poder hacer realidad este ambicioso objetivo es necesario que se alcance una comprensión profunda del funcionamiento de
    los sistemas biológicos y su interrelación. El enfoque de una sola salud (One health) con el que trabajan diferentes organizaciones
    internacionales (FAO, OMS…) defiende que es imprescindible prevenir, detectar y responder eficazmente a los desafíos de
    salud que surgen de las relaciones entre las personas, los seres vivos y el medioambiente. Analizando las relaciones de
    interdependencia y ecodependencia con el resto de los seres vivos y el entorno, se fomentarán actitudes responsables y
    se adoptarán estilos de vida sostenibles, encaminados no solo a la conservación del medioambiente, sino a la mejora de
    la salud necesaria para alcanzar el bienestar físico y mental tanto a nivel individual como colectivo. Por otro lado,
    se pretende que el alumnado sea capaz de valorar los beneficios aportados por los avances médicos, como las terapias avanzadas
    (terapias genéticas, terapias celulares, ingeniería tisular y terapias combinadas) o los métodos de diagnóstico, pero
    sin dejar de cuestionar los costes de carácter ambiental y social que generan; y que, además, tome conciencia de la importancia
    del autocuidado y la autorresponsabilidad para proponer y adoptar estilos de vida sostenibles y saludables, con el fin
    de convertirse en agente activo y promotor de la difusión del pensamiento científico y de la preservación del medioambiente
    y la salud pública, contribuyendo así al logro de los Objetivos de Desarrollo Sostenible, concretados en la Agenda Canaria
    de Desarrollo Sostenible 2030.
- nodo: ce:BBILC5
  campo: definition
  valor: Investigar y debatir sobre las consecuencias de los avances científicos en el campo de la medicina en la salud individual
    y colectiva, y analizar sus efectos e influencia sobre el planeta y el resto de seres vivos para adoptar estilos de vida
    sostenibles y respetuosos con el medioambiente.
- nodo: crit:BBIL02CE1.3
  campo: definition
  valor: Argumentar sobre aspectos relacionados con la biología humana, considerando los puntos fuertes y débiles de diferentes
    posturas de forma razonada, con el fin de participar en interacciones comunicativas, y valorando la importancia de mantener
    una actitud abierta, flexible, receptiva y respetuosa con las demás personas.
- nodo: crit:BBIL02CE2.1
  campo: definition
  valor: Plantear y resolver cuestiones y crear contenidos relacionados con los diferentes campos de estudio de la biología
    humana, localizando y citando fuentes de forma adecuada; seleccionando, organizando y analizando de forma crítica la información
    para poder adoptar un juicio propio; y argumentado ante problemas de actualidad, reutilizar la información y generar nuevos
    conocimientos.
- nodo: crit:BBIL02CE4.1
  campo: definition
  valor: Analizar la relación existente entre el correcto equilibrio y funcionamiento de los diferentes aparatos y sistemas,
    y los estilos de vida saludables, para proponer y adoptar una actitud responsable con el mantenimiento de la salud, tanto
    individual como colectiva.
- nodo: crit:BBIL02CE4.2
  campo: definition
  valor: Argumentar, a partir del análisis crítico de determinadas acciones humanas relacionadas con la salud, sobre la importancia
    de adoptar estilos de vida saludables que contemplen la salud física, mental y social, basándose en los aprendizajes adquiridos
    en esta materia, con el fin de tomar conciencia de la necesidad de emprender acciones, personales y colectivas, para contribuir
    a la construcción de una sociedad más sana, justa y solidaria.
- nodo: crit:BBIL02CE5.3
  campo: definition
  valor: Participar de forma activa en la construcción colectiva y evolutiva del conocimiento científico, en su entorno cotidiano
    y cercano, para que el alumnado se convierta en agente activo de la difusión del pensamiento, mantenga una posición crítica
    hacia la información científica y tecnológica, y ponga en valor la preservación del medioambiente y la salud pública,
    el desarrollo económico y la búsqueda de una sociedad igualitaria.
- nodo: crit:BBIL02CE5.4
  campo: definition
  valor: Analizar los efectos y la influencia de los nuevos avances médicos sobre la salud propia y comunitaria para promover
    estilos de vida sostenibles, argumentando sobre sus impactos positivos y la urgencia de adoptarlos, con el fin de convertir
    al alumnado en agente activo de la difusión del conocimiento científico y contribuir al logro de los objetivos concretados
    en la Agenda Canaria de Desarrollo Sostenible 2030.
- nodo: sb:BBIL02SBI.3
  campo: definition
  valor: Preparación de cortes histológicos, a partir de muestras de tejidos animales, y observación al microscopio óptico
    e interpretación.
- nodo: sb:BBIL02SBII.1
  campo: definition
  valor: Diferenciación entre alimentación y nutrición; y reflexión sobre la importancia de una alimentación saludable y nutritiva,
    así como de su repercusión positiva en la salud general de la persona.
- nodo: sb:BBIL02SBII.2
  campo: definition
  valor: Comparación de la anatomía de los sistemas implicados en la nutrición humana con la de órganos diseccionados en el
    laboratorio o mediante el uso de esquemas, modelos y simulaciones.
- nodo: sb:BBIL02SBIII.3
  campo: definition
  valor: 'Análisis evolutivo a lo largo de la historia de pandemias, epidemias, endemias y brotes epidémicos acontecidos:
    VIH, viruela del mono, sífilis…'
- nodo: sb:BBIL02SBIII.4
  campo: definition
  valor: Valoración de la educación sexual como parte del desarrollo integral de la persona, identificando las diferencias
    entre los conceptos de sexo y sexualidad, para poner el foco en el respeto a la libertad, la diversidad sexual y la igualdad
    de género.
- nodo: sb:BBIL02SBIII.5
  campo: definition
  valor: Concienciación sobre la importancia de adquirir prácticas sexuales saludables, responsables y consentidas, y sobre
    la prevención de infecciones de transmisión sexual (ITS) y de embarazos no deseados. Selección del método anticonceptivo
    y método de prevención de las ITS en función de las condiciones personales.
- nodo: sb:BBIL02SBIII.6
  campo: definition
  valor: Análisis de la influencia del tabaco, del alcohol y de otras drogas en la sexualidad y en la descendencia para conocer
    sus consecuencias.
- nodo: sb:BBIL02SBIV.3
  campo: definition
  valor: Estudio del eje hipotálamo-hipofisario-adrenal, y su relación con el estrés y los trastornos psicológicos y mentales
    para prevenir su sobreestimulación.
- nodo: sb:BBIL02SBIV.5
  campo: definition
  valor: Indagación sobre las organizaciones, fundaciones, asociaciones de apoyo a las personas que padecen alteraciones en
    la salud mental, para conocer de qué forma la sociedad responde a estos problemas.
- nodo: sb:BBIL02SBV.2
  campo: definition
  valor: Estudio de los diferentes métodos de diagnóstico para clasificar las enfermedades según su etiología, y conocimiento
    de las medidas de prevención y tratamiento.
- nodo: sb:BBIL02SBV.4
  campo: definition
  valor: Indagación sobre los beneficios de mostrar una actitud positiva ante la enfermedad para fomentar el autocuidado y
    la autorresponsabilidad.
- nodo: sb:BBIL02SBV.6
  campo: definition
  valor: Investigación sobre el funcionamiento y las prestaciones de la Sanidad Pública Canaria, comparándola con otros países.
- nodo: sb:BBIL02SBVI.1
  campo: definition
  valor: Identificación de los mecanismos básicos de la transmisión de la herencia genética y del concepto de gen, y su relación
    con los trastornos hereditarios humanos.
- nodo: sb:BBIL02SBVI.3
  campo: definition
  valor: Reflexión sobre las repercusiones sociales, éticas, económicas y medioambientales de las terapias avanzadas; y análisis
    sobre los fármacos y su uso responsable.
- nodo: sb:BBIL02SBVI.4
  campo: definition
  valor: Diferenciación entre tratamientos con base científica y pseudomedicina; y elaboración de un estudio crítico acerca
    del uso de las medicinas alternativas.
