id: '0266'
titulo: 'Ámbito Lingüístico y Social (Educación Secundaria Obligatoria): enunciados de competencia que cambian según el curso'
motivo: 'El documento oficial da a estas competencias un enunciado distinto en algunos cursos. La competencia guarda como
  enunciado (definition) el más repetido y, en enunciados_curso, el de los cursos en que difiere (decisión del 05-11-2026:
  enunciado por curso antes de la 1.0).'
fuente:
  documento: eso-ambito-linguistico-y-social
