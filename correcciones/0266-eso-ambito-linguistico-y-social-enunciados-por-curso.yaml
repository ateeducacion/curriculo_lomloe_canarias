  ubicacion: Tablas de bloques competenciales de cada curso
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: ce:SMBSC1
  campo: enunciados_curso
  valor:
    curso:S04: Comprender, interpretar y producir textos orales, escritos y multimodales con fluidez, coherencia, cohesión
      y registro adecuados, atendiendo a la corrección gramatical y ortográfica, para comunicarse de manera eficaz, cooperativa
      y respetuosa, construir conocimiento y dar respuesta a demandas comunicativas concretas.
