id: '0001'
titulo: 'Matemáticas ESO: enunciados de las competencias específicas 2, 4, 6, 8 y 10'
motivo: En Matemáticas cada bloque competencial agrupa dos competencias. La exportación solo conserva el enunciado de la primera
  de cada bloque; los de las competencias pares faltan.
fuente:
  documento: eso-matematicas
  fichero: fuentes/documentos/eso/Matematicas_ESO.odt
  ubicacion: Tablas de bloques competenciales de cada sección (1.º, 2.º y 3.º ESO; Matemáticas A y B)
estado: propuesta
aprobada_por: null
cambios:
- nodo: ce:SMATC2
  campo: definition
  valor: Analizar las soluciones de un problema usando diferentes técnicas y herramientas, evaluando las respuestas obtenidas,
    para verificar su validez e idoneidad desde un punto de vista matemático y su repercusión global.
- nodo: ce:SMATC4
  campo: definition
  valor: Utilizar los principios del pensamiento computacional organizando datos, descomponiendo en partes, reconociendo patrones,
    interpretando, modificando y creando algoritmos para modelizar situaciones y resolver problemas de forma eficaz.
- nodo: ce:SMATC6
  campo: definition
  valor: Identificar las matemáticas implicadas en otras materias y en situaciones reales susceptibles de ser abordadas en
    términos matemáticos, interrelacionando conceptos y procedimientos, para aplicarlos en situaciones diversas.
- nodo: ce:SMATC8
  campo: definition
  valor: Comunicar de forma individual y colectiva conceptos, procedimientos y argumentos matemáticos, usando lenguaje oral,
    escrito o gráfico, utilizando la terminología matemática apropiada, para dar significado y coherencia a las ideas matemáticas.
- nodo: ce:SMATC10
  campo: definition
  valor: Desarrollar destrezas sociales reconociendo y respetando las emociones y experiencias de los demás, participando
    activa y reflexivamente en proyectos en equipos heterogéneos con roles asignados, para construir una identidad positiva
    como estudiante de matemáticas, fomentar el bienestar personal y grupal y crear relaciones saludables.
