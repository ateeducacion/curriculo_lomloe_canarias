id: '0221'
titulo: 'Matemáticas (Educación Primaria): 5 diferencias corregidas con el documento oficial'
motivo: 'Diferencias que el contraste no explicaba con el BOC. Criterio aprobado: el ODT oficial de la web de currículos es
  la referencia y el corpus debe reflejarlo. Se rehacen con los saberes y la numeración del documento los bloques PMAT03SBI,
  PMAT04SBI, en los que faltaban o sobraban saberes. Tipos: descriptores de criterio distinto; falta en el corpus: texto de
  saber.'
