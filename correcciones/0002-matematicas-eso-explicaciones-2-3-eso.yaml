id: '0002'
titulo: 'Matemáticas 2.º y 3.º ESO: explicaciones de bloque copiadas de 1.º ESO'
motivo: En la exportación, las explicaciones de los bloques competenciales 1, 3, 5 y 9 de 2.º y 3.º ESO son idénticas a las
  de 1.º ESO. El documento oficial tiene un texto propio para cada curso.
fuente:
  documento: eso-matematicas
  fichero: fuentes/documentos/eso/Matematicas_ESO.odt
  ubicacion: Tablas de bloques competenciales de cada sección (1.º, 2.º y 3.º ESO; Matemáticas A y B)
estado: propuesta
aprobada_por: null
cambios:
- nodo: bc:SMAT02BC1
  campo: scopeNote
  valor: A través de este bloque competencial se persigue que el alumnado sea capaz de resolver problemas de la vida cotidiana
    y propios de las matemáticas de cualquiera de los bloques de los saberes básicos, siguiendo todas las fases de resolución,
    haciendo uso de herramientas manuales o digitales, como regletas, fichas, dados, calculadoras, hojas de cálculo, programas
    de representación gráfica o geometría dinámica, entre otros. Para ello se comprobará que el alumnado sea capaz de interpretar
    problemas matemáticos, identificando los datos y el objetivo, definiendo la relación que existe entre ellos y representando
    la información mediante herramientas de modelización como diagramas, expresiones simbólicas, gráficas, etc. Además, se
    pretende comprobar si el alumnado aplica estrategias, como la analogía con otros problemas, estimación, ensayo y error,
    resolución de manera inversa (ir hacia atrás), descomposición en problemas más sencillos, búsqueda de patrones, etc.,
    buscando un cambio de estrategia cuando sea necesario y transformando el error en oportunidad de aprendizaje. También
    se evaluará que sea capaz de obtener las soluciones óptimas de un problema.
- nodo: bc:SMAT02BC3
  campo: scopeNote
  valor: A través de este bloque competencial se pretende que el alumnado, empleando métodos inductivos, deductivos y lógicos
    propios del razonamiento matemático, sea capaz de formular y comprobar, de forma guiada, por medio de la experimentación
    y la indagación, conjeturas sencillas; utilizando para tal fin distintos materiales y herramientas digitales. Del mismo
    modo, se persigue que pueda reconocer patrones numéricos, analizar relaciones cuantitativas, así como desarrollar métodos
    con los que resolver problemas, actuando con curiosidad y perseverancia, para obtener e intercambiar conclusiones relevantes
    y generar nuevo conocimiento. Asimismo, este bloque competencial trata de comprobar que el alumnado sabe reconocer las
    variantes de un problema y las partes más simples en las que este se puede descomponer, a fin de facilitar su interpretación
    y su tratamiento computacional, y también, que el alumnado es capaz de modelizar diferentes situaciones de la vida cotidiana,
    apoyándose en representaciones matemáticas, en el lenguaje algebraico, y en aplicaciones informáticas sencillas. 
- nodo: bc:SMAT02BC5
  campo: scopeNote
  valor: Se persigue con este bloque competencial constatar que el alumnado es capaz de establecer conexiones entre diferentes
    procesos matemáticos, comenzando a desarrollar una visión coherente e integrada de las matemáticas, así como que sabe
    identificar las matemáticas implicadas en otras materias y en contextos reales reconociendo situaciones susceptibles de
    ser formuladas y resueltas mediante métodos propios del razonamiento científico, herramientas y estrategias matemáticas.
    También se evaluará que el alumnado reconoce la aportación de las matemáticas al progreso de la humanidad. En particular,
    su presencia y uso en diferentes contextos de las islas Canarias y su contribución a la superación de los retos que demanda
    la sociedad actual.
- nodo: bc:SMAT02BC9
  campo: scopeNote
  valor: A través de este bloque competencial, que se trabajará de manera interrelacionada con el resto de bloques de la materia,
    se persigue que el alumnado desarrolle destrezas personales y sociales, así como actitudes con las que entender y gestionar
    las emociones propias y las de los y las demás al trabajar individualmente o en grupo, seleccionando fortalezas y debilidades,
    mostrando actitud positiva y perseverante, gestionando las situaciones de incertidumbre y aceptando la crítica razonada
    para reconocer el error como una oportunidad de aprendizaje. Asimismo, se evaluará que el alumnado participa de manera
    activa, al trabajar en grupos heterogéneos, comunicándose de manera adecuada, practicando la escucha activa, realizando
    el trabajo en equipo, gestionando los conflictos y ayudando en el reparto de tareas, asumiendo el rol asignado, así como
    reconociendo y aceptando la diversidad presente en el aula y en la sociedad. 
- nodo: bc:SMAT03BC1
  campo: scopeNote
  valor: A través de este bloque competencial se persigue que el alumnado sea capaz de resolver problemas de la vida cotidiana
    y propios de las matemáticas de cualquiera de los bloques de los saberes básicos, siguiendo todas las fases de resolución,
    haciendo uso de diferentes herramientas manuales o digitales, como regletas, fichas, dados, calculadoras, hojas de cálculo,
    programas de representación gráfica o geometría dinámica, entre otros, seleccionando la más adecuada en función de la
    tarea. Para ello se comprobará que el alumnado sea capaz de interpretar problemas matemáticos, identificando los datos
    y el objetivo, definiendo la relación que existe entre ellos y representando la información mediante herramientas de modelización
    como diagramas, expresiones simbólicas, gráficas, etc. Además, se pretende comprobar si el alumnado aplica estrategias,
    como la analogía con otros problemas, estimación, ensayo y error, resolución de manera inversa (ir hacia atrás), descomposición
    en problemas más sencillos, búsqueda de patrones, etc., valorando su eficacia e idoneidad en la resolución de problemas,
    buscando un cambio de estrategia cuando sea necesario y transformando el error en oportunidad de aprendizaje. También
    se evaluará que sea capaz de obtener todas las soluciones posibles de un problema, así como seleccionar de entre ellas
    las óptimas, valorando tanto la corrección matemática como sus implicaciones desde diferentes perspectivas (de género,
    de sostenibilidad, de consumo responsable, etc.).
- nodo: bc:SMAT03BC3
  campo: scopeNote
  valor: A través de este bloque competencial se pretende que el alumnado, empleando métodos inductivos, deductivos y lógicos
    propios del razonamiento matemático, sea capaz de formular, comprobar y valorar, de forma guiada, por medio de la experimentación
    y la indagación, conjeturas sencillas; utilizando para tal fin diversos materiales y herramientas digitales, así como
    que sepa reconocer patrones. Además, se trata de comprobar que es capaz de plantear variantes de un problema, seleccionando
    distintas estrategias para su resolución, y que sabe descomponer un problema en partes más simples para facilitar su interpretación
    y su tratamiento computacional, haciendo un uso responsable de las tecnologías digitales que tiene a su alcance. Por último,
    se persigue que el alumnado sea capaz de modelizar diferentes situaciones y fenómenos de la vida cotidiana interpretando,
    modificando y generalizando distintos algoritmos.
- nodo: bc:SMAT03BC5
  campo: scopeNote
  valor: Se persigue con este bloque competencial constatar que el alumnado es capaz de establecer conexiones entre diferentes
    procesos matemáticos, comenzando a desarrollar una visión coherente e integrada de las matemáticas, así como que sabe
    identificar las matemáticas implicadas en otras materias y en contextos reales reconociendo situaciones susceptibles de
    ser formuladas y resueltas mediante métodos propios del razonamiento científico, herramientas y estrategias matemáticas.
    También se evaluará que el alumnado reconoce la aportación de las matemáticas al progreso de la humanidad. En particular
    su presencia y uso en diferentes contextos de las islas Canarias y su contribución a la superación de los retos que demanda
    la sociedad actual.
- nodo: bc:SMAT03BC9
  campo: scopeNote
  valor: A través de este bloque competencial, que se trabajará de manera interrelacionada con el resto de bloques de la materia,
    se persigue que el alumnado desarrolle destrezas personales y sociales, así como actitudes con las que entender, identificar
    y gestionar las emociones propias y las de los y las demás al trabajar individualmente o en grupo, valorando fortalezas
    y debilidades, mostrando actitud positiva y perseverante, gestionando las situaciones de incertidumbre y aceptando la
    crítica razonada para reconocer el error como una oportunidad de aprendizaje. Asimismo, se evaluará que el alumnado participa
    de manera activa y reflexiva al trabajar en grupos heterogéneos, comunicándose de forma asertiva, practicando la escucha
    activa, realizando el trabajo en equipo, gestionando los conflictos y el reparto de tareas, responsabilizándose del rol
    asignado y favoreciendo la aceptación de la diversidad presente en el aula y en la sociedad.
