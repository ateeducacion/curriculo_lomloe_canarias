  valor: La competencia específica 3 contribuye al desarrollo del alumnado, puesto que deberá ser capaz de interpretar y comentar
    textos clásicos latinos pertenecientes a diferentes géneros y épocas mediante una lectura comprensiva y con actitud crítica,
    al mismo tiempo que valora la diversidad lingüística y literaria que ofrecen estas obras. El alumnado profundizará en
    los aspectos más relevantes de la literatura latina mediante textos seleccionados u obras completas de los distintos géneros
    y autores, de manera que pueda lograr la autonomía en la lectura, fomentando el disfrute y la sensibilidad literaria,
    y producir textos escolares con intencionalidad estética y con ayuda de diferentes soportes y lenguajes, en los que reflexione
    sobre sus características y refleje los conocimientos adquiridos sobre estas cuestiones y su pervivencia en la literatura
    posterior, con especial mención a la literatura canaria, tras un proceso autónomo de búsqueda en internet, y de investigación
    y comparación de la información, de modo que esté en disposición de crear contenidos digitales, con la finalidad de formar
    su propio conocimiento en la construcción de la identidad personal y compartirlo en un entorno social arropado por la
    diversidad cultural y artística.
