id: '0225'
titulo: 'Bioestadística (Bachillerato): 3 diferencias corregidas con el documento oficial'
motivo: 'Diferencias que el contraste no explicaba con el BOC. Criterio aprobado: el ODT oficial de la web de currículos es
  la referencia y el corpus debe reflejarlo. Tipos: explicación de bloque distinto; texto de criterio distinto; texto de saber
  distinto.'
