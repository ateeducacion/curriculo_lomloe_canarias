id: 0219
titulo: 'Lengua Extranjera (Educación Primaria): 14 diferencias corregidas con el documento oficial'
motivo: 'Diferencias que el contraste no explicaba con el BOC. Criterio aprobado: el ODT oficial de la web de currículos es
  la referencia y el corpus debe reflejarlo. Tipos: texto de criterio distinto; texto de saber distinto.'
fuente:
  documento: primaria-lengua-extranjera
  fichero: fuentes/documentos/primaria/anexo_2__curriculo-lengua-extranjera.odt
  sha256: 6baef7fe62a16acfc2ccb342f736e6c8765a3cd9c60de08a28f08b94cffd26e9
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: crit:PLNT03CE4.2
  campo: definition
  valor: Seleccionar e implementar, de forma codirigida, estrategias básicas en situaciones colaborativas y cooperativas,
    apoyándose en el lenguaje no verbal y en las herramientas digitales y plataformas virtuales, con el fin de ayudar a las
    demás personas y facilitar la comprensión, y la producción de información y la comunicación.
- nodo: sb:PLNT03SBII.1
  campo: definition
  valor: Identificación de estrategias y técnicas de compensación de las carencias comunicativas para responder a una necesidad
    elemental, teniendo en cuenta las limitaciones derivadas del nivel de competencia en la lengua extranjera y en las demás
    lenguas del repertorio lingüístico propio.
- nodo: crit:PLNT04CE4.2
  campo: definition
  valor: Seleccionar e implementar, de forma codirigida, estrategias básicas en situaciones colaborativas y cooperativas,
    apoyándose en el lenguaje no verbal y en las herramientas digitales y plataformas virtuales, con el fin de ayudar a las
    demás personas y facilitar la comprensión, y la producción de información y la comunicación.
- nodo: sb:PLNT04SBII.1
  campo: definition
  valor: Identificación de estrategias y técnicas de compensación de las carencias comunicativas para responder a una necesidad
    elemental, teniendo en cuenta las limitaciones derivadas del nivel de competencia en la lengua extranjera y en las demás
    lenguas del repertorio lingüístico propio.
- nodo: crit:PLNT05CE3.1
  campo: definition
  valor: Participar, de manera progresivamente autónoma, en situaciones interactivas de intercambios de información breves
    y sencillos a través de textos escritos y orales, sobre temas cotidianos, de relevancia personal y próximos a su experiencia
    y contexto, mediante diferentes soportes, tanto analógicos como digitales, afrontando, entre otros, retos que impliquen
    la generación de ideas y la búsqueda de respuestas creativas y originales, con el fin de responder a propósitos comunicativos
    concretos y respetuosos, y favorecer actitudes cooperativas, y un uso ético y eficaz del lenguaje.
- nodo: sb:PLNT05SBI.5
  campo: definition
  valor: Empleo de unidades lingüísticas básicas y significados asociados a dichas unidades, tales como expresión de la entidad
    y sus propiedades, la cantidad y el número, el espacio y las relaciones espaciales, el tiempo, la afirmación, la negación,
    la interrogación y la exclamación, o las relaciones lógicas elementales.
- nodo: sb:PLNT05SBI.10
  campo: definition
  valor: Empleo de recursos para el aprendizaje y de estrategias para la búsqueda guiada de información en medios analógicos
    y digitales.
- nodo: sb:PLNT05SBII.1
  campo: definition
  valor: Implementación de estrategias y técnicas de compensación de las carencias comunicativas para responder eficazmente
    a una necesidad concreta,teniendo en cuenta las limitaciones derivadas del nivel de competencia en la lengua extranjera
    y en las demás lenguas del repertorio lingüístico propio.
- nodo: sb:PLNT05SBIII.1
  campo: definition
  valor: Uso de la lengua extranjera como medio de comunicación y relación con personas de otros países, y de conocimiento
    de culturas y modos de vida diferentes, y como forma de acceder a nueva información.
