- nodo: sb:PEUM05SBI
  campo: definition
  valor: 'Conciencia emocional: percepción, identificación, comprensión y aceptación responsable de las propias emociones'
- nodo: sb:PEUM05SBI.5
  campo: definition
  valor: Identificación, comprensión, razonamiento, descripción y evaluación de las emociones originadas en relación con los
    sucesos desencadenantes en contextos de su vida diaria, a través de experiencias vivenciadas en el aula con diferentes
    lenguajes multimodales.
- nodo: sb:PEUM05SBI.6
  campo: definition
  valor: Conocimiento de recursos y estrategias favorecedoras del diálogo reflexivo (su yo y el mundo y la conexión con las
    otras personas, escucha activa, mensajes-yo…), a través del modelaje o role play en diferentes situaciones escolares.
- nodo: sb:PEUM05SBI.10
  campo: definition
  valor: Vivenciar sus emociones de manera efectiva y adaptativa, a través de múltiples experiencias en el ámbito escolar,
    con la finalidad de comprenderlas y comenzar a responsabilizarse de la gestión de las mismas.
- nodo: sb:PEUM05SBII.3
  campo: definition
  valor: 'Expresión y control de las propias emociones, en pro de una convivencia positiva con el resto de personas, aplicando
    habilidades del pensamiento y de rutinas como: «comparto, agradezco y me comprometo», para ejercitar el sentido crítico
    y la autonomía e iniciativa en la toma de decisiones en el grupo de iguales y con las personas adultas.'
- nodo: sb:PEUM05SBIV.10
  campo: definition
  valor: Interés por las experiencias e ideas comunes, y receptividad frente a lo diferente, lo nuevo o lo alternativo, rompiendo
    estereotipos y fomentando la actitud crítica.
