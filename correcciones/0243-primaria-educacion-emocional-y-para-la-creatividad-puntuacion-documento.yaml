id: '0243'
titulo: 'Educación Emocional y para la Creatividad (Educación Primaria): 26 textos con la puntuación del documento oficial'
motivo: 'Textos que solo difieren en la puntuación y que el BOC no permite decidir (el texto extraído del PDF no conserva
  la puntuación de forma fiable). Criterio aprobado: el ODT oficial es la referencia y el corpus debe reflejarlo.'
fuente:
  documento: primaria-educacion-emocional-y-para-la-creatividad
  fichero: fuentes/documentos/primaria/anexo_2_curriculo-educacion_emocional_para_creatividad.odt
  sha256: d8bbb4b3c9352f688bab39e85898368441b6303659bb08747e32859e61e650d8
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: sb:PEUM01SBI
  campo: definition
  valor: 'Conciencia emocional: percepción, identificación, validación y aceptación responsable de las propias emociones'
- nodo: sb:PEUM01SBIII.1
  campo: definition
  valor: Comunicación de los efectos en sus emociones a partir de su interacción e interdependencia con las demás personas,
    el medio y los objetos, identificando y comprendiendo las señales emociones en las otras personas para desarrollar una
    relación interpersonal que favorezca el respeto a la convivencia.
- nodo: sb:PEUM01SBIV
  campo: definition
  valor: 'Autoconfianza creativa: Técnicas creativas aplicadas a múltiples lenguajes expresivos y estimulación multisensorial'
- nodo: sb:PEUM01SBIV.6
  campo: definition
  valor: 'Percepción de los obstáculos sociales que limitan la propia capacidad creativa, a partir de la vivencia corporal
    u otros recursos asistenciales; e identificación de los aspectos afectivos implicados: el miedo, el conformismo, la vergüenza,
    la obediencia…'
- nodo: sb:PEUM02SBI
  campo: definition
  valor: 'Conciencia emocional: percepción, identificación, validación y aceptación responsable de las propias emociones'
- nodo: sb:PEUM02SBIII.1
  campo: definition
  valor: Comunicación de los efectos en sus emociones a partir de su interacción e interdependencia con las demás personas,
    el medio y los objetos, identificando y comprendiendo las señales emociones en las otras personas para desarrollar una
    relación interpersonal que favorezca el respeto a la convivencia.
- nodo: sb:PEUM02SBIV
  campo: definition
  valor: 'Autoconfianza creativa: Técnicas creativas aplicadas a múltiples lenguajes expresivos y estimulación multisensorial'
- nodo: sb:PEUM02SBIV.6
  campo: definition
  valor: 'Percepción de los obstáculos sociales que limitan la propia capacidad creativa, a partir de la vivencia corporal
    u otros recursos asistenciales; e identificación de los aspectos afectivos implicados: el miedo, el conformismo, la vergüenza,
    la obediencia…'
- nodo: sb:PEUM03SBI.5
  campo: definition
  valor: 'Adquisición y utilización de vocabulario relacionado con sensaciones: respiración pausada-agitada, gestos faciales
    tensos-relajados, manos sudorosas-secas, agitación-relajación corporal, mirada serena-inquieta…, con la finalidad de expresarnos
    y desarrollar el autoconocimiento.'
- nodo: sb:PEUM03SBI.6
  campo: definition
  valor: Comunicación de las propias sensaciones a través de la utilización de la expresión lingüística, cultural, artística
    creativa, corporal, proporcionando múltiples formas de implicación, representación y expresión…, con el fin de percibir
    las emociones adecuadas a través de lenguajes multimodales.
- nodo: sb:PEUM03SBII.3
  campo: definition
  valor: 'Expresión y control de las propias emociones, en pro de una convivencia positiva con el resto de personas, aplicando
    habilidades del pensamiento y de rutinas como: «comparto, agradezco y me comprometo», para ejercitar el sentido crítico
    y la autonomía e iniciativa en la toma de decisiones en el grupo de iguales y con las personas adultas.'
- nodo: sb:PEUM04SBI.5
  campo: definition
  valor: 'Adquisición y utilización de vocabulario relacionado con sensaciones: respiración pausada-agitada, gestos faciales
    tensos-relajados, manos sudorosas-secas, agitación-relajación corporal, mirada serena-inquieta…, con la finalidad de expresarnos
