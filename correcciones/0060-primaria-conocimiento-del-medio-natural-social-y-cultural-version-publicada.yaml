- nodo: bc:PC9N03BC1
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de utilizar dispositivos y recursos
    del entorno digital de aprendizaje, de forma segura, responsable, saludable y sostenible, individualmente y en equipo,
    con acompañamiento del profesorado, para dar respuesta a las necesidades del contexto educativo. Se verificará que realiza
    búsquedas guiadas, procedente de dos o más fuentes, a través de estrategias de valoración, discriminación, selección y
    organización de la información. Se valorará que utilice los dispositivos y recursos digitales para comunicarse en plataformas
    restringidas y supervisadas, de manera segura, compartiendo datos y haciendo uso de la etiqueta digital, de las reglas
    básicas de cortesía y respeto, y de estrategias para resolver problemas en la comunicación digital. Asimismo, se constatará
    que trabaja con esos dispositivos y recursos digitales, de manera cooperativa, en el marco de proyectos de investigación,
    experimentación, acciones, retos, etc., que parten del conocimiento sobre el medio canario. Se evaluará, además, que reelabore
    y cree contenidos digitales sencillos, con diferentes formatos (dibujos, diagramas, gráficos, símbolos, texto, tabla,
    audio, vídeo, programa informático…) y que utilice herramientas digitales, adoptando un punto de vista creativo y personal,
    y aprovechando, de forma crítica, ética y responsable, la cultura digital para compartir nuevos conocimientos. Para ello,
    el alumnado deberá mostrar que respeta la propiedad intelectual y los derechos de autoría. Por último, se evaluará que
    el alumnado desarrolla estrategias de actuación para fomentar el bienestar digital físico y mental (tiempo excesivo de
    uso, ciberacoso, acceso a contenidos inadecuados, publicidad y correos no deseados, etc.), con el fin de adoptar, con
    la orientación docente, medidas preventivas para proteger los dispositivos, los datos personales, la salud y el medioambiente,
    de manera que se desenvuelva en el ambiente digital más allá del mero manejo de dispositivos y la búsqueda de información
    en la red.
- nodo: bc:PC9N03BC2
  campo: scopeNote
  valor: A través de este bloque competencial, se aspira a que el alumnado utilice el pensamiento científico para entender
    y explicar algunos de los fenómenos que ocurren a su alrededor, demosttrando curiosidad, iniciativa y constancia, en investigaciones
    contextualizadas en el medio natural, social y cultural de Canarias, a partir de estrategias cooperativas. Se evaluará
    que se inicie en la investigación científica, utilizando modelos propios del pensamiento científico (observación en el
    tiempo, identificación y clasificación, búsqueda de patrones, creación de modelos, investigación guiada a través de la
    búsqueda de información, experimentos pautados con control de variables…) y manipulando instrumentos, dispositivos y herramientas
    digitales apropiados, para realizar observaciones y mediciones, y para interpretar y explicar hechos y fenómenos que ocurren
    en el medio natural, social y cultural. Se comprobará, además, que utiliza el vocabulario científico básico para comunicar
    y construir nuevos conocimientos. Para ello, se constatará que, en las investigaciones, formula preguntas y realiza predicciones
    razonadas; busca, selecciona y comprende información de diferentes fuentes; realiza experimentos guiados; interpreta la
    información y los resultados obtenidos, comparándolos con las predicciones realizadas, y comunica los resultados en diferentes
    formatos. Se evaluará, asimismo, que reconozca los avances en el pasado relacionados con la ciencia y la tecnología, que
    han contribuido a transformar nuestra sociedad, así como la aportación histórica de las mujeres, y que reconoce el desarrollo
    de la ciencia en Canarias. Se comprobará, por último, que valora el uso de la ciencia y la tecnología para ayudar a comprender
    las causas de las propias acciones, tomar decisiones razonadas y realizar tareas de forma más eficiente.
- nodo: bc:PC9N03BC3
  campo: scopeNote
  valor: A través de este bloque competencial, se evaluará que el alumnado sea capaz de resolver problemas sencillos, de forma
    guiada, para generar cooperativamente un producto creativo e innovador, aplicando las fases de los proyectos de diseño
    (diseño, prototipado, prueba y comunicación) y del pensamiento computacional, de manera que se inicie en la programación
    a través de recursos analógicos (actividades desenchufadas) y digitales (plataformas digitales de iniciación en la programación,
    aplicaciones de programación por bloques, robótica educativa…). Para ello, el alumnado experimentará, de forma segura
    y creativa, con diferentes herramientas, técnicas y materiales, adecuados a la consecución del proyecto. Se evaluará,
    asimismo, la capacidad del alumnado para desarrollar técnicas cooperativas sencillas para el trabajo en equipo y estrategias
    para la gestión de conflictos y la promoción de conductas empáticas e inclusivas, procurando la participación de todo
    el grupo en la resolución pacífica de los desacuerdos que puedan surgir. Se constatará, además, que es capaz de explicar
    los pasos seguidos, autoevaluando y coevaluando el proceso realizado y el resultado obtenido.
- nodo: bc:PC9N03BC4
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue que el alumnado tome conciencia del propio cuerpo y su expresión,
    para fortalecer el optimismo y la empatía, y permitir la participación constructiva en los retos y los cambios que surgen
    en su entorno. Se evaluará que sea capaz de aplicar el conocimiento científico para demostrar actitudes que fomenten el
    bienestar de la persona en todas sus dimensiones, y que desarrolla la conciencia emocional (percepción, reconocimiento
    y comprensión emocional de alegría, tristeza, miedo, enfado, asco, sorpresa, culpa y vergüenza), la regulación emocional
    (autocontrol impulsivo, ajuste afectivo y responsabilidad emocional) y la vinculación emocional (empatía y comunicación
    emocional), para establecer relaciones afectivas saludables basadas en el cuidado de las personas. Se constatará, además,
    que demuestra actitudes inclusivas y de corresponsabilidad, así como una educación afectivo-sexual adaptada a su nivel
    madurativo. Se valorará, además, que desarrolle estilos de vida saludables para su bienestar físico y mental, y que participe,
    empleando estrategias cooperativas, en acciones fundamentadas científicamente para promover la salud, valorando la importancia
    de una alimentación variada, equilibrada y sostenible, la higiene, el ejercicio físico, el contacto con la naturaleza,
    el descanso y cuidado del cuerpo, así como el uso adecuado de las tecnologías.
- nodo: bc:PC9N03BC5
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de identificar, de manera guiada, las
    características, la organización y las propiedades de los elementos del medio natural, social y cultural; así como las
    conexiones sencillas entre ellos, de forma que adquiera un conocimiento científico conectado que movilice en las investigaciones
    o los proyectos que realice, y que le ayude a visibilizar los problemas relacionados con el uso del espacio y sus transformaciones,
    los cambios y adaptaciones protagonizados por la humanidad a través del tiempo para cubrir sus necesidades, y las distintas
    organizaciones sociales que han ido desarrollándose. Se evaluará, asimismo, que valore y proteja el patrimonio cultural
    y el natural, local, insular y estatal; demostrando actitudes en pro del cuidado y la conservación de los espacios protegidos
    y de los parques nacionales de Canarias, emprendiendo acciones para su uso responsable, a través de propuestas de actuaciones
    originales y sostenibles, que respondan a los retos planteados y permitan su participación en la conservación y la creación
    de nuevos patrimonios.
- nodo: bc:PC9N03BC6
  campo: scopeNote
  valor: 'A través de este bloque competencial, se verificará que el alumnado identifica las causas y consecuencias de la
    intervención humana en el entorno próximo, desde los puntos de vista social, económico, cultural, tecnológico y ambiental,
    para poner en práctica estilos de vida sostenibles y potenciar un modelo de isla sostenible para Canarias. Se comprobará
    que reconoce comportamientos respetuosos de cuidado, corresponsabilidad y protección del entorno (consumo y producción
    responsable, alimentación sostenible, uso eficiente del agua y la energía, movilidad sostenible, prevención y gestión
    de los residuos…). Se valorará, asimismo, que identifique, de manera individual y cooperativa, problemas ecosociales (cambio
    climático; desarrollo sostenible; desigualdades sociales y diferencias de acceso a los recursos; usos del espacio por
    el ser humano; fragmentación del territorio en Canarias por su carácter insular y las implicaciones del aislamiento del
    archipiélago: el valor, el control del dinero y los medios de pago; el maltrato animal…) y que proponga soluciones valiosas
    para su resolución, desde la reflexión guiada y la resolución pacífica de los conflictos. Se evaluará, además, el fomento
    de la responsabilidad ecosocial en el alumnado: ecodependencia (relación que existe entre los seres vivos y los ecosistemas
    en los que viven) e interdependencia entre personas, sociedades y medio natural, facilitando su empoderamiento como agente
    de cambio ecosocial desde una perspectiva emprendedora y cooperativa, a través del diseño y la participación en actividades
    que permitan avanzar hacia la consecución de los ODS.'
- nodo: bc:PC9N03BC7
  campo: scopeNote
  valor: Este bloque competencial tiene como finalidad que el alumnado sea capaz de localizar, seleccionar e identificar hechos
    del entorno social y cultural, desde la Prehistoria hasta la Edad Antigua, empleando las nociones de causalidad, simultaneidad
    y sucesión; así como de reconocer personas, grupos sociales relevantes y formas de vida de dichas sociedades, así como
    el papel que mujeres y hombres han desempeñado en las mismas como protagonistas individuales y colectivos de la historia,
    para relacionar las diferentes épocas e identificar las acciones y los hechos más destacados en cada una de ellas, respetando
    la diversidad lingüística y cultural. Para ello, se evaluará que el alumnado adquiera nociones básicas de tiempo histórico,
    que clasifique y utilice las distintas fuentes históricas (orales, escritas, patrimoniales y museísticas), para explicar
    y valorar las relaciones entre diferentes elementos y acontecimientos (los cambios y la permanencia en la localidad a
    lo largo de la historia; las huellas de la historia en lugares, edificios, objetos, oficios o tradiciones de la localidad;
    la supervivencia y la alimentación; la vivienda; los intercambios comerciales; la explotación de bienes y recursos; los
    avances técnicos; las relaciones, los conflictos, las creencias; la función del arte y la cultura; las aportaciones y
    representación de las mujeres…), para comprender la forma en la que el pasado contribuye en la configuración del presente
    y del futuro.
- nodo: bc:PC9N03BC8
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue constatar que el alumnado es capaz de analizar la importancia demográfica,
    cultural y económica de las migraciones en la actualidad y su reflejo en Canarias (factores que modifican la ocupación
    y distribución de la población en el espacio, representación gráfica y cartográfica de la población, conocimiento de la
    organización del territorio en España y Europa, las costumbres, tradiciones y manifestaciones etnoculturales del entorno…),
    respetando la diversidad cultural presente en su municipio, isla o archipiélago; y reconociendo su valor para mejorar
    la convivencia y contribuir al bienestar individual y colectivo de una sociedad en continua transformación. Se constatará
    que el alumnado afronta esta realidad múltiple y diversa desde los principios de igualdad, de respeto a los derechos humanos
    y de la infancia, y desde los valores del europeísmo, para prevenir prejuicios y actitudes discriminatorias y favorecer
    la inclusión y la cohesión social, oponiéndose a cualquier forma de discriminación o violencia. Se evaluará, también,
    que el alumnado reconozca y valore positivamente las acciones que fomentan la igualdad efectiva entre mujeres y hombres,
    y las conductas no sexistas, reconociendo modelos positivos a lo largo de la historia; y que participe en actividades
    comunitarias desarrollando técnicas cooperativas sencillas para el trabajo en equipo.
- nodo: bc:PC9N03BC9
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue constatar que el alumnado es capaz de realizar actividades en el
    contexto de la comunidad escolar, asumiendo responsabilidades y estableciendo acuerdos de forma democrática, a través
    de la adquisición de compromisos y del respeto a las normas que rigen la vida en sociedad, favoreciendo la utilización
    eficaz de los diferentes sistemas de comunicación y empleando un lenguaje inclusivo y no violento. En este marco de convivencia,
    se valorará que pueda reflexionar y valorar la importancia de la gestión de los principales órganos de gobierno para la
    seguridad integral ciudadana y la participación democrática, por medio del conocimiento de las principales instituciones
    y entidades del entorno local, autonómico y nacional, y de los servicios públicos que prestan, prestando especial atención
    al papel de ayuntamiento y cabildos en el contexto de Canarias. Además, se valorará que interioriza normas básicas para
    la convivencia en el uso de los espacios públicos como peatones o como personas usuarias de los medios de locomoción,
    identificando las normas de circulación, las señales de tráfico y las marcas viales, valorando la ciudad como un espacio
    de convivencia inclusiva e igualitaria, y tomando conciencia de la importancia de una movilidad segura, saludable y sostenible.
- nodo: bc:PC9N04BC1
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de utilizar dispositivos y recursos
    del entorno digital de aprendizaje, de forma segura, responsable, saludable y sostenible, individualmente y en equipo,
    con acompañamiento del profesorado, para dar respuesta a las necesidades del contexto educativo. Se verificará que realiza
    búsquedas guiadas, procedente de dos o más fuentes, a través de estrategias de valoración, discriminación, selección y
    organización de la información. Se valorará que utilice los dispositivos y recursos digitales para comunicarse en plataformas
    restringidas y supervisadas, de manera segura, compartiendo datos y haciendo uso de la etiqueta digital, de las reglas
    básicas de cortesía y respeto, y de estrategias para resolver problemas en la comunicación digital. Asimismo, se constatará
    que trabaja con esos dispositivos y recursos digitales, de manera cooperativa, en el marco de proyectos de investigación,
    experimentación, acciones, retos, etc., que parten del conocimiento sobre el medio canario. Se evaluará, además, que reelabore
    y cree contenidos digitales sencillos, con diferentes formatos (dibujos, diagramas, gráficos, símbolos, texto, tabla,
    audio, vídeo, programa informático…) y que utilice herramientas digitales, adoptando un punto de vista creativo y personal,
    y aprovechando, de forma crítica, ética y responsable, la cultura digital para compartir nuevos conocimientos. Para ello,
    el alumnado deberá mostrar que respeta la propiedad intelectual y los derechos de autoría. Por último, se evaluará que
    el alumnado desarrolla estrategias de actuación para fomentar el bienestar digital físico y mental (tiempo excesivo de
    uso, ciberacoso, acceso a contenidos inadecuados, publicidad y correos no deseados, etc.), con el fin de adoptar, con
    la orientación docente, medidas preventivas para proteger los dispositivos, los datos personales, la salud y el medioambiente,
    de manera que se desenvuelva en el ambiente digital más allá del mero manejo de dispositivos y la búsqueda de información
    en la red.
