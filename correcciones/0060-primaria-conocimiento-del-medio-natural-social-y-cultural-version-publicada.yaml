    guiadas, fiables y útiles, con una actitud crítica, sobre los contenidos obtenidos; y que los utiliza para comunicarse
    en plataformas digitales restringidas y seguras, compartiendo datos en diversos formatos, para facilitar su comprensión
    y análisis, haciendo uso de la etiqueta digital, de las reglas básicas de cortesía y respeto, y de estrategias para resolver
    problemas en la comunicación digital. Se valorará que trabaje con los dispositivos y recursos digitales, cooperativamente,
    en el marco de proyectos de investigación, experimentación, acciones, etc., que se nutran del medio canario para comprender
    los desafíos del mundo actual, de manera que el alumnado pueda reconocer necesidades para elaborar ideas originales y
    soluciones valiosas a los mismos. Se evaluará, además, que cree, integre y reelabore contenidos digitales sencillos, experimentando,
    de forma creativa, con diferentes medios, soportes y técnicas digitales (visuales, audiovisuales, sonoras…), para resolver
    problemas concretos o retos, solicitando ayuda en caso necesario. Para ello, el alumnado deberá demostrar que respeta
    la propiedad intelectual y la autoría de los recursos que reutiliza. Por último, se evaluará que el alumnado desarrolle
    estrategias de actuación para fomentar el bienestar digital físico y mental (tiempo excesivo de uso, ciberacoso, dependencia
    tecnológica, acceso a contenidos inadecuados, etc.), con el fin de adoptar, con la orientación docente, medidas preventivas
    para proteger los dispositivos, los datos personales, la salud y el medioambiente, de manera que pueda desenvolverse en
    un ambiente digital con una actitud abierta, crítica y responsable ante su uso.
- nodo: bc:PC9N05BC2
  campo: scopeNote
  valor: A través de este bloque competencial, se aspira a que el alumnado interprete y explique hechos y fenómenos que ocurren
    en el medio natural, social y cultural, local y global, partiendo de la curiosidad, la iniciativa, la constancia y el
    sentido de la responsabilidad, en la realización de las diferentes investigaciones cooperativas. Se evaluará que se inicie
    en la investigación científica, utilizando modelos propios del pensamiento científico (observación, formulación de preguntas
    y predicciones, diseño y realización de experimentos guiados, recogida y análisis de información y datos, comunicación
    de resultados…), e instrumentos, dispositivos y herramientas digitales apropiados, para realizar observaciones y mediciones,
    y para interpretar y explicar hechos y fenómenos que ocurren en el medio natural, social y cultural, haciendo uso del
    vocabulario científico apropiado. Se valorará, además, que sea capaz de comunicar, compartir y construir nuevos conocimientos.
    Para ello, se constatará que, en las investigaciones, formula preguntas y realiza predicciones razonadas; que busca, selecciona
    y comprende información de diferentes fuentes; que diseña y realiza experimentos guiados; que interpreta la información
    y los resultados obtenidos, comparándolos con las predicciones realizadas; y que comunica los resultados en diferentes
    formatos, utilizando vocabulario científico básico. Se evaluará, asimismo, que valore la ciencia, la tecnología y la ingeniería
    como actividades humanas, a través de las profesiones STEM en la actualidad, evitando estereotipos sexistas y visibilizando
    la ciencia que se realiza en Canarias, especialmente la llevada a cabo por mujeres científicas. Se constatará, además,
    que conoce la relación entre los avances en matemáticas, ciencia, ingeniería y tecnología, para comprender la evolución
    de la sociedad en el ámbito científico-tecnológico y divulgarlos.
- nodo: bc:PC9N05BC3
  campo: scopeNote
  valor: A través de este bloque competencial, se evaluará que el alumnado es capaz de plantear cooperativamente problemas
    de diseño que se resuelvan con la creación de un producto creativo e innovador (prototipo o solución digital sencilla
    y sostenible), y de resolver problemas, de forma guiada, a través de la aplicación de las fases de los proyectos de diseño
    (identificación de necesidades, diseño, prototipado, prueba, evaluación y comunicación) y del pensamiento computacional
    (descomposición de una tarea en partes más sencillas, reconocimiento de patrones y creación de algoritmos sencillos para
    la resolución…). Para ello, el alumnado experimentará, de forma creativa, con diferentes herramientas, dispositivos, técnicas,
    materiales y recursos digitales (programación por bloques, sensores, motores, simuladores, impresoras 3D…), seguros y
    adecuados a la consecución del proyecto. Se evaluará, asimismo, la capacidad del alumnado para desarrollar estrategias
    creativas en situaciones de incertidumbre (detección de necesidades y oportunidades, adaptación y cambio de propuesta
    cuando sea necesario, valoración del error propio y ajeno como fuente de aprendizaje y valoración de la diversidad como
    enriquecimiento en el desempeño cooperativo), procurando la participación de todo el grupo para resolver pacíficamente
    los conflictos que puedan surgir. Se constatará, además, que es capaz de adoptar posturas críticas en procesos de reflexión
    guiados y participar en procesos de auto y coevaluación, valorando el proceso realizado y el resultado obtenido.
- nodo: bc:PC9N05BC4
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue constatar que el alumnado es capaz de aplicar el conocimiento científico
    para promover actitudes que fomenten el bienestar de una persona en todas sus dimensiones, que desarrolla la conciencia
    emocional (percepción, reconocimiento y comprensión emocional de alegría, tristeza, miedo, enfado, asco, sorpresa, culpa,
    vergüenza, ansiedad, seguridad y amor), la regulación emocional (autocontrol impulsivo, ajuste afectivo y responsabilidad
    emocional), el cambio emocional (compensación emocional) y la vinculación emocional (empatía y comunicación emocional),
    para fomentar relaciones afectivas y sociales saludables basadas en los cuidados de las personas desde la corresponsabilidad
    e inclusión. Se comprobará que describe las funciones vitales básicas del ser humano desde una perspectiva integrada (obtención
    de energía, relación con el entorno y perpetuación de la especie), así como que reconoce los cambios físicos, emocionales
    y sociales que conllevan la pubertad y la adolescencia, para favorecer su aceptación, de forma positiva, a través de la
    educación afectivo-sexual, adaptada a su nivel madurativo. Se valorará, además, que adopta estilos de vida saludables
    para su bienestar físico y mental; y que participa, empleando estrategias cooperativas, en acciones fundamentadas científicamente
    para promover la salud, desarrollando pautas para una alimentación saludable y sostenible y para una salud emocional y
    social adecuadas (higiene del sueño, prevención y consecuencias del consumo de drogas, gestión saludable del ocio y del
    tiempo libre, contacto con la naturaleza y uso adecuado de las tecnologías). Asimismo, se evaluará que el alumnado tenga
    conocimiento de actuaciones básicas de primeros auxilios y pautas para la prevención de riesgos y accidentes.
- nodo: bc:PC9N05BC5
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de identificar y analizar los elementos
    del medio natural, social y cultural, así como de establecer conexiones sencillas entre ellos, permitiéndole adquirir
    un conocimiento científico conectado que movilizará en las investigaciones o los proyectos que realice, y le ayudará a
    visibilizar los problemas relacionados con el uso del espacio y sus transformaciones, los cambios y adaptaciones protagonizados
    por la humanidad a través del tiempo para sus necesidades, y las distintas organizaciones sociales que han ido desarrollándose.
    Se evaluará, asimismo, que valora, protege y muestra actitudes de conservación y mejora del patrimonio natural y del cultural,
    como bien y recurso, apreciando la herencia cultural a escala local, nacional y europea, y que emprende acciones para
    su uso responsable, a través de propuestas de actuaciones originales, sostenibles y éticas, que respondan, de forma creativa,
    a los retos planteados y permitan la participación en la conservación y la creación de nuevos patrimonios.
- nodo: bc:PC9N05BC6
  campo: scopeNote
  valor: A través de este bloque competencial, se verificará que el alumnado identifica las causas y consecuencias de la intervención
    humana en el entorno próximo, desde los puntos de vista social, económico, cultural, tecnológico y ambiental, para promover
    estilos de vida sostenibles y consecuentes con el respeto, los cuidados, la corresponsabilidad y la protección de las
    personas y del planeta. Se valorará que afronta problemas ecosociales (el cambio climático, el desarrollo sostenible,
    la distribución de la riqueza, la ciudad como espacio de convivencia, la economía verde, los derechos laborales de mujeres
    y hombres…), propone soluciones valiosas y actúa en su resolución, desde la reflexión y la interacción comunicativa. Se
    evaluará, además, el fomento de la responsabilidad ecosocial en el alumnado, que comprende la ecodependencia (relación
    que existe entre los seres vivos y los ecosistemas en los que viven), la interdependencia e interrelación entre las personas,
    las sociedades y el medio natural, facilitando su empoderamiento como agente de cambio ecosocial, de lo local a lo global,
    desde una perspectiva emprendedora y cooperativa, a través del diseño y la participación en actividades que permitan avanzar
    hacia la consecución de los ODS de manera consciente y contextualizada.
- nodo: bc:PC9N05BC7
  campo: scopeNote
  valor: Con este bloque competencial se comprobará que el alumnado es capaz de analizar las relaciones de causalidad, simultaneidad
    y sucesión entre diferentes elementos del medio social y cultural desde la Edad Media hasta la actualidad, así como conocer
    personas, grupos sociales relevantes y formas de vida de dichas sociedades, respetando la diversidad lingüística y cultural.
    Para ello, se evaluará que el alumnado clasifica y utiliza las distintas fuentes históricas (orales, escritas, patrimoniales
    y museísticas), para explicar y valorar las relaciones entre diferentes elementos y acontecimientos (el papel de la mujer
    en la historia y los principales movimientos en defensa de sus derechos; la situación actual y los retos de futuro en
    la igualdad de oportunidades entre mujeres y hombres; la memoria democrática, análisis multicausal del proceso de construcción
    de la democracia en España, fórmulas para la participación de la ciudadanía en la vida pública; las expresiones artísticas
    y culturales medievales, modernas y contemporáneas y su contextualización histórica visibilizando las aportaciones y representación
    de las mujeres en ellas…). Se evaluará, además, que el alumnado comprende que los elementos y las manifestaciones culturales
    de cada sociedad son la expresión de complejas relaciones económicas, sociales y políticas, así como de los valores, las
    creencias e ideas que las sustentan, pero también de sus múltiples identidades, del talento de sus integrantes y de las
    relaciones con otras culturas. Se comprobará, por tanto, que comprende, reflexiona y adopta posturas críticas, de manera
    constructiva y comunicativa, sobre la forma en la que el pasado contribuye en la configuración del presente y cómo los
    retos del mundo actual influirán en el futuro de nuestra sociedad y del planeta.
- nodo: bc:PC9N05BC8
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue constatar que el alumnado es capaz de analizar los procesos geográficos,
    históricos y culturales que han conformado la sociedad actual (movimientos migratorios, minorías étnicas presentes en
    nuestro país, diversidad cultural y lingüística de España…), y su reflejo en Canarias, respetando y valorando la diversidad
    cultural presente en su entorno, reconociendo y comprendiendo su valor como factor de mejora de la convivencia y del bienestar
    individual y colectivo de una sociedad en continua transformación. Esta realidad múltiple y diversa debe afrontarse desde
    los principios de igualdad, de respeto a los derechos humanos y de la infancia, y desde los valores del europeísmo, para
    prevenir prejuicios y actitudes discriminatorias, y favorecer la inclusión y la cohesión social. Se evaluará, también,
    que el alumnado promueva acciones, empleando estrategias cooperativas en actividades comunitarias, para la igualdad efectiva
    entre mujeres y hombres, para evitar las conductas sexistas, a través del desarrollo del pensamiento crítico de los estereotipos
    y roles, y para respetar la diversidad afectivo-sexual, analizando y contrastando diferentes modelos en nuestra sociedad.
    Se valorará que el alumnado respete todo tipo de diversidades asociadas a la etnicidad, el género, la edad, las creencias,
    la identidad, la orientación sexual o la situación funcional de las personas, mostrando actitudes basadas en el respeto
    y el desarrollo universal, la inclusión, la equidad y la accesibilidad, de manera que se oponga a cualquier forma de discriminación
    o violencia.
- nodo: bc:PC9N05BC9
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue constatar que el alumnado es capaz de resolver los conflictos de
    forma pacífica y comunicativa, ejercitando las principales normas, derechos, deberes y libertades que forman parte de
    los principios y valores de los derechos humanos y de la infancia, de la Constitución española de 1978 y de la Unión Europea,
    favoreciendo la utilización no solo eficaz sino también ética de los diferentes sistemas de comunicación. En este marco
    de convivencia, se valorará que pueda explicar el funcionamiento general de los sistemas de representación y de participación
    política del entorno local, autonómico y nacional en España, los ámbitos de acción de las instituciones europeas y su
    repercusión en el entorno, valorando la función que el Estado y sus instituciones desempeñan en el mantenimiento de la
    seguridad integral, la defensa como un compromiso cívico y solidario al servicio de la paz, el reconocimiento de las víctimas
    de violencia y la cooperación internacional para el desarrollo, con el fin de preparar al alumnado para afrontar los retos
    y desafíos del siglo XXI.
