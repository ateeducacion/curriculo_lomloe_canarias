cambios:
- nodo: bc:PC9N01BC1
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de utilizar, con supervisión y de manera
    segura, saludable y sostenible, dispositivos y recursos del entorno digital de aprendizaje, de forma individual y en equipo,
    con el debido acompañamiento y pautas, para dar respuesta a las necesidades del contexto educativo. Se verificará, que
    realiza búsquedas sencillas, guiadas y seguras, en internet, procedente de distintas fuentes, que impliquen la localización,
    la selección y la organización de la información; que los utiliza para comunicarse con personas cercanas en entornos conocidos
    y seguros; y que trabaja con los dispositivos y recursos digitales cooperativamente, en el marco de proyectos de investigación,
    experimentación, acciones, retos, etc., contextualizados en el medio natural, social y cultural canario. Se evaluará,
    además, que reelabore y cree contenidos digitales sencillos, de manera pautada, para expresar ideas, sentimientos y conocimientos,
    adoptando un punto de vista creativo y personal, mediante el uso de diferentes herramientas digitales y formatos. Para
    ello, el alumnado deberá demostrar que respeta la propiedad intelectual y la autoría de los mismos. Por último, se evaluará
    que se inicia en el conocimiento de las reglas básicas de seguridad y privacidad para navegar por internet, con el fin
    de tomar conciencia progresivamente de los riesgos, aprender de forma guiada cómo evitarlos o minimizarlos, pidiendo ayuda
    cuando sea preciso; y para resolver los posibles problemas tecnológicos siempre de forma acompañada.
- nodo: bc:PC9N01BC2
  campo: scopeNote
  valor: A través de este bloque competencial, se aspira a que el alumnado, partiendo de la curiosidad por comprender el mundo
    que lo rodea, participe, de forma activa y con iniciativa, en los diferentes procesos de indagación y exploración propios
    del pensamiento científico, con actitud cooperativa. Se evaluará que se inicie en los procedimientos adecuados a las necesidades
    de la investigación, utilizando modelos propios del pensamiento científico (observación en el tiempo, identificación y
    clasificación, búsqueda de patrones…); y que comience a utilizar instrumentos y dispositivos apropiados, para realizar
    observaciones y mediciones guiadas, aprovechando la cultura digital, para interpretar y explicar hechos y fenómenos que
    ocurren en el medio natural, social y cultural de Canarias. Para ello, se constatará que, en las investigaciones, se plantea
    preguntas, busca información sencilla, participa en experimentos pautados, propone respuestas a las preguntas formuladas
    y comunica los resultados obtenidos, utilizando vocabulario científico básico. Se evaluará, asimismo, el conocimiento
    de las profesiones relacionadas con la ciencia y la tecnología, especialmente las que se desempeñan en el archipiélago
    canario, evitando estereotipos sexistas y promocionando las vocaciones STEAM en las niñas.
- nodo: bc:PC9N01BC3
  campo: scopeNote
  valor: A través de este bloque competencial, se evaluará que el alumnado sea capaz de resolver problemas elementales, de
    forma pautada, para generar cooperativamente un producto creativo e innovador sencillo. Se comprobará que se inicia en
    la aplicación de las fases de los proyectos de diseño (prototipado, prueba y comunicación) y del pensamiento computacional,
    acercándose a la programación a través de recursos analógicos (actividades desenchufadas) o digitales, adaptados al nivel
    lector del alumnado (plataformas digitales de iniciación en la programación, robótica educativa…). Para ello, el alumnado
    experimentará, de forma segura y creativa, con diferentes materiales adecuados a la consecución del proyecto. Se evaluará,
    asimismo, la capacidad del alumnado para desarrollar estrategias básicas de trabajo en equipo y si explica los pasos seguidos
    con ayuda de un guion y de herramientas digitales, valorando el proceso personal y grupal realizado, y el resultado obtenido.
- nodo: bc:PC9N01BC4
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue que el alumnado toma conciencia del propio cuerpo como vía de expresión
    de los sentimientos y las emociones, de manera que pueda reconocerlo y controlarlo, así como mejorar la ejecución de los
    movimientos y su relación con el entorno. Para ello, se evaluará que sea capaz de aplicar el conocimiento científico para
    reconocer y participar en acciones que favorezcan el bienestar de la persona en todas sus dimensiones; que desarrolla
    la conciencia emocional (percepción, reconocimiento y comprensión emocional de alegría, tristeza, miedo, enfado, asco
    y sorpresa), la regulación emocional (autocontrol impulsivo y ajuste afectivo) y la vinculación emocional (empatía). Se
    constatará, además, que reconoce y representa la diversidad corporal, que entiende las relaciones familiares y escolares
    a las que pertenece, aceptando la diversidad familiar, la diversidad presente en el aula y en la sociedad, desde un modelo
    inclusivo y la educación afectivo-sexual, adaptada a su nivel madurativo. Se comprobará que reconozca estilos de vida
    saludables para su bienestar físico y mental, y que participe, en acciones cooperativas y fundamentadas científicamente,
    para promover la salud, valorando la importancia de una alimentación variada, equilibrada y sostenible, de la higiene,
    del ejercicio físico, del contacto con la naturaleza, del descanso y del cuidado del cuerpo, como medios para prevenir
    posibles enfermedades; y de un uso adecuado de las tecnologías.
- nodo: bc:PC9N01BC5
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de reconocer, de manera pautada, las
    características, la organización y las propiedades de los elementos del medio natural, social y cultural; así como las
    conexiones sencillas y directas entre ellos, de manera que adquiera un conocimiento científico conectado, que movilizará
    en las investigaciones o los proyectos que realice, y que le ayudará a visibilizar los problemas relacionados con el uso
    del espacio y sus transformaciones, y con los cambios y las adaptaciones protagonizados por la humanidad a través del
    tiempo para cubrir sus necesidades, así como las distintas organizaciones sociales que han ido desarrollándose. Se evaluará,
    asimismo, que demuestre y promueva actitudes de respeto ante el patrimonio cultural y el natural local, cuidando y respetando
    a los seres vivos y al entorno en el que vive, así como las costumbres y manifestaciones populares de la cultura canaria
    preservadas del pasado. Para ello, se constatará que emprende acciones originales, creativas, sostenibles y guiadas, para
    su uso responsable, que permitan su participación en la conservación y la creación de nuevos patrimonios.
- nodo: bc:PC9N01BC6
  campo: scopeNote
  valor: A través de este bloque competencial, se verificará que el alumnado identifica las causas y consecuencias de la intervención
    humana en el entorno próximo, desde los puntos de vista social, económico, cultural, tecnológico y ambiental, que reconoce
    estilos de vida sostenibles y que demuestra interés por el respeto, el cuidados, la corresponsabilidad y la protección
    de los elementos y seres del planeta (el uso responsable del agua, la movilidad sostenible, la prevención y gestión de
    los residuos…). Se valorará que participe en acciones guiadas, de manera individual y cooperativa, para buscar soluciones
    valiosas a problemas ecosociales, desde la reflexión pautada y el diálogo. Se evaluará, además, que el alumnado demuestre
    responsabilidad ecosocial (acciones para la conservación, mejora y uso sostenible de los bienes comunes, rechazo del maltrato
    animal y su prevención…), de manera que se empodere como agente de cambio ecosocial desde una perspectiva emprendedora
    y cooperativa, a través de la participación en actividades que permitan avanzar hacia la consecución de los ODS.
- nodo: bc:PC9N01BC7
  campo: scopeNote
  valor: Este bloque competencial tiene como finalidad que el alumnado sea capaz de ordenar temporalmente hechos del entorno
    social y cultural cercano, empleando nociones básicas de medida y sucesión, así como de reconocer personas y grupos sociales
    relevantes de la historia y formas de vida del pasado, visibilizando las aportaciones y representación de las mujeres
    en ellas, y respetando la diversidad lingüística y cultural. Para ello, se evaluará que el alumnado desarrolla la percepción
    del tiempo y utiliza fuentes orales, reconociendo la importancia de la memoria colectiva, para explicar y valorar las
    relaciones entre diferentes elementos y acontecimientos (el ciclo vital y las relaciones intergeneracionales, objetos
    y artefactos de la vida cotidiana como fuentes del cambio y la continuidad, la historia local y la biografía familiar,
    el patrimonio material e inmaterial local…). El conocimiento y la contextualización de acontecimientos relevantes desde
    un punto de vista histórico resultan fundamentales para que el alumnado comprenda la forma en la que el pasado contribuye
    en la configuración del presente y esta en la del futuro.
- nodo: bc:PC9N01BC8
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue constatar que el alumnado es capaz de recoger información acerca
    de manifestaciones culturales del propio entorno, respetando la diversidad cultural que enriquece a la sociedad canaria
    y reconociendo su valor como factor de mejora de la convivencia y contribución al bienestar individual y colectivo de
    una sociedad en continua transformación. Se evaluará, también, que el alumnado muestra actitudes que fomentan la igualdad
    efectiva entre mujeres y hombres, y las conductas no sexistas así como el respeto a todo tipo de diversidades; que participa
    en actividades comunitarias desarrollando estrategias básicas de trabajo en equipo; y que reconoce modelos positivos en
    el entorno cercano basados en los principios de igualdad y de respeto a los derechos humanos y de la infancia, así como
    a los valores del europeísmo.
- nodo: bc:PC9N01BC9
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue constatar que el alumnado es capaz de establecer acuerdos democráticamente
    a través de la adquisición de compromisos, la corresponsabilidad, participación y aceptación de normas en el entorno familiar,
    vecinal y escolar, haciendo uso de diferentes sistemas de comunicación y empleando un lenguaje inclusivo y no violento,
    que influya en el bienestar de la comunidad. En este marco de convivencia, se valorará que pueda identificar instituciones
    cercanas (en especial de los ayuntamientos) y las funciones que realizan en pro de una buena cohesión social, por medio
    del reconocimiento de los espacios, recursos y servicios del entorno local. Además, se valorará que reconozca e interiorice
    normas básicas para la convivencia en el uso de los espacios públicos, especialmente como peatones o como personas usuarios
    de los medios de locomoción, valorando las formas y modos de interacción social en ellos para que sean inclusivos e igualitarios,
    y tomando conciencia de la importancia de una movilidad segura, saludable y sostenible.
