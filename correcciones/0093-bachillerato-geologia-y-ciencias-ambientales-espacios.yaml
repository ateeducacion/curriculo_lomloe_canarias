  valor: A través de este bloque competencial se verificará que el alumnado es capaz de analizar, empleando estrategias de
    trabajo colaborativo o de forma individual, los diferentes tipos de recursos geológicos y de la biosfera (hídricos, paisajísticos,
    mineros, energéticos, edáficos, etc.) e identificar sus posibles usos y disponibilidad, a partir de información procedente
    de fuentes diversas y en distintos formatos (fotografías, imágenes de satélite, cortes, mapas, etc.), de observaciones
    del entorno cercano (salidas de campo o uso de sistemas de información geográfica digitales) o de visitas realizadas a
    alguna explotación en concreto (salinas, canteras de extracción de piedra ornamental, áridos, central hidroeólica, etc.),
    estimulando en el alumnado el interés y el gusto por la observación del entorno natural, con el fin de promover la reflexión
    sobre los impactos ambientales de determinadas acciones humanas y adquirir una serie de valores desde una perspectiva
    de justicia, igualdad y sostenibilidad. También se quiere constatar que adopta y promueve de forma autónoma estilos de
    vida sostenibles, demostrando un compromiso ético y ecosocialmente responsable hacia el medioambiente, a través del diseño
    de actividades de concienciación y sensibilización (exposiciones, dosieres divulgativos, vídeos, pódcast…), fundamentadas
    en los principios y procedimientos democráticos, el compromiso ético con la igualdad, la cohesión social, el desarrollo
    sostenible y el logro de la ciudadanía mundial, dirigidas a toda la comunidad educativa. Igualmente, se evaluará si el
    alumnado es capaz de establecer la relación del impacto de la explotación y uso incontrolado de determinados recursos
    (suelo, áridos, agua…) con el deterioro medioambiental (impactos en el paisaje, contaminación de acuíferos, disminución
    de las reservas fósiles, contaminación marina, cambio climático, pérdida del suelo por recubrimiento [asfaltado], desertización,
    etc.) y con sus efectos sociales (explotación de mano de obra infantil, conflictos bélicos, desigualdad de distribución
    del agua en el planeta…), y si justifica la necesidad de mantener una gestión sostenible de los mismos y defender su consumo
    responsable, acorde a los Objetivos de Desarrollo Sostenible —especialmente al ODS 12—, mediante la presentación y argumentación
    de medidas concretas, tanto personales como comunitarias, a través de la elaboración de informes y otras producciones,
    así como la exposición de sus conclusiones. Finalmente, se quiere verificar que el alumnado valora la importancia de la
    conservación del patrimonio geológico y medioambiental de Canarias como recurso para el desarrollo sostenible en el medio
    rural y para el uso de energías renovables (solar, eólica marina offshore…).
