- nodo: crit:PC9N05CE6.1
  campo: definition
  valor: Promover y adoptar estilos de vida sostenibles y consecuentes con el respeto, los cuidados, la corresponsabilidad
    y la protección de las personas y del planeta, a partir del análisis de las causas y consecuencias de la intervención
    humana en el entorno, utilizando el pensamiento científico para favorecer un modelo de isla sostenible para Canarias.
- nodo: sb:PC9N05SBI.2.5
  campo: definition
  valor: Reconocimiento de los cambios físicos, emocionales y sociales que conllevan la pubertad y la adolescencia, para favorecer
