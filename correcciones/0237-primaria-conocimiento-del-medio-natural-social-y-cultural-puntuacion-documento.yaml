  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: ce:PC9NC1
  campo: definition
  valor: Utilizar dispositivos y recursos digitales, de forma segura, responsable y eficiente, para buscar información, comunicarse
    y trabajar de manera individual, en equipo y en red, y para reelaborar y crear contenido digital de acuerdo con las necesidades
    digitales del contexto educativo.
- nodo: sb:PC9N01SBI.3.2
  campo: definition
  valor: Reconocimiento de las propiedades observables de los materiales, su procedencia y su uso en objetos de la vida cotidiana,
    de acuerdo con las necesidades de diseño para los que fueron fabricados.
- nodo: sb:PC9N01SBII.1.1
  campo: definition
  valor: Iniciación al uso adecuado de dispositivos y recursos del entorno digital de aprendizaje, de acuerdo con las necesidades
    del contexto educativo.
