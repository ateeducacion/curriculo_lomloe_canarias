id: '0237'
titulo: 'Conocimiento del Medio Natural, Social y Cultural (Educación Primaria): 38 textos con la puntuación del documento
  oficial'
motivo: 'Textos que solo difieren en la puntuación y que el BOC no permite decidir (el texto extraído del PDF no conserva
  la puntuación de forma fiable). Criterio aprobado: el ODT oficial es la referencia y el corpus debe reflejarlo. En las competencias
  cuyo enunciado el documento repite en cada curso con puntuación distinta, se toma la versión que más se repite (el corpus
  guarda un enunciado por materia).'
fuente:
  documento: primaria-conocimiento-del-medio-natural-social-y-cultural
  fichero: fuentes/documentos/primaria/anexo_2_curriculo-conocimiento_medio.odt
