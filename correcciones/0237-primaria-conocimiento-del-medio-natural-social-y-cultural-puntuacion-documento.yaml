  campo: definition
  valor: Reconocimiento de las propiedades observables de los materiales, su procedencia y su uso en objetos de la vida cotidiana,
    de acuerdo con las necesidades de diseño para los que fueron fabricados.
- nodo: sb:PC9N02SBII.1.1
  campo: definition
  valor: Iniciación al uso adecuado de dispositivos y recursos del entorno digital de aprendizaje, de acuerdo con las necesidades
    del contexto educativo.
- nodo: crit:PC9N03CE1.2
  campo: definition
  valor: Reelaborar y crear contenidos digitales sencillos, con diferentes medios, soportes y formatos, trabajando de forma
    individual y en equipo, para construir, comunicar y compartir nuevos conocimientos, respetando los derechos de autoría
    y de acuerdo a las necesidades digitales del contexto educativo.
- nodo: crit:PC9N03CE4.2
  campo: definition
  valor: Desarrollar estilos de vida saludables, valorando la importancia de una alimentación variada, equilibrada y sostenible,
    la higiene, el ejercicio físico, el contacto con la naturaleza, el descanso y cuidado del cuerpo y el uso adecuado de
    las tecnologías, participando en acciones fundamentadas científicamente para preservar la salud.
- nodo: ce:PC9NC9
  campo: definition
  valor: Participar en el entorno y la vida social de forma eficaz y constructiva desde el respeto a los valores democráticos,
    los derechos humanos y de la infancia y los principios y valores de la Constitución española y la Unión Europea, valorando
    la función del Estado y sus instituciones en el mantenimiento de la paz y la seguridad integral ciudadana, para generar
    interacciones respetuosas y equitativas y promover la resolución pacífica y dialogada de los conflictos.
- nodo: sb:PC9N03SBI.1.2
  campo: definition
  valor: Fomento de la curiosidad, la iniciativa y la constancia en la realización de las diferentes investigaciones contextualizadas
    en el medio natural, social y cultural de Canarias, a partir de estrategias cooperativas.
- nodo: sb:PC9N03SBI.2.1
  campo: definition
  valor: Reconocimiento de los reinos de la naturaleza desde una perspectiva general e integrada, valorando la biodiversidad,
    a partir del estudio y análisis de las características de diferentes ecosistemas, sus funciones y servicios como lugar
    donde intervienen factores bióticos y abióticos, manteniéndose un equilibrio entre los diferentes elementos y recursos.
- nodo: sb:PC9N03SBI.2.2
  campo: definition
  valor: 'Comprensión del carácter excepcional de la biodiversidad canaria: conceptos básicos (endemismo y autoctonismo) e
    introducción a los ecosistemas canarios (fondos rocosos, sebadal, matorral costero, termófilo, monteverde, jaral, pinar,
    matorral de cumbre...).'
- nodo: sb:PC9N03SBI.2.4
  campo: definition
  valor: Identificación de la relación del ser humano con los ecosistemas para cubrir las necesidades de la sociedad. Ejemplos
    de buenos y malos usos de los recursos naturales de nuestro planeta, especialmente en nuestro archipiélago canario, y
    sus consecuencias.
- nodo: sb:PC9N03SBII.1.1
  campo: definition
  valor: Utilización de dispositivos y recursos del entorno digital de aprendizaje, de acuerdo con las necesidades del contexto
    educativo.
- nodo: sb:PC9N03SBIII.2.3
  campo: definition
  valor: Iniciación en la investigación y en los métodos de trabajo para la realización de proyectos, que analicen hechos,
    asuntos y temas de relevancia actual con perspectiva histórica, contextualizándolos en la época correspondiente (Prehistoria
    y Edad Antigua), como la supervivencia y la alimentación, la vivienda, los intercambios comerciales (de dónde viene el
    dinero, los trabajos no remunerados), la explotación de bienes comunes y recursos, o los avances técnicos.
- nodo: sb:PC9N03SBIII.2.5
  campo: definition
  valor: Reconocimiento de las expresiones artísticas y culturales, en la Prehistoria y la Edad Antigua, su contextualización
    histórica y su función, visibilizando las aportaciones y la representación de las mujeres en ellas.
- nodo: sb:PC9N03SBIII.4.3
  campo: definition
  valor: Valoración de la transformación y la degradación de los ecosistemas naturales por la acción humana, y desarrollo
    de acciones para la conservación y protección de la naturaleza y la prevención del maltrato animal.
- nodo: sb:PC9N03SBIII.4.4
  campo: definition
  valor: 'Reconocimiento de estilos de vida sostenibles: el consumo y la producción responsables, la alimentación sostenible,
    el uso eficiente del agua y la energía, y la prevención y la gestión de los residuos en Canarias.'
