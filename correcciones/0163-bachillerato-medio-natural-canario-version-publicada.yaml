  valor: A través de este bloque competencial, se pretende que el alumnado sea capaz de plantear hipótesis o diseñar un proyecto
    de investigación en sí, de forma cooperativa, acerca de procesos naturales, relacionados con cualquiera de los bloques
    de saberes básicos de la materia, y de contrastar sus planteamientos mediante la observación del entorno a través, fundamentalmente,
    de salidas de campo (reconocimiento de muestras sobre el terreno, toma de datos, identificación de impactos…), pero también
    de la experimentación en el laboratorio (manejo de la lupa y los microscopios petrográfico y biológico, utilización de
    claves de identificación, interpretación de mapas topográficos y geológicos…) y de la localización y selección de información
    en fuentes diversas (BIOCAN, GRAFCAN, páginas web, artículos científicos y divulgativos…), aplicando las metodologías
    propias de la ciencia, así como el razonamiento matemático, y utilizando con corrección y precisión procedimientos, materiales
    e instrumentos adecuados. Asimismo, se pretende constatar que el alumnado comunica empleando terminología científica y
    comparte los resultados y el procedimiento seguido, a través de herramientas, aplicaciones y servicios en línea, utilizando
    diversos formatos (informes, murales, artículos, pódcast…), de manera clara, rigurosa, es decir, con un vocabulario científico
    adecuado y de acuerdo a los principios éticos básicos, pero adoptando un punto de vista creativo e innovador para contribuir
    a la divulgación científica, hacer accesible la información a toda la comunidad educativa y adquirir, de esta forma, un
    compromiso con la mejora del entorno y de la sociedad.
