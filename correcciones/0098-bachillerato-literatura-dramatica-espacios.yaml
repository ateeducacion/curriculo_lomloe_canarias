  valor: Se comprobará, con este bloque competencial, que el alumnado, individualmente o de manera cooperativa, realiza proyectos
    de investigación guiados sobre autoras de relevancia, personajes femeninos esenciales, obras literarias de contextos no
    occidentales o textos de la literatura canaria, que le permitan establecer relaciones intertextuales entre obras y fragmentos
    de diferentes géneros, épocas, contextos culturales y códigos artísticos, así como con sus respectivos contextos de producción,
    investigando sus especificidades e intención y utilizando la información sociohistórica, cultural y artística para comprender
    el lugar que ocuparon en la tradición literaria. Todo ello con el fin de identificar elementos de continuidad y ruptura,
    interpretar los aciertos y carencias de la literatura con respecto a la complejidad de la identidad individual y la diversidad
    de géneros en la sociedad y examinar la huella de su legado en la actualidad, aplicando, de manera cívica y respetuosa,
    su entorno digital de aprendizaje para comparar, analizar, evaluar y sintetizar datos, información e ideas de los medios
    de comunicación y obtener conclusiones lógicas de forma autónoma, valorando la fiabilidad de las fuentes. Por otro lado,
    se verificará que el alumnado es capaz de elaborar comentarios o reseñas de textos teatrales de forma crítica y reflexiva,
    entendiendo el teatro como artefacto ideológico determinante en la construcción de los imaginarios sociales, con singular
    atención a la perspectiva de género, y atendiendo a sus valores culturales, éticos y estéticos. Por último, a través de
    su participación en conversaciones literarias y en intercambios de recomendaciones en contextos presenciales y digitales,
    se constatará que el alumnado, con un metalenguaje específico y actitud empática y respetuosa, comparte su propia interpretación
    argumentada de los aspectos singulares y el valor social del patrimonio cultural y artístico de cualquier época, con el
    fin de reconocer y descartar actitudes inconscientemente sexistas y etnocéntricas, y de incorporar a su mapa de cultura
    muestras representativas de un patrimonio auténticamente universal, con presencia de mujeres escritoras, de personajes
    femeninos destacables y de obras no occidentales.
