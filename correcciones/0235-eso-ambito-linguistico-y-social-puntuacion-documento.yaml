cambios:
- nodo: sb:SMBS03SBIV.1
  campo: definition
  valor: 'Lectura autónoma. Implicación en la lectura de obras de forma progresivamente autónoma a partir de una preselección
    de textos variados, y reflexión sobre los textos leídos y sobre la práctica de lectura, atendiendo a los siguientes saberes:'
- nodo: bc:SMBS04BC4
  campo: scopeNote
  valor: A través de esta competencia se comprobará que el alumnado es capaz de seleccionar y leer de manera autónoma obras
    variadas, propias de la literatura universal, española y canaria, así como de la literatura juvenil, de acuerdo con sus
    gustos, intereses y necesidades. Asimismo, se favorecerá la utilización de bibliotecas escolares y públicas, y el contacto
    con situaciones comunicativas vinculadas a la lectura en el ámbito personal, educativo y social, empleando soportes, herramientas
    o plataformas virtuales diversas, y mostrando prácticas culturales emergentes (videorreseñas, reseñas en revistas o radios
    escolares, jornadas de oralidad, videopoemas, audiolibros, plataformas de lectura y para escritura social, murales en
    forma de poesía, luchalibro…), asumiendo que «leer con otras personas» también es hablar sobre lo que se lee y compartir
    lo que se escribe. De este modo, el alumnado podrá ir progresivamente configurando su propio itinerario lector, estableciendo
    vínculos entre las obras leídas y la actualidad, y aprendiendo a expresar juicios respetando las opiniones y experiencias
    ajenas. Por último, se constatará que el alumnado utiliza lo aprendido en la creación de textos con intención literaria,
    entendiendo la escritura creativa como una forma de comunicación que permite compartir ideas, sentimientos y emociones.
