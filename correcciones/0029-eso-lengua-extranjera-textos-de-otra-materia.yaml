cambios:
- nodo: sb:SLNT03SBI.2
  campo: definition
  valor: Aplicación de conocimientos, destrezas y actitudes que permiten llevar a cabo actividades de mediación en situaciones
    cotidianas.
- nodo: sb:SLNT03SBI.3
  campo: definition
  valor: 'Uso de funciones comunicativas de uso común adecuadas al ámbito y al contexto comunicativo: saludar y despedirse,
    presentar y presentarse; describir personas, objetos, lugares, fenómenos y acontecimientos; situar eventos en el tiempo;
    situar objetos, personas y lugares en el espacio; pedir e intercambiar información sobre cuestiones cotidianas; dar y
    pedir instrucciones, consejos y órdenes; ofrecer, aceptar y rechazar ayuda, proposiciones o sugerencias; expresar parcialmente
    el gusto o el interés y las emociones; narrar acontecimientos pasados, describir situaciones presentes y enunciar sucesos
    futuros; expresar la opinión, la posibilidad, la capacidad, la obligación y la prohibición; expresar argumentaciones sencillas;
    reformular y resumir.'
- nodo: sb:SLNT03SBII.2
  campo: definition
  valor: Empleo de estrategias de uso común para identificar, organizar, retener, recuperar y utilizar creativamente unidades
    lingüísticas (léxico, morfosintaxis, patrones sonoros, etc.) a partir de la comparación de las lenguas y variedades que
    conforman el repertorio lingüístico personal.
- nodo: sb:SLNT03SBII.3
  campo: definition
  valor: Selección y uso de estrategias y herramientas de uso común para la autoevaluación, la coevaluación y la autorreparación,
    analógicas y digitales, individuales y cooperativas.
- nodo: sb:SLNT03SBIII.1
  campo: definition
  valor: Reconocimiento y respeto por aspectos socioculturales y sociolingüísticos de uso común relativos a la vida cotidiana
    y las condiciones de vida; convenciones sociales de uso común; lenguaje no verbal, cortesía lingüística y etiqueta digital;
    cultura, normas, actitudes, costumbres y valores propios de países donde se habla la lengua extranjera y de Canarias.
- nodo: sb:SLNT03SBIV.4
  campo: definition
  valor: Interés e iniciativa en la realización de intercambios comunicativos a través de diferentes medios con hablantes
    o estudiantes de la lengua extranjera.
