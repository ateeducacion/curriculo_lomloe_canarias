- nodo: ce:BHICC2
  campo: definition
  valor: Identificar e interpretar todos aquellos elementos de las infraestructuras, la arquitectura o los paisajes que proporcionen
    información sobre el pasado del archipiélago hasta la actualidad, para inferir y explicar los aspectos políticos, sociales,
    económicos y culturales que caracterizaron el archipiélago desde el Antiguo Régimen, y contrastar la información con la
    derivada de las fuentes documentales propias del período.
- nodo: ce:BHICC4
  campo: definition
  valor: Investigar los principales aspectos políticos, sociales, económicos y culturales de Canarias, desde finales del siglo
    XIX hasta la actualidad, a partir de su reflejo en fuentes diversas, incluidas las audiovisuales y artes plásticas, para
    adquirir una comprensión general de la realidad histórica del Archipiélago hoy en día, reconociendo la discriminación
    histórica de la mujeres y la contribución del archipiélago a los Objetivos de Desarrollo Sostenible.
- nodo: ce:BHICC5
  campo: definition
  valor: Situar la presencia de Canarias dentro de las principales corrientes culturales y científicas del mundo occidental,
    así como evidenciar el impacto de estas en el desarrollo del archipiélago, a través de la biografía de personas destacadas,
    del estudio de sus obras, actuaciones y declaraciones públicas, y de los escenarios que transitaron o de los colectivos
    sociales a los que pertenecieron para comprender las relaciones e implicaciones en el desarrollo cultural del archipiélago.
- nodo: sb:BHIC01SBI.2
  campo: definition
  valor: Lo global y lo local.
- nodo: sb:BHIC01SBII.5
  campo: definition
  valor: 'Identificación del patrimonio urbano de Canarias y las instituciones de Canarias: el poder religioso, el poder militar
    y el poder civil en la trama urbana, y su posterior influencia en el continente americano. La diferenciación de los espacios
    públicos y de ocio.'
