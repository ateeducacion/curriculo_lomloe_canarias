- nodo: bc:BIAS01BC3
  campo: scopeNote
  valor: Este bloque competencial pretende evaluar que el alumnado es capaz de reconocer y reproducir las principales características
    de los componentes del Sistema Solar tanto interior como exterior. Asimismo, deberá conocer las condiciones que deben
    darse dentro y fuera de nuestro Sistema Solar (exoplanetas,..) para considerar la posibilidad de que haya cuerpos celestes
    con capacidad para albergar vida, reconociendo algunos de los astros que reúnan tales condiciones. También se evaluará
    su capacidad de valorar la importancia de los descubrimientos de las misiones espaciales en el conocimiento del Universo,
    analizando la problemática de la basura espacial y sus posibles soluciones, y aplicando recursos digitales adecuados,
    como simuladores...
- nodo: sb:BIAS01SBII.7
  campo: definition
  valor: Análisis de las condiciones necesarias para que un cuerpo celeste albergue vida. Importancia de la búsqueda de biomarcadores
    y tecnomarcadores. Discusión de la ecuación de Drake y valoración de la contribución de los programas científicos de búsqueda
    extraterrestre (SETI).
