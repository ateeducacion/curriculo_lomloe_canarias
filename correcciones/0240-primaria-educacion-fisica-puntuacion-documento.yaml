id: '0240'
titulo: 'Educación Física (Educación Primaria): 6 textos con la puntuación del documento oficial'
motivo: 'Textos que solo difieren en la puntuación y que el BOC no permite decidir (el texto extraído del PDF no conserva
  la puntuación de forma fiable). Criterio aprobado: el ODT oficial es la referencia y el corpus debe reflejarlo.'
fuente:
  documento: primaria-educacion-fisica
  fichero: fuentes/documentos/primaria/anexo_2_curriculo-educacion_fisica.odt
  sha256: 24c8a6c7f9c1cf7414f747c0dc48fb58e8bb21fff3bb91f99e15698aae6b671e
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: bc:PEFI01BC2
  campo: scopeNote
  valor: A través de este bloque competencial el alumnado resolverá problemas motrices, aplicando sus capacidades perceptivo-motrices,
    coordinación, equilibrio, lateralidad y estructuración espacio-temporal; y las habilidades motrices básicas locomotrices
    (desplazamientos, saltos, giros,…), no locomotrices (balancearse, empujar,…) y de manipulación (lanzamientos y recepciones,…),
    tomando conciencia del dominio de su propio cuerpo en situaciones en movimiento o estáticas, con el uso de materiales
    y con la incertidumbre derivada del entorno y el resto de participantes. Para ello, se implican los mecanismos de percepción,
    decisión y ejecución en situaciones motrices lúdicas diversas, ajustando las conductas motrices a los objetivos motores
    establecidos, teniendo en cuenta los estímulos internos percibidos (cansancio, sed, calor, frío,…) el espacio, el tiempo,
    los materiales y la interacción con el resto de participantes. Se constatará que inicia un progresivo control y dominio
    del cuerpo, aplicando sus habilidades motrices básicas y capacidades perceptivo-motrices en situaciones motrices lúdicas,
    llevando a cabo retos motores de carácter individual y colaborativos, siguiendo orientaciones para resolver problemas
    motores que tengan lugar en contextos de carácter real o simulado. Todo ello con la finalidad de que el alumnado descubra
    y reflexione sobre las posibles respuestas motrices para resolver un problema motor a través de métodos guiados de carácter
    inductivo (generando conductas motrices a partir de respuestas concretas) y deductivo (utilizando aprendizajes adquiridos
    en situaciones lúdicas específicas), reconociendo sus limitaciones y la posibilidad de mejorar a través de la búsqueda
    de ayuda y el esfuerzo.
- nodo: bc:PEFI01BC4
  campo: scopeNote
  valor: A través de este bloque competencial el alumnado experimentará y practicará diferentes manifestaciones lúdicas y
    artístico-expresivas, reconociendo su influencia y sus aportaciones a la cultura tradicional y contemporánea, para integrarlas
    dentro del repertorio de actuaciones motrices que se utilizan regularmente en la vida cotidiana mostrando actitudes de
    igualdad. Se constatará que el alumnado es capaz de experimentar juegos motores, composiciones con o sin soporte musical
    propios de la cultura canaria, y de otras. Todo ello con la finalidad de que el alumnado reconozca y respete los aspectos
    fundamentales del patrimonio cultural y artístico, iniciándose en el disfrute y conocimiento de las especificidades e
    intencionalidades de las manifestaciones artísticas más destacadas de cualquier época, reconociendo y respetando las diferencias
    culturales. Se evaluará que reconoce y respeta los aspectos fundamentales del patrimonio cultural y artístico, iniciándose
    en el disfrute y conocimiento de las especificidades e intencionalidades de las manifestaciones artísticas más destacadas
    de cualquier época, reconociendo y respetando las diferencias culturales.
- nodo: bc:PEFI01BC5
  campo: scopeNote
  valor: A través de este bloque competencial se constatará que el alumnado es capaz de participar en diferentes medios naturales
    y urbanos como contextos de práctica motriz. Para ello, el alumnado deberá demostrar que es capaz de participar en actividades
    lúdicas en diversos espacios del entorno natural y urbano de forma segura, reconociendo las posibilidades motrices de
    los espacios de juego y esparcimiento infantil, así como del material para el desarrollo de la motricidad. Todo ello con
    la finalidad de que el alumnado actúe con actitudes de respeto y conservación hacia los diferentes entornos y adopte hábitos
    de vida sostenibles, tanto mediante la utilización de materiales fabricados como iniciándose en la educación vial para
    peatones a través de una movilidad segura, saludable y sostenible, participando así de forma activa en su cuidado y mejora.
