  valor: A través del presente bloque competencial, concretado en un único criterio de evaluación, se persigue constatar si
    el alumnado es capaz de expresar juicios personales, justificados y argumentados sobre las obras estudiadas en el aula,
    haciendo uso de un vocabulario técnico apropiado. Para ello se verificará la habilidad para elaborar y publicar comentarios
    y críticas musicales, expresándose con fluidez, coherencia y corrección, participando activamente en las interacciones
    comunicativas del aula, con actitud respetuosa y cooperativa, y poniendo sus prácticas comunicativas al servicio de la
    convivencia democrática. También se evaluará la capacidad para localizar, comparar, analizar y sintetizar datos en la
    consulta autónoma de fuentes diversas, con respeto a los derechos de autoría y la propiedad intelectual. Igualmente, se
    valorará la destreza en el manejo de las tecnologías para la elaboración de productos de difusión, así como la existencia
    de un punto de vista crítico y creativo a la hora de comunicar sus conocimientos y opiniones, favoreciendo un uso ético
    de los sistemas de comunicación. Por último, se verificará la consolidación de valores relativos a la reflexión y valoración
    crítica del patrimonio cultural y artístico, así como la existencia de una actitud proactiva hacia su difusión y a la
    valoración de la diversidad cultural como fuente de enriquecimiento personal.
