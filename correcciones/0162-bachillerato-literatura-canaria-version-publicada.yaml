cambios:
- nodo: crit:BLCA02CE4.1
  campo: definition
  valor: Relacionar textos y obras de la literatura canaria con otras manifestaciones artísticas y multimedia, así como con
    otras disciplinas humanísticas, sociales y científicas, con especial atención a las desarrolladas en Canarias, desde una
    perspectiva interdisciplinar, entablando un diálogo con la reflexión contemporánea sobre aspectos culturales y éticos,
    con especial atención a la perspectiva de género y la sostenibilidad.
- nodo: sb:BLCA02SBI.1.2
  campo: definition
  valor: 'El hecho geográfico: la «condición archipelágica». La isla como espacio insular y centro vital. La intimidad, la
    soledad y la angustia. El complejo de lejanía, de prisión. El destierro. Cosmopolitismo y vanguardismo. La luz: revelación
    surrealista y realismo mágico.'
