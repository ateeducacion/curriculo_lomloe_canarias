id: '0232'
titulo: 'Medio Natural Canario (Bachillerato): 4 diferencias corregidas con el documento oficial'
motivo: 'Diferencias que el contraste no explicaba con el BOC. Criterio aprobado: el ODT oficial de la web de currículos es
  la referencia y el corpus debe reflejarlo. Tipos: explicación de bloque distinto; texto de saber distinto.'
fuente:
  documento: bachillerato-medio-natural-canario
  fichero: fuentes/documentos/bachillerato/Medio_Natural_Canario_BACH.odt
  sha256: d6900742638ca1356be7eef989d8724fd41807ab642f8524599594aaa4cc40da
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: bc:BMNC01BC4
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de analizar un paisaje concreto, identificando
    sus elementos y la biodiversidad que habita en él, tanto con los datos recabados in situ en salidas de campo como a través
    de la utilización de imágenes (mapas, dibujos, fotografías, videos, animaciones…) y de información científica de fuentes
    y soportes variados (GRAFCAN, páginas web, fotografías, videos, artículos científicos, prensa...). También, se evaluará
    si el alumnado identifica los efectos de determinadas acciones sobre el medio natural (destrucción de hábitats, erosión
    y contaminación del suelo, extinción directa de especies,…); asimismo se busca comprobar si es capaz de reconocer los
    estilos de vida y las acciones propias y ajenas que pueden influir en la transformación de la superficie terrestre, y
    de reflexionar sobre el impacto ambiental, elaborando proyectos de sensibilización a través de distintas producciones
    (informes, decálogos, carteles informativos, exposiciones orales…), de forma individual o en grupo, mediante metodologías
    activas como el Aprendizaje servicio, para proponer y adoptar hábitos de vida sostenibles; y poniendo especial énfasis
    en las acciones antropogénicas para fomentar la conservación del medioambiente, en relación con el desarrollo sostenible
    y la calidad de vida, así como para la protección y mejora del paisaje natural canario. Todo ello con el fin de que el
    alumnado identifique el paisaje como parte del patrimonio natural, social y cultural de las islas, producto de su historia
    y parte de su idiosincrasia, con sentido crítico, optimismo y resiliencia, y promoviendo en la comunidad actitudes respetuosas
    y comprometidas con la naturaleza.
- nodo: sb:BMNC01SBII.6.2
  campo: definition
  valor: Análisis de la dinámica de los vientos alisios. Valoración de la importancia del mar de nubes y de la lluvia horizontal.
- nodo: sb:BMNC01SBII.6.3
  campo: definition
  valor: Características del monte verde, pinares y bosques termófilos.
- nodo: sb:BMNC01SBIII.3
  campo: definition
  valor: Análisis de las relaciones de interdependencia, trascendiendo del desarrollismo y conservacionismo al desarrollo
    sostenible. Con una mirada local a la vez que global, para comprender que cualquier acción que afecte a un elemento lo
    hace sobre el resto.
