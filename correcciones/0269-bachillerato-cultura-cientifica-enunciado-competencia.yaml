id: 0269
titulo: 'Cultura Científica (Bachillerato): enunciado de competencia del documento oficial'
motivo: En la exportación la competencia 2 repetía el enunciado de la competencia 1. El documento oficial y el BOC (Decreto
  78/2025) dan para la 2 «Localizar y utilizar fuentes fiables…». Lo ocultaba la explicación automática «limitación del modelo»,
  retirada al guardar los enunciados por curso.
