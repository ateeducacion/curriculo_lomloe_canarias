cambios:
- nodo: bc:BDAI01BC1
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue constatar que el alumnado es capaz de identificar y valorar el
    dibujo como una fuente de riqueza y una forma de conocimiento, comunicación y expresión. A través de la reflexión y el
    análisis, el alumnado podrá elaborar de forma razonada y compartida producciones orales, escritas o multimodales que pongan
    de manifiesto el conocimiento adquirido a través del análisis del dibujo en el arte, desde la Antigüedad hasta el Romanticismo,
    así como reflexionar a través de las obras de diferentes artistas sobre la defensa activa de la igualdad entre hombres
    y mujeres y sobre la libertad de expresión. Por tanto, se comprobará que el dibujo es una herramienta de pensamiento crítico
    que forma parte de diferentes procesos artísticos y ámbitos disciplinares, que le ayudará a desarrollar con autonomía
    la reflexión, la observación y la imaginación para poder comunicarse. Todo ello con la finalidad de que el alumnado realice
    representaciones creativas y aprecie la importancia de la diversidad cultural y la relevancia de la conservación y la
    promoción del patrimonio con especial interés al de Canarias.
- nodo: bc:BDAI01BC3
  campo: scopeNote
  valor: 'A través de este bloque competencial, se verificará que el alumnado, mediante la realización de bocetos o esbozos,
    utilizando medios tanto analógicos como digitales, a partir de la observación de la realidad. Asimismo, se comprobará
    que el alumnado es capaz de experimentar con las posibilidades expresivas de los elementos propios del dibujo: punto,
    línea, forma, color y textura, así como con su sintaxis. Todo ello con la finalidad de potenciar la sensibilidad del alumnado
    a través de la comprensión de las relaciones entre los elementos del lenguaje plástico que se establecen en la producción
    artística, y que le permitan avanzar hacia el aprendizaje de un lenguaje artístico más personal, expresivo y creativo.'
- nodo: bc:BDAI01BC6
  campo: scopeNote
  valor: A través de este bloque competencial, se persigue constatar que el alumnado es capaz de comprender y emplear con
    intenciones comunicativas y expresivas algunos de los principios más importantes de las teorías de la percepción visual
    y de la Gestalt. Además se comprobará que el alumnado es capaz de experimentar con la composición y la ordenación de los
    elementos plásticos en la sintaxis visual, para ir adquiriendo poco a poco autonomía en la expresión plástica, que le
    permita valorar la importancia de la práctica en todo proceso creativo. Todo ello con la finalidad de que el alumnado
    sea capaz de representar la realidad que observa a su alrededor y de crear imágenes a partir de su fantasía o de sus emociones,
    respondiendo con creatividad a los retos planteados.
