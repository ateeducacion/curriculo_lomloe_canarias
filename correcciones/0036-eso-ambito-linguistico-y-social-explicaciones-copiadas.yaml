cambios:
- nodo: bc:SMBS04BC3
  campo: scopeNote
  valor: A través de este bloque competencial se valorará el grado en que el alumnado organiza y gestiona su aprendizaje,
    tanto en el trabajo individual como en el grupal, comprobando, en el seguimiento de las pautas marcadas con diferentes
    niveles de ayuda, que describe con antelación lo que quiere conseguir, realiza un seguimiento del proceso de aprendizaje
    a través de diversas herramientas (diario de aprendizaje, planes de acción, agenda escolar, portfolio…) y propone alternativas
    en el caso de no obtener los resultados deseados. Se verificará que trabaja de manera cooperativa negociando el reparto
    de tareas, aceptando diferentes roles y asumiendo compromisos de eficacia y eficiencia para desarrollar proyectos en los
    que se apliquen las ideas que tienen para resolver situaciones y retos de aprendizaje, y empleando, además, técnicas de
    valoración del trabajo propio y ajeno. Se tendrá en cuenta la aceptación de la incertidumbre como una oportunidad para
    articular respuestas más creativas, aprendiendo a manejar la ansiedad que pueda llevar aparejada, así como la predisposición
    para favorecer con su actitud un clima propicio para la comunicación, teniendo presentes las emociones propias y ajenas
    en el intercambio de ideas y opiniones, e integrando de manera constructiva los diferentes puntos de vista, todo ello
    con el fin de desarrollar las habilidades que le permitan seguir aprendiendo a lo largo de la vida, desde la confianza
    en el conocimiento como motor del desarrollo.
- nodo: bc:SMBS04BC5
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de conocer los principales desafíos a
    los que se han enfrentado las diferentes sociedades a lo largo del tiempo (la globalización, movimientos migratorios e
    interculturalidad, los avances tecnológicos y la conciencia ecosocial, los conflictos ideológicos y étnico-culturales,
    la diversidad social, étnico-cultural y de género, el proceso industrializador en España y Canarias, el imperialismo y
    colonialismo, análisis del Holocausto y el papel de los organismos internacionales). Se verificará que el alumnado es
    capaz de analizar los cambios producidos, sus causas y consecuencias, teniendo como referencia las realidades de Canarias,
    mediante el contraste de fuentes diversas históricas y literarias, tanto de forma individual como en grupos colaborativos.
    Por último, se constatará que es capaz de analizar procesos de cambio histórico y comparar casos de la historia a través
    del uso de fuentes de información diversas (textos, gráficas, mapas, estadísticas…), teniendo en cuenta las transformaciones
    de corta y larga duración, coyunturales y estructurales, las continuidades y permanencias en diferentes períodos y lugares,
    con especial atención a Canarias.
- nodo: bc:SMBS04BC7
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de comprender los procesos geográficos,
    históricos y culturales que han conformado la sociedad multicultural en la que vivimos (la identificación de los genocidios
    y crímenes contra la humanidad. la indagación sobre las guerras, el terrorismo y otras formas de violencia política, la
    valoración de las alianzas e instituciones internacionales, la mediación y las misiones de paz, la acción de los movimientos
    feministas y sufragistas en la lucha por la igualdad de género, la historia de las mujeres en la sociedad canaria, los
    movimientos obreros, estudiantiles, ecologistas y LGTBI+, la reflexión sobre la mediación y gestión pacífica de conflictos
    y el apoyo a las víctimas de la violencia y del terrorismo). Se constatará que el alumnado es capaz de reconocer la riqueza
    de la diversidad y desterrar prejuicios, a partir del estudio de la aportación de los movimientos en defensa de los derechos
    de las minorías y en favor de la inclusividad y la igualdad real, especialmente de las mujeres, así como estereotipos
    y usos discriminatorios de la lengua con la oportuna reflexión interlingüística e interdialectal, para desarrollar un
    juicio propio, argumentado, respetuoso y opuesto a cualquier tipo de segregación, a partir de trabajos individuales y
    grupales. Por último, se verificará que es capaz de hacer un uso no solo eficaz sino también ético de la lengua (realizando
    trabajos de síntesis, conclusiones, debates, exposiciones orales...), en el que el diálogo sea una herramienta para la
    construcción de una sociedad democrática e igualitaria.
- nodo: bc:SMBS04BC8
  campo: scopeNote
  valor: Con este bloque competencial, se comprobará que el alumnado es capaz de reconocer y explicar las bases sobre las
    que se erigen las diversas identidades propias y las ajenas, tomando como referencia la realidad local de las islas Canarias
    para proyectarse en España, Europa y el resto del mundo. Así, se constatará que el alumnado es capaz de identificar, conocer
    y valorar el patrimonio material e inmaterial común de nuestros pueblos, mediante tareas de investigación sobre la ciencia
    y la cultura de las islas que incluyan trabajos de campo en museos, archivos..., el uso de información digital y analógica,
    y la realización de informes, dosieres, infografías o cualquier otro recurso, para contribuir a su conservación. Por otro
    lado, se verificará que el alumnado es capaz de respetar los distintos sentimientos de pertenencia, y que puede adoptar
    compromisos basados en los principios de igualdad de género, la cohesión social, el desarrollo sostenible y el logro de
    la ciudadanía mundial, reconociendo los valores de Europa y el papel de la Declaración Universal de los Derechos Humanos.
    Por otra parte, se comprobará que el alumnado conoce los derechos que confiere la Constitución Española y el Estatuto
    de Autonomía de Canarias, para fundamentar el respeto hacia nuestro patrimonio cultural y lingüístico, y reforzar la importancia
    de la variedad dialectal canaria en la construcción de nuestra identidad. De este modo, se estudiará el español de Canarias,
    en sus rasgos fónicos, gramaticales y léxicos, comparándola con las características propias de otros dialectos del español,
    para que el alumno comprenda no solo que su variedad es tan valiosa, correcta y adecuada como cualquier otra, sino que,
    además, debe emplearla en contextos informales y formales, para luchar contra los prejuicios socioculturales a los que
    las variedades menos prestigiosas se ven sometidas.
