id: '0040'
titulo: 'Descubrimiento y Exploración del Entorno (Educación Infantil): 9 explicaciones de bloque copiadas de otro curso'
motivo: La exportación repite en estos bloques competenciales la explicación de otro curso de la materia; el documento oficial
  trae una explicación propia para cada curso. Generada con `contrastar --proponer`.
fuente:
  documento: infantil-descubrimiento-y-exploracion-del-entorno
  fichero: fuentes/documentos/infantil/area_2_descubrimiento_exploracion_entorno_infantil.odt
  sha256: 3e36658da4d27fa91502e80d267e74b99b6b9817f38feda264134dad996b1772
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: bc:IDE304BC1
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de establecer relaciones entre los objetos
    a partir de sus cualidades o atributos, y de avanzar en la adquisición de habilidades y destrezas para ubicarse en el
    espacio, aplicando los conocimientos que tiene sobre las nociones espaciales básicas (entre, detrás de-delante de, debajo
    de-encima de, arriba-abajo, izquierda-derecha, dentro-fuera, cerca-lejos), jugando con el propio cuerpo y con los objetos.
    Por otro lado, se comprobará que el alumnado es capaz de emplear los cuantificadores básicos (todos, algunos, no todos,
    ninguno, uno y solo uno, al menos uno…) e identificar situaciones cotidianas en las que es preciso medir, utilizando el
    cuerpo y otros materiales y herramientas para ello. Se valorará además que sea capaz de organizar su actividad, de manera
    secuenciada, utilizando las nociones temporales básicas (cambio y permanencia, continuidad, sucesión y simultaneidad;
    pasado, presente y futuro, períodos de tiempo…), el uso de cuantificadores, así como el concepto de cantidad y de los
    números en la vida cotidiana, de forma funcional, así como las relaciones de orden, correspondencia, clasificación, agrupación
    y comparación, en contextos lúdicos y de interacción con las demás personas. Todo ello con la finalidad de establecer
    relaciones entre sus aprendizajes, lo que les permitirá desarrollar progresivamente sus habilidades lógicas y matemáticas
    primero, ligadas a sus intereses particulares y, progresivamente, a los intereses grupales y colectivos.
- nodo: bc:IDE304BC2
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de gestionar situaciones, retos o problemas,
    mediante la planificación de secuencias de actividades en cooperación con sus iguales, así como proponer soluciones
    y alternativas haciendo uso de estrategias, escuchando y respetando las de las demás personas. Asimismo, se valorará
    que los niños y las niñas sean capaces de plantear hipótesis sobre el comportamiento de objetos y materiales, verificándolas
    a través de la manipulación y actuación sobre ellos, utilizando diferentes estrategias para la toma de decisiones y ofreciendo
    soluciones ajustadas, creativas y originales, a los retos que se le plantean. Además, se verificará la participación del
    alumnado en actividades de programación de secuencia de acciones para la resolución de tareas analógicas o digitales,
    desarrollando habilidades de pensamiento computacional. También se valorará la participación en proyectos cooperativos,
    compartiendo y valorando opiniones propias y ajenas, y expresando conclusiones personales a partir de ellas. Se contribuye
    así a la adquisición de la competencia específica, ya que se comprobará que el alumnado es capaz de indagar en el entorno
    con interés, respeto, curiosidad, asombro, cuestionamiento y deseos de aprender, iniciándose en las estrategias de construcción
    de nuevos conocimientos, relacionando lo conocido y lo novedoso, y las experiencias previas y nuevas, estableciendo interacciones
    de calidad con las personas adultas, con sus iguales y con el entorno. Además, se verificará que los niños y las niñas
    son capaces de elaborar estrategias y utilizar técnicas básicas de investigación, así como de mostrar iniciativa en
    la búsqueda de acuerdos para la toma de decisiones, de forma creativa y dialogada, durante la planificación y organización
    de tareas, identificando sus hallazgos y elaborando y compartiendo las conclusiones. Todo ello con la finalidad de avanzar
    en la gestión de situaciones, integrando la planificación de secuencias de acciones en cooperación con sus iguales y canalizando
    la frustración ante las dificultades.
- nodo: bc:IDE304BC3
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de mostrar una actitud de curiosidad,
    respeto, cuidado y protección hacia el medio natural y los seres que habitan en él y, de manera significativa, hacia
    el entorno natural canario, identificando el impacto positivo o negativo de las acciones humanas sobre el mismo. Asimismo
    se valorará que los niños y las niñas sean capaces de identificar los rasgos comunes y diferentes entre seres vivos o
    inertes, estableciendo relaciones e identificando los elementos del medio natural y cultural, a partir de la observación,
    la participación y el conocimiento de los rasgos característicos de Canarias. Se contribuye así a la adquisición de la
    competencia específica, ya que se verificará que el alumnado es capaz de experimentar con los elementos naturales, apreciando
    y relacionando sus características y comportamiento. Además, se constatará que los niños y niñas son capaces de tomar
    conciencia sobre la influencia que ejercen las acciones de las personas en el medio físico, en especial en el patrimonio
    natural canario, así como sobre el cambio climático, iniciándose en el conocimiento de los recursos naturales, la sostenibilidad
    y las energías limpias. Se verificará, asimismo, que el alumnado progresa en la identificación de algunos fenómenos naturales
    y que muestra actitudes de respeto y protección hacia el medio natural, así como empatía, cuidado y protección hacia los
    seres vivos. Todo ello con la finalidad de establecer relaciones con el medio físico y natural, mostrando curiosidad e
    integrando en su vida cotidiana acciones de cuidado y respeto para aprender a vivir en armonía con el entorno, las personas
    y otros seres vivos presentes en el mundo que les rodea.
