id: '0241'
titulo: 'Lengua Castellana y Literatura (Educación Primaria): 23 textos con la puntuación del documento oficial'
motivo: 'Textos que solo difieren en la puntuación y que el BOC no permite decidir (el texto extraído del PDF no conserva
  la puntuación de forma fiable). Criterio aprobado: el ODT oficial es la referencia y el corpus debe reflejarlo. En las competencias
  cuyo enunciado el documento repite en cada curso con puntuación distinta, se toma la versión que más se repite (el corpus
  guarda un enunciado por materia).'
fuente:
  documento: primaria-lengua-castellana-y-literatura
  fichero: fuentes/documentos/primaria/anexo_2_curriculo-lengua-castellana.odt
  sha256: 36db66a2635e6f3476e5d7aac7db76993daa925cbf5a615742a6229259efa140
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: ce:PLCLC2
  campo: definition
  valor: Comprender e interpretar textos orales y multimodales, identificando el sentido general y la información más relevante
    y valorando con ayuda aspectos formales y de contenido básicos, para construir conocimiento y responder a diferentes necesidades
    comunicativas.
- nodo: crit:PLCL01CE8.2
  campo: definition
  valor: Producir, de manera acompañada, textos individuales o colectivos con intención literaria, ajustándose a los modelos
    dados en distintos soportes y complementándolos con otros lenguajes artísticos, con la finalidad de mejorar la capacidad
    expresiva a través de recursos literarios.
- nodo: sb:PLCL01SBIII
  campo: definition
  valor: Educación literaria
- nodo: sb:PLCL01SBIII.1
  campo: definition
  valor: Lectura acompañada de obras o fragmentos variados y diversos de la literatura infantil, adaptados a su nivel madurativo
    y organizados en itinerarios lectores, con la debida atención a muestras de la literatura canaria.
- nodo: crit:PLCL02CE8.2
  campo: definition
  valor: Producir, de manera acompañada, textos individuales o colectivos con intención literaria, ajustándose a los modelos
    dados en distintos soportes y complementándolos con otros lenguajes artísticos, con la finalidad de mejorar la capacidad
    expresiva a través de recursos literarios.
- nodo: sb:PLCL02SBIII
  campo: definition
  valor: Educación literaria
- nodo: sb:PLCL02SBIII.1
  campo: definition
  valor: Lectura acompañada de obras o fragmentos variados y diversos de la literatura infantil, adaptados a su nivel madurativo
    y organizados en itinerarios lectores, con la debida atención a muestras de la literatura canaria.
- nodo: crit:PLCL03CE5.1
  campo: definition
  valor: Producir, de manera guiada, textos escritos y multimodales coherentes, de manera creativa y en distintos soportes,
    seleccionando el modelo discursivo que mejor responda a cada situación comunicativa, aplicando las normas gramaticales
    y ortográficas, con la debida observación a los rasgos del español de Canarias, y utilizando estrategias de planificación,
    redacción, revisión y edición, con el objetivo de transmitir información y comunicar conocimientos, pensamientos, experiencias
    y emociones.
- nodo: sb:PLCL03SBIII
  campo: definition
  valor: Educación literaria
- nodo: crit:PLCL04CE5.1
  campo: definition
  valor: Producir, de manera guiada, textos escritos y multimodales coherentes, de manera creativa y en distintos soportes,
    seleccionando el modelo discursivo que mejor responda a cada situación comunicativa, aplicando las normas gramaticales
    y ortográficas, con la debida observación a los rasgos del español de Canarias, y utilizando estrategias de planificación,
    redacción, revisión y edición, con el objetivo de transmitir información y comunicar conocimientos, pensamientos, experiencias
    y emociones.
- nodo: sb:PLCL04SBIII
  campo: definition
  valor: Educación literaria
- nodo: sb:PLCL05SBI.2
  campo: definition
  valor: Identificación, de manera autónoma, de la diversidad etnocultural y lingüística como riqueza y herramienta de reflexión
    interlingüística, con especial atención a las características propias del español hablado en Canarias y en América.
- nodo: sb:PLCL05SBII.2.3
  campo: definition
  valor: Aplicación, de manera autónoma, de estrategias sencillas para la coherencia, la cohesión y la adecuación en diferentes
    tipos de textos.
- nodo: sb:PLCL05SBII.3.1
  campo: definition
  valor: Interacción oral adecuada en contextos espontáneos y reglados, a través de la escucha activa, la asertividad y la
    cortesía lingüística en la resolución dialogada de conflictos. Expresión y escucha empática de necesidades, vivencias
    y emociones propias y ajenas.
- nodo: sb:PLCL05SBII.3.5
  campo: definition
  valor: Comprensión lectora a través de la aplicación de estrategias antes, durante y después de la lectura. Identificación
    de las ideas más relevantes e interpretación del sentido global, realizando las inferencias necesarias y llevando a cabo
    una valoración crítica de manera autónoma. Identificación de elementos gráficos y paratextuales al servicio de la comprensión.
    Perfeccionamiento de las habilidades lectoras (ritmo, entonación, pausas, timbres de voz…) mediante la lectura compartida.
    Detección de usos discriminatorios del lenguaje verbal y no verbal.
- nodo: sb:PLCL05SBIII
  campo: definition
  valor: Educación literaria
- nodo: sb:PLCL05SBIII.1
