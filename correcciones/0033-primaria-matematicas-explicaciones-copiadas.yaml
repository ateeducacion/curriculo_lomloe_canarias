  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado describe rutinas teniendo en cuenta las acciones
    necesarias y el orden de aplicación, descompone tareas en otras más simples, identifica patrones sencillos a partir de
    regularidades; utiliza secuencias numéricas, figuras o imágenes; hace predicciones y las explica; y crea o modifica algoritmos
