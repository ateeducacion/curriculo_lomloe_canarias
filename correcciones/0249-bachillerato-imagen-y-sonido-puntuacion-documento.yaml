cambios:
- nodo: bc:BIYS02BC1
  campo: scopeNote
  valor: A través de este bloque competencial, se pretende valorar si el alumnado es capaz de diferenciar y analizar, críticamente,
    tanto de manera individual como colaborativa, las características, las cualidades, las tipologías y la intencionalidad
    comunicativa del lenguaje audiovisual, haciendo uso de herramientas digitales adecuadas, respetando la protección de datos
    y los derechos de autoría, evitando sesgos de género y aplicando las técnicas de este tipo de lenguaje, a partir del visionado
    y audición de diferentes obras y productos visuales, sonoros y audiovisuales (videoclips, planos cinematográficos, cuñas
    y spots, making-of, trailers…) y de su evolución histórica (aportaciones tecnológicas y expresivas del sonido en el proceso
    de transformación del cine mudo al sonoro, evolución de las teorías del montaje audiovisual…), de manera que reconozca
    y comprenda la funcionalidad estética y narrativa de sus diferentes elementos y su coherencia con el montaje final. Además,
    debe ser capaz de reconocer e identificar la tipología y la intencionalidad comunicativa de los diferentes géneros, relacionando
    su desarrollo y evolución con los hitos históricos relevantes.
- nodo: bc:BIYS02BC3
  campo: scopeNote
  valor: Con este bloque competencial se pretende comprobar si el alumnado es capaz de reconocer las cualidades técnicas de
    dispositivos específicos de captación de imagen y sonido (cámaras fotográficas y de vídeo, equipos de sonido, cámaras
    de cine, micrófonos, ópticas…), con la finalidad de seleccionar aquellos que sean más adecuados al propósito que se plantea
    y de utilizarlos para realizar grabaciones de piezas audiovisuales (producciones, doblaje, publicidad, efectos sonoros,
    diaporamas…), que cumplan con la finalidad comunicativa planteada y con la planificación previa. Asimismo, se comprobará
    que el alumnado es capaz de identificar los dispositivos y las aplicaciones digitales necesarias para llevar a cabo una
    retransmisión audiovisual o sonora en directo a través de Internet.
