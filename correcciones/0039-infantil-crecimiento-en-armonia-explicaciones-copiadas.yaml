id: 0039
titulo: 'Crecimiento en Armonía (Educación Infantil): 12 explicaciones de bloque copiadas de otro curso'
motivo: La exportación repite en estos bloques competenciales la explicación de otro curso de la materia; el documento oficial
  trae una explicación propia para cada curso. Generada con `contrastar --proponer`.
fuente:
  documento: infantil-crecimiento-en-armonia
  fichero: fuentes/documentos/infantil/Area_1_Crecimiento_en_Armonia.odt
  sha256: 661708b03152323740af3e35c4f121573712d940f1a77e5c6b24e35aeb95989b
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: propuesta
aprobada_por: null
cambios:
- nodo: bc:ICR404BC1
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de reconocer las características de
    su cuerpo de manera global y segmentada y de avanzar en la construcción de su esquema corporal Se constatará que adquiere
    mayor precisión, seguridad y control dinámico en sus desplazamientos y movimientos, y que demuestra un control progresivo
    de la coordinación, el tono, el equilibrio y los desplazamientos. Asimismo, se constatará que los niños y las niñas progresan
    en la integración sensorial del mundo a través de la aplicación de distintas estrategias que le permitan reconocer los
    sentidos y sus funciones, progresando en la construcción de una autoimagen positiva y ajustada, a partir del reconocimiento
    de las cualidades personales y la identificación de las diferencias respecto a otras personas de su entorno escolar, familiar
    y social. Se verificará también que el alumnado muestra autonomía en la realización de tareas y confianza en las propias
    posibilidades, y que es capaz de participar y disfrutar en diferentes tipos de juegos así como de mostrar sensibilidad
    hacia las implicaciones que tiene, en la vida cotidiana, la diversidad funcional. Todo ello con la finalidad de que el
    alumnado profundice en el conocimiento, la valoración y el control de su cuerpo, utilizando los recursos que este le ofrece,
    para desenvolverse en el medio de forma cada vez más autónoma, conformando progresivamente su autoimagen.
- nodo: bc:ICR404BC2
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de identificar inquietudes, gustos y
    preferencias, de comunicar y expresar sus necesidades, sentimientos y emociones, y de desarrollar estrategias de regulación
    emocional. Asimismo, se valorará que los niños y las niñas establezcan relaciones armónicas y alejadas de estereotipos,
    y que sean capaces de mostrar satisfacción y seguridad por los logros conseguidos y de valorar la cooperación y ayuda
    entre iguales. Se contribuye así a la adquisición de la competencia específica, ya que el alumnado será capaz de utilizar
    herramientas para expresar, aceptar y controlar de manera progresiva sus emociones, sentimientos y vivencias. Además,
    se constatará que los niños y las niñas desarrollan estrategias de ayuda y cooperación en diversas situaciones de la vida
    cotidiana así como en contextos de juego, y que son capaces de aceptar con actitud positiva las correcciones que reciben,
    reconocer las propias posibilidades y valorar el trabajo bien hecho. Todo ello con la finalidad de que el alumnado se
    inicie en el reconocimiento y la gestión de sus propias emociones, como herramienta fundamental para hacer frente gradualmente,
    con seguridad y autonomía, a situaciones cambiantes e inciertas presentes en su vida cotidiana.
- nodo: bc:ICR404BC3
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que los niños y las niñas son capaces de identificar y satisfacer
    sus necesidades básicas, así como de mostrar autonomía en las actividades de higiene personal. Se constatará, además que
    participa en actividades relacionadas con el autocuidado –implementando iniciativas de prevención de riesgos en situaciones
    cotidianas– y con el cuidado del entorno, adquiriendo progresivamente hábitos sostenibles y ecosocialmente responsables.
    Se verificará, además, que el alumnado es capaz de participar en actividades físicas estructuradas y otras propuestas
    saludables, en diferentes espacios, incluidos las zonas naturales al aire libre (zonas verdes cercanas al centro, espacios
    que se puedan crear con el alumnado como jardines verticales, huerto escolar…), siendo capaces de identificar situaciones
    peligrosas para prevenir accidentes. Se valorará la planificación secuenciada de acciones para resolver una tarea (normas
    de comportamiento social en la comida, el descanso, la higiene, los desplazamientos…). Todo ello con la finalidad de que
    el alumnado profundice en la adquisición de hábitos saludables y sostenibles, iniciándose en conductas saludables respecto
    al consumo responsable y la actividad física, así como en el cuidado y respeto del propio cuerpo, el de las demás personas
    y del entorno.
- nodo: bc:ICR404BC4
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que los niños y las niñas son capaces de establecer relaciones
    con las demás personas y con el mundo, demostrando afecto y empatía, en juegos y actividades colectivas, evitando situaciones
    de discriminación. Asimismo, se valorará que sean capaces de identificar y reproducir conductas, acciones o situaciones
    basadas en el respeto, la empatía, la igualdad entre mujeres y hombres, así como de desarrollar destrezas y habilidades
    para la gestión de conflictos, proponiendo para ello soluciones creativas. Por otra parte, se comprobará que el alumnado
    participa en actividades para la reflexión sobre las normas sociales de convivencia y que participa activamente en actividades
    relacionadas con su propia cultura y con otras presentes en su entorno, mostrando interés por conocerlas. Se contribuye
    así a la adquisición de la competencia específica, ya que se comprobará que el alumnado es capaz de incorporarse de forma
    armónica a la escuela, desplegando de forma progresiva habilidades socioafectivas y de convivencia que les permitan comunicar
    sentimientos y emociones, interiorizar pautas básicas de convivencia, adquirir estrategias para la autorregulación de
    la conducta y la resolución de conflictos. Asimismo, se valorará que los niños y las niñas adquieran y empleen fórmulas
    de cortesía e interacción social positiva, manifiesten actitudes de ayuda y cooperación y den una respuesta empática a
    la diversidad. Se comprobará el aprecio hacia las señas de identidad y la participación activa y el disfrute en celebraciones,
    costumbres y tradiciones étnicos-culturales, con especial atención a las del patrimonio cultural canario. Por otra parte,
    se valorará que el alumnado desarrolle el juego simbólico a través de la observación, representación e imitación de personas,
    personajes y situaciones. Todo ello con la finalidad de que el alumnado progrese en la construcción de la identidad como
    resultado del conjunto de interacciones con el entorno social próximo y que asimile modelos de relación basados en el
    respeto, la empatía, la promoción de la igualdad entre mujeres y hombres, el reconocimiento y aceptación de la diversidad
    y el respeto a los derechos humanos, mostrando el sentido de pertenencia a un grupo y aprendiendo a vivir en armonía con
    otras personas.
