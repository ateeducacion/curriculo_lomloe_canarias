- nodo: bc:BMUW01BC1
  accion: crear
  datos:
    tipo: BloqueCompetencial
    notation: BMUW01BC1
    prefLabel: Música, Expresión y Espectáculos · 1º Bachillerato · bloque competencial C1
    scopeNote: A través de este bloque competencial se potenciará que el alumnado aplique diversas técnicas de improvisación
      y composición para la creación de materiales propios, destinados a usarse en las producciones artísticas durante el
      curso. Tanto la improvisación como la composición son vías para la nueva creación, siendo procesos interrelacionados
      que impulsan la creatividad de perfiles más intuitivos o reflexivos. En todo caso, ambos procesos inducen a la toma
      de decisiones y a la autoevaluación, que contribuyen al desarrollo del espíritu crítico. Cuando las tareas de improvisación
      o composición se realicen en grupo, las aportaciones individuales forman parte de una expresión musical conjunta, por
      lo que es indispensable mantener una actitud colaborativa. En el desempeño de esta competencia, se podrán aplicar variedad
      de estilos, tanto afines como novedosos. Para este propósito, la docencia debe considerar las experiencias previas del
      alumnado y sus habilidades con el manejo de instrumentos y la voz. De esta manera, se ajustará el proceso creativo con
      la capacidad de interpretación. Además, es necesario considerar la gestión emocional durante la experimentación, que
      puede activar diversos frenos a la creatividad como el miedo y el perfeccionismo. Por otro lado, la creación artística
      se debe nutrir de técnicas y conocimientos para la producción de material con un lenguaje comprensible. Para ello, en
      el ámbito de la improvisación, existen las opciones de lenguajes idiomáticos, por ejemplo, el blues, u otros lenguajes
      no idiomáticos, más abiertos. En todo caso, la práctica contínua de improvisación aportará experiencia para su aplicación
      en escena, así como ideas musicales para componer posteriormente. Respecto a las técnicas, es muy útil fijar unos límites
      y unas consignas, musicales o extramusicales, así como puntualmente usar gestos de dirección. En estos casos, las restricciones
      serán paradójicamente de gran ayuda para la libre expresión. En cuanto a la composición y los arreglos, el profesorado
      puede facilitar un material de partida y unas indicaciones concretas para su desarrollo, conforme al nivel de conocimiento
      y habilidades del alumnado. La posibilidad de componer material inédito o de realizar arreglos de músicas preexistentes
      brinda opciones para atender a diversas preferencias del alumnado, de forma que se consideren tanto las tendencias experimentales
      como otras más conservadoras, con gusto por la recreación de piezas conocidas. En ocasiones será necesario plasmar las
      ideas con partituras o con la grabación, usando medios digitales Respecto a la evaluación de las improvisaciones y creaciones
      propias, el profesorado debe fomentar el espíritu crítico y constructivo, que conlleve una mejora continua, apostando
      por la experimentación y el desarrollo de ideas propias como impulso de la creatividad. En esta línea, será de ayuda
      considerar tanto el progreso como el resultado de cada producto, aplicando algunos ítems observables como el ajuste
      a las consignas, el desarrollo de las ideas y el sentido del riesgo; asimismo, se puede estimar la escucha y la precisión,
      en el caso de las improvisaciones.
