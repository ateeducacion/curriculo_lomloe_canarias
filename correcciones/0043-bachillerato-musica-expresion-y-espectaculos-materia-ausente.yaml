- nodo: bc:BMUW01BC2
  accion: crear
  datos:
    tipo: BloqueCompetencial
    notation: BMUW01BC2
    prefLabel: Música, Expresión y Espectáculos · 1º Bachillerato · bloque competencial C2
    scopeNote: A través de este bloque competencial se persigue comprobar que el alumnado identifique sus emociones en relación
      a la experiencia musical. La identificación y la reflexión sobre las emociones es una tarea compleja que facilitará
      tanto el conocimiento personal como el de las demás personas, propiciando el desarrollo de la empatía y la mejora de
      la comunicación en todas sus dimensiones. Asimismo, el alumnado debe ser capaz de expresarse de manera escrita, oral
      o mediante cualquier medio artístico. Se evaluará la capacidad del alumnado de exponer conclusiones y poder elaborar
      productos para desarrollar este proceso de indagación y descubrimiento emocional y personal. Todo esto favorece el aprendizaje
      de aquellos saberes básicos relativos al desarrollo tanto de las habilidades y las destrezas para identificar, reconocer
      y expresar emociones como de las actitudes necesarias para que esto pueda llevarse a cabo en un entorno de respeto,
      seguridad y confianza. Este bloque competencial implica actividades de experimentación musical y la realización de productos
      artísticos que vinculen emociones y música, todas ellas acompañadas de procesos reflexivos que pueden verse reflejados
      en fichas de trabajo individuales así como en actividades dialécticas grupales. Se podrán diseñar actividades que vinculen
      cuerpo-mente-emoción, que posibiliten la autorreflexión y el autoconocimiento. Inicialmente, y para facilitar el buen
      desarrollo de esta competencia específica, se realizarán ejercicios introductorios de respiración, de conciencia corporal,
      dinámicas de pareja y trabajo en pequeños grupos. La dimensión abierta y dinámica a la vez que personal de este bloque
      competencial permite la inclusión de alumnado de diferentes capacidades, inquietudes e intereses, posibilitando un aprendizaje
      igualitario e inclusivo.
