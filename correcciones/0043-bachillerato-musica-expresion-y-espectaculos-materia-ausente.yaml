- nodo: bc:BMUW01BC3
  accion: crear
  datos:
    tipo: BloqueCompetencial
    notation: BMUW01BC3
    prefLabel: Música, Expresión y Espectáculos · 1º Bachillerato · bloque competencial C3
    scopeNote: El desarrollo de este bloque competencial permitirá que el alumnado comprenda la relación directa entre la
      música y las diferentes expresiones escénicas, prestando especial atención a las producciones realizadas en Canarias.
      Se valorará la capacidad del alumnado para analizar las funciones que desempeña la música en las artes escénicas, abarcando
      aspectos expresivos, estéticos y estructurales. En este empeño, se fomentará el conocimiento del patrimonio artístico
      tanto canario como del resto del territorio nacional y de otras culturas, así como el descubrimiento de nuevas formas
      de producir arte. Todo esto permitirá ampliar el vocabulario técnico y sus gustos artísticos, mejorando su espíritu
      crítico y valorando el patrimonio cultural tanto propio como ajeno. Estos aprendizajes se llevarán a cabo mediante el
      análisis de diferentes disciplinas escénicas, mostrando una actitud abierta, con respeto por distintas manifestaciones
      artísticas y consideración por el valor de la mujer como artista.
    broader: materia:BMUW
    agrupa:
