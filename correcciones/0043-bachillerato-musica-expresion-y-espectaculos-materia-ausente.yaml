- nodo: bc:BMUW01BC4
  accion: crear
  datos:
    tipo: BloqueCompetencial
    notation: BMUW01BC4
    prefLabel: Música, Expresión y Espectáculos · 1º Bachillerato · bloque competencial C4
    scopeNote: La activación de este bloque competencial permitirá constatar el grado de compromiso del alumnado durante la
      preparación de proyectos escénicos y la adquisición de habilidades como intérprete, en escenario y frente al público.
      De esta manera, se logra potenciar el desempeño en actividades escénicas y se contribuye al desarrollo artístico y personal
      del alumnado. También, la programación de actuaciones pueden beneficiar la vida cultural del entorno. Respecto al Perfil
      de salida, el alumnado debe ser capaz de integrarse en dinámicas de trabajo marcadas por la implicación y la cooperación
      para facilitar el crecimiento artístico del grupo. Asimismo, el contacto con el escenario y el público conlleva la aplicación
      de técnicas de gestión emocional, así como tomar conciencia de los condicionantes y las limitaciones técnicas, cuya
      aceptación puede reforzar la confianza y optimizar el rendimiento en escena. Además, la preparación de un actuación
      focaliza las actividades creativas, los lenguajes y los medios que se vayan a usar en escena. En este sentido, los saberes
      básicos consideran determinadas habilidades y técnicas para usar en ensayos y actuaciones, relacionadas con la práctica
      de conjunto y con la escucha activa. También se han de considerar aquellos estados emocionales que limitan la expresión
      artística en el escenario, para lo cual se pueden aplicar diversas técnicas de relajación y concentración. La participación
      en proyectos escénicos aglutina diversas competencias incluidas en esta optativa, visto que los ensayos y la actuación
      con público activan diversos estados emocionales con la música, y permiten expresar material creado por el alumnado,
      ya sea de nueva composición, improvisación o arreglos. La flexibilidad que aportan obras de creación propia facilita
      el encaje de diversos perfiles artísticos y técnicos, además de un repertorio acorde al nivel del alumnado. En lo que
      respecta a la evaluación en ensayos y actuaciones, la observación de la docencia es una herramienta fundamental, que
      puede apoyarse en rúbricas con ítems como el cumplimientos de las pautas dadas y el comportamiento decidido, en equilibrio
      con las necesidades del grupo. En todo caso, es necesario tener en mente que esta competencia tiene un fuerte componente
      actitudinal y, por tanto, el rendimiento artístico pasa a un segundo plano porque estas enseñanzas no son profesionalizadoras.
