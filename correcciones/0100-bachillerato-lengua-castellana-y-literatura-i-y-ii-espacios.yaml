- nodo: bc:BLEY01BC8
  campo: scopeNote
  valor: Se verificará con este bloque competencial que el alumnado es capaz de explicar y argumentar, utilizando un metalenguaje
    específico, la interpretación de obras o fragmentos representativos de la literatura canaria, española y universal a partir
    de la lectura guiada y compartida en el aula de textos inscritos en itinerarios temáticos o de género planificados, que
    atraviesan épocas, contextos culturales y movimientos artísticos, vinculando el contenido y la forma con su contexto sociohistórico,
    cultural y artístico, la intención del autor o autora, la recurrencia de temas y los elementos constitutivos del género
    y su relación con el sentido de la obra, interpretando de manera justificada los efectos de los recursos expresivos en
    la recepción, atendiendo a sus valores culturales y estéticos, con especial atención a la perspectiva de género, así como
    constatando la pervivencia de universales temáticos y formales, a fin de enriquecer su mapa cultural y desarrollar su
    conciencia literaria con la configuración de una panorámica de la literatura española hasta el tercer cuarto del siglo
    XIX. Asimismo, se comprobará que el alumnado analiza y compara de manera reflexiva la conexión existente entre unos textos
    literarios con otros, ya sean orales, escritos o multimodales, y con otras manifestaciones artísticas, clásicas o contemporáneas
    (música, pintura, cine, arquitectura, cómic y novela gráfica, media art…), estableciendo vínculos intertextuales en función
    de temas, tópicos, estructuras, lenguaje, valores éticos y estéticos; interpretando de manera razonada las influencias,
    las semejanzas o las diferencias que existen entre ellos y manifestando, a lo largo del proceso, juicios críticos razonados
    en los que se valorará el respeto por las opiniones y experiencias ajenas. Para ello, el alumnado participará de manera
    activa y adecuada en situaciones comunicativas propias del ámbito personal, académico y social que propiciarán la construcción
    compartida de la interpretación argumentada de las obras y la realización de trabajos de identificación y crítica literaria
    de complejidad creciente, individuales o cooperativos, presentados en diversos formatos y soportes, en los que se propicie
    una relación afectiva con las obras literarias y se priorice el despertar de una sensibilidad estética que acreciente
    en ellos y ellas las posibilidades de disfrute ante la lectura y la escritura creativa. Además, efectuará lecturas expresivas,
    dramatizaciones y recitaciones de textos (videopoemas, guiones, improvisaciones, representaciones…) atendiendo a los procesos
    de comprensión, apropiación y oralización implicados. Por último, se pretende verificar que el alumnado es capaz, a partir
    de las obras leídas, de crear textos personales o colectivos de géneros diversos (poemas, caligramas, relatos cortos,
    diarios digitales, biografías, monólogos humorísticos, novelas gráficas, piezas teatrales…) con propósito literario y
    artístico, sentido estético y conciencia de estilo, en los que aplica las convenciones del lenguaje literario y la experiencia
    lectora en la expresión con distintos lenguajes artísticos y audiovisuales (cómics, vídeos, biopic, animación, interpretación
    teatral, blogs…), aplicando autoevaluaciones y técnicas metacognitivas de retroalimentación sobre su propio proceso de
    aprendizaje, con el propósito de que la escritura creativa sea una forma de comunicación que permita afianzar el gusto
    por la lectura y la creación literaria.
- nodo: bc:BLNG02BC2
  campo: scopeNote
  valor: A través de este bloque competencial se persigue constatar que el alumnado, individualmente o en grupo, comprende,
    interpreta y valora textos orales o multimodales especializados de los ámbitos social (redes sociales y medios de comunicación)
    y educativo (textos académicos), aplicando estrategias que le permitan valorar y explicar de manera razonada los componentes
    del hecho comunicativo (grado de formalidad de la situación y carácter público o privado; distancia social entre las personas
    interlocutoras; propósitos comunicativos e interpretación reflexiva de intenciones y canal de comunicación). Se verificará
    asimismo que distingue y explica con sentido crítico la diferencia entre la información, la opinión y la persuasión, los
    procedimientos retóricos, las falacias argumentativas, los elementos no verbales de la comunicación (gestos, postura,
    proxemia y vocalización), así como que analiza y expone de manera sólida y argumentada el significado de la imagen y elementos
    paratextuales de los textos icónico-verbales y multimodales, ensanchando las posibilidades de la comunicación asíncrona
    a partir de la búsqueda, de manera avanzada y selección de forma autónoma de la información con criterios de validez,
    calidad, actualidad, fiabilidad y pertinencia, analizándola, valorándola, reorganizándola y sintetizándola en oraciones
    que se relacionen lógica y semánticamente, lo que requiere una específica alfabetización audiovisual y mediática para
    hacer frente a los riesgos de desinformación y manipulación. También se comprobará que es capaz de analizar, valorar y
    exponer de manera fluida y razonada la forma y el contenido del texto atendiendo al sentido global y la relación entre
    sus partes, así como de seleccionar, retener y analizar de forma reflexiva y crítica la información más relevante, y de
    interpretar de manera reflexiva y apropiarse de los mecanismos de referencia interna y de los procedimientos lingüísticos
    para la expresión de la subjetividad y de la objetividad. Todo ello estableciendo conexiones entre el texto y su contexto
    que le permitan conferir su sentido y detectar sus sesgos ideológicos, examinando de manera eficaz e instintiva fuentes
    de procedencia verbal y no verbal (también entornos virtuales de aprendizaje, bibliotecas escolares y públicas como espacios
    creativos de aprendizaje…), reflexionando sobre los usos discriminatorios del lenguaje verbal e icónico y rechazándolos
    de manera responsable, y aplicando con rigor y eficiencia métodos inductivos, deductivos y metalingüísticos (formulación
    de hipótesis, búsqueda de contraejemplos, establecimiento de generalizaciones, comparación con otras lenguas o redacción
    de conclusiones propias) con el propósito de participar en diferentes contextos de manera activa, responsable e informada
    y de construir conocimiento.
