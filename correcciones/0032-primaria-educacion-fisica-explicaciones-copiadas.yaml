id: '0032'
titulo: 'Educación Física (Educación Primaria): 12 explicaciones de bloque copiadas de otro curso'
motivo: La exportación repite en estos bloques competenciales la explicación de otro curso de la materia; el documento oficial
  trae una explicación propia para cada curso. Generada con `contrastar --proponer`.
fuente:
  documento: primaria-educacion-fisica
  fichero: fuentes/documentos/primaria/anexo_2_curriculo-educacion_fisica.odt
  sha256: 24c8a6c7f9c1cf7414f747c0dc48fb58e8bb21fff3bb91f99e15698aae6b671e
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: bc:PEFI03BC2
  campo: scopeNote
  valor: A través de este bloque competencial el alumnado resolverá problemas motores, aplicando sus capacidades físicas básicas
    (fuerza, velocidad, resistencia y flexibilidad) y resultantes, las capacidades perceptivo-motrices (coordinación, equilibrio,
    lateralidad y estructuración espacio-temporal) y las habilidades motrices básicas (saltos, giros, desplazamientos, lanzamientos
    y recepciones) y genéricas (bote, conducción, golpeo…), tomando conciencia del dominio de su propio cuerpo, y teniendo
    en cuenta situaciones en movimiento o estáticas, con el uso de materiales y con la incertidumbre derivada del entorno
    y del resto de participantes. Para ello, el alumnado debe demostrar que adopta decisiones en juegos motores y actividades
    deportivas individuales, de cooperación, de oposición y de cooperación-oposición, en función de lo que percibe, ajustando
    sus conductas motrices a los objetivos de la situación y a las características del espacio, del tiempo, de los materiales
    y a la interacción con los otros participantes. Además, se constatará que adquiere un progresivo control y dominio corporal,
    empleando los componentes cualitativos y adaptando los componentes cuantitativos de la motricidad a las situaciones motrices
    lúdicas, llevando a cabo retos motores de carácter individual y colaborativo, y teniendo en cuenta estímulos internos
    y externos para ofrecer respuestas motrices en contextos reales o simulados. Todo ello con la finalidad de que el alumnado
    utilice, mediante alguna orientación, métodos inductivos (generando conductas motrices a partir de respuestas concretas)
    y deductivos (utilizando aprendizajes adquiridos en situaciones lúdicas específicas), para resolver problemas motores
    implicando el esfuerzo y la dedicación personal, reconociendo sus limitaciones y buscando la superación personal a través
    de autoevaluación y la coevaluación.
- nodo: bc:PEFI03BC4
  campo: scopeNote
  valor: A través de este bloque competencial el alumnado es capaz de distinguir y practicar diferentes manifestaciones lúdicas,
    físico-deportiva y artístico-expresivas, valorando su influencia y sus aportaciones a la cultura tradicional y contemporánea,
    para integrarlas dentro del repertorio de actuaciones motrices que se utilizan regularmente en la vida cotidiana. Se constatará
    que el alumnado es capaz de participar activamente en juegos motores y deportes tradicionales de Canarias así como de
    otras culturas generando interacciones positivas hacia la igualdad. También se comprobará que el alumnado es capaz de
    reproducir composiciones artístico-expresivas de Canarias y otras culturas, y participar en composiciones con o sin soporte
    musical, transmitiendo sensaciones, emociones e ideas mediante el ritmo y movimiento. Todo ello con la finalidad de que
    el alumnado reconozca, respete y disfrute de las manifestaciones culturales y artísticas integrando sus capacidades afectivas
    con actitud abierta e inclusiva, utilizando de forma creativa distintas representaciones artísticas con técnicas corporales,
    visuales y sonoras. Se constatará que reflexiona y dialoga sobre problemas éticos diferencias culturales, ideológicas,
    rechaza prejuicios y se opone a cualquier forma de discriminación, reconociendo y respetando los aspectos del patrimonio
    cultural y artístico de cualquier época, comprendiendo las diferencias culturales.
- nodo: bc:PEFI03BC5
  campo: scopeNote
  valor: A través de este bloque competencial se constatará que el alumnado es capaz de valorar diferentes medios naturales
    y urbanos como contextos de práctica motriz. Para ello, el alumnado deberá demostrar que es capaz de practicar actividad
    física en los distintos espacios del entorno natural y urbano de forma segura, siendo consciente de las relaciones sistémicas
    entre las acciones humanas y el entorno e iniciándose en la adopción de hábitos de vida sostenibles, tanto favoreciendo
    la reutilización de materiales como a través de una educación vial que favorezca una movilidad segura, saludable y sostenible.
    Se comprobará que participa en acciones fundamentadas científicamente para preservar la salud y conservar el medioambiente
    previniendo y sensibilizando sobre la generación de residuos y su correcta gestión, atendiendo a las particulares características
    del territorio canario. Se constatará que sus actuaciones se fundamentan en un análisis previo de la situación, reconociendo
    el estado del material para las actividades en el medio natural y urbano a través de una valoración previa y actuando
    ante posibles desperfectos. Todo ello con la finalidad de que el alumnado reconozca necesidades y retos a afrontar y utilice
    destrezas creativas para identificar y proponer ideas y soluciones originales.
