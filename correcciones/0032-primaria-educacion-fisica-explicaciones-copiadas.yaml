- nodo: bc:PEFI05BC2
  campo: scopeNote
  valor: 'A través de este bloque competencial el alumnado resolverá problemas motrices, aplicando sus capacidades físicas
    básicas (fuerza, velocidad, resistencia y flexibilidad) y resultantes, las capacidades perceptivo-motrices (coordinación,
    equilibrio, lateralidad y estructuración espacio-temporal) y las habilidades motrices básicas (saltos, giros, desplazamientos,
    lanzamientos y recepciones), genéricas (bote, conducción, golpeo…) e iniciación a las específicas (entendidas como la
    combinación de las habilidades motrices básicas y su aplicación al deporte), tomando conciencia del dominio de su propio
    cuerpo teniendo en cuenta situaciones en movimiento o estáticas, con el uso de materiales y con la incertidumbre derivada
    del entorno y el resto de participantes. Para ello, el alumnado aplica respuestas significativas a situaciones motrices
    de carácter individual, de oposición, de cooperación y de cooperación-oposición, teniendo en cuenta el espacio, el tiempo,
    los materiales utilizados y la interacción con el resto de participantes, implicando los tres mecanismos: percepción,
    decisión y ejecución. Se constatará que controla y domina su propio cuerpo y aplica las habilidades motrices, perceptivo-motrices,
    capacidades coordinativas y las capacidades físicas básicas para dar respuesta a situaciones motrices variadas y cercanas
    a su contexto, mediante la planificación y la autorregulación de retos motores individuales o colaborativos, con unas
    metas a alcanzar, realizando un seguimiento y valorando su evolución y creando productos que den respuesta a un problema
    motor. Todo ello con la finalidad de que el alumnado seleccione y utilice acciones motrices y estrategias en función de
    la lógica interna de los juegos motores o deportes, adaptándose a la incertidumbre que se puede generar en las distintas
    situaciones motrices y el reconocimiento de sus propias conductas motrices y las de las demás personas. Se valorará su
    capacidad de reflexión y de sentido crítico con las propias limitaciones, organizando y planificando objetivos a corto
    plazo para la mejora a partir de la retroalimentación de la auto y coevaluación, reconociendo el esfuerzo y la dedicación
    como aspectos fundamentales para el aprendizaje.'
- nodo: bc:PEFI05BC4
  campo: scopeNote
  valor: A través de este bloque competencial el alumnado reconocerá y practicará diferentes manifestaciones lúdicas, físico-deportivas
    y artístico-expresivas propias de la cultura motriz, valorando y transmitiendo su influencia y sus aportaciones para integrarlas
    en el ámbito educativo y a la vida cotidiana. Se comprobará que el alumnado es capaz de participar activamente en juegos
    motores y deportes de la cultura tradicional de Canarias, así como de otras culturas generando interacciones positivas
    hacia la igualdad entre personas reconociendo el esfuerzo y la dedicación de distintos referentes deportivos. Se constatará
    que el alumnado es capaz de reproducir composiciones artístico-expresivas de Canarias y otras culturas, y crear composiciones
    con o sin soporte musical, transmitiendo sensaciones, emociones e ideas mediante el ritmo y movimiento. Todo ello con
    la finalidad de que el alumnado reconozca, reflexione y dialogue sobre valores y problemas éticos de actualidad y entienda
    la necesidad de respetar diferentes culturas e ideologías, cuidar el entorno, rechazar prejuicios y estereotipos sexistas
    en el deporte, oponiéndose a cualquier forma de discriminación y violencia, reconociendo y respetando los aspectos fundamentales
    del patrimonio cultural de cualquier época, comprendiendo las manifestaciones culturales y artísticas integrando sus capacidades
    afectivas con actitud abierta e inclusiva, utilizando de forma creativa distintas representaciones artísticas con técnicas
    corporales, visuales y sonoras.
- nodo: bc:PEFI05BC5
  campo: scopeNote
  valor: A través de este bloque competencial se constatará que el alumnado es capaz de valorar diferentes medios naturales
    y urbanos como contextos de práctica motriz. Para ello, el alumnado deberá demostrar que es capaz de adaptar las acciones
    motrices a la incertidumbre de los espacios del entorno natural y urbano de forma eficiente y segura, previa valoración
    de posibles riesgos y posibilidades para la práctica de actividad física y actuando desde una perspectiva ecosostenible,
    cuidando el entorno, los animales y las plantas que en él conviven, como servicio a la comunidad. Se verificará que comprende
    las relaciones sistémicas entre las acciones humanas y el entorno, y se inicia en la adopción de hábitos de vida sostenibles
    valorando y utilizando la educación vial desde la actividad física y deportiva a través de una movilidad segura, saludable
    y sostenible, participando en acciones fundamentadas científicamente para preservar la salud y el medioambiente, aplicando
    principios de ética y seguridad. Se evaluará si es capaz de participar en actividades comunitarias contribuyendo a la
    resolución dialogada y justa de los conflictos de forma consciente y respetuosa con los principios democráticos y si asume
    retos y adopta medidas de responsabilidad individual durante la práctica motriz para que sea respetuosa con el entorno
    mediante la construcción y reutilización de materiales. Se constatará que realiza las tareas planificadas, cooperando
    con otros para llevarlas a cabo valorando el proceso realizado, así como el resultado obtenido y considerando tanto la
    experiencia de éxito como de fracaso, una oportunidad para aprender. Todo ello con la finalidad de que el alumnado reconozca
    necesidades y retos a afrontar y utilice destrezas creativas para identificar y proponer ideas valiosas y soluciones originales,
    tomando conciencia de las consecuencias y efectos que estas ideas puedan generar en el entorno.
