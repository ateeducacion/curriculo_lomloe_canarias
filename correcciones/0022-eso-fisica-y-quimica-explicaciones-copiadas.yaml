id: '0022'
titulo: 'Física y Química (Educación Secundaria Obligatoria): 12 explicaciones de bloque copiadas de otro curso'
motivo: La exportación repite en estos bloques competenciales la explicación de otro curso de la materia; el documento oficial
  trae una explicación propia para cada curso. Generada con `contrastar --proponer`.
fuente:
  documento: eso-fisica-y-quimica
  fichero: fuentes/documentos/eso/Fisica_quimica_ESO.odt
  sha256: 15a856ae13e6dd6415a1d9666e0afff3b822618e57d60ae72cd308c015c802b3
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: propuesta
aprobada_por: null
cambios:
- nodo: bc:SFYQ03BC1
  campo: scopeNote
  valor: A través de este bloque competencial se pretende comprobar si el alumnado, ante una situación problemática real de
    índole científica, es capaz de hacerse preguntas para describirla, identificando y explicando los fenómenos fisicoquímicos
    cotidianos más relevantes que subyacen en ella, aplicando los conocimientos científicos que se engloban en los diferentes
    bloques de saberes básicos para mejorar su comprensión de los principios, las teorías y las leyes científicas y si activa
    los procesos necesarios para la resolución del problema (comprensión del enunciado, organización de la información, planteamiento
    lógico, ejecución correcta y solución), así como el análisis de los resultados que se obtienen (revisión del proceso,
    validez del resultado y reformulación del procedimiento si fuera necesario), expresando razonadamente sus conclusiones
    en diferentes formatos y soportes, dotándolo así de herramientas para la toma de decisiones y la mejora de la realidad
    cercana a través de la ciencia.
- nodo: bc:SFYQ03BC2
  campo: scopeNote
  valor: A través de este bloque competencial se constatará que el alumnado es capaz de poner su curiosidad al servicio del
    aprendizaje y emplear las metodologías propias de la ciencia (la observación, la formulación de hipótesis y la aplicación
    de la experimentación, la indagación y la búsqueda de evidencias, y la deducción) para identificar y describir los fenómenos
    científicos que ocurren en situaciones conocidas relacionadas con los diferentes bloques de saberes básicos, diferenciándolas
    de aquellas pseudocientíficas que no admiten comprobación experimental. Además se valorará si diseña procedimientos experimentales,
    valida hipótesis y analiza los resultados utilizando el razonamiento lógico-matemático, empleando diversos entornos y
    recursos científicos como el laboratorio o los entornos virtuales y manejando materiales, sustancias y herramientas de
    forma segura, para mejorar sus destrezas al interpretar los fenómenos científicos, presentar soluciones que creen valor
    en el ámbito personal, social, cultural y económico y despertar vocaciones científicas.
- nodo: bc:SFYQ03BC3
  campo: scopeNote
  valor: A través de este bloque competencial se pretende que el alumnado se familiarice con los flujos de información multidireccional
    característicos de las disciplinas científicas y, por tanto, se constatará si es capaz de seleccionar, interpretar y comunicar
    datos e información relativa a procesos físicoquímicos concretos de cualquiera de los bloques de saberes básicos con responsabilidad,
    en diferentes formatos y fuentes (enunciados, textos, tablas, gráficas, informes, manuales, diagramas, fórmulas, esquemas,
    modelos, símbolos…), analizando la calidad de los mismos y observando su imprecisión. Asimismo, se comprobará que es capaz
    de interrelacionar variables, conocer el Sistema Internacional de Unidades y sus símbolos, las herramientas matemáticas
    necesarias y las reglas de nomenclatura básicas de la IUPAC para los compuestos inorgánicos más sencillos para comunicarse
    en el lenguaje universal de la ciencia. También se evaluará si es capaz de aplicar las normas de uso de los espacios específicos
    de la ciencia (instalaciones de museos, universidades, centros sanitarios, centros de investigación…), especialmente los
    laboratorios del centro, y de utilizar los materiales, las sustancias y las herramientas que en ellos se encuentren para
    establecer comunicaciones efectivas englobadas en un entorno que asegure su salud, la de las demás personas y la del medioambiente.
- nodo: bc:SFYQ03BC4
  campo: scopeNote
  valor: A través de este bloque competencial se verificará si el alumnado es capaz de seleccionar distintos recursos, incluso
    en otros idiomas, apropiados para la consulta de información, la creación de contenidos didácticos o con fines comunicativos.
    Para ello ha de utilizar con creatividad las fuentes y las herramientas, tradicionales y digitales, más adecuadas en función
    de sus necesidades cuando localiza, selecciona y analiza información, de manera progresivamente autónoma, atendiendo a
    criterios de pertinencia, calidad y fiabilidad; cuando la integra y transforma para construir nuevo conocimiento y crear
    contenidos que aporten valor para sí mismos y para la comunidad, asociados a cualquiera de los bloques de saberes básicos,
    respetando la propiedad intelectual; y cuando interacciona con otros miembros de la comunidad educativa, tanto en el trabajo
    individual como en equipo, desde el respeto a las aportaciones del grupo en los procesos de revisión y mejora, para construir
    una comunicación efectiva y aumentar el aprendizaje propio y colectivo, con la finalidad de adquirir competencias que
    le permitan adaptarse a una sociedad que demanda personas integradas y comprometidas.
- nodo: bc:SFYQ03BC5
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará si el alumnado es capaz de trabajar en equipo como requiere, en
    la actualidad, la labor científica. Para ello, tendrá que desarrollar proyectos científicos que den solución a situaciones
    problemáticas reales relacionadas con cualquiera de los bloques de saberes básicos, tanto en el ámbito cercano como a
    escala global, desarrollando actividades de cooperación, propiciando la participación de todo el grupo, aceptando y cumpliendo
    las tareas y responsabilidades asignadas, analizando críticamente las aportaciones del equipo, incorporándolas a su aprendizaje
    con actitud dialogante y respetuosa, optimizando los recursos para llevar a término el proceso. Asimismo, se valorará
    si razona y comprende el impacto que las iniciativas desarrolladas tienen en la mejora de la sociedad, en la preservación
    de la salud física y mental propia y comunitaria, y en la conservación del medioambiente, adquiriendo hábitos de vida
    saludable y sostenible. Además, se evaluará si, en el contexto del trabajo en equipo, colabora e interactúa mediante herramientas
    o plataformas virtuales compartiendo contenidos, datos e información, y gestiona responsable y éticamente sus acciones
    poniendo sus prácticas comunicativas al servicio de la convivencia democrática, la resolución dialogada de los conflictos
    y el respeto a la diversidad en todas sus formas, evitando todo tipo de discriminación o violencia con la finalidad de
    unir puntos de vista diferentes en los procesos de investigación que contribuyan al progreso de la ciencia.
- nodo: bc:SFYQ03BC6
  campo: scopeNote
  valor: A través de este bloque competencial se constatará si el alumnado percibe y valora la ciencia como un proceso no
    finalizado, en continuo cambio y evolución, que se construye de manera recíproca con la tecnología y la sociedad, a través
    del análisis histórico de los avances científicos logrados por hombres y mujeres de ciencia, en aspectos como los modelos
    atómicos o la concepción del universo; así como los límites de la ciencia y los problemas éticos derivados. Del mismo
    modo, se evaluará si toma conciencia de la utilidad y aplicaciones que las sustancias químicas y sus reacciones, la energía,
    el movimiento de los cuerpos y las fuerzas que actúan sobre ellos, entre otros, tienen en la mejora de la calidad de vida
    cuando se hace un uso saludable y sostenible de los mismos. También se comprobará si establece las relaciones que existen
    entre la física y la química y otros campos como la ingeniería, el deporte, el diseño, la industria…, que permiten aportar
    soluciones para adoptar estilos de vida sostenibles y respetuosos con el medioambiente; y detectar, en el entorno, las
    necesidades tecnológicas, económicas, sociales y ambientales más importantes que demanda la humanidad, en general, y la
    sociedad canaria, en particular, con la finalidad de generar una conciencia social que requiere de la participación de
    toda la ciudadanía.
