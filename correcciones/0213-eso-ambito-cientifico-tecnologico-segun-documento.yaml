id: '0213'
titulo: 'Ámbito Científico-Tecnológico (Educación Secundaria Obligatoria): 7 diferencias corregidas con el documento oficial'
motivo: 'Diferencias que el contraste no explicaba con el BOC. Criterio aprobado: el ODT oficial de la web de currículos es
  la referencia y el corpus debe reflejarlo. Tipos: explicación de bloque distinto; texto de saber distinto.'
fuente:
  documento: eso-ambito-cientifico-tecnologico
  fichero: fuentes/documentos/eso/anexo_2_curriculo_pdc_eso_ACT.odt
  sha256: 64d8f26e9c715b667e231f20a70e91c7e1e54cfc4389a09e25d10a7ca5afe6e9
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: aprobada
aprobada_por: Fran Mateos
cambios:
- nodo: bc:SAMB03BC3
  campo: scopeNote
  valor: Este bloque competencial tiene el propósito de evaluar si el alumnado es capaz de identificar y gestionar sus emociones
    en el contexto educativo mediante el empleo de distintas técnicas (razonamiento lógico, asertividad, diario emocional...)
    en el desarrollo de proyectos colaborativos, el trabajo individual, la resolución de problemas y retos…, relacionados
    con los saberes básicos del ámbito, asumiendo el error como una oportunidad de crecimiento personal, proponiendo alternativas
    en el caso de no obtener los resultados esperados, aprendiendo de las equivocaciones propias y de las de las demás personas
    y realizando un seguimiento de su proceso formativo a través de diversas herramientas (diarios, planes de acción, agenda
    escolar, portafolio…) para planificar, abordar y regular su aprendizaje de forma eficaz. Además, se verificará que el
    alumnado es capaz, a través de procesos de autoevaluación individual y colectiva, y mediante la revisión de borradores
    y de los feedback correspondientes, de reflexionar, corregir o mejorar aquellos aspectos que lo requieran, utilizando
    la retroalimentación constructiva y la evaluación formativa, con el fin de mejorar su capacidad de perseverancia en la
    consecución de los objetivos. Por otro lado, se pretende comprobar si el alumnado es capaz de colaborar y asumir las responsabilidades
    del trabajo en equipo, participando de forma activa y desarrollando las destrezas personales y sociales que se ponen en
    acción a través de la realización de proyectos de investigación, debates en equipo, juegos de rol, resolución de problemas
    o retos, pequeñas experiencias de laboratorio…, relacionados con cualquiera de los bloques de saberes básicos del ámbito;
    utilizando dinámicas de trabajo cooperativo; elaborando productos que dependan de las aportaciones de cada una de las
    personas que conforman el grupo y de su funcionamiento; fomentando la comunicación y la colaboración entre el alumnado;
    promoviendo la empatía y respetando las emociones al comprender proactivamente las experiencias y los puntos de vista
    de las demás personas, a la vez que aprende a resolver los conflictos inherentes al trabajo en equipo; considerando los
    sentimientos y las perspectivas del resto; y buscando soluciones justas y mutuamente beneficiosas. Todo ello, con el fin
    de que el alumnado desarrolle las habilidades que le permitan seguir aprendiendo a lo largo de la vida, desde la confianza
    en el conocimiento como motor del desarrollo, construyendo una identidad positiva y fomentando una actitud dialogante
    y asertiva que repercuta en el bienestar personal y grupal y genere relaciones saludables.
- nodo: bc:SAMB03BC4
  campo: scopeNote
  valor: A través de este bloque competencial se persigue constatar que el alumnado es capaz de resolver problemas reales,
    relacionados con cualquiera de los bloques de saberes básicos del ámbito, haciendo uso de diferentes herramientas manuales
    o digitales (regletas, fichas, dados, calculadoras, hojas de cálculo, programas de representación gráfica o geometría
    dinámica, laboratorios virtuales, simulaciones...), seleccionando y configurando las más adecuadas en función de la tarea,
    aplicando los pasos del trabajo científico y utilizando de forma eficaz el pensamiento computacional para descomponer
    un problema en partes más simples y para codificarlo en un lenguaje apropiado y fácil de ejecutar por un sistema informático,
    y describiendo de forma oral, escrita o gráfica el proceso realizado. Asimismo, se comprobará que interpreta y modeliza
    problemas sencillos de la vida cotidiana, identificando los datos y el objetivo, definiendo la relación que existe entre
    ellos y representando la información mediante herramientas de modelización como diagramas, expresiones simbólicas, gráficas...
    Además, se verificará que el alumnado aplica diversas estrategias (analogía con otros problemas, estimación, ensayo y
    error, resolución de manera inversa, búsqueda de patrones...), reflexionando sobre el proceso realizado y transformando
    el error en oportunidad de aprendizaje. También se pretende evaluar si es capaz de obtener todas las soluciones posibles
    de un problema, así como seleccionar de entre ellas las óptimas, comprobando, interpretando y reflexionando sobre su validez
    e idoneidad, y reformulando los procedimientos y las conclusiones, si fuera necesario. Igualmente, se verificará que el
    alumnado es capaz de reconocer y describir, utilizando el pensamiento científico y el razonamiento matemático, fenómenos
    de índole científico-tecnológico; analizando datos e información científico-tecnológica de diferentes fuentes de información
    (libros, revistas, periódicos, páginas web, pódcast, vídeos...) y en diversos formatos (gráficos, tablas, imágenes, símbolos…);
    haciendo uso de la terminología adecuada y de los principios, las teorías y las leyes científicas que se engloban en los
    diferentes bloques de saberes básicos; entendiendo y aplicando las conexiones existentes entre el mundo real, las matemáticas
    y las ciencias; y usando los procesos inherentes a la investigación científica y matemática para comprender y mejorar
    lo que ocurre a su alrededor a través de la ciencia y la tecnología. Finalmente, se evaluará si el alumnado identifica
    los elementos del hardware y del software de los dispositivos tecnológicos de uso cotidiano, analiza y evalúa su funcionamiento,
    desarrollando procesos metacognitivos de retroalimentación para aprender de sus errores, y resuelve problemas técnicos
    sencillos, aplicando, para todo ello, criterios de reutilización de materiales y ahorro energético, con el fin de hacer
    un uso seguro y eficiente de estos, y proteger los datos personales, la salud y el medioambiente.
- nodo: bc:SAMB03BC6
  campo: scopeNote
  valor: 'A través de este bloque competencial se pretende evaluar si el alumnado es capaz de identificar de forma colaborativa
    los efectos de las acciones cotidianas, propias y ajenas, sobre el medioambiente (valoración crítica del empleo de materiales
    contaminantes, uso eficiente de la energía, impactos de la movilidad sostenible, consecuencias para el medio y la salud
    de los diferentes hábitos de consumo, efectos del ser humano sobre el paisaje), utilizando los conocimientos adquiridos,
    la recogida, el análisis de datos (observación, encuestas, muestras, entrevistas, auditorías….) y el diagnóstico de lo
    que ocurre en su entorno cercano (centro, barrio…), proponiendo soluciones alternativas sostenibles, de forma argumentada,
    y difundiendo sus conclusiones y propuestas mediante campañas, exposiciones, pódcast, informes, artículos, revistas medioambientales…,
    con el fin de valorar la repercusión de dichas acciones en la salud de las personas, el resto de los seres vivos y el
    planeta. Además, se persigue constatar que el alumnado es capaz de identificar las aportaciones de las tecnologías digitales
    en el bienestar físico y emocional, en la igualdad social y en la disminución del impacto ambiental, reconociendo la importancia
    de utilizarlas de forma ética, segura, saludable y sostenible. Se trata de averiguar si el alumnado aplica el pensamiento
    científico y utiliza métodos inductivos y deductivos propios del razonamiento matemático, para, a través del análisis
    de la información en diferentes formatos y soportes, diseñar un proyecto, hacer un estudio estadístico sencillo o investigar
    en su entorno más cercano (familia, barrio, centro educativo) el uso del teléfono móvil y de las redes sociales (adicciones
    sin sustancia), así como los impactos que generan estos hábitos de consumo sobre el medioambiente, la salud mental y física,
    la brecha digital…, proponiendo soluciones alternativas a su empleo inadecuado y difundiendo los resultados entre la comunidad
    educativa. Por último, se pretende comprobar si el alumnado, a partir de la indagación en fuentes diversas (textos periodísticos,
    entrevistas a científicos y científicas, ingenieros o ingenieras, técnicos y técnicas, páginas web de centros de investigación...)
    es capaz de reconocer y dar ejemplos de la contribución de la ciencia y la tecnología a la sociedad; mostrando una actitud
    crítica acerca de su alcance y sus limitaciones; entendiendo que la investigación es una labor colectiva e interdisciplinar
    que genera avances y que se encuentra en constante evolución; y transmitiendo sus opiniones a través de la participación
    en exposiciones, debates, semanas de la ciencia y la tecnología o mesas redondas, en las que se discuta sobre temas como:
    la visibilidad de las mujeres en la ciencia y la tecnología, los institutos y centros de investigación de Canarias que
    son referentes a nivel internacional en estudios relacionados con la astrofísica, la biodiversidad…, o la valoración de
    las personas que en Canarias han dedicado y dedican su carrera a la ciencia y la tecnología. Todo ello con el fin, por
    un lado, de desarrollar en el alumnado habilidades y destrezas que promuevan formas de participación y actuación que puedan
    ser aplicadas en diferentes situaciones de la vida cotidiana y que estén basadas en la empatía y la responsabilidad; y
    por otro lado, de formar personas responsables y comprometidas que manifiesten una actitud proactiva con la conservación,
    la protección del medioambiente y la sostenibilidad.'
- nodo: sb:SAMB03SBI.5.3
  campo: definition
  valor: Uso de números naturales, enteros, fracciones y decimales para expresar cantidades en contextos científico-tecnológicos
    de la vida cotidiana con la precisión requerida.
- nodo: sb:SAMB03SBI.7
  campo: definition
  valor: Valoración de la contribución de la ciencia y la tecnología a la sociedad y la labor de las personas dedicadas a
    ella, destacando y visibilizando a las mujeres científicas, ingenieras y técnicas, especialmente, a las investigadoras
    canarias, para fomentar la vocación científica-tecnológica y acabar con la brecha de género en el ámbito de la ciencia
    y la tecnología.
- nodo: bc:SAMB04BC2
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará si el alumnado analiza, manteniendo una actitud crítica, información
    científico-tecnológica en diferentes formatos (textos, gráficos, tablas, diagramas, imágenes, páginas web…), y la representa
    mediante el diseño y la realización de modelos y diagramas, utilizando diversos medios y soportes para interpretar y explicar
    con rigor científico procesos matemáticos y fenómenos físico-químicos, tecnológicos, biológicos y geológicos concretos,
    relacionados con los distintos bloques de saberes básicos del ámbito. Asimismo, se evaluará si es capaz de comunicar de
    forma clara y precisa, mediante exposiciones orales, escritas o visuales en diversos soportes y con el apoyo de las tecnologías
    digitales, opiniones propias, conjeturas y conclusiones argumentadas y fundamentadas, empleando el lenguaje científico-técnico
    apropiado, evitando el uso discriminatorio de la lengua y mostrando una actitud dialogante y respetuosa para conseguir
    una comunicación efectiva, ética y responsable. Finalmente, se valorará la capacidad del alumnado para crear y reelaborar
    contenidos accesibles en diferentes formatos, a partir de la información obtenida, tanto de forma individual como colaborativa,
    seleccionando, configurando y utilizando de manera crítica y creativa las herramientas digitales más adecuadas, respetando
    los derechos de autoría y las licencias de uso, y reflexionando sobre el proceso realizado. Todo ello con el fin de comprender
    la importancia que tiene el intercambio de información y la colaboración entre individuos en la ciencia y la tecnología.
- nodo: bc:SAMB04BC6
  campo: scopeNote
  valor: 'Este bloque competencial tiene el propósito de evaluar en el alumnado la capacidad de investigar y analizar, utilizando
    el razonamiento lógico y el pensamiento computacional, los impactos que generan los avances tecnológicos, económicos y
    sociales sobre el medioambiente y la vida en el planeta, identificando las consecuencias derivadas de las acciones humanas
    (destrucción de hábitats, sobreexplotación de recursos, cambio climático, contaminación de la atmósfera, pérdida de la
    biodiversidad…), mediante la búsqueda y selección de información en fuentes y soportes variados (páginas web, fotografías,
    videos, prensa...) y la toma de datos recabados en salidas de campo o experiencias de laboratorio, para valorar la compatibilidad
    de dichos avances con los objetivos de la Agenda Canaria de Desarrollo Sostenible 2030 y promover la adopción de medidas
    ecosocialmente responsables e innovadoras que eviten o minimicen los impactos medioambientales negativos. Asimismo, se
    pretende comprobar si el alumnado es capaz, utilizando los conocimientos adquiridos, de analizar con criterio científico
    las acciones cotidianas propias y ajenas y comprender las relaciones sistémicas de interdependencia y ecodependencia,
    a través del diseño de un proyecto, un estudio estadístico o una investigación en su entorno más cercano (familia, barrio,
    centro educativo) sobre las consecuencias derivadas de dichas acciones, como el ahorro energético, el empleo de materiales
    sostenibles y ecológicos, la prevalencia en Canarias de ciertas enfermedades (diabetes, obesidad, determinados cánceres…)
    y su relación probabilística con determinados hábitos de consumo (comida rápida, tabaquismo…), para proponer y emprender,
    colaborativamente, un plan de medidas que fomente la adopción de estilos de vida que contribuyan a la protección y mejora
    del entorno más próximo y del planeta según el concepto One Health (la salud de los seres humanos, de otros seres vivos
    y del entorno natural), defendiendo de forma argumentada y respetuosa su conveniencia, y difundiéndolo, de manera clara
    y rigurosa, mediante campañas, exposiciones, pódcast, informes, artículos… Por último, se pretende comprobar si el alumnado,
    a partir de la interpretación de información procedente de fuentes diversas (gráficos, textos periodísticos, entrevistas
    a científicos y científicas, ingenieros e ingenieras, instituciones públicas, boletines sobre transición ecológica, herramientas
    digitales...) es capaz de valorar la contribuición de la ciencia y la tecnología, a la sociedad, mostrando una actitud
    crítica acerca de su alcance y sus limitaciones, y entendiendo que la investigación es una labor colectiva e interdisciplinar
    que genera avances y que se encuentra en constante evolución influida por el contexto político y los recursos económicos.
    El alumnado, desarrollando juicios propios para afrontar la controversia moral con actitud dialogante, argumentativa,
    respetuosa y opuesta a cualquier tipo de discriminación o violencia, podrá participar en exposiciones, debates, semanas
    de la ciencia y la tecnología o mesas redondas en las que se discuta sobre temas como: la visibilidad de las mujeres en
    la ciencia, las vocaciones STEAM, el avance de la investigación científico-tecnológica en Canarias, los institutos y centros
    de investigación de Canarias que son referentes en diferentes campos del conocimiento como Instituto de Astrofísica de
    Canarias (IAC), Instituto tecnológico de Canarias (ITC), Instituto Tecnológico de Energías Renovables (ITER), Instituto
    Universitario de Microelectrónica Aplicada (IUMA), Instituto Universitario de Ciencias y Tecnologías Cibernéticas (IUCTC),
    Instituto Universitario de Enfermedades Tropicales y salud pública de Canarias (IUETSPC), Instituto Universitario de Biorgánica
    Antonio González (IUBO-AG); o sobre cuestiones como la dependencia de la ciencia y la tecnología para cualquier sociedad
    de progreso, poniendo en valor, en todo momento, a las personas que en Canarias han dedicado y dedican su carrera a la
    misma. Todo ello con el fin, por un lado, de desarrollar en el alumnado habilidades y destrezas que promuevan formas de
    participación y actuación que puedan ser aplicadas en diferentes situaciones de la vida cotidiana y que estén basadas
    en la empatía y la responsabilidad; y, por otro lado, formar personas responsables y comprometidas que manifiesten una
    actitud proactiva con la conservación y protección del medioambiente y la sostenibilidad.'
