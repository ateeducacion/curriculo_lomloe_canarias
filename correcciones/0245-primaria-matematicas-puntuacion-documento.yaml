cambios:
- nodo: sb:PMAT01SBII.2.1
  campo: definition
  valor: Conocimiento y aplicación de procesos para medir mediante repetición de una unidad no convencional o convencional,
    y mediante la utilización de instrumentos convencionales (reglas, cintas métricas, balanzas, calendarios, etc.) en contextos
    familiares.
- nodo: sb:PMAT02SBII.2.1
  campo: definition
  valor: Conocimiento y aplicación de procesos para medir mediante repetición de una unidad no convencional o convencional,
    y mediante la utilización de instrumentos convencionales (reglas, cintas métricas, balanzas, calendarios, etc.) en contextos
    familiares.
- nodo: crit:PMAT03CE3.1
  campo: definition
  valor: Analizar conjeturas matemáticas sencillas de forma pautada, investigando patrones, propiedades y relaciones, utilizando
    materiales manipulativos, representaciones gráficas o la calculadora, para extraer conclusiones, comunicarlas y argumentarlas
    de forma verbal, manipulativa, gráfica o a través de medios tecnológicos.
- nodo: crit:PMAT04CE3.1
  campo: definition
  valor: Analizar conjeturas matemáticas sencillas de forma pautada, investigando patrones, propiedades y relaciones, utilizando
    materiales manipulativos, representaciones gráficas o la calculadora, para extraer conclusiones, comunicarlas y argumentarlas
    de forma verbal, manipulativa, gráfica o a través de medios tecnológicos.
- nodo: crit:PMAT05CE5.2
  campo: definition
  valor: Utilizar las conexiones entre las matemáticas, otras áreas y la vida cotidiana para realizar proyectos, empleando,
    entre otros, recursos digitales; y resolver problemas en contextos no matemáticos que permitan tomar decisiones desde
    una perspectiva crítica, sostenible y respetuosa.
- nodo: sb:PMAT05SBI.2.7
  campo: definition
  valor: Utilización de la calculadora en la investigación, el cálculo del resultado exacto, cuando las cantidades lo precisen,
    y la comprobación de resultados.
- nodo: sb:PMAT05SBIII.2.1
  campo: definition
  valor: 'Localización y desplazamientos en planos y mapas, entre ellos los de entornos cercanos, a partir de puntos de referencia
    (incluidos los puntos cardinales), direcciones y cálculo de distancias (escalas): descripción, interpretación y representación
    con el vocabulario adecuado en soportes físicos y virtuales.'
- nodo: sb:PMAT05SBV.1.2
  campo: definition
  valor: 'Planificación de estrategias para la realización de un estudio estadístico sencillo de la realidad cercana: formulación
    de preguntas, y recogida, registro y organización de datos cualitativos y cuantitativos procedentes de diferentes experimentos
    (encuestas, mediciones, observaciones, etc.).'
- nodo: sb:PMAT05SBV.1.5
  campo: definition
  valor: Elaboración de gráficos estadísticos sencillos (diagrama de barras, diagrama de sectores, histograma y lineal, gráficos
    con doble información), representación de datos mediante recursos tradicionales y tecnológicos, y selección del más conveniente.
- nodo: sb:PMAT05SBVI.2.2
  campo: definition
  valor: Aplicación de técnicas simples para el trabajo en equipo en matemáticas, y estrategias para la gestión de conflictos,
    promoción de conductas empáticas e inclusivas, y aceptación de la diversidad presente en el aula y en la sociedad.
