  valor: Mediante este bloque competencial se comprobará que el alumnado es capaz de utilizar como escenario de aprendizaje,
    real o virtual, la Red Canaria de Espacios Naturales Protegidos. El alumnado deberá ser capaz de realizar procesos de
    planificación y búsqueda de información dirigidos a identificar, analizar e interpretar elementos del paisaje natural
    que le permitan conocer el origen de las islas, así como sus principales características físicas, climáticas y biogeográficas.
    El objetivo será que el alumnado construya conocimiento partiendo de la investigación, elaborando síntesis y productos
    explicativos (en forma de infografías, folletos, pósteres, mapas, revistas, sitios web, etc.), a la vez que participando
    en debates, asambleas, foros virtuales, etc., partiendo de la necesidad de aplicar los Objetivos de Desarrollo Sostenible
    y las metas canarias que responden a los retos identificados en la Agenda Canaria de Desarrollo Sostenible 2030, que impliquen
    en el alumnado proyectos de investigación, el uso de mapas u otras representaciones gráficas, a partir de la Red Canaria
    de Espacios Naturales Protegidos, para incidir en la sostenibilidad y la responsabilidad de la conservación del entorno
    natural, rural y urbano. La finalidad será que el alumnado tome conciencia de la singularidad del medio natural canario,
    su fragilidad, su interés científico y patrimonial junto a sus necesidades de gestión y conservación.
