- nodo: bc:PMAT01BC1
  campo: scopeNote
  valor: A través de este bloque competencial se comprobará que el alumnado es capaz de comprender, resolver y enunciar problemas
    matemáticos sencillos, siguiendo una secuencia ordenada. Se constatará que puede analizar y comprender la situación planteada
    en los problema, de manera que interpreta la información que se le proporciona, ordena su pensamiento y encauza la búsqueda
    de posibles soluciones, empleando las estrategias más adecuadas para resolver el problema planteado. Para ello, se comprobará
    que es capaz de identificar la información relevante y de organizar y estructurar estos elementos en diagramas u otras
    representaciones matemáticas sencillas, que le permitan visualizar las conexiones entre lo que le dan y lo que le piden,
    y le orienten en el camino a seguir para abordar el reto que se le plantea, de forma que pueda elegir y ejecutar una estrategia
    básica para la resolución del problema planteado, utilizando para todo ello herramientas y recursos diversos (manipulación
    de materiales, diseño de diagramas y representaciones gráficas sencillas, e inicio de explicaciones verbales de su pensamiento).
    Se valorará, además, que sea capaz de comprobar las soluciones a los problemas, de forma que revise el proceso seguido
    y evalúe su corrección, transformando el error en una oportunidad para el aprendizaje. Se valorará, además, que sea capaz
    de expresar el proceso seguido y de comunicar sus conclusiones. Se comprobará, asimismo, que acepta los retos que se le
    planteen con compromiso y que realiza las tareas planificadas, cooperando en equipo para llevarlas a cabo y valorando
    el proceso realizado.
- nodo: bc:PMAT01BC3
  campo: scopeNote
  valor: En este bloque competencial se comprobará si el alumnado realiza conjeturas elementales, se plantea preguntas y si
    pone en funcionamiento su razonamiento, su pensamiento analítico y crítico. Además, deberá ser capaz de observar e identificar
    elementos matemáticos, tanto en contextos cotidianos como en situaciones propias del área relacionadas con los saberes
    básicos. Se constatará que el alumnado investiga sobre patrones, propiedades y relaciones, de forma guiada, con la ayuda
    de materiales manipulativos o calculadora, para extraer conclusiones; que comunica de forma verbal o gráfica, adquiriendo
    nuevo conocimiento; y que desarrolla una actitud activa ante el trabajo y proactiva ante el aprendizaje. Se verificará
    también que identifica problemas que conectan las matemáticas con la realidad, comprobando la validez de los pasos seguidos
    en dicha conexión y su coherencia en el contexto.
- nodo: bc:PMAT01BC5
  campo: scopeNote
  valor: A través de este bloque competencial, se constatará que el alumnado reconoce y utiliza conexiones entre los objetos
    matemáticos de los diferentes sentidos, entre los objetos matemáticos y las diferentes áreas para construir y consolidar
    sus aprendizajes. Se comprobará también que identifica las matemáticas implicadas en la vida cotidiana, facilitando el
    desarrollo de la capacidad de comprensión del entorno y de los sucesos que en él acontecen; que participa en proyectos
    que hagan visibles todas estas conexiones; y que se inicie en la adquisición de hábitos de vida sostenible.
- nodo: bc:PMAT01BC6
  campo: scopeNote
  valor: En este bloque competencial se evaluará que el alumnado reconoce el lenguaje matemático presente en la vida cotidiana
    y lo utiliza para comunicar e intercambiar ideas, conceptos, procedimientos y resultados matemáticos, de forma guiada,
    y lo adecua con ayuda al canal de comunicación y al oyente en diferentes formatos, entre ellos el digital, tanto individualmente
    como en grupo, con el objetivo de dar significado, afianzar las ideas trabajadas y generar nuevos conocimientos. Se constatará,
    a través de debates, presentación de resultados, extracción de conclusiones a partir de situaciones que supongan un reto
    o un problema, que el alumnado moviliza sus recursos lingüísticos y matemáticos con la intención de comunicar de la forma
    más adecuada posible sus ideas.
- nodo: bc:PMAT01BC7
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado se enfrenta positivamente a los retos que se
    le plantean, identifica sus emociones y muestra interés y actitud positiva en la tarea, siendo capaz de reconocer sus
    fortalezas y debilidades durante el proceso del trabajo matemático y entendiendo el error como una oportunidad de aprendizaje.
    Se comprobará que el alumnado trabaja colaborativamente, usando la escucha activa y la comunicación asertiva, valorando
    el respeto, la igualdad y la resolución pacífica de conflictos, y asumiendo las responsabilidades individuales orientadas
    hacia la consecución de objetivos compartidos, con un lenguaje inclusivo y no violento. Asimismo, se constatará que el
    alumnado va adquiriendo las destrezas emocionales que fomentan su bienestar, interés e implicación.
