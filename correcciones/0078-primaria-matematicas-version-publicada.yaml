    permitan tomar decisiones sostenibles y respetuosas con el entorno mostrando hábitos de vida sostenible. Se evaluará,
    asimismo, si el alumnado realiza de forma pautada proyectos que hagan visibles estas conexiones para generar en equipo
    productos creativos, utilizando, entre otros recursos, los entornos digitales, y que sean el resultado de la reflexión
    sobre las posibles soluciones.
- nodo: bc:PMAT06BC6
