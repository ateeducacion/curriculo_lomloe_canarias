    relaciones con la ayuda de materiales manipulativos o calculadora, tanto en contextos cotidianos como en situaciones propias
    del área relacionadas con los saberes básicos, para extraer conclusiones; si comunica y argumenta de forma verbal, gráfica,
    o a través de medios tecnológicos, generando nuevo conocimiento; y si desarrolla una actitud activa ante el trabajo y
    proactiva ante el aprendizaje. Por último, se evaluará si plantea problemas que conectan las matemáticas con la realidad
    y con otras áreas del currículo, comprobando y analizando de forma crítica la validez de las soluciones que se obtengan
    y su coherencia en el contexto.
- nodo: bc:PMAT06BC5
  campo: scopeNote
