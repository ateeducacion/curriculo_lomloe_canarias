id: '0014'
titulo: 'Matemáticas (Primaria, 3.º y 4.º): saberes de I.2.10 e I.2.12 perdidos por códigos truncados'
motivo: 'En 3.º y 4.º la exportación trae «PMAT0nSBI.2.10.» y «PMAT0nSBI.2.12.» (códigos truncados y sin texto). El importador
  los reconstruye como el propio apartado y se pierden, y los otros dos saberes (2.10.2 y 2.12.1) llegan sin texto. En el
  documento oficial cada apartado tiene dos saberes: se crean 2.10.1 y 2.12.2 y se completan los textos de 2.10.2 y 2.12.1,
  en el orden del documento.'
