id: '0065'
titulo: 'Lengua Castellana y Literatura (Educación Primaria): 12 explicaciones de bloque copiadas de otro curso'
motivo: La exportación repite en estos bloques competenciales la explicación de otro curso de la materia; el documento oficial
  trae una explicación propia para cada curso. Generada con `contrastar --proponer`.
fuente:
  documento: primaria-lengua-castellana-y-literatura
  fichero: fuentes/documentos/primaria/anexo_2_curriculo-lengua-castellana.odt
  sha256: 36db66a2635e6f3476e5d7aac7db76993daa925cbf5a615742a6229259efa140
  ubicacion: Tablas de bloques competenciales y saberes básicos de cada sección
estado: propuesta
aprobada_por: null
cambios:
- nodo: bc:PLCL03BC5
  campo: scopeNote
  valor: 'A través de este bloque competencial, se comprobará que el alumnado es capaz de producir, de manera creativa, textos
    escritos y multimodales ajustados a su nivel madurativo, con coherencia, cohesión y adecuación, aplicando estrategias
    para las distintas fases del proceso: de planificación, a partir de pautas o de la lectura de modelos específicos para
    cada tipología textual; de redacción, secuenciando correctamente los contenidos y empleando normas gramaticales y ortográficas
    básicas con la debida observación a los rasgos del español de Canarias; de revisión individual o compartida, haciendo
    un uso guiado de fuentes documentales diversas, tanto en papel como digitales y participando en procesos de auto y coevaluación,
    reconociendo sus limitaciones y sabiendo buscar ayuda en el proceso; de edición, empleando elementos gráficos y paratextuales
    sencillos que faciliten la presentación, la organización y la comprensión del texto, y respetando la propiedad intelectual
    y los derechos de autor de los contenidos que reutiliza; y de difusión, participando así en actividades o proyectos, escolares
    o comunitarios, mediante el uso guiado de herramientas o entornos digitales restringidos y supervisados de manera segura,
    con una actitud responsable ante su uso. Todo ello con el propósito de construir conocimiento y dar respuesta a demandas
    comunicativas concretas, como intercambiar o transmitir información, conocimientos, pensamientos, experiencias, emociones
    o sentimientos, así como construir vínculos personales con actitud cooperativa y respetuosa, poniendo las prácticas
    comunicativas al servicio de la convivencia democrática.'
- nodo: bc:PLCL03BC6
  campo: scopeNote
  valor: A través de este bloque competencial, se comprobará que el alumnado es capaz de realizar un tratamiento adecuado
    de la información en un proceso de investigación guiado, a través de un método de trabajo realizado preferentemente de
    manera cooperativa en torno a temas relacionados con el propio currículo escolar o con los retos y desafíos del siglo
    XXI. Para ello, se verificará que puede localizar información determinada, realizando búsquedas guiadas en diferentes
    soportes y poniendo en práctica hábitos de uso crítico, seguro, sostenible y saludable; seleccionar dicha información
    a través de estrategias de comprensión lectora, tales como la identificación de las ideas más relevantes y la interpretación
    del sentido global, realizando las inferencias necesarias; contrastarla en distintas fuentes documentales conociendo los
    riesgos de los entornos digitales; evaluar su utilidad, opinando de manera razonada sobre su fiabilidad y pertinencia
    en función de los objetivos de lectura, distinguiendo entre hechos y opiniones; con la finalidad de estructurarla y compartirla
    adoptando un punto de vista creativo y personal mediante el uso de diferentes herramientas digitales con una actitud ética,
    responsable y respetando la propiedad intelectual.
- nodo: bc:PLCL03BC8
  campo: scopeNote
  valor: Con este bloque competencial se comprobará que el alumnado, a través de su participación en itinerarios lectores,
    es capaz de escuchar textos literarios y realizar lecturas guiadas, acompañadas y autónomas, con especial atención a la
    literatura canaria, silenciosas o en voz alta, empleando la entonación y el ritmo adecuados. De la misma manera, se constatará
    que relaciona los elementos básicos constitutivos de la obra literaria atendiendo a las especificidades de cada género,
    y que construye y reconoce el sentido de los textos y los valores proyectados en los mismos. Asimismo, se verificará que
    comunica, de manera guiada, ideas, pensamientos, sentimientos y emociones de forma creativa y con una actitud abierta
    e inclusiva empleando distintos lenguajes artísticos y culturales, integrando su propio cuerpo y que usa estrategias para
    la interpretación acompañada y compartida de las obras a través de conversaciones literarias. Por último, se verificará
    que produce textos literarios, de manera guiada y a partir de modelos dados, que incluyan otros lenguajes artísticos,
    experimentando, tanto en la creación como en la difusión, con diferentes medios y soportes, y con diversas técnicas plásticas,
    visuales, audiovisuales, sonoras o corporales, para percibir su sensibilidad estética, disfrutar de la experiencia y,
    en consecuencia, mejorar su expresión oral y escrita en la producción de diversos textos con intención lúdica, artística
    y creativa.
