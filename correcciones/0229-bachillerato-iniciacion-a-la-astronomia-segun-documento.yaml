id: 0229
titulo: 'Iniciación a la Astronomía (Bachillerato): 3 diferencias corregidas con el documento oficial'
motivo: 'Diferencias que el contraste no explicaba con el BOC. Criterio aprobado: el ODT oficial de la web de currículos es
  la referencia y el corpus debe reflejarlo. Se rehacen con los saberes y la numeración del documento los bloques BIAS01SBII,
  en los que faltaban o sobraban saberes. Tipos: falta en el corpus: texto de saber; nodo del corpus que no está en el documento.'
