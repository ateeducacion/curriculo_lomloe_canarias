name: Validar currículo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: Construir y validar (datos/ debe estar al día)
        run: python -m herramientas.construir --comprobar --dist

      - name: Exportar a RDF y validar con SHACL
        run: python -m herramientas.exportar_rdf --ttl dist/curriculo.ttl --validar

      - name: Contrastar con los documentos oficiales (ninguna diferencia sin explicar)
        if: always()
        run: python -m herramientas.contrastar --estricto

      - name: Resumen
        if: always()
        run: |
          cat informes/resumen.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat informes/contraste.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: informes/
